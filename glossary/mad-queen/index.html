<script type="application/json" id="data">{"tier":3,"group":"historical","kind":"look-up","term":"The mad queen","slug":"mad-queen","also":["mad queen chess","queen's chess","alla rabiosa"],"chips":["sourced"],"definition":"The rule change, in Spain around 1475, that gave the queen and the bishop the moves they have now - and with them the game you play. Before it the queen crept one square diagonally and the bishop jumped two. Afterwards the queen was the strongest piece on the board, and contemporaries named the new game after her: queen's chess, or in Italian *alla rabiosa*, with the madwoman.","precision":[{"against":"it being a tweak","text":"It is the single largest change in the game's history and everything modern follows from it. A piece that reaches across the whole board makes mate possible early, makes development urgent, makes an exposed king fatal, and makes the opening a race - which is why almost every idea in this glossary is younger than 1475 and why `shatranj` positions and modern ones barely overlap."},{"against":"the name being a compliment","text":"It was not entirely. The new queen was startling and the names for the game carry that: *alla rabiosa* is the raging or mad one, and the association of an unreasonably powerful queen with a female sovereign was made at the time and has been argued over since. The word that survived into English is simply \"queen\"."},{"against":"the bishop being an afterthought","text":"It changed by the same amount and gets none of the credit. The alfil jumped to exactly two squares diagonally and could reach eight squares in the entire game; the bishop that replaced it runs the length of a diagonal. Half of what a modern attack does - the long diagonal, the pin from a distance, the `battery` - needs the piece that arrived in 1475 as much as it needs the queen."}],"origin":{"text":"Spain, in the Kingdom of Valencia, around 1475. The first document showing the queen moving the modern way is the allegorical poem *Scachs d'amor*, written in Catalan in Valencia in 1475; the resulting game was called queen's chess or, in Italy, *scacchi alla rabiosa*.","chip":"sourced","source":"Wikipedia, History of chess, which cites the poem directly. The primary - *Scachs d'amor* itself - was not consulted."},"boards":[{"fen":"rnb1kbnr/ppp1pppp/8/3q4/8/8/PPPP1PPP/RNBQKBNR w KQkq - 0 3","corpus":"opening","ref":"fqn8022b","caption":"1.e4 d5 2.exd5 Qxd5 - the Scandinavian, and the black queen has crossed three squares on move two to stand in the middle of the board. That move did not exist before about 1475: a ferz went one square diagonally, so d8 to d5 was four separate moves and the recapture was impossible. This is the commonest opening in the census that a shatranj player could not begin to understand.","highlight":["d5","d8"],"render_fen":"rnb1kbnr/ppp1pppp/8/3q4/8/8/PPPP1PPP/RNBQKBNR w KQkq - 0 3","highlight_squares":["d5","d8"]}],"drill":{"mode":"none","why":"impossible","note":"A rule change is not a property of a position. The nearest computable question - could this queen move have been played before 1475 - is answered by geometry alone and has no learner in it."},"links":["shatranj","chaturanga","queen","bishop","romantic-era","scandinavian-defence","battery","promotion"],"reading":[{"title":"History of chess","url":"https://en.wikipedia.org/wiki/History_of_chess"}],"links_resolved":[{"label":"Shatranj","href":"/glossary/shatranj/"},{"label":"Chaturanga","href":"/glossary/chaturanga/"},{"label":"Queen","href":"/glossary/queen/"},{"label":"Bishop","href":"/glossary/bishop/"},{"label":"Romantic era","href":"/glossary/romantic-era/"},{"label":"Scandinavian Defence","href":"/glossary/scandinavian-defence/"},{"label":"Battery","href":"/glossary/battery/"},{"label":"Promotion","href":"/glossary/promotion/"}],"home":null}</script>
