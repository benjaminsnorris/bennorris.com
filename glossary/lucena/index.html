<script type="application/json" id="data">{"term":"The Lucena position","slug":"lucena","tier":3,"group":"endgame-technique","kind":"look-up","also":["building a bridge","the bridge"],"definition":"The winning position in rook and pawn against rook: the pawn is on the seventh, its own king is in front of it, and the defending king is cut off two files away. The win is a specific four-move technique called building a bridge - the rook steps out to the fourth rank so that it can interpose against the checks the king cannot otherwise escape.","precision":[{"against":"a position you can work out at the board","text":"It has to be known. The natural moves lose the pawn to endless checks from behind, and the bridge is not something most players find unaided. This is the reason rook endings are worth studying at all: they are common, and a handful of exact positions decide most of them."},{"against":"the Philidor position","text":"The pair to know together, and the difference is one king. In the Lucena the attacking king is in front of the pawn and it is a win; in the Philidor the defending king is in front of the pawn and it is a draw. Rook-and-pawn endings played accurately tend to arrive at one or the other."}],"origin":{"chip":"sourced","text":"Named after the Castilian Luis Ramirez de Lucena, and the position does not appear in his book - the 1497 Repeticion de Amores e Arte de Axedrez. The earliest surviving discussion is in Alessandro Salvio's Il Puttino of 1634, where Salvio credits it to Scipione Genovino. The misattribution appears to date from the sixth edition of the Handbuch des Schachspiels in 1880, whose editor Constantin Schwede credited it to \u201cLucena 96\u201d, probably having misread the references in van der Linde's Das Schachspiel des XVI. Jahrhunderts of 1874. So the most important position in endgame theory is named after a book it is not in, by way of an editor's slip.","source":"Wikipedia, Lucena position. Secondary; none of Lucena, Salvio, the
