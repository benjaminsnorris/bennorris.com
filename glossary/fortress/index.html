<script type="application/json" id="data">{"term":"Fortress","slug":"fortress","tier":3,"group":"endgame-technique","kind":"look-up","definition":"A drawn position that the stronger side cannot break however much material they are up, because there is no way in. The defender sets up a structure the attacker cannot make progress against and then simply keeps it.","precision":[{"against":"being a pawn or two down and holding on","text":"A fortress is not stubbornness, it is a proof. The defender is often a whole piece or an exchange down and the position is still a dead draw, because every attacking plan runs out of moves. That is what makes it worth a name: material has stopped meaning anything."},{"against":"what an engine tells you","text":"This is the classic blind spot of a searching engine, and a useful thing for a beginner to know an engine can be wrong about. An engine counting material sees a large advantage and cannot see that no continuation converts it; modern engines handle the known types better than they did, and a tablebase settles the small ones outright."}],"chips":["sourced"],"boards":[],"no_board":"Calling a position a fortress is a claim about every continuation from it, not a claim about the diagram. This glossary shows boards whose captions can be checked against the position, and there is no way to check this one without a tablebase or an engine - which, on this specific subject, is the tool that gets it wrong.","drill":{"mode":"none","why":"impossible","note":"The definition is a statement about all continuations. No predicate over a FEN can settle it, and the entry says so rather than approximating it."},"links":["defensive-move","tablebase","philidor-position","material","stalemate","wrong-coloured-bishop","endgame"],"reading":[{"title":"Fortress (chess)","url":"https://en.wikipedia.org/wiki/Fortress_(chess)"}],"links_resolved":[{"label":"Defensive move","href":"/glossary/defensive-move/"},{"label":"Tablebase","href":"/glossary/tablebase/"},
