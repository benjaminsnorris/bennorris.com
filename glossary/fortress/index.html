<script type="application/json" id="data">{"term":"Fortress","slug":"fortress","tier":3,"group":"endgame-technique","kind":"look-up","definition":"A drawn position that the stronger side cannot break however much material they are up, because there is no way in. The defender sets up a structure the attacker cannot make progress against and then simply keeps it.","precision":[{"against":"being a pawn or two down and holding on","text":"A fortress is not stubbornness, it is a proof. The defender is often a whole piece or an exchange down and the position is still a dead draw, because every attacking plan runs out of moves. That is what makes it worth a name: material has stopped meaning anything."},{"against":"what an engine tells you","text":"This is the classic blind spot of a searching engine, and a useful thing for a beginner to know an engine can be wrong about. An engine counting material sees a large advantage and cannot see that no continuation converts it; modern engines handle the known types better than they did, and a tablebase settles the small ones outright."},{"against":"this diagram proving the general case","text":"It does not, and the difference is worth having. Whether a position is a fortress is normally a claim about every continuation from it, which is a search - and on this subject a searching engine is the tool that gets it wrong. The wrong-rook-pawn case is the exception: it is a geometry, checkable in four lines, and this project's build checks it. Every other fortress in this entry is an argument rather than a measurement."}],"chips":["sourced"],"boards":[{"fen":"k7/8/PK6/8/8/8/8/4B3 w - - 0 1","corpus":"composed","ref":"wrong-rook-pawn-fortress","caption":"The one kind of fortress whose claim can be settled without an engine, which is why it is the one shown here. White is a bishop and a pawn ahead and cannot win: the pawn is a rook pawn, so its promotion square is a8, and the bishop on e1 travels on dark squares - it can never attack a8 or
