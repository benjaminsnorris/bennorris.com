<script type="application/json" id="data">{"term":"Blunder","slug":"blunder","tier":2,"order":900,"group":"practical","kind":"look-up","taught":[],"thread":"The practical terms, which are about playing chess rather than about positions.","definition":"A move that loses material or the game outright, when something much better was available. The word is about the size of the mistake rather than its kind: an oversight, a miscalculation and a bad plan can all be blunders if they cost enough.","precision":[{"against":"a mistake and an inaccuracy","text":"The conventional ladder, and the one every analysis engine now uses: an inaccuracy is a small loss, a mistake a moderate one, a blunder a large one. The thresholds are the engine's and they differ between tools, so the words are more precise-sounding than they are."},{"against":"a sacrifice","text":"Identical on the board and opposite in intent. A sacrifice gives up material on purpose for something; a blunder gives it up by accident for nothing. No position can tell you which one you are looking at."}],"chips":["sourced"],"boards":[{"fen":"2k3r1/6pp/p1p2p2/4p3/np2P2P/1P2bP2/P1P2P2/2KR4 w - - 0 21","corpus":"drill","ref":"o47utv2o","caption":"Two black pieces, the knight on a4 and the bishop on e3, are both attacked and both undefended, with White to move. Whatever produced this position, the count is not in doubt.","render_fen":"2k3r1/6pp/p1p2p2/4p3/np2P2P/1P2bP2/P1P2P2/2KR4 w - - 0 21"}],"drill":{"mode":"none","why":"impossible","note":"Whether a move was a blunder depends on what else was available and by how much it was better - which is an engine's judgement about a move, not a predicate over a position. Every analysis tool that labels blunders is comparing two evaluations."},"reading":[{"title":"Glossary of chess","url":"https://en.wikipedia.org/wiki/Glossary_of_chess"}],"links":["sacrifice","hanging","material","hanging-piece"],"also":["mistake","inaccuracy"],"links_resolved":[{"label":"Sacrifice","href":"/glossa
