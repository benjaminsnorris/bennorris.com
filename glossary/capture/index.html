<script type="application/json" id="data">{"tier":3,"group":"pieces-and-rules","kind":"look-up","chips":["sourced"],"term":"Capture","slug":"capture","also":["take"],"definition":"Removing an enemy man from the board by moving onto its square. Every piece captures the way it moves, with two exceptions: a pawn moves forward and captures diagonally, and en passant is the one capture that does not land on the square the captured pawn was standing on.","precision":[{"against":"having to capture","text":"You never have to. Chess has no compulsory capture, which is what makes a sacrifice possible at all and what makes zugzwang possible in the endgame - if capturing were forced, having to move would not be a burden. Draughts and several chess variants do require it; this game does not."},{"against":"a capture winning something","text":"A capture is legal for the side to move in 69.3% of the drill corpus. An *even* capture - one where the recapture leaves material level - is available in 28.0% of it. Most of the difference is captures that lose material, and telling the two apart is what `attacker-count` is for."}],"boards":[{"fen":"1Bbk1bnr/3q1ppp/p3p3/1p6/2pP4/2N2B2/1P3PPP/R2QK2R b KQ - 0 15","corpus":"drill","ref":"sqqmlgta","caption":"Black is to move, has twenty-nine legal moves, and exactly one of them is a capture: Qxd4. Nothing else on the board can take anything. That is rarer than it looks and still not rare - exactly one legal capture is on offer in 20.9% of the drill corpus.","highlight":["d7","d4"],"render_fen":"1Bbk1bnr/3q1ppp/p3p3/1p6/2pP4/2N2B2/1P3PPP/R2QK2R b KQ - 0 15","highlight_squares":["d7","d4"]}],"drill":{"mode":"computed","predicate":"capture_available","corpus":"drill","question":"Can the side to move capture something?","note":"Scan the enemy men and ask what reaches them, rather than scanning your own and asking where they go - there are usually fewer enemy men than moves. En passant counts. Measured on the drill corpus, where it is 69.3%: 10,000
