<script type="application/json" id="data">{"tier":3,"group":"endgame-technique","kind":"look-up","chips":["sourced"],"term":"Breakthrough","slug":"breakthrough","definition":"Giving up a pawn, sometimes two, to force a passed pawn through a wall of pawns that could not otherwise be passed. It is the one idea in pawn endings that looks like a sacrifice, and it is pure arithmetic: the pawn you give costs one move and the pawn you make queens a move sooner than anything can stop it.","precision":[{"against":"being a sacrifice","text":"Nothing is being risked. A breakthrough is calculated to the end before it is played - you can see the queening square from where you sit - and if the count does not work you simply do not play it. What makes it feel like a sacrifice is that the material goes first and the compensation arrives four moves later."},{"against":"being rare or advanced","text":"A pawn push that can be captured and still leaves the pusher with a passed pawn is available in 9.0% of the 3,435 positions in the endgame corpus. It is a common resource that is almost never played at club level, because the natural instinct with pawns is to keep them."}],"boards":[{"fen":"6k1/8/7P/p5K1/1p6/1P6/P1P5/8 w - - 9 62","corpus":"endgame","ref":"uxh7al7y","caption":"Three white pawns against two on the queenside, and the wall looks solid: a2 and c2 behind b3, against a5 and b4. Two pushes break it - a3 and c3 - and each of them is capturable and each of them leaves White with a passed pawn whichever way Black takes. The h-pawn on the other wing is what the whole thing is for.","highlight":["a2","b3","c2","a5","b4"],"render_fen":"6k1/8/7P/p5K1/1p6/1P6/P1P5/8 w - - 9 62","highlight_squares":["a2","b3","c2","a5","b4"]}],"drill":{"mode":"none","why":"unbalanced","note":"Computable, and at 9.0% of the endgame corpus far under the floor - and the endgame corpus is the only pool where the question is even about the right kind of position. What the predicate finds is the *opportunity
