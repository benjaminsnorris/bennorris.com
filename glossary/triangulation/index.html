<script type="application/json" id="data">{"term":"Triangulation","slug":"triangulation","tier":3,"group":"endgame-technique","kind":"look-up","also":["losing a move","losing a tempo"],"definition":"Walking your king round a three-square triangle so that it arrives back where it started with the opponent to move instead of you. It is how you hand over the obligation to move when the position is otherwise exactly as you want it.","precision":[{"against":"wasting time","text":"It is the opposite: the three moves buy a tempo rather than spend one. The manoeuvre works because a king has three routes to an adjacent square and a pawn has one, so the side with a spare king move can lose a move on purpose and the side without one cannot."},{"against":"the opposition","text":"Triangulation is what you do when you want the opposition and it is the other player's turn to have it. The two ideas are inseparable: it is only worth three moves if having to move is what is damaging the other side."}],"chips":["sourced"],"boards":[],"no_board":"The technique is three moves, and the position it wins is identical to the position it does not - the only difference is whose turn it is, which a diagram cannot show. A board here would illustrate the starting square and none of the point.","drill":{"mode":"none","why":"impossible","note":"Whether losing a move wins requires knowing that the same position with the other side to move is lost, which is a tablebase judgement rather than a property of the position. Nothing computable from a FEN answers it."},"links":["opposition","zugzwang","tempo","pawn-endgame","key-squares"],"reading":[{"title":"Triangulation (chess)","url":"https://en.wikipedia.org/wiki/Triangulation_(chess)"}],"links_resolved":[{"label":"Opposition","href":"/glossary/opposition/"},{"label":"Zugzwang","href":"/glossary/zugzwang/"},{"label":"Tempo","href":"/glossary/tempo/"},{"label":"Pawn endgame","href":"/glossary/pawn-endgame/"},{"label":"Key squares","href":"/glossary/key-
