<script type="application/json" id="data">{"term":"Pawn storm","slug":"pawn-storm","tier":3,"group":"positional","kind":"look-up","definition":"Throwing several pawns forward at the enemy king to tear the cover off it. The pawns are not trying to promote and are usually not trying to survive - they are there to remove the pawns defending the king so the pieces behind them have lines.","precision":[{"against":"any pawn advance","text":"A storm is aimed at a king and it costs you the pawns. The distinguishing question is what you are left with if it fails: a pawn advance that gains space leaves you a structure, and a storm that fails leaves you three pawns down round your own king. It is the most committal plan in the game."},{"against":"storming when the kings are on the same side","text":"The plan needs your own king somewhere else, which is why it belongs to positions with opposite-side castling, and why those games are races. Pushing the pawns in front of your own castled king opens lines at yourself first."},{"against":"a closed position","text":"A storm needs the centre blocked, or the counter-attack through the middle arrives before the storm does. So the same locked structure that makes a position slow is what makes the storm possible - that is the connection between the two entries."}],"chips":["sourced"],"boards":[{"fen":"1kqr3r/1pp1npb1/p2p1n2/PP1Pp1p1/B3P2p/2NQ2BP/2P2PP1/R3R1K1 w - - 1 23","corpus":"drill","ref":"zcn4rufh","caption":"Both storms at once, which is what opposite-side castling produces. White's pawns on a5 and b5 are up at Black's king on b8; Black's on g5 and h4 are up at White's king on g1. The centre is locked by the pawns on d5 and e5, so neither attack can be answered in the middle, and it is a race.","highlight":["a5","b5","b8","g1","g5","h4"],"render_fen":"1kqr3r/1pp1npb1/p2p1n2/PP1Pp1p1/B3P2p/2NQ2BP/2P2PP1/R3R1K1 w - - 1 23","highlight_squares":["a5","b5","b8","g1","g5","h4"]}],"drill":{"mode":"none","why":"impossible","note":"Advanced pawns near a king are countable; whether they constitute an attack or an act of self-harm is the judgement the term is for, and it depends on the whole position. Drawn from the relaxed corpus, since the certified one filters to plies 16-60 with material within a pawn and holds no position with three pawns that far up at a king."},"links":["kingside-attack","closed-position","exposed-king","king-safety","castling","space","open-file"],"reading":[{"title":"Glossary of chess","url":"https://en.wikipedia.org/wiki/Glossary_of_chess"}],"links_resolved":[{"label":"Kingside attack","href":"/glossary/kingside-attack/"},{"label":"Closed position","href":"/glossary/closed-position/"},{"label":"Exposed king","href":"/glossary/exposed-king/"},{"label":"King safety","href":"/glossary/king-safety/"},{"label":"Castling","href":"/glossary/castling/"},{"label":"Space","href":"/glossary/space/"},{"label":"Open file","href":"/glossary/open-file/"}],"home":null}</script>
