<script type="application/json" id="data">{"term":"Pawn storm","slug":"pawn-storm","tier":3,"group":"positional","kind":"look-up","definition":"Throwing several pawns forward at the enemy king to tear the cover off it. The pawns are not trying to promote and are usually not trying to survive - they are there to remove the pawns defending the king so the pieces behind them have lines.","precision":[{"against":"any pawn advance","text":"A storm is aimed at a king and it costs you the pawns. The distinguishing question is what you are left with if it fails: a pawn advance that gains space leaves you a structure, and a storm that fails leaves you three pawns down round your own king. It is the most committal plan in the game."},{"against":"storming when the kings are on the same side","text":"The plan needs your own king somewhere else, which is why it belongs to positions with opposite-side castling, and why those games are races. Pushing the pawns in front of your own castled king opens lines at yourself first."},{"against":"a closed position","text":"A storm needs the centre blocked, or the counter-attack through the middle arrives before the storm does. So the same locked structure that makes a position slow is what makes the storm possible - that is the connection between the two entries."}],"chips":["sourced"],"boards":[{"fen":"r2q1r2/p3npk1/1p2pNp1/3pPnPP/3p4/P2PB3/P4P2/R2QK1R1 w Q - 0 20","corpus":"drill","ref":"jcccstp1","caption":"Three white pawns up at the king on g7 - e5, g5 and h5 - with White's own king still on e1 and the centre locked by the pawns on d3/d4 and e5. Every one of the three is available to be traded off; what White is buying is the g and h files for the rook on g1 and the queen.","highlight":["e5","g5","g7","h5"],"render_fen":"r2q1r2/p3npk1/1p2pNp1/3pPnPP/3p4/P2PB3/P4P2/R2QK1R1 w Q - 0 20","highlight_squares":["e5","g5","g7","h5"]}],"drill":{"mode":"none","why":"impossible","note":"Advanced pawns near a king are countable; whether they constitute an attack or an act of self-harm is the judgement the term is for, and it depends on the whole position. Drawn from the relaxed corpus, since the certified one filters to plies 16-60 with material within a pawn and holds no position with three pawns that far up at a king."},"links":["kingside-attack","closed-position","exposed-king","king-safety","castling","space","open-file"],"reading":[{"title":"Glossary of chess","url":"https://en.wikipedia.org/wiki/Glossary_of_chess"}],"links_resolved":[{"label":"Kingside attack","href":"/glossary/kingside-attack/"},{"label":"Closed position","href":"/glossary/closed-position/"},{"label":"Exposed king","href":"/glossary/exposed-king/"},{"label":"King safety","href":"/glossary/king-safety/"},{"label":"Castling","href":"/glossary/castling/"},{"label":"Space","href":"/glossary/space/"},{"label":"Open file","href":"/glossary/open-file/"}],"home":null}</script>
