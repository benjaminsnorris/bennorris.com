<script type="application/json" id="data">{"tier":{"n":1,"slug":"start","title":"Course words","lead":"Nine terms the two chess courses use and never define.","why":["The courses were built to teach seeing rather than naming, so they lean on ordinary chess vocabulary without stopping to explain it. These nine are the places where that leaning shows: words that appear in the prose, carry real weight, and are never defined anywhere in the sequence.","They are worth reading once, in this order, before or alongside the courses. It takes about twenty minutes. Nothing here is a skill to practise - these are look-up words, and the point is simply to stop them being holes.","The largest of them is combination. Both courses end by telling you the scan has gone quiet and you now have to calculate, and neither says what calculating is looking for. That entry is the answer, and it is the last one here on purpose."],"grouped":false,"framing":"Why this is one of the course words"},"groups":["board-and-notation","phases","moves","seeds","tactics"],"groupmeta":{"board-and-notation":{"key":"board-and-notation","n":1,"title":"The board, and how positions are written down","intro":"Where things are, and how to record where things are. Everything else is described in these terms.","planned":7},"phases":{"key":"phases","n":2,"title":"The three phases","intro":"The two words that bracket the part of the game the courses are about.","planned":4},"moves":{"key":"moves","n":3,"title":"Moves, exchanges and results","intro":"What a move can do, and the vocabulary for trading pieces off.","planned":10},"seeds":{"key":"seeds","n":5,"title":"The twelve seeds","intro":"Structural weaknesses that make a tactic possible. Each is a shape rather than a tactic, and each entry reports how often it actually fires - which is the fastest way to see why presence alone decides so little.","planned":11},"tactics":{"key":"tactics","n":6,"title":"The tactics they grow into","intro":"The named shapes. The seeds course withholds these until after its final gate on purpose: a library of shapes handed over early produces pattern-matching, which is the habit the sequence exists to break.","planned":14}},"rows":[{"slug":"fen","term":"FEN","kind":"look-up","group":"board-and-notation","tier":1,"blurb":"A single line of text that describes a position completely."},{"slug":"open-file","term":"Open file","kind":"see-it","group":"board-and-notation","tier":1,"blurb":"A file with no pawns on it at all, of either colour."},{"slug":"opening","term":"Opening","kind":"look-up","group":"phases","tier":1,"blurb":"The first phase of a game, while both sides are still bringing pieces off their starting squares and following sequences that have been catalogued and named."},{"slug":"endgame","term":"Endgame","kind":"look-up","group":"phases","tier":1,"blurb":"The last phase, once enough material has come off that the king becomes a fighting piece rather than something to hide, and getting a pawn to the far rank becomes the main way to win.."},{"slug":"recapture","term":"Recapture","kind":"look-up","group":"moves","tier":1,"blurb":"Taking back on the square where one of your own pieces has just been captured."},{"slug":"trade","term":"Trade","kind":"look-up","group":"moves","tier":1,"blurb":"Exchanging pieces of roughly equal value - a knight for a bishop, a rook for a rook - so that both sides come out level on material."},{"slug":"queening","term":"Queening","kind":"look-up","group":"moves","tier":1,"blurb":"Promoting a pawn to a queen by reaching the far rank."},{"slug":"back-rank","term":"Back rank","kind":"see-it","group":"seeds","tier":1,"blurb":"Your own first rank - the one your king started on."},{"slug":"combination","term":"Combination","kind":"look-up","group":"tactics","tier":1,"blurb":"A forced sequence of moves, usually beginning with a sacrifice, that reaches a specific goal you have seen in advance."}]}</script>
