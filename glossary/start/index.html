<h1>Course words</h1>
<p>The terms the courses use and never define. Eight of them, read once, in the order the courses need them.</p>
<div id="out"></div>

<script type="application/json" id="data">[{"term":"FEN","slug":"fen","tier":1,"order":10,"kind":"look-up","taught":[],"thread":"Every term in this glossary is illustrated with a position, and every position is stored as one line of text. This is that line, so it comes first.","definition":"A single line of text that describes a position completely: where the pieces are, whose turn it is, which castling moves are still legal, whether an en passant capture is available, and two counters. Six fields, separated by spaces. The initials stand for Forsyth-Edwards Notation.","precision":[{"against":"PGN","text":"A FEN is one position; a PGN is a whole game, stored as the moves that produced it. You replay a PGN and you load a FEN. Puzzles usually ship as a FEN plus a short move list, which is how they can begin in the middle of a game nobody has shown you."},{"against":"the first four fields","text":"Tools routinely compare only the first four - placement, side to move, castling, en passant - because the two counters can differ between two boards that are the same position. The corpus behind this glossary de-duplicates on exactly those four, and so do both courses."}],"chips":["sourced"],"extra":[{"heading":"Why the counters are the part everyone drops","body":"The two counters are the youngest and least loved part of the notation. They are what the courses and the corpus behind this glossary ignore when comparing two boards, because the same position can carry different counters. Dropping them is not a shortcut - a position is where the pieces are, whose turn it is, and what is still legal, and the counters are none of those things."},{"heading":"Checked, not assumed","body":"All 2,100 positions in the corpus parse as FEN and carry exactly six fields."}],"boards":[{"fen":"r1bqk2r/pp2nppp/2nb4/2p1p3/3pP3/3P1NNP/PPP1BPP1/R1BQK2R w KQkq - 1 9","corpus":"positions","ref":"747wya3v","caption":"Read the fields off it: the placement, then w for White to move, then KQkq because all four castling rights survive, then - because no en passant capture is available, then the two counters. Nothing has been captured yet - all thirty-two pieces are still on.","render_fen":"r1bqk2r/pp2nppp/2nb4/2p1p3/3pP3/3P1NNP/PPP1BPP1/R1BQK2R w KQkq - 1 9"}],"drill":{"mode":"none","why":"unwritten","note":"There is a real item here and it is computable - given a FEN, name the square the black king is on - but the drill machinery in this glossary asks yes/no questions and that is not one. Recorded as debt rather than dressed up as impossible."},"reading":[{"title":"Forsyth-Edwards Notation","url":"https://en.wikipedia.org/wiki/Forsyth%E2%80%93Edwards_Notation"}],"links":["opening","recapture"],"origin":{"chip":"sourced","text":"The scheme was first proposed by David Forsyth, a Scottish newspaper journalist, in the Glasgow Weekly Herald on 2 February 1883, as shorthand for recording where the pieces stood - letters for pieces, numbers for runs of empty squares. That is the whole of Forsyth's contribution, and it is the first field of a modern FEN. Everything after it was added by Steven J. Edwards in 1993, extending the scheme for computers as part of the Portable Game Notation standard: whose turn it is, what castling remains, and the counters. Edwards also tidied the syntax, replacing commas with slashes and moving the knight from Kt to N. So the six fields are two authors a century apart, which is why the first one looks like handwriting and the rest look like a record format.","source":"Wikipedia, Forsyth-Edwards Notation - a secondary source; Forsyth's 1883 column has not been consulted directly"},"links_resolved":[{"label":"Opening","href":"/glossary/opening/"},{"label":"Recapture","href":"/glossary/recapture/"}]},{"term":"Opening","slug":"opening","tier":1,"order":20,"kind":"look-up","taught":[],"thread":"Both courses start counting about eight moves in and never say what they skipped.","definition":"The first phase of a game, while both sides are still bringing pieces off their starting squares and following sequences that have been catalogued and named. It ends, roughly, when neither player is recalling any more and both start working things out.","precision":[{"against":"opening book","text":"An opening is a phase of the game; an opening book is the catalogue of known sequences. Out of book means the position is no longer in the catalogue, which can happen on move four or move twenty - it is not the same as the opening being over."},{"against":"development","text":"Development is the work the opening exists to do: getting pieces off the back rank and the king to safety. You can be well into the opening and badly developed, which is one of the twelve things the seeds course teaches you to look for."}],"chips":["inference"],"extra":[{"heading":"Why the corpus starts where it does","body":"Every position in this glossary's corpus is at least sixteen half-moves in, because before that the positions are book and teach nothing about scanning. The board below sits exactly on that boundary."}],"boards":[{"fen":"r2q1rk1/pppb1ppp/2nbp3/1B1p4/1P2nP2/P3PN2/1BPP2PP/RN1Q1RK1 w - - 3 9","corpus":"positions","ref":"ws65oudu","caption":"The earliest position the corpus contains: sixteen half-moves in, both kings already castled, and not a single piece captured on either side.","render_fen":"r2q1rk1/pppb1ppp/2nbp3/1B1p4/1P2nP2/P3PN2/1BPP2PP/RN1Q1RK1 w - - 3 9"}],"drill":{"mode":"none","why":"impossible","note":"Where the opening ends is a judgement about how much of a position is still being recalled rather than worked out, and no predicate settles it. The corpus sidesteps the question by starting after it."},"reading":[{"title":"Chess opening","url":"https://en.wikipedia.org/wiki/Chess_opening"}],"links":["endgame","fen"],"links_resolved":[{"label":"Endgame","href":"/glossary/endgame/"},{"label":"FEN","href":"/glossary/fen/"}]},{"term":"Endgame","slug":"endgame","tier":1,"order":30,"kind":"look-up","taught":[],"thread":"The other bracket. The seeds vocabulary stops applying here, which is why the corpus stops here too.","definition":"The last phase, once enough material has come off that the king becomes a fighting piece rather than something to hide, and getting a pawn to the far rank becomes the main way to win.","precision":[{"against":"middlegame","text":"There is no sharp line. Counting pieces or naming a move number are conventions rather than rules, and two strong players will disagree about a given position. The useful test is behavioural: if the kings are walking towards the action instead of away from it, you are in an endgame."},{"against":"the end of the game","text":"An endgame is a phase, not a result. Plenty of games finish before one starts, and an endgame can last sixty moves."}],"chips":["inference"],"extra":[{"heading":"This glossary's corpus cannot tell you anything about endgames","body":"The 2,100 certified positions required at least twelve pieces on the board and stopped at sixty half-moves, both by construction. Any endgame rate measured on them would be measuring the filter rather than the game, so the board below comes from the puzzle bank, which has no piece floor. The drill gate in this project refuses computed drills whose base rate is degenerate, which is the same guard from the other direction."}],"boards":[{"fen":"8/8/p7/8/3K4/1P6/k7/8 b - - 1 47","corpus":"puzzles","ref":"03cWT","caption":"Four pieces. Both kings are in the middle of the fight rather than tucked away, and the entire game is about whether a pawn reaches the far rank. Nothing in the seeds vocabulary applies to a position like this.","render_fen":"8/8/p7/8/3K4/1P6/k7/8 b - - 1 47"}],"drill":{"mode":"none","why":"impossible","note":"Which phase a position is in is a judgement, and the corpus that feeds this glossary excluded endgames by construction. There is nothing honest to drill against."},"reading":[{"title":"Chess endgame","url":"https://en.wikipedia.org/wiki/Chess_endgame"}],"links":["opening","queening","fen"],"links_resolved":[{"label":"Opening","href":"/glossary/opening/"},{"label":"Queening","href":"/glossary/queening/"},{"label":"FEN","href":"/glossary/fen/"}]},{"term":"Open file","slug":"open-file","also":["half-open file","semi-open file"],"tier":1,"order":40,"kind":"see-it","taught":["board-vision:unit-2"],"thread":"Included on purpose because it is dull. The bar has to hold for the boring terms or it is not a bar. It also earns its place in tier 1 for a duller reason: both courses talk about files without ever saying what an open one is.","definition":"A file with no pawns on it at all, of either colour. A rook or queen on an open file attacks along its whole length, and getting a rook there is one of the standard reasons to trade pawns.","precision":[{"against":"half-open file","text":"A half-open file has pawns of one colour only. It is open for the side without a pawn there, and is often the more useful thing to own, because the enemy pawn on it is a fixed target that cannot run. Sources agree on the definitions and split on the label - some write semi-open - with no difference in meaning."}],"origin":{"chip":"contested","text":"The chess senses of rank and file are attested early: the OED's first citation for the chess use of ranke is a 1597 English translation of Damiano, and for file a 1614 treatise by Saul. The military phrase ranke and file is first cited in 1598, between the two. It is tempting to conclude the chess use came first and the army borrowed it, but it does not follow: a year's gap in surviving printed records is noise, not sequence. The honest statement is that both senses appear in English within roughly twenty years of each other and the direction of borrowing is not established.","source":"Attestation research: Edward Winter, Earliest Occurrences of Chess Terms"},"chips":["sourced","contested"],"extra":[{"heading":"Why this one gets a real drill","body":"An open file is a fact about pawn placement, so a four-line predicate settles it and the answer key is generated rather than asserted. Most terms in this glossary cannot be treated that way, and say so."}],"boards":[{"fen":"r1b1r1k1/1p1n1pbp/pBp1p1p1/8/4P3/1BN5/PPP2PPP/3R1RK1 w - - 4 14","corpus":"positions","ref":"oxpgprd1","highlight":"auto:open_files","caption":"One open file, d, with a white rook already on it and no half-open files to confuse the picture.","render_fen":"r1b1r1k1/1p1n1pbp/pBp1p1p1/8/4P3/1BN5/PPP2PPP/3R1RK1 w - - 4 14","highlight_squares":["d1","d2","d3","d4","d5","d6","d7","d8"]},{"fen":"r4rk1/1p2bppp/p3bn2/2p5/2PqPB2/P1NB3P/1P4P1/R2Q1R1K b - - 2 15","corpus":"positions","ref":"1p81vand","highlight":"auto:open_files","awkward":true,"caption":"The awkward one. d is open; e and f are half-open. Three files that look similar and are not - only the highlighted one is open.","render_fen":"r4rk1/1p2bppp/p3bn2/2p5/2PqPB2/P1NB3P/1P4P1/R2Q1R1K b - - 2 15","highlight_squares":["d1","d2","d3","d4","d5","d6","d7","d8"]}],"drill":{"mode":"computed","predicate":"open_file","note":"Does this position have an open file? Ten items, answer revealed after each, no gate. The base rate is shown after the set.","base_rate_pct":62.5,"base_rate_n":2100},"reading":[{"title":"Glossary of chess","url":"https://en.wikipedia.org/wiki/Glossary_of_chess"}],"links":["file","rook","/courses/board-vision-counting/"],"links_resolved":[{"label":"Board vision: counting attackers","href":"/courses/board-vision-counting/"}]},{"term":"Back rank","slug":"back-rank","tier":1,"order":50,"kind":"see-it","taught":["seeds:block-2"],"thread":"The first term here you have to be able to see rather than look up, and the first one the courses actually drill.","definition":"Your own first rank - the one your king started on. The phrase almost always points at a weakness: a king that has castled and never moved one of the three pawns in front of it can be mated by a rook or queen arriving on that rank, because its own pawns block every square it could step to.","precision":[{"against":"back-rank mate","text":"The rank is a place; the mate is an event. A back rank can be weak for fifty moves and never be mated on, and the weakness is worth seeing long before anything can be done about it."},{"against":"first rank","text":"The same eight squares. First rank is neutral and absolute; back rank is relative - it means whichever of the two is yours, and it usually carries the implication that it is soft."},{"against":"luft","text":"Luft is the escape square a pawn move makes for the king. Making luft is the standard cure for a weak back rank, and the word is simply German for air."}],"chips":["sourced"],"extra":[{"heading":"How common the weakness is","body":"The seeds course's own back-rank test fires for at least one side in 35.5% of the 2,100 certified positions. That is the point the seeds course makes about all twelve features: presence is common, so presence alone decides very little. The drill below uses the course's predicate rather than a second copy of it, so the glossary cannot disagree with the course about what a weak back rank is."}],"boards":[{"fen":"r3r1k1/p1ppqppp/bpnb1n2/8/2N5/1NPBP3/PP3PPP/R1BQR1K1 w - - 2 12","corpus":"positions","ref":"vn9lo1is","caption":"Both back ranks are soft at once. Neither king has made itself an escape square, and both sides still have heavy pieces that could arrive on the rank.","render_fen":"r3r1k1/p1ppqppp/bpnb1n2/8/2N5/1NPBP3/PP3PPP/R1BQR1K1 w - - 2 12"},{"fen":"2kr3r/1b1pn1pp/1p6/pB2p3/8/P1P1P3/1B3PPP/3R1RK1 b - - 1 19","corpus":"positions","ref":"g8cquzp6","awkward":true,"caption":"The awkward case. Both kings are on their back ranks, and the test fires for White only. Being on the rank is not the weakness; having no way off it is.","render_fen":"2kr3r/1b1pn1pp/1p6/pB2p3/8/P1P1P3/1B3PPP/3R1RK1 b - - 1 19"}],"drill":{"mode":"computed","predicate":"back_rank_either","note":"Does either side have a weak back rank? Ten items, answer revealed after each, no gate. The base rate is shown after the set, because it is high enough to be worth knowing before you start.","base_rate_pct":35.5,"base_rate_n":2100},"reading":[{"title":"Back-rank mate","url":"https://en.wikipedia.org/wiki/Back-rank_mate"}],"links":["queening","combination","skewer"],"links_resolved":[{"label":"Queening","href":"/glossary/queening/"},{"label":"Combination","href":"/glossary/combination/"},{"label":"Skewer","href":"/glossary/skewer/"}]},{"term":"Recapture","slug":"recapture","tier":1,"order":60,"kind":"look-up","taught":[],"thread":"Two entries in a row about pairs of moves rather than positions - and between them, the clearest illustration of why this glossary can drill some terms and not others.","definition":"Taking back on the square where one of your own pieces has just been captured. The word describes the second half of an exchange, so it only means anything relative to the move before it.","precision":[{"against":"capture","text":"A capture removes a piece. A recapture is a capture that answers one, on the same square. Every recapture is a capture; almost no captures are recaptures."},{"against":"trade","text":"A trade is the pair of moves; a recapture is the second of them. If nobody takes back, there was a capture and no trade."}],"chips":["inference"],"extra":[{"heading":"Why this entry has no drill and, deliberately, no statistic","body":"A recapture is not a property of a position. Look at the board below and you cannot tell that anything was just captured, because a FEN does not record the previous move. That is also why the pipeline that built this glossary's corpus had to carry the previous move alongside each position: it discarded forced recaptures, and it could not have found them from the FEN alone. The obvious statistic - how often a capture is answered on the same square - can be computed from the puzzle bank, but that bank holds exactly twelve puzzles per theme per tier by construction, so a rate measured across themes would be an artefact of the sampling rather than a fact about chess. A proportional sample would make the claim legitimate. Until one exists, this entry gives no number."}],"boards":[{"fen":"1r3rk1/q5pp/2R5/3P4/2Q5/1p2NpPb/1P3P1P/3R2K1 b - - 1 32","corpus":"puzzles","ref":"00Oim","moves":["a7e3","f2e3"],"caption":"Qxe3 takes the knight, and fxe3 takes it back on the same square. This is the position after both moves - and nothing visible in it records that either one happened.","render_fen":"1r3rk1/6pp/2R5/3P4/2Q5/1p2PpPb/1P5P/3R2K1 b - - 0 33"}],"drill":{"mode":"none","why":"impossible","note":"A recapture is a fact about a pair of moves, not about a position, and a FEN does not record the previous move. No predicate over a position can settle it. This is the cleanest example in the glossary of a term that cannot be drilled at all."},"reading":[{"title":"Glossary of chess","url":"https://en.wikipedia.org/wiki/Glossary_of_chess"}],"links":["trade","combination"],"links_resolved":[{"label":"Trade","href":"/glossary/trade/"},{"label":"Combination","href":"/glossary/combination/"}]},{"term":"Trade","slug":"trade","also":["exchange"],"tier":1,"order":70,"kind":"look-up","taught":[],"thread":"The pair of moves a recapture completes, and the first word here that is about intention as much as geometry.","definition":"Exchanging pieces of roughly equal value - a knight for a bishop, a rook for a rook - so that both sides come out level on material. Trading is one of the main ways to change a position without taking a risk: it simplifies, and whether that helps depends entirely on what each side is left with.","precision":[{"against":"sacrifice","text":"A trade comes out level on material; a sacrifice deliberately does not. The difference is intention plus arithmetic, and the arithmetic is the easy half."},{"against":"recapture","text":"The trade is the pair of moves; the recapture is the second one. An offer that is declined is not a trade."},{"against":"the exchange","text":"Exchange is an older synonym for trade, but the exchange, with the article, is a different term entirely: it means the advantage of a rook against a bishop or knight. Up the exchange does not mean a trade happened."}],"chips":["inference"],"extra":[{"heading":"A measurement that changed this entry","body":"The assumption going in was that a trade is nearly always available, so asking about it would be pointless. It is not: an even capture is on offer to the side to move in 35.0% of the 2,100 certified positions. That is inside the band this project requires of a drill, so this term gets a real one. The measurement overruled the plan, which is the only reason it was worth taking."}],"boards":[{"fen":"3r4/pp3k2/2p1bbp1/4Bp1p/3P3P/2P5/PP3PP1/1B2R1K1 w - - 4 30","corpus":"positions","ref":"xw4ccyaw","caption":"The white bishop on e5 attacks the black bishop on f6, and f6 is defended. Taking is available and comes out level, bishop for bishop. Whether it is a good idea is a different question from whether it is a trade.","render_fen":"3r4/pp3k2/2p1bbp1/4Bp1p/3P3P/2P5/PP3PP1/1B2R1K1 w - - 4 30"}],"drill":{"mode":"computed","predicate":"even_capture_available","note":"Is a trade on offer - can the side to move capture something with a piece of the same value? Ten items, answer revealed after each, no gate.","base_rate_pct":35.0,"base_rate_n":2100},"reading":[{"title":"Exchange (chess)","url":"https://en.wikipedia.org/wiki/Exchange_(chess)"}],"links":["recapture","combination"],"links_resolved":[{"label":"Recapture","href":"/glossary/recapture/"},{"label":"Combination","href":"/glossary/combination/"}]},{"term":"Queening","slug":"queening","tier":1,"order":80,"kind":"look-up","taught":["seeds:block-3"],"thread":"The reason endgames are about pawns, and the last of the course words before the one they were all leading to.","definition":"Promoting a pawn to a queen by reaching the far rank. The pawn is removed from the board and a queen takes its place, whatever else is still on - a second or third queen is perfectly legal.","precision":[{"against":"promotion","text":"Promotion is the rule: a pawn reaching the last rank must become a queen, rook, bishop or knight. Queening is the usual choice, and common enough that the two words get used interchangeably. Choosing anything else is underpromotion, and it is occasionally the only move that wins, because a new queen can leave the opponent with no legal move and force a draw where a knight would have mated."},{"against":"passed pawn","text":"A passed pawn has no enemy pawn able to stop it on its own file or the two beside it. That is what turns queening from a wish into a threat - but the pawn still has to get there."}],"chips":["inference"],"extra":[{"heading":"Why there is no drill here, with the number","body":"The seeds course has a working predicate for a pawn about to promote, and it fires in 3.0% of the 2,100 certified positions. A yes/no item at that rate is answered correctly 97% of the time by always saying no. Worse, the 3% is not a fact about chess either: the corpus stopped at sixty half-moves and required twelve pieces on the board, which is exactly where promotions do not happen. The predicate is sound and the corpus is wrong for it - a different problem from a term that cannot be measured at all, which is why this is marked unbalanced rather than impossible."}],"boards":[{"fen":"8/p1p1k2p/4P3/2PP1p1P/1r3r2/5B2/P3RK2/8 w - - 4 39","corpus":"puzzles","ref":"004Lu","caption":"White's pawn on e6 is two moves from the far rank, with the black king standing directly in front of it on e7. The seeds test for a promoting pawn fires here.","render_fen":"8/p1p1k2p/4P3/2PP1p1P/1r3r2/5B2/P3RK2/8 w - - 4 39"},{"fen":"r5k1/6pR/3prPP1/8/1pp1P3/p7/2P5/1K6 w - - 0 39","corpus":"puzzles","ref":"02KwH","awkward":true,"caption":"The awkward case: both sides are queening. White's pawns on f6 and g6 are near the far rank, and Black's on a3, b4 and c4 are running the other way. A race, where being first matters more than being safe.","render_fen":"r5k1/6pR/3prPP1/8/1pp1P3/p7/2P5/1K6 w - - 0 39"}],"drill":{"mode":"hand-picked","why":"unbalanced","note":"Two verified examples, drawn from positions where the course's own promoting-pawn test fires. Not a drill and not scored: at a 3.0% base rate a yes/no set would teach a learner to say no ten times and feel accurate."},"reading":[{"title":"Promotion (chess)","url":"https://en.wikipedia.org/wiki/Promotion_(chess)"}],"links":["endgame","back-rank"],"links_resolved":[{"label":"Endgame","href":"/glossary/endgame/"},{"label":"Back rank","href":"/glossary/back-rank/"}]},{"term":"Combination","slug":"combination","tier":1,"order":90,"kind":"look-up","taught":[],"thread":"The word the whole sequence has been walking towards. Both courses end by telling you the scan has gone quiet and you now have to calculate; neither ever says what calculating is looking for. This is it, and it is the largest hole the two courses leave.","definition":"A forced sequence of moves, usually beginning with a sacrifice, that reaches a specific goal you have seen in advance. Three things separate it from a plain good move: the opponent's replies are forced or near-forced, the goal is concrete rather than positional, and you have to see the whole thing before you start, because the first move is often bad on its own terms.","precision":[{"against":"tactic","text":"Tactic is the general word for short-range forcing play; combination is the specific thing you calculate. The seeds course scans for the twelve features that make a tactic possible. A combination is what you find afterwards, and it is the thing the scan cannot produce."},{"against":"a named shape","text":"Fork and skewer name a shape. Combination names a sequence. A single combination often contains two or three named shapes at once, which is why looking for shapes and looking for combinations are different searches."}],"chips":["inference"],"extra":[{"heading":"Why forcedness is countable","body":"Forced is usually offered as a feeling. It is not: it is the number of legal replies. Counting them is what lets a sequence be calculated to the end before the first piece moves, and it is the only part of this definition a machine can check."},{"heading":"This entry used to have no origin, on purpose","body":"It shipped without one while the rule here was to omit an origin rather than write an unsourced guess, and combination was the entry where that was hardest to accept. Nothing about the rule has changed - a dated attestation from a reputable secondary source satisfies it rather than bending it. The rule was never no origins; it was no invented ones."}],"boards":[{"fen":"2k3r1/1p1q3p/1p2p3/1NbpQr2/P1p2P2/6P1/6KP/R4R2 w - - 1 32","corpus":"puzzles","ref":"00ICz","caption":"Na7+ Kd8 Qb8+ Ke7 Qxg8. After Na7+ Black has exactly one legal move; after Qb8+, two. That is what forced means, stated as a count rather than as a feeling.","render_fen":"2k3r1/1p1q3p/1p2p3/1NbpQr2/P1p2P2/6P1/6KP/R4R2 w - - 1 32"}],"drill":{"mode":"none","why":"impossible","note":"Whether a position contains a combination depends on how deep you look and on what goal you accept, and no predicate settles either. Illustrated, not drilled. Inventing an answer key here is the failure this project has spent real effort avoiding."},"reading":[{"title":"Combination (chess)","url":"https://en.wikipedia.org/wiki/Combination_(chess)"}],"links":["tactic","sacrifice","/courses/chess-seeds/"],"origin":{"chip":"sourced","text":"The word itself is much older than its chess sense: it reaches English from French in the first half of the sixteenth century, and by the 1700s it had already been pressed into service by mathematics, theology, education and chemistry. Chess was late. The Oxford English Dictionary dates the chess sense only to the 1870s - which means players were finding these sequences for centuries before anyone settled on a word for them, and that the word arrived as a borrowing from mathematics rather than as something chess coined for itself.","source":"Oxford English Dictionary, combination, n. - the entry's dating of the chess sense. Secondary source; the 1870s texts have not been consulted directly"},"links_resolved":[{"label":"Seeds of tactical destruction","href":"/courses/chess-seeds/"}]}]</script>
