<script type="application/json" id="data">{"tier":3,"group":"tournament","kind":"look-up","term":"Arbiter","slug":"arbiter","also":["tournament director","TD"],"chips":["sourced"],"definition":"The official running the event: the person who makes the pairings, starts the clocks, and rules on anything the two players cannot settle themselves. An arbiter decides claims - an illegal move, a flag fall, a repetition - and adjusts the clocks when something has gone wrong. Their job is to be unnecessary and to be there.","precision":[{"against":"the arbiter being a referee who watches the moves","text":"Mostly they do not intervene until asked. A great deal of what the Laws describe is a *claim procedure*: a player who wants a draw by repetition or a win on time says so and stops the clock, and the arbiter rules. Play on without claiming and the position simply continues, which surprises beginners who expect the rules to enforce themselves."},{"against":"their decisions being about chess","text":"Most are about the apparatus. Where the clock sits, how much time to restore after an illegal move, whether a scoresheet was kept, what happens when a phone rings - the Laws of Chess are largely a procedure manual, and the arbiter is the person who runs it."},{"against":"online play having none","text":"It has the same job done by software and after the fact. A server enforces legality absolutely, calls the flag automatically, and settles cheating claims by review rather than at the board - see `cheat-detection`. What is genuinely gone is the human judgement, and with it the possibility of arguing."}],"no_board":"A person, doing a job that only becomes visible when something has gone wrong away from the board. No position records it - and every position in this glossary comes from an online game with no arbiter in it at all.","boards":[],"drill":{"mode":"none","why":"impossible","note":"Nothing on a board depends on who is running the tournament."},"links":["fide","touch-move","j-
