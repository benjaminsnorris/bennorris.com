<script type="application/json" id="data">{"term":"Opening trap","slug":"opening-trap","tier":3,"group":"openings","kind":"look-up","definition":"A line in the opening where the natural move loses by force. Traps work because the losing move is the obvious one - usually taking something - and they are the reason a beginner can be lost by move eight without having done anything that felt wrong.","precision":[{"against":"playing for traps","text":"The test of a trap is what happens when it is declined, and that is where most of them fail: a line that wins if the opponent grabs the bait and loses a pawn if they do not is a bad line you are hoping to be rescued from. Setting a trap that costs nothing is good chess; needing it to work is hope chess."},{"against":"being about memory","text":"The useful lesson is not the list. Traps almost all punish the same thing - grabbing material with pieces undeveloped and the king in the middle - so the habit that avoids all of them is checking what a capture does to your development, which is a general skill and not an opening one."}],"chips":["sourced"],"boards":[{"fen":"r1bBk2r/pppp1ppp/2n5/2b1p3/4n3/P2P2P1/1PP2P1P/RN1QKBNR b KQkq - 0 6","corpus":"puzzles","ref":"07KkQ","caption":"Move six, thirty men, and White has just won a queen: the bishop on d8 has taken it. Black mates in three - Bxf2+, Ke2 forced, Nd4 - because taking the queen left the king in the centre with f2 defended once. This is exactly the shape of the thing: the winning move for White was not the greedy one, and nothing about the greedy one looked wrong.","moves":["c5f2","e1e2","c6d4"],"highlight":["d8","e2","f2"],"render_fen":"r1bBk2r/pppp1ppp/8/4p3/3nn3/P2P2P1/1PP1Kb1P/RN1Q1BNR w kq - 2 8","highlight_squares":["d8","e2","f2"]}],"drill":{"mode":"none","why":"impossible","note":"Whether a natural-looking move loses by force is what calculation is for, and no predicate over a position settles it. The puzzle bank supplies the illustration because a puzzle is a position with a verified forced solution, which is what a trap is."},"links":["gambit","development","combination","blunder","sacrifice","attacking-f2-f7","theory"],"reading":[{"title":"Chess opening","url":"https://en.wikipedia.org/wiki/Chess_opening"}],"links_resolved":[{"label":"Gambit","href":"/glossary/gambit/"},{"label":"Development","href":"/glossary/development/"},{"label":"Combination","href":"/glossary/combination/"},{"label":"Blunder","href":"/glossary/blunder/"},{"label":"Sacrifice","href":"/glossary/sacrifice/"},{"label":"Attacking f2 and f7","href":"/glossary/attacking-f2-f7/"},{"label":"Theory","href":"/glossary/theory/"}],"home":null}</script>
