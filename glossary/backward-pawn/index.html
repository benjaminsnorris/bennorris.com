<script type="application/json" id="data">{"term":"Backward pawn","slug":"backward-pawn","tier":3,"group":"positional","kind":"look-up","definition":"A pawn left behind the pawns on the files either side of it, on a file with no enemy pawn to shield it. It cannot advance without being taken and it cannot be defended by another pawn, so it is a target that stays where it is.","precision":[{"against":"an isolated pawn","text":"An isolated pawn has no friendly pawns on either side at all. A backward pawn has them and is behind them, which is worse in one specific way: the square in front of it is a hole its own neighbours cannot cover, so the pawn is weak and so is the square above it."},{"against":"a pawn that is merely undeveloped","text":"The half-open file is the other half of the definition. A pawn behind its neighbours with an enemy pawn facing it is just a pawn; it is when a rook can be put on the file that being backward starts to cost something."},{"against":"being unusual","text":"A pawn behind both of its neighbours turns up in 81.3% of the certified corpus, which is far too common to be worth a drill and worth knowing anyway: the shape is normal, and what makes it a weakness is the open file next to it and a piece that can reach it."}],"chips":["sourced"],"boards":[{"fen":"2kr4/5p1p/p6p/4P1r1/3Nb3/P2N1P1P/1P4P1/5RK1 w - - 0 29","corpus":"positions","ref":"fpycei5h","caption":"White's pawn on g2 is behind both of its neighbours - f3 and h3 - and no black pawn is on the g-file, which is why the black rook is already on g5. The pawn cannot advance and no white pawn can ever defend it.","highlight":["f3","g2","g5","h3"],"render_fen":"2kr4/5p1p/p6p/4P1r1/3Nb3/P2N1P1P/1P4P1/5RK1 w - - 0 29","highlight_squares":["f3","g2","g5","h3"]}],"drill":{"mode":"none","why":"unbalanced","note":"The predicate is straightforward and the shape is nearly universal: 81.3% of the certified corpus, which the base-rate gate refuses. Adding the half-open-file condition would bring it down, and would also make the question two questions. Measured over `positions.json`: 2,100 engine-checked positions, materially level, plies 16 to 60 - which is to say middlegames, the part of the game these words are about. Club games: the median rating is 1627 and both players were between 1200 and 1800 in 67% of them."},"links":["isolated-pawn","doubled-pawns","weak-square","open-file","minority-attack","connected-pawns","outpost"],"reading":[{"title":"Backward pawn, in Glossary of chess","url":"https://en.wikipedia.org/wiki/Glossary_of_chess#backward_pawn"}],"links_resolved":[{"label":"Isolated pawn","href":"/glossary/isolated-pawn/"},{"label":"Doubled pawns","href":"/glossary/doubled-pawns/"},{"label":"Weak square","href":"/glossary/weak-square/"},{"label":"Open file","href":"/glossary/open-file/"},{"label":"Minority attack","href":"/glossary/minority-attack/"},{"label":"Connected pawns","href":"/glossary/connected-pawns/"},{"label":"Outpost","href":"/glossary/outpost/"}],"home":null}</script>
