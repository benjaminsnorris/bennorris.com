<script type="application/json" id="data">{"tier":3,"group":"pieces-and-rules","kind":"look-up","chips":["sourced"],"term":"Minor piece","slug":"minor-piece","also":["light piece"],"definition":"A bishop or a knight: the two three-point pieces, and the two that cannot force checkmate with only their own king. Developing in the opening mostly means getting these out, which is why the word turns up in opening advice more than anywhere else.","precision":[{"against":"the two being interchangeable","text":"The same price and different jobs, and the position decides which. A bishop wants the board open and a long diagonal; a knight wants the pawns fixed and a square in the enemy half that no pawn can chase it from, which is what an `outpost` is. Their average mobility on the certified corpus is almost identical - 4.92 legal moves for a bishop against 4.84 for a knight - so the difference is not that one of them moves more."},{"against":"minor meaning unimportant","text":"Two minor pieces are worth more than a rook, and the two bishops together are worth more than twice one bishop - see `bishop-pair`. Minor is a statement about mating with a king and one piece and about nothing else."}],"boards":[{"fen":"1r4k1/r1p2ppp/2Bp4/3Pp3/1P2K3/1QP1B2P/2N3P1/2N2q2 w - - 0 28","corpus":"positions","ref":"u61n8tsv","caption":"A clean imbalance: White has four minor pieces and one major - bishops on c6 and e3, knights on c1 and c2, a queen on b3 - against Black's queen and two rooks and no minor piece at all. Material is 26 to 25. White's pieces cover squares; Black's need lines.","highlight":["c6","e3","c1","c2","a7","b8","f1"],"render_fen":"1r4k1/r1p2ppp/2Bp4/3Pp3/1P2K3/1QP1B2P/2N3P1/2N2q2 w - - 0 28","highlight_squares":["c6","e3","c1","c2","a7","b8","f1"]}],"drill":{"mode":"none","why":"unbalanced","note":"Both sides still hold a minor piece in 91.5% of the certified corpus and 73.7% of the drill corpus, so in the middlegame the question answers itself. The version worth asking - which minor piece is better in this position - is a judgement, and `good-and-bad-bishop` is the nearest this project comes to drilling it."},"links":["major-piece","bishop","knight","development","bishop-pair","outpost"],"reading":[{"title":"Minor piece, in Glossary of chess","url":"https://en.wikipedia.org/wiki/Glossary_of_chess#minor_piece"}],"links_resolved":[{"label":"Major piece","href":"/glossary/major-piece/"},{"label":"Bishop","href":"/glossary/bishop/"},{"label":"Knight","href":"/glossary/knight/"},{"label":"Development","href":"/glossary/development/"},{"label":"The bishop pair","href":"/glossary/bishop-pair/"},{"label":"Outpost","href":"/glossary/outpost/"}],"home":null}</script>
