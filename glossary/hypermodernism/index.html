<script type="application/json" id="data">{"tier":3,"group":"historical","kind":"look-up","term":"Hypermodernism","slug":"hypermodernism","also":["hypermodern","the hypermoderns"],"chips":["sourced"],"definition":"The 1920s reaction to the classical school: control the centre from a distance with pieces instead of occupying it with pawns, and invite the other side to build a big pawn centre so that it becomes something to attack. Nimzowitsch, R\u00e9ti, Tartakower, Breyer and Gr\u00fcnfeld, and a set of openings still named after them.","precision":[{"against":"it contradicting the classical school","text":"It disputes the method and keeps the goal. Both schools want the centre; the argument is over whether a pawn standing on a central square controls it or merely occupies it and becomes a target. Modern practice took the hypermodern openings and the classical principles together, which is why a beginner is still taught to occupy the centre and will still meet the King's Indian."},{"against":"it being a fringe idea","text":"The openings are ordinary now - and mostly at the top. Of the 7,905 distinct positions in the opening census, **359 carry a hypermodern opening name**: 4.5%, about one position in twenty, counting the R\u00e9ti, the King's Indian, the Queen's Indian, the Nimzo-Indian, the Gr\u00fcnfeld, the Catalan, Alekhine's Defence and the Modern. A revolution that reached one club game in twenty inside the first three moves."},{"against":"the name being the movement's own","text":"It is a label from outside and the men it names did not agree with each other much. What they shared is a suspicion of rules: Nimzowitsch's argument is that chess cannot be reduced to principles, which is a claim about `classical-school` teaching rather than about the centre. Tartakower coined the word in a book title, which is how these things usually happen."}],"origin":{"text":"Emerged after the First World War and came to prominence in the 1920s, in Central Europe. R\u00e9ti's *
