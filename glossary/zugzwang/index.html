<script type="application/json" id="data">{"term":"Zugzwang","slug":"zugzwang","tier":2,"order":707,"group":"judgement","kind":"look-up","taught":[],"thread":"The last of the judgement terms, and the only one in the group a machine can actually confirm.","definition":"A position where you would be better off if you could pass, but you cannot: every legal move makes your position worse. It is a peculiarity of chess that having the move - normally an advantage - can be the thing that loses.","precision":[{"against":"having no good moves","text":"A position can be lost with no good moves available and not be zugzwang at all. Zugzwang means the obligation itself is what does the damage: if you could stand still, you would be fine."},{"against":"mutual zugzwang","text":"Also called reciprocal zugzwang or trebuchet: whichever side has to move loses. The same square, two different results, decided entirely by whose turn it is."},{"against":"the endgame","text":"Not exclusively an endgame idea, but overwhelmingly one. With more pieces on there is nearly always some harmless move available; with three pieces there may be none."}],"chips":["sourced"],"extra":[{"heading":"Rare enough to be worth a number","body":"Every position in the drill corpus with four to nine men was tested with an engine, twice - once with each side to move - to price the obligation to move: 456 positions, 912 evaluations at depth 14. Having the move is normally worth something, and the median position pays about 40 centipawns for it. The exceptions are what the word is for, and they are rare: the obligation to move costs a pawn or more in 19 of the 456, and the equivalent of a rook or more in 8. **In none of the 456 does it reverse who is winning.** So zugzwang in a real club endgame is usually a change in how much you are winning by, not a change in who wins - which is why there is no drill, and why the two boards above are the far tail rather than the ordinary case."},{"heading":"How the two boards below were confirmed","body":"Not by a label and not by eye. Each position was evaluated by Stockfish at depth 16, then evaluated again with the side to move reversed. If a player is better off when it is the opponent's turn, the obligation to move is costing them something, and that is what zugzwang means. Both boards clear that test by a wide margin; the numbers are in the captions."}],"boards":[{"fen":"8/8/4kPK1/7p/7P/8/8/8 w - - 1 52","corpus":"drill","ref":"dfjzc0um","caption":"Five men, White to move, and six legal moves - Kg5, Kxh5, Kh6, Kg7, Kh7 or f7. Stockfish 18 at depth 16 scores this +974 for White. The same position with Black to move is a forced mate for White. White is winning either way; the obligation to move is the difference between winning and finishing.","render_fen":"8/8/4kPK1/7p/7P/8/8/8 w - - 1 52"},{"fen":"8/6k1/2K3P1/p7/8/2p5/1p6/8 w - - 0 59","corpus":"drill","ref":"k9tvq1ux","awkward":true,"caption":"The harsher version. White has eight legal moves, all king moves, and every one of them loses: White to move is mate in 6 against best play. If White could pass, the same position scores -1075 - lost, but not lost this week.","render_fen":"8/6k1/2K3P1/p7/8/2p5/1p6/8 w - - 0 59"}],"drill":{"mode":"none","why":"impossible","note":"Confirming zugzwang needs an engine and two evaluations of the same position - one with each side to move - which is not a predicate over a FEN. It is also rare: across the 456 positions in the drill corpus with four to nine men, each evaluated both ways, the obligation to move costs a pawn or more in 19 and reverses the result in none."},"reading":[{"title":"Zugzwang","url":"https://en.wikipedia.org/wiki/Zugzwang"}],"links":["endgame","tempo","material","depth"],"also":["mutual zugzwang","reciprocal zugzwang"],"origin":{"chip":"sourced","text":"German, literally compulsion to move - Zug is a move, Zwang is compulsion. It is one of a small group of German chess terms English simply adopted rather than translating, alongside luft and zwischenzug, and it survives untranslated because no English phrase says it as compactly.","source":"Wikipedia, Zugzwang - a secondary source; not verified against the German chess literature"},"links_resolved":[{"label":"Endgame","href":"/glossary/endgame/"},{"label":"Tempo","href":"/glossary/tempo/"},{"label":"Material","href":"/glossary/material/"},{"label":"Depth","href":"/glossary/depth/"}],"home":{"slug":"core","title":"The core vocabulary","framing":"Why this is in the core vocabulary"},"paths":{"core":{"title":"The core vocabulary","n":69,"of":73,"prev":{"slug":"prophylaxis","term":"Prophylaxis"},"next":{"slug":"blunder","term":"Blunder"}}}}</script>
