<script type="application/json" id="data">{"term":"Bishop endgame","slug":"bishop-endgame","tier":3,"group":"endgame-technique","kind":"look-up","definition":"An endgame in which the bishops are the only pieces left. Everything in it follows from one fact: a bishop can only ever reach half the squares on the board, so the colour it runs on decides which pawns it can defend, which it can attack, and whether it can stop a pawn at all.","precision":[{"against":"bishops of opposite colours","text":"The drawish reputation belongs to this case specifically, not to bishop endgames generally, because two bishops on different colours can never meet or block each other. Of the 24 puzzles here, 11 have a lone bishop against none, 7 have both bishops on the same colour and 6 on opposite colours - so the famously drawn case is a quarter of them."},{"against":"the knight endgame","text":"Both are single minor pieces and they fail in opposite ways. A bishop covers distance and cannot change colour; a knight reaches every square and needs three moves to cross the board. That is why a wrong-coloured bishop is a draw and a knight on the wrong side is a loss."}],"chips":["sourced"],"boards":[{"fen":"8/3P4/8/2k2pbP/8/5K2/8/8 w - - 0 52","corpus":"puzzles","ref":"018Iz","caption":"Six men. The white h-pawn runs, and the black bishop on g5 runs on dark squares - the same colour as h8, the square the pawn is heading for. Being the right colour is not enough when it is on the wrong side of the board: h6, and the pawn goes through.","moves":["h5h6"],"highlight":["g5","h5","h8"],"render_fen":"8/3P4/7P/2k2pb1/8/5K2/8/8 b - - 0 52","highlight_squares":["g5","h5","h8"]}],"drill":{"mode":"none","why":"unwritten","note":"The bishop's colour is trivially computable and so is the promotion square, so a wrong-coloured-bishop predicate could be written and would have a real answer key. It has not been, and the relaxed corpus now contains the endgames it would need. This is debt rather than a refusal.
