<script type="application/json" id="data">{"tier":3,"group":"notation","kind":"look-up","term":"Move number","slug":"move-number","also":["full move","the ellipsis"],"chips":["sourced"],"definition":"A move is one turn by each player, so move 3 means White's third and Black's third together. The number goes before White's move - 3.Nc3 - and to write Black's on its own you repeat the number and add three dots: 3...Nf6. A game of forty moves is eighty turns.","precision":[{"against":"a move being one player's turn","text":"Everywhere else in chess a move is what one player does: you make a move, it is your move. In the numbering it is what both players do, and the notation follows the numbering. The word for one player's turn is `ply`, and that is the one engines and databases count in."},{"against":"the three dots meaning \"and so on\"","text":"They are not an abbreviation and nothing has been left out. The ellipsis says only that the move being written is Black's, and it is needed whenever Black's move is not sitting to the right of White's on the page: at the start of an excerpt, under a diagram, or inside a bracketed variation. 3.Nf6 and 3...Nf6 are claims about two different players."},{"against":"a FEN needing them","text":"A FEN carries the same fact in two separate fields - its last number is the move number and its second field is the side to move - so \"3\" and \"b\" together say what \"3...\" says. Notation needs the dots because a list of moves has nowhere to put whose turn it is. Only a position does."}],"boards":[{"fen":"rnbqkbnr/ppp2ppp/4p3/3p4/3PP3/2N5/PPP2PPP/R1BQKBNR b KQkq - 1 3","corpus":"opening","ref":"pkacb0rf","caption":"1.e4 e6 2.d4 d5 3.Nc3 - a French, three moves in, Black to play. The FEN's last field is 3 and its side-to-move field is b, so Black's reply here is written 3...Nf6 or 3...Bb4, never 3.Nf6: White has already had the third move.","render_fen":"rnbqkbnr/ppp2ppp/4p3/3p4/3PP3/2N5/PPP2PPP/R1BQKBNR b KQkq - 1 3"}],"drill":{"mode":"no
