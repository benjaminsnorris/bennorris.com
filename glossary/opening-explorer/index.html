<script type="application/json" id="data">{"tier":3,"group":"online","kind":"look-up","term":"Opening explorer","slug":"opening-explorer","also":["explorer","opening database"],"chips":["sourced","vendor-framing"],"definition":"A database you can walk into. Play the moves of an opening and it tells you how many recorded games reached this position, which moves were played from it, and how each of them scored. It is how a beginner discovers that the move they invented has been played eleven thousand times and does badly.","precision":[{"against":"the explorer telling you what is good","text":"It tells you what was popular and what scored, in whichever population it was built from - and the population is the whole question. A line that scores well among 1200-rated players may be a trap that stops working at 1600, and a line the masters avoid may be perfectly good against anybody you will actually meet. An explorer that does not let you choose the rating band is answering a question you did not ask."},{"against":"this glossary having one","text":"It has the shape of one with both useful columns missing. The corpus behind the opening boards is 7,905 distinct positions from plies 2 to 6 of 121,332 games, each carrying the moves that made it and Lichess's own classification - but each position is kept **once**, however many games produced it, and no game's result was stored. So it can tell you what a position is called and cannot tell you how often anyone reached it or what happened afterwards, which are the two things an explorer exists for."},{"against":"the names being the position's own","text":"They are the database's, applied to the game rather than to the position - see `eco-code`, where the same corpus files 1.Nc3 Nf6 under a code for a king's pawn opening. An explorer inherits that: the label on a row is a classification somebody made, and early positions get labels from games that transposed."}],"boards":[{"fen":"r1bqkbnr/1ppp1ppp/p1n5/1B2p3/4P3/5N2/PPPP1PPP/RNB
