<script type="application/json" id="data">{"tier":3,"group":"slang","kind":"look-up","term":"Cheapo","slug":"cheapo","also":["cheap shot","cheap trick"],"chips":["sourced"],"definition":"A primitive trap, set in a bad position in the hope that the opponent will not look. The sources are blunt about it - \"often set in the hope of swindling a win or a draw from a lost position\" - and the word carries the shrug that goes with it: a cheapo is not expected to work, it is played because nothing else was going to.","precision":[{"against":"it being a plan","text":"It is the absence of one, and that is the whole meaning of the word. A cheapo depends entirely on the opponent's inattention: if they look, it loses, usually faster than playing on would have. Setting one is a decision to stop playing chess and start playing the person - defensible when you were losing anyway, and a bad habit when you were not."},{"against":"the opponent being at fault for falling in","text":"They are, and that is the point of `hope-chess`: the reason cheapos work at club level is that most players do not check their opponent's forcing replies, and the median position offers only two. A cheapo is a tax on a habit that costs two moves' attention to fix."},{"against":"it being the same thing as an `opening-trap`","text":"An opening trap is prepared, sound, and leaves you fine if it is declined. A cheapo is improvised, unsound, and leaves you worse. The word for the difference is whether you would have been happy to see it refused."}],"no_board":"The same filter as `swindle`: a cheapo lives in a lost position and the certified corpus holds almost none. There is also no predicate for it - a trap is defined by what its author was hoping for.","boards":[],"drill":{"mode":"none","why":"contested","note":"The label depends on intent and on the position being bad, and neither is decidable from a FEN. A predicate could find one-move threats; it could not tell a cheapo from a good move that happens to thr
