<script type="application/json" id="data">{"term":"Blockade","slug":"blockade","tier":3,"group":"positional","kind":"look-up","definition":"Parking a piece on the square directly in front of an enemy pawn so it cannot advance. A pawn cannot capture what is straight ahead of it, so the blockading piece is safe from the thing it is stopping - and a knight, which wants a square nothing can chase it from, is the ideal piece for the job.","precision":[{"against":"merely defending against a pawn","text":"A blockade stops the pawn permanently rather than fighting it. That is why the square matters more than the piece: it is immune to the pawn by geometry, so the only way to shift the blockader is to attack it with something else. Nimzowitsch's rule - first restrain, then blockade, then destroy - is about the order those come in, and he is also where the word comes from."},{"against":"being about passed pawns only","text":"Passed pawns are the usual target because they are the ones that would otherwise run, and any pawn can be blockaded. The square in front of an isolated pawn is the other standard case: it is a hole the pawn's own neighbours cannot cover."}],"chips":["sourced"],"boards":[{"fen":"5rk1/1b1n1pp1/3Pp2p/q1p5/4P3/1N1B4/rP2QPPP/2R2RK1 b - - 0 22","corpus":"positions","ref":"pt7j4xxe","caption":"The knight on d7 sits in front of White's passed pawn on d6 and the pawn will never move again. The knight cannot be attacked by that pawn - a pawn captures diagonally - so removing it means bringing something else, and until then a pawn on the sixth rank is doing nothing at all.","highlight":["d6","d7"],"render_fen":"5rk1/1b1n1pp1/3Pp2p/q1p5/4P3/1N1B4/rP2QPPP/2R2RK1 b - - 0 22","highlight_squares":["d6","d7"]}],"drill":{"mode":"none","why":"unbalanced","note":"A piece standing in front of an enemy passed pawn is exactly computable and occurs in 4.1% of the certified corpus and 7.2% of the relaxed one - far too rare for a balanced item. Measured over `positions.json`: 2,100 engine-checked positions, materially level, plies 16 to 60 - which is to say middlegames, the part of the game these words are about. Club games: the median rating is 1627 and both players were between 1200 and 1800 in 67% of them."},"links":["passed-pawn","outpost","isolated-pawn","weak-square","overprotection","closed-position","wrong-coloured-bishop"],"reading":[{"title":"Glossary of chess","url":"https://en.wikipedia.org/wiki/Glossary_of_chess"}],"links_resolved":[{"label":"Passed pawn","href":"/glossary/passed-pawn/"},{"label":"Outpost","href":"/glossary/outpost/"},{"label":"Isolated pawn","href":"/glossary/isolated-pawn/"},{"label":"Weak square","href":"/glossary/weak-square/"},{"label":"Overprotection","href":"/glossary/overprotection/"},{"label":"Closed position","href":"/glossary/closed-position/"},{"label":"Wrong-coloured bishop","href":"/glossary/wrong-coloured-bishop/"}],"home":null}</script>
