<script type="application/json" id="data">{"tier":3,"group":"tactical-method","kind":"look-up","chips":["sourced"],"term":"Overloading","slug":"overloading","also":["overload"],"definition":"Giving one defender two jobs and then taking one of them away. The piece is not attacked and is not pinned; it is simply doing too much, so anything that forces it to choose wins whichever duty it drops.","precision":[{"against":"an overworked defender","text":"The same situation named from the two ends. `overworked-defender` is the piece and the thing this glossary's seed predicate looks for; overloading is what you do to it - the deflection, capture or threat that makes it choose. The seed finds the candidates and cannot tell you which of them can actually be exploited."},{"against":"a pin","text":"A pinned piece cannot move. An overloaded piece can move perfectly freely and that is precisely the problem: it can go and deal with one threat, and the other one is then unanswered. The two feel similar at the board and want opposite treatments - you attack a pin, you distract an overload."}],"boards":[{"fen":"2krn2r/1pp1b1pp/p1n1p3/1NNq1p2/1P1P1B2/P1P2PP1/4Q2P/R3K2R w KQ - 0 20","corpus":"positions","ref":"orqvd3c2","caption":"The seeds course's own predicate finds this one: White's queen on e2 is the only defender of both f3 and b5, a pawn on one side of the board and a knight on the other. Nothing is attacking the queen and nothing needs to - anything that makes her leave one square abandons the other.","highlight":["e2","f3","b5"],"render_fen":"2krn2r/1pp1b1pp/p1n1p3/1NNq1p2/1P1P1B2/P1P2PP1/4Q2P/R3K2R w KQ - 0 20","highlight_squares":["e2","f3","b5"]}],"drill":{"mode":"none","why":"taught-elsewhere","note":"The seeds course drills finding the overworked piece, as one of the twelve seeds, and it is the rarest of them: it fires for at least one side in only 4.8% of the 2,100 certified positions. The courses already drill this, and better than a second drill here would. What the seed cannot do is say which candidate is exploitable, and no predicate settles that."},"links":["overworked-defender","capturing-defender","deflection","attacker-count","underguarded","absolute-pin","/courses/chess-seeds/"],"reading":[{"title":"Overloading (chess)","url":"https://en.wikipedia.org/wiki/Overloading_(chess)"}],"links_resolved":[{"label":"Overworked defender","href":"/glossary/overworked-defender/"},{"label":"Capturing the defender","href":"/glossary/capturing-defender/"},{"label":"Deflection","href":"/glossary/deflection/"},{"label":"Attacker count","href":"/glossary/attacker-count/"},{"label":"Underguarded","href":"/glossary/underguarded/"},{"label":"Absolute pin","href":"/glossary/absolute-pin/"},{"label":"Seeds of tactical destruction","href":"/courses/chess-seeds/"}],"home":null}</script>
