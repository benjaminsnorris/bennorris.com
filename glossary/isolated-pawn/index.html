<script type="application/json" id="data">{"term":"Isolated pawn","slug":"isolated-pawn","tier":2,"order":602,"group":"pawns","kind":"see-it","taught":[],"thread":"The second, and the more common one by a distance.","definition":"A pawn with no friendly pawn on either adjacent file. No pawn can ever defend it, so if it is attacked it must be defended by pieces - and pieces tied to a pawn are pieces not doing anything else.","precision":[{"against":"doubled pawns","text":"Different weaknesses that often arrive together. Doubled is about the file it shares; isolated is about the files beside it. A pawn can be both, and the pair on one file can be isolated as a unit."},{"against":"a backward pawn","text":"A backward pawn still has neighbours, but they have advanced past it, so it cannot be defended by them and cannot safely advance either. Related complaint, different geometry - and it is a tier 3 term rather than one of these."},{"against":"the isolated queen's pawn","text":"A specific and much-analysed case: an isolated pawn on the d-file, usually arising from particular openings, which comes with a whole body of theory about the attacking chances it buys. When strong players say IQP they mean that structure, not any isolated pawn."}],"chips":["sourced"],"extra":[{"heading":"Commoner than the reputation suggests","body":"At least one isolated pawn is present in 61.8% of the drill corpus and 53.4% of the certified corpus. It is the most common pawn weakness by a wide margin, which is a useful corrective: a feature in three positions out of five is not by itself a reason to do anything. What matters is whether it can be attacked, and that is not a property of the pawn."}],"boards":[{"fen":"r2q1rk1/2p3p1/p7/1p4R1/8/2P4P/PPB2bP1/R2Q3K w - - 1 24","corpus":"drill","ref":"oqv727z8","highlight":"auto:pawns:isolated","caption":"One isolated pawn on the board: the black pawn on g7, with nothing on f or h. Black's other three pawns are all neighbours of each other.","render_fe
