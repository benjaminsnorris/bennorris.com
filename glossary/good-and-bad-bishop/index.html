<script type="application/json" id="data">{"term":"Good and bad bishop","slug":"good-and-bad-bishop","tier":3,"group":"positional","kind":"look-up","also":["bad bishop","good bishop"],"definition":"A bishop is bad when most of your own pawns sit on the colour it travels on, so its diagonals are already occupied by your own men, and good when they sit on the other colour and it has the board to itself. Nothing about the bishop changes; the pawns decide.","precision":[{"against":"the bishop being the problem","text":"The pawns are. That is the practical content of the term, because pawns are what you can change: trading the wrong ones, or advancing them off the bishop's colour, turns a bad bishop into a good one without the bishop moving. Trading the bishop itself is the other fix and usually the worse one."},{"against":"the wrong-coloured bishop","text":"Different problem, same word doing different work. A wrong-coloured bishop cannot control one specific square - the promotion square of a rook pawn - and no plan changes it. A bad bishop is blocked by pawns that can move, so it is a condition rather than a fact."},{"against":"a bad bishop being a bad piece","text":"It is often the better defender: a bishop on the colour of your own pawns is exactly the piece that guards them. Bad describes its attacking range, not its usefulness, which is why some strong players deliberately keep one."}],"chips":["sourced"],"boards":[{"fen":"r1b1r1k1/1p1n1pbp/pBp1p1p1/8/4P3/1BN5/PPP2PPP/3R1RK1 w - - 4 14","corpus":"positions","ref":"cu3skyfm","caption":"Both extremes at once, in one position, belonging to the same player. All seven of Black's pawns stand on light squares. The bishop on c8 travels on light squares - 7 of 7 own pawns in its way, the worst case there is - and the bishop on g7 travels on dark, with 0 of 7 in its way and the whole long diagonal to itself.","highlight":["c8","g7"],"render_fen":"r1b1r1k1/1p1n1pbp/pBp1p1p1/8/4P3/1BN5/PPP2PPP/3R1RK1 w - - 4 14","highlight_squ
