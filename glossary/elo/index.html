<script type="application/json" id="data">{"tier":3,"group":"tournament","kind":"look-up","term":"Elo","slug":"elo","also":["Elo rating","Elo points"],"chips":["sourced"],"definition":"FIDE's rating system, and the one most people mean by \"rating\". Each game moves points from the loser to the winner, and how many depends on the gap between them: beat somebody far above you and you gain a lot, lose to somebody far below and you lose a lot. It is named after the man who devised it and it is not an acronym.","precision":[{"against":"ELO being initials","text":"It is a surname. Arpad Elo was a Hungarian-American physics professor and chess master, and the system is his; writing it in capitals is the commonest mistake in chess vocabulary and it is worth not making. \"Elo\", like \"Glicko\", is a person."},{"against":"the points being awarded","text":"They are transferred. Elo is zero-sum between the two players: the winner takes exactly what the loser gives, so a rating pool cannot inflate by anybody winning. The number that decides how much moves in one game is the K-factor, and a system choosing a high one is choosing to react fast and be noisy."},{"against":"a rating difference meaning a strength difference","text":"It means an expected score, which is the only thing it was built to mean. 100 points of difference is an expected 64% for the stronger player; 200 points is 76%. Note what that says about the underdog: at 200 points down you are still expected to take about a quarter of the points, so losing to somebody 200 above you is the system working rather than a verdict."}],"origin":{"text":"Devised by Arpad Elo, implemented by the United States Chess Federation in 1960 and adopted by FIDE in 1970. It replaced systems that ranked players in classes; Elo's contribution was to model a result as a probability and let the ratings be the parameters of it.","chip":"sourced","source":"Wikipedia, Elo rating system. The primary - Elo's *The Rating of Chessplayers, Past and
