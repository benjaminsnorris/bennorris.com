<script type="application/json" id="data">{"term":"FEN","slug":"fen","tier":1,"order":10,"kind":"look-up","taught":[],"thread":"Every term in this glossary is illustrated with a position, and every position is stored as one line of text. This is that line, so it comes first.","definition":"A single line of text that describes a position completely: where the pieces are, whose turn it is, which castling moves are still legal, whether an en passant capture is available, and two counters. Six fields, separated by spaces. The initials stand for Forsyth-Edwards Notation.","precision":[{"against":"PGN","text":"A FEN is one position; a PGN is a whole game, stored as the moves that produced it. You replay a PGN and you load a FEN. Puzzles usually ship as a FEN plus a short move list, which is how they can begin in the middle of a game nobody has shown you."},{"against":"the first four fields","text":"Tools routinely compare only the first four - placement, side to move, castling, en passant - because the two counters can differ between two boards that are the same position. The corpus behind this glossary de-duplicates on exactly those four, and so do both courses."}],"chips":["sourced"],"extra":[{"heading":"Why the counters are the part everyone drops","body":"The two counters are the youngest and least loved part of the notation. They are what the courses and the corpus behind this glossary ignore when comparing two boards, because the same position can carry different counters. Dropping them is not a shortcut - a position is where the pieces are, whose turn it is, and what is still legal, and the counters are none of those things."},{"heading":"Checked, not assumed","body":"All 2,100 positions in the corpus parse as FEN and carry exactly six fields."}],"boards":[{"fen":"r1bqk2r/pp2nppp/2nb4/2p1p3/3pP3/3P1NNP/PPP1BPP1/R1BQK2R w KQkq - 1 9","corpus":"positions","ref":"747wya3v","caption":"Read the fields off it: the placement, then w for White to move, then KQkq because all four castling rights survive, then - because no en passant capture is available, then the two counters. Nothing has been captured yet - all thirty-two pieces are still on.","render_fen":"r1bqk2r/pp2nppp/2nb4/2p1p3/3pP3/3P1NNP/PPP1BPP1/R1BQK2R w KQkq - 1 9"}],"drill":{"mode":"none","why":"unwritten","note":"There is a real item here and it is computable - given a FEN, name the square the black king is on - but the drill machinery in this glossary asks yes/no questions and that is not one. Recorded as debt rather than dressed up as impossible."},"reading":[{"title":"Forsyth-Edwards Notation","url":"https://en.wikipedia.org/wiki/Forsyth%E2%80%93Edwards_Notation"}],"links":["opening","recapture"],"origin":{"chip":"sourced","text":"The scheme was first proposed by David Forsyth, a Scottish newspaper journalist, in the Glasgow Weekly Herald on 2 February 1883, as shorthand for recording where the pieces stood - letters for pieces, numbers for runs of empty squares. That is the whole of Forsyth's contribution, and it is the first field of a modern FEN. Everything after it was added by Steven J. Edwards in 1993, extending the scheme for computers as part of the Portable Game Notation standard: whose turn it is, what castling remains, and the counters. Edwards also tidied the syntax, replacing commas with slashes and moving the knight from Kt to N. So the six fields are two authors a century apart, which is why the first one looks like handwriting and the rest look like a record format.","source":"Wikipedia, Forsyth-Edwards Notation - a secondary source; Forsyth's 1883 column has not been consulted directly"},"links_resolved":[{"label":"Opening","href":"/glossary/opening/"},{"label":"Recapture","href":"/glossary/recapture/"}]}</script>
