<script type="application/json" id="data">{"term":"FEN","slug":"fen","tier":1,"order":10,"kind":"look-up","taught":[],"thread":"Every term in this glossary is illustrated with a position, and every position is stored as one line of text. This is that line, so it comes first.","definition":"A single line of text that describes a position completely. Six fields separated by spaces: where the pieces are, whose turn it is, which castling moves are still legal, whether an en passant capture is available, and two counters. The initials stand for Forsyth-Edwards Notation. Every board in this glossary is stored as one, and the breakdown below is the FEN of the first one.","precision":[{"against":"PGN","text":"A FEN is one position; a PGN is a whole game, stored as the moves that produced it. You replay a PGN and you load a FEN. Puzzles usually ship as a FEN plus a short move list, which is how they can begin in the middle of a game nobody has shown you."},{"against":"the first four fields","text":"Tools routinely compare only the first four - placement, side to move, castling, en passant - because the two counters can differ between two boards that are the same position. The corpus behind this glossary de-duplicates on exactly those four, and so do both courses."},{"against":"the two en passant conventions","text":"The original specification records the skipped square after any double pawn push, whether or not anyone can actually capture. A later revision records it only when an en passant capture is genuinely legal, and the older behaviour remains the more common one. The same position can therefore have two different FENs that differ only in field four - which matters, because that field is inside the four that de-duplication compares. Checked rather than assumed: the library used to build this glossary follows the newer convention, and writes - after 1.e4 from the starting position, where the older convention would write e3."}],"chips":["sourced","contested"],"extra":[{"heading":"What the corpus can and cannot show you here","body":"None of the 2,100 certified positions has an en passant square: the field is only set for the single ply after a double pawn push, and under the newer convention only when a capture is actually available, so random sampling almost never lands on one. The second board below therefore comes from the puzzle bank. The castling field is the opposite case and worth a number: 1,487 of the 2,100 positions have no castling rights left at all, and only 199 still have all four."},{"heading":"Why the counters are the part everyone drops","body":"The two counters are the youngest and least loved part of the notation. They are what the courses and the corpus behind this glossary ignore when comparing two boards, because the same position can carry different counters. Dropping them is not a shortcut - a position is where the pieces are, whose turn it is, and what is still legal, and the counters are none of those things."},{"heading":"Checked, not assumed","body":"All 2,100 positions in the corpus parse as FEN and carry exactly six fields."}],"boards":[{"fen":"r1bqk2r/pp2nppp/2nb4/2p1p3/3pP3/3P1NNP/PPP1BPP1/R1BQK2R w KQkq - 1 9","corpus":"positions","ref":"747wya3v","caption":"The position the breakdown above describes. All four castling rights survive, nothing has been captured, and the counters read 1 and 9.","show_fen":true,"render_fen":"r1bqk2r/pp2nppp/2nb4/2p1p3/3pP3/3P1NNP/PPP1BPP1/R1BQK2R w KQkq - 1 9"},{"fen":"r3qr2/pp3pk1/3p1np1/2pPp2p/4P2P/P1Q2P1B/1PP2P2/2KR3R w - c6 0 19","corpus":"puzzles","ref":"06fMQ","awkward":true,"caption":"The same six fields, three of them different: castling is - because neither side has rights left, en passant is c6 because a black pawn has just come to c5 and can be taken in passing, and the halfmove clock is 0 because that pawn move reset it. One of only two positions in either corpus with an en passant square set.","show_fen":true,"render_fen":"r3qr2/pp3pk1/3p1np1/2pPp2p/4P2P/P1Q2P1B/1PP2P2/2KR3R w - c6 0 19"}],"drill":{"mode":"none","why":"unwritten","note":"There is a real item here and it is computable - given a FEN, name the square the black king is on, or say which side may still castle - but the drill machinery in this glossary asks yes/no questions and those are not. Recorded as debt rather than dressed up as impossible."},"reading":[{"title":"Forsyth-Edwards Notation","url":"https://en.wikipedia.org/wiki/Forsyth%E2%80%93Edwards_Notation"}],"links":["opening","recapture"],"origin":{"chip":"sourced","text":"The scheme was first proposed by David Forsyth, a Scottish newspaper journalist, in the Glasgow Weekly Herald on 2 February 1883, as shorthand for recording where the pieces stood - letters for pieces, numbers for runs of empty squares. That is the whole of Forsyth's contribution, and it is the first field of a modern FEN. Everything after it was added by Steven J. Edwards in 1993, extending the scheme for computers as part of the Portable Game Notation standard: whose turn it is, what castling remains, and the counters. Edwards also tidied the syntax, replacing commas with slashes and moving the knight from Kt to N. So the six fields are two authors a century apart, which is why the first one looks like handwriting and the rest look like a record format.","source":"Wikipedia, Forsyth-Edwards Notation - a secondary source; Forsyth's 1883 column has not been consulted directly"},"anatomy":{"sample":"r1bqk2r/pp2nppp/2nb4/2p1p3/3pP3/3P1NNP/PPP1BPP1/R1BQK2R w KQkq - 1 9","parts":[{"field":"Piece placement","value":"r1bqk2r/pp2nppp/2nb4/2p1p3/3pP3/3P1NNP/PPP1BPP1/R1BQK2R","meaning":"Eight ranks separated by slashes, written from rank 8 down to rank 1 - the black side first, which is the opposite of how the board is usually drawn. Within a rank, letters are pieces and a digit is that many empty squares in a row. Uppercase is White, lowercase is Black: K Q R B N P against k q r b n p. So r1bqk2r reads rook, one empty, bishop, queen, king, two empty, rook. The digits in a rank always add up with the letters to eight. Both boards below print their own FEN underneath, so you can read the string against the picture."},{"field":"Side to move","value":"w","meaning":"w or b. Nothing else in the string tells you this, and a position with the other side to move is a different position - often a winning one instead of a losing one."},{"field":"Castling","value":"KQkq","meaning":"Which castling moves have not yet been ruled out, as up to four letters: K and Q for White's kingside and queenside, k and q for Black's. A single - means none remain. This records rights, not availability: KQkq can appear in a position where no castling move is legal right now because a square is occupied or attacked."},{"field":"En passant","value":"-","meaning":"The square a pawn just skipped over, so an en passant capture can be aimed at it - or - for none. This is the field with two conventions in the wild; see below."},{"field":"Halfmove clock","value":"1","meaning":"How many half-moves since the last capture or pawn move. It exists for the fifty-move rule, and resets to zero on every capture and every pawn move."},{"field":"Fullmove number","value":"9","meaning":"Which move of the game this is. It starts at 1 and goes up after Black moves, so both of a pair share a number - which is why this position, sixteen half-moves in, is move 9."}]},"group":"board-and-notation","links_resolved":[{"label":"Opening","href":"/glossary/opening/"},{"label":"Recapture","href":"/glossary/recapture/"}],"home":{"slug":"start","title":"Course words","framing":"Why this is one of the course words"},"paths":{"start":{"title":"Course words","n":1,"of":9,"prev":null,"next":{"slug":"open-file","term":"Open file"}},"core":{"title":"The core vocabulary","n":1,"of":42,"prev":null,"next":{"slug":"open-file","term":"Open file"}}}}</script>
