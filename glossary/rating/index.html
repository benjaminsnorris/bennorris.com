<script type="application/json" id="data">{"tier":3,"group":"tournament","kind":"look-up","term":"Rating","slug":"rating","also":["chess rating","rated game"],"chips":["sourced"],"definition":"A number that predicts results. It is not a score, a rank or a measure of how much you know: it is an estimate, from your past games, of how you will do against somebody with a different number. Two hundred points of difference means the higher-rated player is expected to score about 76%, and that is the whole of what a rating claims.","precision":[{"against":"a rating being a property of a player","text":"It is a property of a player *within a pool*. Every rating pool floats independently - a site's, a federation's, a club's - and a number only means something against the other numbers on the same list. Lichess says this about its own: \"It is best not to think of ratings as absolute numbers, or compare them against other organisations.\" A 1600 in one place and a 1600 in another are two different claims that happen to be spelled the same."},{"against":"being able to see it in a game","text":"You cannot, and this project measured it rather than supposing it. Split the 2,098 certified positions that carry both players' ratings at the median - a mean rating of 1621 - and ask whether any simple feature of the position tells the halves apart. **The best single feature reaches 56.1%**, and it is the engine's own evaluation gap; piece count gets 51.6%, ply 52.5%, the side to move 50.1%. A coin gets 50%. Caveat, and it matters: this corpus is filtered to material within a pawn, which removes the feature most likely to have leaked."},{"against":"a rating rising because you improved","text":"It rises because you scored better than the number predicted, which is usually the same thing and sometimes is not. A run of weak opponents moves it barely at all, a run of strong ones moves it a lot, and a long absence moves it not at all until you play - `provisional-rating` is what a system does while it is still unsure."}],"no_board":"The measurement above is the reason. A rating is a fact about a player's results and nothing in a position carries it: 2,098 positions with both ratings attached, spanning 954 to 2369, and no single feature of the board that separates the top half from the bottom better than 56%. This is the one entry in the glossary whose `no_board` was established by a test rather than by an argument.","boards":[],"drill":{"mode":"none","why":"impossible","note":"Guessing a rating from a position is precisely the thing measured above and it does not work - 56.1% for the best single feature against a 50% coin. A drill would be teaching a skill that has been shown not to exist."},"links":["elo","glicko","provisional-rating","fide","title","norm","time-control","engine","accuracy"],"reading":[{"title":"Chess rating system","url":"https://en.wikipedia.org/wiki/Chess_rating_system"}],"links_resolved":[{"label":"Elo","href":"/glossary/elo/"},{"label":"Glicko","href":"/glossary/glicko/"},{"label":"Provisional rating","href":"/glossary/provisional-rating/"},{"label":"FIDE","href":"/glossary/fide/"},{"label":"Title","href":"/glossary/title/"},{"label":"Norm","href":"/glossary/norm/"},{"label":"Time control","href":"/glossary/time-control/"},{"label":"Engine","href":"/glossary/engine/"},{"label":"Accuracy","href":"/glossary/accuracy/"}],"home":null}</script>
