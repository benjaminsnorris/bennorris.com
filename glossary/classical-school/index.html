<script type="application/json" id="data">{"tier":3,"group":"historical","kind":"look-up","term":"Classical school","slug":"classical-school","also":["positional school","the classical principles"],"chips":["sourced"],"definition":"The answer to the romantics, and the source of nearly every rule a beginner is taught. Occupy the centre with pawns, develop behind them, castle, do not attack until you have something to attack with, and accumulate small advantages rather than hunting for a combination. Steinitz worked it out; Tarrasch and Lasker made it the way chess is taught.","precision":[{"against":"the principles being laws","text":"They are the summary of a method, and the method is the part that matters: decide what is permanently good about a position and play toward it. Tarrasch's habit of stating the summaries as rules is what `hypermodernism` reacted against a generation later - not because the rules are wrong, but because a rule cannot tell you when it does not apply."},{"against":"defence being the boring half","text":"It was the discovery. The romantics assumed an attack should succeed and that defending was what you did while losing; Steinitz's claim was that a sound position defends itself and that an unsound attack must fail against correct play. That is why the era ended - not because attacking stopped working, but because someone showed that it only works when the position has earned it."},{"against":"the centre being about occupying squares","text":"Occupying it is the classical *method* and controlling it is the goal, which is a distinction the next generation made rather than this one. Two friendly pawns abreast in the centre - the classical formation the board below shows - occur in 844 of the 7,905 distinct positions in the opening census, 10.7%, inside the first three moves."}],"origin":{"text":"Wilhelm Steinitz turned away from the attacking style around 1873 and became the first official world champion on 29 March 1886, beating Zukertort 12\u00bd\u20137\u00bd. Lasker summarised the method as: ignore the search for combinations at first, abstain from violent moves, aim for small advantages and accumulate them, and only then look for the combination. Tarrasch and Lasker carried it to the next generation.","chip":"sourced","source":"Wikipedia, Wilhelm Steinitz and School of chess. The primaries - Steinitz's own writings - were not consulted."},"boards":[{"fen":"r1bqkbnr/pppp1ppp/2n5/4p3/3PP3/5N2/PPP2PPP/RNBQKB1R b KQkq - 0 3","corpus":"opening","ref":"pl2ob3ki","caption":"1.e4 e5 2.Nf3 Nc6 3.d4 - the Scotch, and the classical statement of intent. White has two pawns abreast in the centre, a knight developed behind them and a move that opens lines for the rest. Nothing is offered and nothing is risked; the claim is that a player who takes the centre and finishes developing will have something to attack with later, and need not decide now what it will be.","highlight":["d4","e4"],"render_fen":"r1bqkbnr/pppp1ppp/2n5/4p3/3PP3/5N2/PPP2PPP/RNBQKB1R b KQkq - 0 3","highlight_squares":["d4","e4"]}],"drill":{"mode":"none","why":"impossible","note":"A school of thought, not a feature. `centre` is the drill this entry would want and it already exists, in the courses and in this glossary."},"links":["romantic-era","hypermodernism","centre","development","king-safety","space","prophylaxis","initiative","soviet-school"],"reading":[{"title":"School of chess","url":"https://en.wikipedia.org/wiki/School_of_chess"}],"links_resolved":[{"label":"Romantic era","href":"/glossary/romantic-era/"},{"label":"Hypermodernism","href":"/glossary/hypermodernism/"},{"label":"Centre","href":"/glossary/centre/"},{"label":"Development","href":"/glossary/development/"},{"label":"King safety","href":"/glossary/king-safety/"},{"label":"Space","href":"/glossary/space/"},{"label":"Prophylaxis","href":"/glossary/prophylaxis/"},{"label":"Initiative","href":"/glossary/initiative/"},{"label":"Soviet school","href":"/glossary/soviet-school/"}],"home":n
