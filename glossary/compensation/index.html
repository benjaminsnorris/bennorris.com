<script type="application/json" id="data">{"term":"Compensation","slug":"compensation","tier":2,"order":704,"group":"judgement","kind":"look-up","taught":[],"thread":"The word for claiming the material count is wrong.","definition":"What you have in return when you are behind on material: an attack, the initiative, better pieces, a safer king, or a structure the opponent cannot untangle. Saying a sacrifice has compensation is saying the count is not the whole story here - and being right about that is the hard part.","precision":[{"against":"material","text":"Material is a count and compensation is the argument against taking the count at face value. The two are made to be weighed against each other, which is exactly why neither can be settled by the other."},{"against":"a sacrifice","text":"The sacrifice is the move; the compensation is what it bought. A sacrifice with no compensation has a shorter name - a blunder."},{"against":"sufficient compensation","text":"The phrase strong players actually use, and the hedge is doing real work. Compensation is a spectrum, and most of the argument in annotation is about whether there is enough of it rather than whether there is any."}],"chips":["inference"],"extra":[{"heading":"Why this one cannot be measured even in principle","body":"Material is countable, and the two things it is weighed against here - an attack and the initiative - are not. Compensation is the ratio of a number to a judgement. That is not a gap in this glossary's tooling; it is what the word means."}],"boards":[{"fen":"1n5k/6p1/p2q1rPp/1ppB4/8/3P4/PPP1rPQ1/2K4R w - - 0 26","corpus":"puzzles","ref":"00GuD","moves":["h1h6","g7h6"],"caption":"White has just given up a rook on h6, and the board shows the position after gxh6: eight points of material down, with the move. The pawn on g6 and the state of Black's king are the compensation - and whether eight points is worth it is settled by calculation, not by the word.","render_fen":"1n5k/8/p2q1rPp/1ppB4/8/3P4/PPP1rPQ1/2K5 w - - 0 27"}],"drill":{"mode":"none","why":"impossible","note":"Compensation weighs a count against a judgement. There is no predicate, and there could not be one without an engine deciding the judgement half - at which point it is an evaluation and not this word."},"reading":[{"title":"Compensation (chess)","url":"https://en.wikipedia.org/wiki/Compensation_(chess)"}],"links":["material","sacrifice","initiative","combination"],"also":["sufficient compensation"],"links_resolved":[{"label":"Material","href":"/glossary/material/"},{"label":"Sacrifice","href":"/glossary/sacrifice/"},{"label":"Initiative","href":"/glossary/initiative/"},{"label":"Combination","href":"/glossary/combination/"}],"home":{"slug":"core","title":"The core vocabulary","framing":"Why this is in the core vocabulary"},"paths":{"core":{"title":"The core vocabulary","n":51,"of":54,"prev":{"slug":"initiative","term":"Initiative"},"next":{"slug":"weak-square","term":"Weak square"}}}}</script>
