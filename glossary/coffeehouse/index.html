<script type="application/json" id="data">{"tier":3,"group":"slang","kind":"look-up","term":"Coffeehouse","slug":"coffeehouse","also":["coffee-house chess","coffeehouse move"],"chips":["sourced"],"definition":"Risky, positionally dubious play that sets traps - a style, a move or a player. The name is where such chess was expected to be found: skittles games in a coffeehouse, often for stakes and often at speed, where a flashy unsound attack beats a careful opponent often enough to be worth playing.","precision":[{"against":"it being an insult","text":"It is a description with an edge, and the edge cuts both ways. Coffeehouse chess wins games - against a player who does not defend accurately it wins a great many - and the objection to it is that it stops working as your opponents improve. Calling a move coffeehouse says it will be punished by somebody better, which is a prediction rather than a verdict."},{"against":"the coffeehouse being a metaphor","text":"They were real rooms and they were where European chess lived for two centuries before clubs and federations existed. The `romantic-era` played there, and much of what this glossary calls romantic - the gambits, the sacrifices, the willingness to be unsound in a good cause - is coffeehouse chess with a better reputation. The difference between the two words is mostly whether the person using them approves."},{"against":"it being extinct","text":"It moved online. Blitz and bullet reward exactly what a coffeehouse rewarded - speed, traps, the opponent's discomfort over the objective merits - so the style is commoner now than it has ever been, being played by more people than ever sat in a coffeehouse."}],"origin":{"text":"The name is where the chess was: skittles games played in a coffeehouse or somewhere like it, \"particularly in games played for stakes or blitz chess\". The Blackburne Shilling Gambit is given as the typical example, and its own name says the rest - a gambit named after the shilling it was played for.","chip":"sourced","source":"Wikipedia, Glossary of chess, under coffeehouse. No primary consulted, and no date is given there for when the usage began."},"no_board":"A style is a property of a player's choices across a game, not of a position. Any diagram of a wild position would be an illustration of *a* wild position, which is decoration - the same refusal `romantic-era` would have made if the opening census had not been able to show a King's Gambit.","boards":[],"drill":{"mode":"none","why":"contested","note":"Whether a move is coffeehouse is a judgement about soundness *and* about intent, and annotators disagree about both. `evaluation-symbols` is where the judgement usually gets written down."},"links":["romantic-era","skittles","swindle","cheapo","gambit","sacrifice","time-control","opening-trap"],"reading":[{"title":"Glossary of chess: coffeehouse","url":"https://en.wikipedia.org/wiki/Glossary_of_chess#coffeehouse"}],"links_resolved":[{"label":"Romantic era","href":"/glossary/romantic-era/"},{"label":"Skittles","href":"/glossary/skittles/"},{"label":"Swindle","href":"/glossary/swindle/"},{"label":"Cheapo","href":"/glossary/cheapo/"},{"label":"Gambit","href":"/glossary/gambit/"},{"label":"Sacrifice","href":"/glossary/sacrifice/"},{"label":"Time control","href":"/glossary/time-control/"},{"label":"Opening trap","href":"/glossary/opening-trap/"}],"home":null}</script>
