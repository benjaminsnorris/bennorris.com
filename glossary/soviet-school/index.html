<script type="application/json" id="data">{"tier":3,"group":"historical","kind":"look-up","term":"Soviet school","slug":"soviet-school","also":["Soviet chess school"],"chips":["sourced","contested"],"definition":"The state-backed Soviet chess system that dominated the world championship from 1948, and the training culture that came with it: chess treated as a sport to be trained for rather than a talent to be born with, taught in schools and clubs, with published analysis and seconds and preparation as a matter of course. Most of what a modern player means by *studying* chess comes from it.","precision":[{"against":"it being a style","text":"It is mostly a method, which is why the label is `contested`. The players it names do not share a way of playing - Botvinnik was compared to Steinitz for method while the postwar reputation was for fast, daring chess - so \"Soviet school\" describes an institution and a work ethic better than it describes any move. Where it did change the moves is in preparation: opening theory as a thing you build before the game rather than find during it."},{"against":"it being over","text":"The dominance ended and the method won. Every serious player now prepares openings, analyses their own games, works with published theory and treats chess as trainable - which was the Soviet claim and is now simply how it is done, in every country. `opening-book`, `repertoire` and `theory` in this glossary all describe habits this system made ordinary."},{"against":"the label being neutral","text":"It was a national project and was meant to be. Chess was supported as evidence that the system produced better minds, and the phrase carries that. Kasparov's reading of the turning point - Capablanca's 1938 loss to Botvinnik as the end of the heroic era, when a professional's preparation began to beat a genius's board sense - is an argument about the whole century, made by somebody with a side in it."}],"origin":{"text":"Recognised internationally after the Second World War, when Soviet players began a run of results that surprised the world; the world championship ran through Soviet hands from 1948. Lenin's support for chess as a national pastime is credited with legitimising it, against the game's earlier association with the bourgeoisie.","chip":"sourced","source":"Wikipedia, Soviet chess school. The primaries were not consulted, and the article treats the term as a description rather than examining it - which is part of why this entry marks it contested."},"no_board":"There is nothing to draw. This is an institution and a training culture, and the only trace it leaves on a position is that both players have prepared - which no FEN records. The corpora here are club games from 2013 rather than championship games, so they cannot even illustrate the practice at second hand.","boards":[],"drill":{"mode":"none","why":"impossible","note":"A national training system is not a feature of a position, and no predicate reaches it."},"links":["classical-school","hypermodernism","theory","opening-book","repertoire","novelty","engine","annotation"],"reading":[{"title":"Soviet chess school","url":"https://en.wikipedia.org/wiki/Soviet_chess_school"}],"links_resolved":[{"label":"Classical school","href":"/glossary/classical-school/"},{"label":"Hypermodernism","href":"/glossary/hypermodernism/"},{"label":"Theory","href":"/glossary/theory/"},{"label":"Opening book","href":"/glossary/opening-book/"},{"label":"Repertoire","href":"/glossary/repertoire/"},{"label":"Novelty","href":"/glossary/novelty/"},{"label":"Engine","href":"/glossary/engine/"},{"label":"Annotation","href":"/glossary/annotation/"}],"home":null}</script>
