<script type="application/json" id="data">{"term":"Sacrifice","slug":"sacrifice","tier":2,"order":540,"group":"tactics","kind":"see-it","taught":[],"thread":"The one term here defined by intention rather than by anything on the board.","definition":"Material given up on purpose, for something you have judged to be worth more - a mate, a decisive attack, or a position the opponent cannot hold. The defining feature is intent: a sacrifice is not a miscalculation that happened to work.","precision":[{"against":"a blunder","text":"Arithmetically identical and completely different. Both hand over material; only one was chosen. The distinction lives in the player's head, which is exactly why no predicate can identify a sacrifice from a position."},{"against":"a sham sacrifice","text":"A sham sacrifice - sometimes a temporary sacrifice - is one where the material comes back by force within a few moves, so nothing was really risked. A real or true sacrifice does not get the material back and is justified only by the position that follows. Sources differ on how strictly to police the line, and many writers use sacrifice for both."},{"against":"a trade","text":"A trade comes out level. A sacrifice deliberately does not."}],"chips":["sourced"],"extra":[{"heading":"The other motif the scan cannot see","body":"117 puzzles in the bank carry the tag - more than any other motif here - and not one seed is claimed as a link at this project's thresholds. The closest is the back rank seed, present in 37% of them, and that is nowhere near support enough. Along with the fork, this is a motif the scan gives no warning of, and for a clearer reason: a sacrifice is a decision, not a feature of the board."}],"boards":[{"fen":"kr6/1pR4p/p4R2/n7/P3p3/3rB3/6PP/6K1 w - - 1 39","corpus":"puzzles","ref":"00LNB","moves":["f6a6","b7a6"],"caption":"Verified as a sacrifice by the arithmetic: Rxa6+ puts a rook worth five on a square defended by a pawn, in return for one pawn. The board shows the position after bxa6 - White is a rook down, and Ra7 is mate.","render_fen":"kr6/2R4p/p7/n7/P3p3/3rB3/6PP/6K1 w - - 0 40"}],"drill":{"mode":"none","why":"impossible","note":"A sacrifice is defined by intent and by what it buys, neither of which is in the position. A predicate could find every move that loses material, and almost all of them would be blunders. This is the clearest case in the glossary of a term no answer key can settle."},"reading":[{"title":"Sacrifice (chess)","url":"https://en.wikipedia.org/wiki/Sacrifice_(chess)"}],"links":["combination","trade","back-rank-mate"],"also":["sham sacrifice"],"links_resolved":[{"label":"Combination","href":"/glossary/combination/"},{"label":"Trade","href":"/glossary/trade/"},{"label":"Back-rank mate","href":"/glossary/back-rank-mate/"}],"home":{"slug":"core","title":"The core vocabulary","framing":"Why this is in the core vocabulary"},"paths":{"core":{"title":"The core vocabulary","n":38,"of":42,"prev":{"slug":"hanging-piece","term":"Hanging piece"},"next":{"slug":"promotion","term":"Promotion"}}}}</script>
