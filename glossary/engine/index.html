<script type="application/json" id="data">{"tier":3,"group":"online","kind":"look-up","term":"Engine","slug":"engine","also":["chess engine","the computer"],"chips":["sourced"],"definition":"A program that searches a position and reports what it found: a number for how good the position is, and the line it expects. Every analysis board, every evaluation bar and every accuracy score on a chess site is an engine underneath. This glossary's own evidence base is one - 2,100 positions certified by Stockfish 18 at depth 14, and its labels are the engine's numbers with a threshold applied.","precision":[{"against":"the engine's number being the truth about the position","text":"It is the result of one search, and a search is defined by its settings rather than by the position. Measured on this project's own corpus: the stored evaluations reproduce exactly when Stockfish 18 is re-run at depth 14 with the options the certifier set - one thread and a 32 MB hash table - **12 of 12** on a seeded sample. Change nothing but the hash size, to the 16 MB a fresh engine defaults to, and **5 of the same 12** come back different. Same engine, same position, same depth, different number."},{"against":"that making the numbers useless","text":"It does not, and where the drift lives is the useful part. Every one of the five that moved was within a pawn of level, and every one moved by between 1 and 10 centipawns. The four decisive positions in the sample - scoring 5.01, 4.72, 4.51 and 2.75 - came back identical to the digit under both settings. **The first digit of an engine evaluation is usually information and the last one never is**, which is the whole argument of `centipawn`."},{"against":"the engine understanding chess","text":"It searches and it scores. It has no plan, offers no reason, and cannot tell you which of its moves you would have found - so an engine line is not an `annotation` and reading one is a different skill from being taught. What it is unbeatably good at is saying t
