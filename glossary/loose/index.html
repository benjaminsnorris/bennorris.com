<script type="application/json" id="data">{"term":"Loose","slug":"loose","tier":2,"order":302,"kind":"see-it","taught":["board-vision:unit-4"],"defined_also_in":["board-vision:unit-4"],"thread":"Undefended, and nothing more than that. The single most misread word in the sequence.","definition":"Undefended. No friendly piece would recapture on that square. A loose piece may be entirely safe - nothing is attacking it - and it is still loose.","precision":[{"against":"hanging","text":"Hanging is loose plus attacked. That is the whole difference, and confusing the two is the commonest error in the sequence: a loose piece costs nothing today and everything the moment something arrives, which is exactly why it is worth seeing before anything arrives."},{"against":"loose piece","text":"The seed narrows this word: a loose piece is a loose unit that is not a pawn. Pawns are loose constantly and it means very little, so the seed excludes them. A stated narrowing, never a replacement - loose still means undefended."}],"chips":["sourced"],"boards":[{"fen":"3r4/pp3k2/2p1bbp1/4Bp1p/3P3P/2P5/PP3PP1/1B2R1K1 w - - 4 30","corpus":"positions","ref":"xw4ccyaw","caption":"The white rook on e1 is loose: nothing defends it. Nothing attacks it either, so it is safe today - which is the point of learning to see the difference.","render_fen":"3r4/pp3k2/2p1bbp1/4Bp1p/3P3P/2P5/PP3PP1/1B2R1K1 w - - 4 30"},{"fen":"6rk/ppp1Q1pp/3p4/8/2P5/1P4qP/PB6/4RK2 b - - 1 29","corpus":"positions","ref":"pj3e2mxs","awkward":true,"caption":"The awkward case, with three kinds at once. The white bishop on b2 and the black queen on g3 are both loose and both non-pawns, so both count as the seed. The pawns on a2, c7 and h3 are loose too, and none of them counts.","render_fen":"6rk/ppp1Q1pp/3p4/8/2P5/1P4qP/PB6/4RK2 b - - 1 29"}],"drill":{"mode":"none","why":"taught-elsewhere","note":"The courses already drill this, and better than a second drill here would. Board vision is where the seeing gets built; this entry exists so the word can be looked up, not so the skill can be practised twice."},"reading":[{"title":"Glossary of chess","url":"https://en.wikipedia.org/wiki/Glossary_of_chess"}],"links":["hanging","loose-piece","defends","/courses/board-vision-loose/"],"group":"relations","links_resolved":[{"label":"Hanging","href":"/glossary/hanging/"},{"label":"Loose piece","href":"/glossary/loose-piece/"},{"label":"Defends","href":"/glossary/defends/"},{"label":"Board vision: loose pieces","href":"/courses/board-vision-loose/"}],"home":{"slug":"core","title":"The core vocabulary","framing":"Why this is in the core vocabulary"},"paths":{"core":{"title":"The core vocabulary","n":24,"of":73,"prev":{"slug":"defends","term":"Defends"},"next":{"slug":"hanging","term":"Hanging"}}}}</script>
