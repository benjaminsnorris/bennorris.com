<script type="application/json" id="data">{"term":"Caro-Kann Defence","slug":"caro-kann","tier":3,"group":"openings","kind":"look-up","also":["Caro-Kann","Caro Kann"],"definition":"1.e4 c6, preparing 2...d5 the way the French does but with the c-pawn, so that Black's light-squared bishop keeps its diagonal. The trade is one move slower and a structure with fewer complaints in it.","precision":[{"against":"the French","text":"The same plan with a different pawn, and the difference is the bishop. In the French the e6 pawn blocks it in; in the Caro-Kann the c6 pawn does not, so Black's pieces are easier to develop. The price is that c6 takes away the natural square for Black's own knight and does nothing for the queenside counterplay the French gets from ...c5."},{"against":"being dull","text":"It has that reputation because it avoids early complications on purpose, and it is the reputation the sharp lines were built to contradict. What is reliably true is that it produces sound structures, which is exactly what makes it a reasonable first defence to learn against 1.e4."}],"origin":{"chip":"sourced","text":"Named for two people who analysed it in 1886: Horatio Caro, English, and Marcus Kann, Austrian. The order of the names is not the order of the evidence - Kann had already won a 24-move game with it against Jacques Mieses at Hamburg in May 1885, a year before the analysis that got them both their half of the name.","source":"Wikipedia, Caro-Kann Defence. Secondary."},"chips":["sourced"],"boards":[{"fen":"rnbqkbnr/pp1ppppp/2p5/8/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2","corpus":"opening","ref":"2cj9hphe","caption":"1.e4 c6. Compare the French entry's board, which is the same idea one file across: d5 is coming either way, and here nothing has been put in front of the bishop on c8. Lichess codes the game B10. Lichess classifies the game itself, so the code is the database's and not this glossary's. Note what it names: the *game's* whole opening, decided by moves played after the position shown.","highlight":["c6","c8","d5","e4"],"render_fen":"rnbqkbnr/pp1ppppp/2p5/8/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2","highlight_squares":["c6","c8","d5","e4"]}],"drill":{"mode":"none","why":"impossible","note":"A named opening is a move order, and a position cannot say how it was reached - which is why this board is drawn from the one corpus here that stores the moves alongside the position."},"links":["french-defence","sicilian-defence","good-and-bad-bishop","open-game","development","theory"],"reading":[{"title":"Caro-Kann Defence","url":"https://en.wikipedia.org/wiki/Caro-Kann_Defence"}],"links_resolved":[{"label":"French Defence","href":"/glossary/french-defence/"},{"label":"Sicilian Defence","href":"/glossary/sicilian-defence/"},{"label":"Good and bad bishop","href":"/glossary/good-and-bad-bishop/"},{"label":"Open game","href":"/glossary/open-game/"},{"label":"Development","href":"/glossary/development/"},{"label":"Theory","href":"/glossary/theory/"}],"home":null}</script>
