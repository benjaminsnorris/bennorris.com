<script type="application/json" id="data">{"tier":3,"group":"tactical-method","kind":"look-up","chips":["sourced"],"term":"Undermining","slug":"undermining","also":["removing the base","destroying the base"],"definition":"Taking away the pawn that holds another pawn up. A chain is only as good as its base, so capturing the defender at the bottom leaves everything above it hanging - and unlike a piece, a pawn cannot step aside and keep defending.","precision":[{"against":"removing the guard in general","text":"`capturing-defender` is the general method and this is the pawn-structure case of it. The difference worth having is that a pawn chain is fixed: a piece defender can often be replaced by another piece, and a pawn that has been exchanged off leaves a hole nothing can fill, because pawns cannot move backwards."},{"against":"always being worth doing","text":"It is a trade, and the resulting structure has to be better for you. Measured on the 2,100 certified positions, a capture of a pawn that is defending another pawn is available in 22.1% of them - so the opportunity is common and the judgement is what is scarce."}],"boards":[{"fen":"6rk/ppp1Q1pp/3p4/8/2P5/1P4qP/PB6/4RK2 b - - 1 29","corpus":"positions","ref":"m0l95uak","caption":"White's pawn on c4 is held up by the pawn on b3 and by nothing else. Black's queen can take on b3, and whatever recaptures, the c-pawn is left with no pawn behind it on an open board. It is the only capture of a defending pawn available in the position.","highlight":["b3","c4","g3"],"render_fen":"6rk/ppp1Q1pp/3p4/8/2P5/1P4qP/PB6/4RK2 b - - 1 29","highlight_squares":["b3","c4","g3"]}],"drill":{"mode":"none","why":"contested","note":"The capture is exactly computable at 22.1% of the certified corpus and 16.4% of the drill corpus, both just under the floor - but the reason there is no drill is not the rate. Whether taking the base is *undermining* or simply a trade depends on what the structure is worth afterwards, and any answer key would be arguing rather than counting. Measured over `positions.json`: 2,100 engine-checked positions, materially level, plies 16 to 60 - which is to say middlegames, the part of the game these words are about. Club games: the median rating is 1627 and both players were between 1200 and 1800 in 67% of them."},"links":["capturing-defender","pawn-chain","pawn-structure","pawn-break","deflection","backward-pawn"],"reading":[{"title":"Undermining (chess)","url":"https://en.wikipedia.org/wiki/Undermining_(chess)"}],"links_resolved":[{"label":"Capturing the defender","href":"/glossary/capturing-defender/"},{"label":"Pawn chain","href":"/glossary/pawn-chain/"},{"label":"Pawn structure","href":"/glossary/pawn-structure/"},{"label":"Pawn break","href":"/glossary/pawn-break/"},{"label":"Deflection","href":"/glossary/deflection/"},{"label":"Backward pawn","href":"/glossary/backward-pawn/"}],"home":null}</script>
