<script type="application/json" id="data">{"tier":3,"group":"notation","kind":"look-up","term":"ECO code","slug":"eco-code","also":["ECO","Encyclopaedia of Chess Openings"],"chips":["sourced"],"definition":"The letter-and-number label a book or a database puts on an opening: B01, C53, A00. Five volumes, A to E, a hundred codes in each, five hundred in all. The letter is the family - A the flank openings, B the semi-open defences, C the open games and the French, D the closed and semi-closed, E the Indian defences - and the number is a line inside it.","precision":[{"against":"the code naming the position","text":"It names the game. A code is assigned from the line a game actually followed, so an early position carries whatever label the game it was taken from ended up with, and the same position can appear under a dozen codes across a dozen games. The first board below is the sharp version of this: not a pawn has moved and the code is for a king's pawn opening."},{"against":"the code being a judgement","text":"It is an index entry. B12 is not harder, better or more advanced than B11, and a high number is not a deep line - it is just the next shelf along. The one piece of information the code does carry reliably is its letter, which tells you the family."},{"against":"the codes being this glossary\u2019s","text":"They are Lichess's, stored verbatim. The opening corpus behind these boards carries 196 distinct codes and 778 distinct opening names across its 7,905 positions, all of them the database's own classification of the game each position came from. So an entry here that names a board's opening is quoting a source rather than deciding anything, and it says so."}],"origin":{"text":"Published by \u0160ahovski Informator of Belgrade - the Chess Informant company - from 1974, when the first volume appeared. Volume C came out first, which is why the open games have the codes that look like the beginning.","chip":"sourced","source":"Wikipedia, Encyclopaedia of Chess Openings. The primary was not consulted."},"boards":[{"fen":"rnbqkb1r/pppppppp/5n2/8/8/2N5/PPPPPPPP/R1BQKBNR w KQkq - 2 2","corpus":"opening","ref":"xit7yf14","caption":"1.Nc3 Nf6, and all sixteen pawns are still on their starting squares. The corpus stores this position's code as C42, a Russian Game - which begins 1.e4 e5 2.Nf3 Nf6. The code belongs to the game this position was taken from, which transposed into that later; it does not belong to the position on the board.","render_fen":"rnbqkb1r/pppppppp/5n2/8/8/2N5/PPPPPPPP/R1BQKBNR w KQkq - 2 2"},{"fen":"rnbqkbnr/pp2pppp/2p5/3p4/3PP3/2N5/PPP2PPP/R1BQKBNR b KQkq - 1 3","corpus":"opening","ref":"gdouodze","caption":"1.e4 c6 2.d4 d5 3.Nc3 - a Caro-Kann, and here the letter is doing real work: B is where the semi-open defences live, the Sicilian and the Caro-Kann and the Scandinavian, which is B01. The stored code is B18. The B is a fact about this position; the 18 is the game's, because after three moves this is still anywhere in B10 to B19.","render_fen":"rnbqkbnr/pp2pppp/2p5/3p4/3PP3/2N5/PPP2PPP/R1BQKBNR b KQkq - 1 3"}],"drill":{"mode":"none","why":"impossible","note":"A code labels a game and is assigned from the whole line, so one code covers thousands of positions and one position can be labelled several ways. Nothing about a diagram settles it, which is the entry's own argument turned into a refusal."},"links":["opening","opening-book","theory","transposition","variation","main-line","caro-kann","scandinavian-defence","sicilian-defence","opening-explorer"],"reading":[{"title":"Encyclopaedia of Chess Openings","url":"https://en.wikipedia.org/wiki/Encyclopaedia_of_Chess_Openings"}],"links_resolved":[{"label":"Opening","href":"/glossary/opening/"},{"label":"Opening book","href":"/glossary/opening-book/"},{"label":"Theory","href":"/glossary/theory/"},{"label":"Transposition","href":"/glossary/transposition/"},{"label":"Variation","href":"/glossary/variation/"},{"label":"Main line","href":"/glossary/main-line/"},{"la
