<script type="application/json" id="data">{"term":"The square of the pawn","slug":"square-of-the-pawn","tier":3,"group":"endgame-technique","kind":"look-up","also":["the rule of the square","the square rule"],"definition":"A way of seeing whether a lone king can catch a running pawn without counting moves. Draw the square whose side is the number of steps the pawn needs; if the king is inside it, or can step into it, the pawn is caught, and if not the pawn promotes.","precision":[{"against":"a rule about the endgame","text":"It is a rule about two pieces. It counts the pawn and the defending king and nothing else, so a friendly king escorting the pawn, a second pawn, or any piece at all can make the answer wrong. Inside its terms it is exact; the skill is noticing when its terms do not hold."},{"against":"forgetting the pawn on its starting square","text":"A pawn on the second rank moves two the first time, so it needs five steps rather than six and the square is drawn one file narrower than it looks. This is the single commonest way of getting the count wrong."},{"against":"the drawn box being the whole answer","text":"The box is a shortcut for a count, and on this corpus it is a very good one and not a perfect one: it agrees with the full count on 1,552 of 1,592 endgame positions and misses 40. Almost all of the misses are the same thing - the box only ever asks whether the king can reach the promotion square, and a king standing next to the pawn does not need to go there, it just takes it. The drill below answers the count, not the box."},{"against":"what the drill is testing","text":"The race between those two units, and not the result of the game. Every position in it holds exactly one passed pawn with nothing in its way, because that is where the arithmetic means anything - 1,011 of the 2,603 candidate positions were dropped for having something in the pawn's path, most often the pawn's own king. Within those terms the answer is exact. Whether the side with the pawn wins is a different question and often has a different answer."}],"chips":["sourced"],"boards":[{"fen":"8/8/1p6/8/8/k5K1/8/8 w - - 0 38","corpus":"drill","ref":"aebfe3t1","caption":"Black's pawn on b6 is five steps from promoting, so its square runs b6-g6-g1-b1. White's king on g3 is inside it, on the far edge - exactly five moves from b1, with White to move. And the rule's blind spot is on the board too: Black's king on a3 is escorting the pawn, which the square rule does not count at all.","highlight":["a3","b1","b6","g1","g3","g6"],"render_fen":"8/8/1p6/8/8/k5K1/8/8 w - - 0 38","highlight_squares":["a3","b1","b6","g1","g3","g6"]}],"drill":{"mode":"computed","predicate":"defender_catches_pawn","corpus":"endgame","question":"Counting only the pawn and the defending king, does the king get there in time?","note":"Ten endgame positions, each holding exactly one passed pawn with a clear path - which is what makes the question answerable at all. Count the pawn's steps to the promotion square, count the king's, and remember that whoever is to move gets there a move sooner. Answer revealed after each, no gate.","base_rate_pct":43.2,"base_rate_n":1592,"items":[{"fen":"8/8/1r3p2/8/7k/2Kn4/1n6/8 b - - 89 104","ref":"v70daf9s","answer":true,"flip":true},{"fen":"8/1k6/p7/4p3/7r/8/P7/2K5 w - - 0 41","ref":"jj2pf77u","answer":true,"flip":false},{"fen":"8/1K4k1/8/8/6qp/8/8/5qq1 w - - 0 62","ref":"8t84izsq","answer":false,"flip":false},{"fen":"8/2Q5/8/K7/8/8/p1k5/8 b - - 2 76","ref":"jhp8kle0","answer":false,"flip":true},{"fen":"8/8/8/5p2/2k5/3q4/1K6/8 b - - 17 54","ref":"kkvb25hn","answer":false,"flip":true},{"fen":"Q7/8/8/6k1/7p/6q1/8/5K2 b - - 10 61","ref":"dos5y3xi","answer":true,"flip":true},{"fen":"4k3/2R5/8/5p2/5P2/6K1/1r5p/8 w - - 0 53","ref":"4q45orx5","answer":true,"flip":false},{"fen":"8/8/4k3/2K2p2/4q3/8/8/8 b - - 7 49","ref":"kkvb25hn","answer":false,"flip":true},{"fen":"8/K7/8/1pk5/8/8/8/4b3 b - - 3 73","ref":"togmicnk","answer":false,"flip":true},{"fen":"4Q3
