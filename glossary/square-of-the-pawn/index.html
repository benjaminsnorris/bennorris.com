<script type="application/json" id="data">{"term":"The square of the pawn","slug":"square-of-the-pawn","tier":3,"group":"endgame-technique","kind":"look-up","also":["the rule of the square","the square rule"],"definition":"A way of seeing whether a lone king can catch a running pawn without counting moves. Draw the square whose side is the number of steps the pawn needs; if the king is inside it, or can step into it, the pawn is caught, and if not the pawn promotes.","precision":[{"against":"a rule about the endgame","text":"It is a rule about two pieces. It counts the pawn and the defending king and nothing else, so a friendly king escorting the pawn, a second pawn, or any piece at all can make the answer wrong. Inside its terms it is exact; the skill is noticing when its terms do not hold."},{"against":"forgetting the pawn on its starting square","text":"A pawn on the second rank moves two the first time, so it needs five steps rather than six and the square is drawn one file narrower than it looks. This is the single commonest way of getting the count wrong."}],"chips":["sourced"],"boards":[{"fen":"8/8/1p6/8/8/k5K1/8/8 w - - 0 38","corpus":"drill","ref":"aebfe3t1","caption":"Black's pawn on b6 is five steps from promoting, so its square runs b6-g6-g1-b1. White's king on g3 is inside it, on the far edge - exactly five moves from b1, with White to move. And the rule's blind spot is on the board too: Black's king on a3 is escorting the pawn, which the square rule does not count at all.","highlight":["a3","b1","b6","g1","g3","g6"],"render_fen":"8/8/1p6/8/8/k5K1/8/8 w - - 0 38","highlight_squares":["a3","b1","b6","g1","g3","g6"]}],"drill":{"mode":"none","why":"unbalanced","note":"This is the one endgame predicate here that a different corpus would fix, and the measurement says so: whether the defending king is inside the square holds in 52.1% of the relaxed corpus's positions with seven men or fewer and 63.6% of those with ten or fewer - both inside the 25-75% band. Over the whole file it is 31.8%, which is in band by accident: most of the no answers are positions with no passed pawn at all, so the question would be compound and the item would teach nothing. What it needs is a corpus sampled from endgames, which is a harvest and not an engine run. The corpora are samples of games, not of endgames: the relaxed harvest takes up to four positions from anywhere in a game, so only 390 of its 10,000 positions have seven men or fewer. A rate measured over the whole file reports how often a position is an endgame, not how often the idea holds where it applies."},"links":["passed-pawn","pawn-race","queening","pawn-endgame","key-squares","outside-passed-pawn"],"reading":[{"title":"Rule of the square","url":"https://en.wikipedia.org/wiki/Rule_of_the_square"}],"links_resolved":[{"label":"Passed pawn","href":"/glossary/passed-pawn/"},{"label":"Pawn race","href":"/glossary/pawn-race/"},{"label":"Queening","href":"/glossary/queening/"},{"label":"Pawn endgame","href":"/glossary/pawn-endgame/"},{"label":"Key squares","href":"/glossary/key-squares/"},{"label":"Outside passed pawn","href":"/glossary/outside-passed-pawn/"}],"home":null}</script>
