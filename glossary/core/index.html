<script type="application/json" id="data">{"tier":{"n":2,"slug":"core","title":"The core vocabulary","lead":"The working vocabulary, ordered so that every entry leans only on the ones before it.","why":["This is the tier meant to be worked through rather than consulted. The order is not alphabetical and it is not arbitrary: the relations come before the seeds because a seed is built out of relations, and the seeds come before the motifs because a motif is what a seed grows into. Read in order, nothing here depends on a term you have not met.","Each entry carries a measurement wherever one is possible - how often the feature actually occurs across 2,100 engine-checked positions, and how strongly it is associated with the tactics that are supposed to follow from it. Those numbers are the through-line. They keep making the same point from different directions: presence is common, and it is convergence that carries the signal.","Terms you have to be able to see, rather than look up, say so at the top of their entry. Knowing those words is not the skill, and the courses are where the seeing gets built."],"grouped":true,"framing":"Why this is in the core vocabulary"},"groups":["board-and-notation","phases","moves","relations","seeds","tactics","pawns","judgement","practical"],"groupmeta":{"board-and-notation":{"key":"board-and-notation","n":1,"title":"The board, and how positions are written down","intro":"Where things are, and how to record where things are. Everything else is described in these terms.","planned":7,"tier":2},"phases":{"key":"phases","n":2,"title":"The three phases","intro":"The two words that bracket the part of the game the courses are about.","planned":4,"tier":2},"moves":{"key":"moves","n":3,"title":"Moves, exchanges and results","intro":"What a move can do, and the vocabulary for trading pieces off.","planned":10,"tier":2},"relations":{"key":"relations","n":4,"title":"The relations board vision fixes","intro":"Ten words the courses use in a deliberately narrow sense. Each one is narrower than the same word in ordinary chess talk, and the narrowing is the point - it is what makes them countable.","planned":10,"tier":2},"seeds":{"key":"seeds","n":5,"title":"The twelve seeds","intro":"Structural weaknesses that make a tactic possible. Each is a shape rather than a tactic, and each entry reports how often it actually fires - which is the fastest way to see why presence alone decides so little.","planned":11,"tier":2},"tactics":{"key":"tactics","n":6,"title":"The tactics they grow into","intro":"The named shapes. The seeds course withholds these until after its final gate on purpose: a library of shapes handed over early produces pattern-matching, which is the habit the sequence exists to break.","planned":15,"tier":2},"pawns":{"key":"pawns","n":7,"title":"Pawn structure","intro":"The pawns decide what the pieces can do, and most of these terms are computable from the position alone.","planned":5,"tier":2},"judgement":{"key":"judgement","n":8,"title":"Judgement","intro":"The words for things no predicate settles. They appear in every annotation and are the hardest to look up usefully, which is exactly why they are here.","planned":8,"tier":2},"practical":{"key":"practical","n":9,"title":"Clock, club and practicalities","intro":"Vocabulary you meet at a board or in a commentary rather than in a position.","planned":4,"tier":2}},"rows":[{"slug":"fen","term":"FEN","kind":"look-up","group":"board-and-notation","tier":1,"blurb":"A single line of text that describes a position completely."},{"slug":"open-file","term":"Open file","kind":"see-it","group":"board-and-notation","tier":1,"blurb":"A file with no pawns on it at all, of either colour."},{"slug":"file","term":"File","kind":"look-up","group":"board-and-notation","tier":2,"blurb":"One of the eight columns of squares running from your side of the board to your opponent's."},{"slug":"rank","term":"Rank","kind":"look-up","group":"board-and-notation","tier":2,"blurb":"One of the eight rows of squares running across the board."},{"slug":"diagonal","term":"Diagonal","kind":"look-up","group":"board-and-notation","tier":2,"blurb":"A line of squares running corner to corner, all of the same colour."},{"slug":"centre","term":"Centre","kind":"look-up","group":"board-and-notation","tier":2,"blurb":"The four squares in the middle - d4, e4, d5 and e5 - and, more loosely, the sixteen squares around them."},{"slug":"algebraic-notation","term":"Algebraic notation","kind":"look-up","group":"board-and-notation","tier":2,"blurb":"The standard way of recording moves: a letter for the piece, then the square it goes to."},{"slug":"opening","term":"Opening","kind":"look-up","group":"phases","tier":1,"blurb":"The first phase of a game, while both sides are still bringing pieces off their starting squares and following sequences that have been catalogued and named."},{"slug":"endgame","term":"Endgame","kind":"look-up","group":"phases","tier":1,"blurb":"The last phase, once enough material has come off that the king becomes a fighting piece rather than something to hide, and getting a pawn to the far rank becomes the main way to win.."},{"slug":"middlegame","term":"Middlegame","kind":"look-up","group":"phases","tier":2,"blurb":"The phase between the opening and the endgame: the pieces are developed, the kings are usually castled, and there is no more theory to follow."},{"slug":"opening-book","term":"Opening book","kind":"look-up","group":"phases","tier":2,"blurb":"The body of recorded, analysed opening sequences - and, for a program, the literal file of them it plays from without thinking."},{"slug":"recapture","term":"Recapture","kind":"look-up","group":"moves","tier":1,"blurb":"Taking back on the square where one of your own pieces has just been captured."},{"slug":"trade","term":"Trade","kind":"look-up","group":"moves","tier":1,"blurb":"Exchanging pieces of roughly equal value - a knight for a bishop, a rook for a rook - so that both sides come out level on material."},{"slug":"queening","term":"Queening","kind":"look-up","group":"moves","tier":1,"blurb":"Promoting a pawn to a queen by reaching the far rank."},{"slug":"castling","term":"Castling","kind":"look-up","group":"moves","tier":2,"blurb":"A single move in which the king steps two squares towards a rook and that rook jumps to the far side of it."},{"slug":"en-passant","term":"En passant","kind":"look-up","group":"moves","tier":2,"blurb":"When a pawn advances two squares and passes an enemy pawn that could have captured it had it advanced one, that enemy pawn may capture it as though it had only moved one - but only immediately, on the very next move."},{"slug":"check","term":"Check","kind":"see-it","group":"moves","tier":2,"blurb":"The king is attacked."},{"slug":"checkmate","term":"Checkmate","kind":"see-it","group":"moves","tier":2,"blurb":"The king is in check and there is no legal way out: no move of the king, no capture of the attacker, no block."},{"slug":"stalemate","term":"Stalemate","kind":"see-it","group":"moves","tier":2,"blurb":"The side to move has no legal move at all and is not in check."},{"slug":"line-piece","term":"Line piece","kind":"look-up","group":"moves","tier":2,"blurb":"A piece that moves along lines for as far as it can reach: the queen, the rook and the bishop."},{"slug":"fifty-move-rule","term":"Fifty-move rule","kind":"look-up","group":"moves","tier":2,"blurb":"If fifty moves pass with no capture and no pawn move, either player may claim a draw."},{"slug":"attacks","term":"Attacks","kind":"see-it","group":"relations","tier":2,"blurb":"One piece attacks a square if it could capture there, supposing an enemy piece stood on it."},{"slug":"defends","term":"Defends","kind":"see-it","group":"relations","tier":2,"blurb":"One piece defends a square if it would recapture there."},{"slug":"loose","term":"Loose","kind":"see-it","group":"relations","tier":2,"blurb":"Undefended."},{"slug":"hanging","term":"Hanging","kind":"see-it","group":"relations","tier":2,"blurb":"Attacked and undefended at the same time."},{"slug":"attacker-count","term":"Attacker count","kind":"see-it","group":"relations","tier":2,"blurb":"How many pieces attack a square - counting pieces standing behind other pieces on the same line, not only the ones with a clear path."},{"slug":"underguarded","term":"Underguarded","kind":"see-it","group":"relations","tier":2,"blurb":"Attacked more times than it is defended."},{"slug":"battery","term":"Battery","kind":"see-it","group":"relations","tier":2,"blurb":"Two friendly line pieces standing on the same line, both attacking the same square through each other - queen behind rook, rook behind rook, queen behind bishop."},{"slug":"x-ray","term":"X-ray","kind":"see-it","group":"relations","tier":2,"blurb":"In the courses' sense: the piece behind, in a battery - the one attacking a square through a colleague, which still counts toward the attacker count."},{"slug":"absolute-pin","term":"Absolute pin","kind":"see-it","group":"relations","tier":2,"blurb":"A piece that cannot legally move at all, because the king is directly behind it on the same line and moving would expose the king."},{"slug":"relative-pin","term":"Relative pin","kind":"see-it","group":"relations","tier":2,"blurb":"A piece that can legally move but should not, because something more valuable than itself is directly behind it on the same line."},{"slug":"back-rank","term":"Back rank","kind":"see-it","group":"seeds","tier":1,"blurb":"Your own first rank - the one your king started on."},{"slug":"loose-piece","term":"Loose piece","kind":"see-it","group":"seeds","tier":2,"blurb":"The first of the twelve seeds."},{"slug":"aligned","term":"Aligned","kind":"see-it","group":"seeds","tier":2,"blurb":"Two of your units on the same rank, file or diagonal with at most one thing between them, while the opponent has a queen, rook or bishop that can travel that line."},{"slug":"cheap-to-attack","term":"Cheap to attack","kind":"see-it","group":"seeds","tier":2,"blurb":"Attacked by something worth less than itself."},{"slug":"overworked-defender","term":"Overworked defender","kind":"see-it","group":"seeds","tier":2,"blurb":"One piece is the only defender of two things that are both attacked."},{"slug":"behind-in-development","term":"Behind in development","kind":"see-it","group":"seeds","tier":2,"blurb":"Two or more fewer pieces off your back rank than your opponent has."},{"slug":"promoting-pawn","term":"Promoting pawn","kind":"see-it","group":"seeds","tier":2,"blurb":"An enemy pawn two squares or fewer from promoting that no pawn of yours can stop."},{"slug":"exposed-king","term":"Exposed king","kind":"see-it","group":"seeds","tier":2,"blurb":"A king with one pawn in front of it, or none."},{"slug":"open-line-to-the-king","term":"Open line to the king","kind":"see-it","group":"seeds","tier":2,"blurb":"A file or diagonal that runs to the king with no pawn of either colour anywhere on it, while the opponent has a queen, rook or bishop able to use that line."},{"slug":"trapped-piece","term":"Trapped piece","kind":"see-it","group":"seeds","tier":2,"blurb":"A piece with nowhere to go that the opponent does not already attack."},{"slug":"discoverable","term":"Discoverable","kind":"see-it","group":"seeds","tier":2,"blurb":"One of your pieces stands between an enemy queen, rook or bishop and something of yours further down the line."},{"slug":"combination","term":"Combination","kind":"look-up","group":"tactics","tier":1,"blurb":"A forced sequence of moves, usually beginning with a sacrifice, that reaches a specific goal you have seen in advance."},{"slug":"tactic","term":"Tactic","kind":"look-up","group":"tactics","tier":2,"blurb":"Short-range forcing play: combinations, traps and threats, where the moves are calculated rather than judged."},{"slug":"fork","term":"Fork","kind":"see-it","group":"tactics","tier":2,"blurb":"One piece attacks two or more enemy units at once."},{"slug":"pin","term":"Pin","kind":"see-it","group":"tactics","tier":2,"blurb":"A piece cannot move, or should not move, because something more valuable sits directly behind it on the same rank, file or diagonal."},{"slug":"skewer","term":"Skewer","kind":"see-it","group":"tactics","tier":2,"blurb":"One piece attacks two enemy units standing on the same line, with the more valuable one in front."},{"slug":"discovered-attack","term":"Discovered attack","kind":"see-it","group":"tactics","tier":2,"blurb":"A piece steps out of the way and reveals an attack from the piece behind it."},{"slug":"double-check","term":"Double check","kind":"see-it","group":"tactics","tier":2,"blurb":"Two pieces give check at the same time: the one that moved and the one it uncovered behind it."},{"slug":"deflection","term":"Deflection","kind":"see-it","group":"tactics","tier":2,"blurb":"A defender is forced away from the thing it was guarding, usually by a check or a threat it cannot ignore."},{"slug":"interference","term":"Interference","kind":"see-it","group":"tactics","tier":2,"blurb":"A defender's line is cut by putting something in the way."},{"slug":"hanging-piece","term":"Hanging piece","kind":"see-it","group":"tactics","tier":2,"blurb":"A piece that is attacked and undefended, so it can be taken for nothing."},{"slug":"sacrifice","term":"Sacrifice","kind":"see-it","group":"tactics","tier":2,"blurb":"Material given up on purpose, for something you have judged to be worth more - a mate, a decisive attack, or a position the opponent cannot hold."},{"slug":"promotion","term":"Promotion","kind":"see-it","group":"tactics","tier":2,"blurb":"A pawn reaching the far rank is replaced, immediately and compulsorily, by a queen, rook, bishop or knight of the same colour."},{"slug":"back-rank-mate","term":"Back-rank mate","kind":"see-it","group":"tactics","tier":2,"blurb":"Mate delivered along the king's own first rank by a rook or queen, against a king whose escape squares are all filled by its own pawns."},{"slug":"smothered-mate","term":"Smothered mate","kind":"see-it","group":"tactics","tier":2,"blurb":"Mate by a knight against a king that is completely boxed in by its own pieces."},{"slug":"zwischenzug","term":"Zwischenzug","kind":"see-it","group":"tactics","tier":2,"blurb":"An in-between move."},{"slug":"passed-pawn","term":"Passed pawn","kind":"see-it","group":"pawns","tier":2,"blurb":"A pawn with no enemy pawn able to stop it: none on its own file ahead of it, and none on either adjacent file ahead of it."},{"slug":"doubled-pawns","term":"Doubled pawns","kind":"see-it","group":"pawns","tier":2,"blurb":"Two pawns of the same colour on the same file, one in front of the other."},{"slug":"isolated-pawn","term":"Isolated pawn","kind":"see-it","group":"pawns","tier":2,"blurb":"A pawn with no friendly pawn on either adjacent file."},{"slug":"pawn-chain","term":"Pawn chain","kind":"see-it","group":"pawns","tier":2,"blurb":"A run of pawns of the same colour each defending the next, diagonally."},{"slug":"outpost","term":"Outpost","kind":"see-it","group":"pawns","tier":2,"blurb":"A square in or near the opponent's half that one of your pawns defends and no enemy pawn can ever attack, because they have all advanced past it or been traded."},{"slug":"material","term":"Material","kind":"look-up","group":"judgement","tier":2,"blurb":"The pieces you have, counted by their conventional values: a pawn 1, a knight or bishop 3, a rook 5, a queen 9."},{"slug":"tempo","term":"Tempo","kind":"look-up","group":"judgement","tier":2,"blurb":"A single move, treated as a thing you can gain or lose."},{"slug":"development","term":"Development","kind":"look-up","group":"judgement","tier":2,"blurb":"Getting your pieces off their starting squares and onto squares where they do something."},{"slug":"initiative","term":"Initiative","kind":"look-up","group":"judgement","tier":2,"blurb":"Having the initiative means you are the one making threats and your opponent is the one answering them."},{"slug":"compensation","term":"Compensation","kind":"look-up","group":"judgement","tier":2,"blurb":"What you have in return when you are behind on material: an attack, the initiative, better pieces, a safer king, or a structure the opponent cannot untangle."},{"slug":"weak-square","term":"Weak square","kind":"look-up","group":"judgement","tier":2,"blurb":"A square in your own half that none of your pawns can ever defend, because the pawns that could have are gone or have advanced past it."},{"slug":"prophylaxis","term":"Prophylaxis","kind":"look-up","group":"judgement","tier":2,"blurb":"Playing to stop what your opponent wants to do, rather than to advance your own plan."},{"slug":"zugzwang","term":"Zugzwang","kind":"look-up","group":"judgement","tier":2,"blurb":"A position where you would be better off if you could pass, but you cannot: every legal move makes your position worse."},{"slug":"blunder","term":"Blunder","kind":"look-up","group":"practical","tier":2,"blurb":"A move that loses material or the game outright, when something much better was available."},{"slug":"time-control","term":"Time control","kind":"look-up","group":"practical","tier":2,"blurb":"The rule governing how much time each player gets."},{"slug":"increment","term":"Increment","kind":"look-up","group":"practical","tier":2,"blurb":"Time added to your clock after each move you make."},{"slug":"j-adoube","term":"J'adoube","kind":"look-up","group":"practical","tier":2,"blurb":"The word you say before touching a piece to adjust it on its square without intending to move it."}]}</script>
