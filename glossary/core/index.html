pture","kind":"look-up","group":"moves","tier":1,"blurb":"Taking back on the square where one of your own pieces has just been captured."},{"slug":"trade","term":"Trade","kind":"look-up","group":"moves","tier":1,"blurb":"Exchanging pieces of roughly equal value - a knight for a bishop, a rook for a rook - so that both sides come out level on material."},{"slug":"queening","term":"Queening","kind":"look-up","group":"moves","tier":1,"blurb":"Promoting a pawn to a queen by reaching the far rank."},{"slug":"attacks","term":"Attacks","kind":"see-it","group":"relations","tier":2,"blurb":"One piece attacks a square if it could capture there, supposing an enemy piece stood on it."},{"slug":"defends","term":"Defends","kind":"see-it","group":"relations","tier":2,"blurb":"One piece defends a square if it would recapture there."},{"slug":"loose","term":"Loose","kind":"see-it","group":"relations","tier":2,"blurb":"Undefended."},{"slug":"hanging","term":"Hanging","kind":"see-it","group":"relations","tier":2,"blurb":"Attacked and undefended at the same time."},{"slug":"attacker-count","term":"Attacker count","kind":"see-it","group":"relations","tier":2,"blurb":"How many pieces attack a square - counting pieces standing behind other pieces on the same line, not only the ones with a clear path."},{"slug":"underguarded","term":"Underguarded","kind":"see-it","group":"relations","tier":2,"blurb":"Attacked more times than it is defended."},{"slug":"battery","term":"Battery","kind":"see-it","group":"relations","tier":2,"blurb":"Two friendly line pieces standing on the same line, both attacking the same square through each other - queen behind rook, rook behind rook, queen behind bishop."},{"slug":"x-ray","term":"X-ray","kind":"see-it","group":"relations","tier":2,"blurb":"In the courses' sense: the piece behind, in a battery - the one attacking a square through a colleague, which still counts toward the attacker count."},{"slug":"absolute-pin","term":"Absolute pin","kind":"see-it","group":"relations","tier":2,"blurb":"A piece that cannot legally move at all, because the king is directly behind it on the same line and moving would expose the king."},{"slug":"relative-pin","term":"Relative pin","kind":"see-it","group":"relations","tier":2,"blurb":"A piece that can legally move but should not, because something more valuable than itself is directly behind it on the same line."},{"slug":"back-rank","term":"Back rank","kind":"see-it","group":"seeds","tier":1,"blurb":"Your own first rank - the one your king started on."},{"slug":"loose-piece","term":"Loose piece","kind":"see-it","group":"seeds","tier":2,"blurb":"The first of the twelve seeds."},{"slug":"aligned","term":"Aligned","kind":"see-it","group":"seeds","tier":2,"blurb":"Two of your units on the same rank, file or diagonal with at most one thing between them, while the opponent has a queen, rook or bishop that can travel that line."},{"slug":"cheap-to-attack","term":"Cheap to attack","kind":"see-it","group":"seeds","tier":2,"blurb":"Attacked by something worth less than itself."},{"slug":"overworked-defender","term":"Overworked defender","kind":"see-it","group":"seeds","tier":2,"blurb":"One piece is the only defender of two things that are both attacked."},{"slug":"behind-in-development","term":"Behind in development","kind":"see-it","group":"seeds","tier":2,"blurb":"Two or more fewer pieces off your back rank than your opponent has."},{"slug":"promoting-pawn","term":"Promoting pawn","kind":"see-it","group":"seeds","tier":2,"blurb":"An enemy pawn two squares or fewer from promoting that no pawn of yours can stop."},{"slug":"exposed-king","term":"Exposed king","kind":"see-it","group":"seeds","tier":2,"blurb":"A king with one pawn in front of it, or none."},{"slug":"open-line-to-the-king","term":"Open line to the king","kind":"see-it","group":"seeds","tier":2,"blurb":"A file or diagonal that runs to the king with no pawn of either colour anywhere on it, while the opponent has a queen, rook or bishop hat is attacked and undefended, so it can be taken for nothing."},{"slug":"sacrifice","term":"Sacrifice","kind":"see-it","group":"tactics","tier":2,"blurb":"Material given up on purpose, for something you have judged to be worth more - a mate, a decisive attack, or a position the opponent cannot hold."},{"slug":"promotion","term":"Promotion","kind":"see-it","group":"tactics","tier":2,"blurb":"A pawn reaching the far rank is replaced, immediately and compulsorily, by a queen, rook, bishop or knight of the same colour."},{"slug":"back-rank-mate","term":"Back-rank mate","kind":"see-it","group":"tactics","tier":2,"blurb":"Mate delivered along the king's own first rank by a rook or queen, against a king whose escape squares are all filled by its own pawns."},{"slug":"smothered-mate","term":"Smothered mate","kind":"see-it","group":"tactics","tier":2,"blurb":"Mate by a knight against a king that is completely boxed in by its own pieces."},{"slug":"passed-pawn","term":"Passed pawn","kind":"see-it","group":"pawns","tier":2,"blurb":"A pawn with no enemy pawn able to stop it: none on its own file ahead of it, and none on either adjacent file ahead of it."},{"slug":"doubled-pawns","term":"Doubled pawns","kind":"see-it","group":"pawns","tier":2,"blurb":"Two pawns of the same colour on the same file, one in front of the other."},{"slug":"isolated-pawn","term":"Isolated pawn","kind":"see-it","group":"pawns","tier":2,"blurb":"A pawn with no friendly pawn on either adjacent file."},{"slug":"pawn-chain","term":"Pawn chain","kind":"see-it","group":"pawns","tier":2,"blurb":"A run of pawns of the same colour each defending the next, diagonally."},{"slug":"outpost","term":"Outpost","kind":"see-it","group":"pawns","tier":2,"blurb":"A square in or near the opponent's half that one of your pawns defends and no enemy pawn can ever attack, because they have all advanced past it or been traded."},{"slug":"material","term":"Material","kind":"look-up","group":"judgement","tier":2,"blurb":"The pieces you have, counted by their conventional values: a pawn 1, a knight or bishop 3, a rook 5, a queen 9."}]}</script>
