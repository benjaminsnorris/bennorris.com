<script type="application/json" id="data">{"term":"London System","slug":"london-system","tier":3,"group":"openings","kind":"look-up","also":["London"],"definition":"1.d4 followed by Bf4, and then much the same set-up whatever Black does: pawn to e3, bishop to d3, knights to f3 and d2, pawn to c3. A *system* rather than an opening - the appeal is that you can play the first six moves without needing to know what your opponent has played.","precision":[{"against":"being an opening","text":"The distinction matters practically. An opening is a line you meet with a reply; a system is a formation you aim for regardless, so the theory you have to learn is close to nothing and the middlegame you get is always familiar. That is a real advantage at any level and the reason the London is everywhere in online chess."},{"against":"being harmless","text":"Quiet is not the same as safe to face. White's set-up is solid and slow, and Black's usual mistake is to treat it as nothing and drift - the standard plans against it involve ...c5 and taking space early, which is exactly what a player who has decided it is harmless will not do."}],"origin":{"chip":"sourced","text":"The name comes from the London tournament of 1922, where it turned up seven times, in games including Capablanca's, Alekhine's and Rubinstein's. But the first master to play it regularly was James Mason, forty years earlier, from Vienna 1882 onward - which is why Lichess still classifies this exact position as the Mason Attack rather than the London. Two names for one bishop move, one from the man and one from the tournament.","source":"Wikipedia, London System. Secondary. The Mason Attack tag is the Lichess database classification of the game this board came from."},"chips":["sourced"],"boards":[{"fen":"rnbqkbnr/ppp1pppp/8/3p4/3P1B2/8/PPP1PPPP/RN1QKBNR b KQkq - 1 2","corpus":"opening","ref":"p73b0lko","caption":"1.d4 d5 2.Bf4 - the bishop move the system is named for, out before the knight on f3. Everything else White intends is independent of Black's reply. Lichess codes this game D00 and names it the Mason Attack, after the player who used it forty years before the tournament that renamed it. Lichess classifies the game itself, so the code is the database's and not this glossary's. Note what it names: the *game's* whole opening, decided by moves played after the position shown.","highlight":["d4","f4"],"render_fen":"rnbqkbnr/ppp1pppp/8/3p4/3P1B2/8/PPP1PPPP/RN1QKBNR b KQkq - 1 2","highlight_squares":["d4","f4"]}],"drill":{"mode":"none","why":"impossible","note":"A named opening is a move order, and a position cannot say how it was reached - which is why this board is drawn from the one corpus here that stores the moves alongside the position."},"links":["queens-gambit","repertoire","theory","development","closed-position","good-and-bad-bishop","transposition"],"reading":[{"title":"London System","url":"https://en.wikipedia.org/wiki/London_System"}],"links_resolved":[{"label":"Queen's Gambit","href":"/glossary/queens-gambit/"},{"label":"Repertoire","href":"/glossary/repertoire/"},{"label":"Theory","href":"/glossary/theory/"},{"label":"Development","href":"/glossary/development/"},{"label":"Closed position","href":"/glossary/closed-position/"},{"label":"Good and bad bishop","href":"/glossary/good-and-bad-bishop/"},{"label":"Transposition","href":"/glossary/transposition/"}],"home":null}</script>
