<script type="application/json" id="data">{"term":"J'adoube","slug":"j-adoube","tier":2,"order":903,"group":"practical","kind":"look-up","taught":[],"thread":"The last entry here, and the only French left in the rules.","definition":"The word you say before touching a piece to adjust it on its square without intending to move it. Said first, it protects you from the touch-move rule; said afterwards, it protects you from nothing.","precision":[{"against":"touch-move","text":"The rule this is the exception to: if you touch one of your pieces you must move it, and if you touch an opponent's you must take it if you legally can. Saying j'adoube first suspends that for the adjustment."},{"against":"saying it in English","text":"I adjust is perfectly acceptable and understood everywhere. The French survives because it is unambiguous across languages, which matters at an international board where the players may share no other word."}],"chips":["sourced"],"boards":[],"drill":{"mode":"none","why":"impossible","note":"A rule about touching pieces leaves nothing in a position."},"reading":[{"title":"Glossary of chess","url":"https://en.wikipedia.org/wiki/Glossary_of_chess"}],"links":["time-control","blunder"],"also":["I adjust","touch-move"],"no_board":"This is a rule about conduct at the board. There is no position that shows it.","links_resolved":[{"label":"Time control","href":"/glossary/time-control/"},{"label":"Blunder","href":"/glossary/blunder/"}],"home":{"slug":"core","title":"The core vocabulary","framing":"Why this is in the core vocabulary"},"paths":{"core":{"title":"The core vocabulary","n":73,"of":73,"prev":{"slug":"increment","term":"Increment"},"next":null}}}</script>
