<script type="application/json" id="data">{"term":"Gambit","slug":"gambit","tier":3,"group":"openings","kind":"look-up","also":["countergambit"],"definition":"An opening in which you give up material, almost always a pawn, to get something else: pieces out faster, lines opened, or the opponent's king kept in the middle. The pawn is the price and the development is the thing being bought.","precision":[{"against":"a sacrifice","text":"A gambit is offered before there is anything to calculate. A sacrifice is a concrete decision in a position you can see - you work out what happens. A gambit is a standing offer that comes with the opening's name attached, and what you get for the pawn is a judgement rather than a variation."},{"against":"having to accept it","text":"Declining is a real option and frequently the best one, which is why most gambits have a declined line with its own name. Taking the pawn is the move that gives the gambiteer what they prepared for, and the practical question is whether you would rather defend well or develop normally."},{"against":"gambits being unsound","text":"Some are and some are not, and the distinction is not about the pawn. A gambit is sound when the development is worth it against best play and dangerous either way at club level, because the side a pawn up has to defend accurately to keep it. The pawn is easy to count; the initiative is not."}],"origin":{"chip":"sourced","text":"From the Italian gambetto - tripping someone with your leg so they fall. The Spanish gambito was first applied to chess openings in 1561, by Ruy Lopez de Segura, who has an opening named after him too; the word reached English in Francis Beale's 1656 translation of a Greco manuscript, advertised as \u201cillustrated with almost one hundred Gambetts\u201d. The general English sense - an opening move meant to gain an advantage - is not recorded until 1855, so the chess meaning is nearly three centuries older than the metaphor.","source":"Wikipedia, Gambit. Secondary; neither Ruy Lopez nor Beale consulted."},"chips":["sourced"],"boards":[{"fen":"rn1qk1nr/2p2ppp/p3p3/3p4/3Pb3/B1PB1N2/P4PPP/R2Q1RK1 b kq - 1 10","corpus":"positions","ref":"8gilwo9n","caption":"What a pawn buys, at move ten. Black is a pawn up - seven against six - and has one piece off its starting square. White has three, has castled, and has both rooks connected, while Black's king is still on e8 with the queenside asleep. Whether that is worth a pawn is the whole question, and it is not a question the pawn count answers.","highlight":["a3","d3","e4","e8","f3","g1"],"render_fen":"rn1qk1nr/2p2ppp/p3p3/3p4/3Pb3/B1PB1N2/P4PPP/R2Q1RK1 b kq - 1 10","highlight_squares":["a3","d3","e4","e8","f3","g1"]}],"drill":{"mode":"none","why":"impossible","note":"A gambit is a move order, not a position: the same board can be reached by a gambit, by a blunder, or by a normal capture ten moves later, and nothing in the position says which. What is computable is the state one leaves behind - a pawn down with a development lead - and that is what the board above is checked against, using the seeds course's own development predicate."},"links":["sacrifice","development","initiative","compensation","theory","main-line","first-move-advantage","romantic-era"],"reading":[{"title":"Gambit","url":"https://en.wikipedia.org/wiki/Gambit"}],"links_resolved":[{"label":"Sacrifice","href":"/glossary/sacrifice/"},{"label":"Development","href":"/glossary/development/"},{"label":"Initiative","href":"/glossary/initiative/"},{"label":"Compensation","href":"/glossary/compensation/"},{"label":"Theory","href":"/glossary/theory/"},{"label":"Main line","href":"/glossary/main-line/"},{"label":"White's first-move advantage","href":"/glossary/first-move-advantage/"},{"label":"Romantic era","href":"/glossary/romantic-era/"}],"home":null}</script>
