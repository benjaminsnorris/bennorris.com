<script type="application/json" id="data">{"term":"The Philidor position","slug":"philidor-position","tier":3,"group":"endgame-technique","kind":"look-up","also":["third-rank defence","third rank defense"],"definition":"The drawing method in rook and pawn against rook. The defending king sits on the pawn's promotion square, and the defending rook sits on its own third rank, which keeps the attacking king off that rank; when the pawn advances far enough to shut that off, the rook drops behind it and checks from a distance for ever.","precision":[{"against":"passive defence","text":"The rook on the third rank is doing something specific - denying the attacking king the rank it needs - rather than sitting still. The moment the pawn takes that job away by advancing, the rook changes job and goes behind. Knowing which of the two jobs applies is the technique."},{"against":"the Lucena position","text":"One king apart, and the reason both are worth learning as a pair. Here the defending king is in front of the pawn and holds; in the Lucena it has been cut off and does not."}],"origin":{"chip":"sourced","text":"Analysed by Francois-Andre Danican Philidor in 1777. Unlike the Lucena, the attribution is sound: Philidor was both the strongest player of his century and its most careful analyst of endings, and the method is still taught in his terms as the third-rank defence.","source":"Wikipedia, Philidor position. Secondary; Philidor not consulted."},"chips":["sourced"],"boards":[],"no_board":"This is a composed position rather than one that occurred, and rule 2 of this project says a board may not cite a corpus it did not come from. It is not in any of the three: no position in the 10,000-position relaxed harvest or the 768-puzzle bank is it, and the nearest rook-and-pawn endings there are a different shape. Better no diagram than a diagram of something else - the further reading has one.","drill":{"mode":"none","why":"impossible","note":"A defensive technique over several moves, of which no single position is the answer. Recognising the setup is computable and is not what has to be learned."},"links":["lucena","rook-endgame","defensive-move","fortress","endgame","passed-pawn"],"reading":[{"title":"Philidor position","url":"https://en.wikipedia.org/wiki/Philidor_position"}],"links_resolved":[{"label":"The Lucena position","href":"/glossary/lucena/"},{"label":"Rook endgame","href":"/glossary/rook-endgame/"},{"label":"Defensive move","href":"/glossary/defensive-move/"},{"label":"Fortress","href":"/glossary/fortress/"},{"label":"Endgame","href":"/glossary/endgame/"},{"label":"Passed pawn","href":"/glossary/passed-pawn/"}],"home":null}</script>
