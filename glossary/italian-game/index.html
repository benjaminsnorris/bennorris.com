<script type="application/json" id="data">{"term":"Italian Game","slug":"italian-game","tier":3,"group":"openings","kind":"look-up","also":["Giuoco Piano","Italian bishop"],"definition":"1.e4 e5 2.Nf3 Nc6 3.Bc4. White develops the bishop to c4, where it points at f7 - the one square near Black's king that only the king defends. It is the most natural opening there is: two pieces out, both aimed at the centre, nothing committed.","precision":[{"against":"being a beginner opening","text":"It is the opening beginners are taught *and* a main line at every level, which is unusual and is the reason to learn it. The moves follow the standard advice - centre, knights, bishops, castle - so nothing has to be unlearned later. Compare the Scandinavian, which is perfectly playable and teaches nothing about development."},{"against":"the bishop on c4 winning material","text":"It is aimed at f7 and that is a long-term threat rather than a move. Everything in this glossary's attacking-f2-f7 entry applies here: the pawn is defended once, by the king, and a bishop or queen arriving there is usually a sacrifice rather than a capture."},{"against":"the Giuoco Piano","text":"Nearly the same thing and not quite. The Italian Game is 3.Bc4; the Giuoco Piano - the quiet game - is what follows 3...Bc5. Black's other main reply, 3...Nf6, is the Two Knights Defence, and it is not quiet at all."}],"origin":{"chip":"sourced","text":"One of the oldest openings on record: it is in the Gottingen manuscript, the earliest known work on chess with the modern rules. Games from around 1620 show Gioachino Greco answering 3...Nf6 with 4.Ng5 and 3...Bc5 with 4.c3, and the 4.c3 lines he worked out are still played.","source":"Wikipedia, Italian Game. Secondary; the manuscript not consulted."},"chips":["sourced"],"boards":[{"fen":"r1bqkbnr/pppp1ppp/2n5/4p3/2B1P3/5N2/PPPP1PPP/RNBQK2R b KQkq - 3 3","corpus":"opening","ref":"ez8rfz4d","caption":"1.e4 e5 2.Nf3 Nc6 3.Bc4 - the position the name refers to, from a
