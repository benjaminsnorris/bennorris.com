<h1>Chess glossary</h1>
<p>Every term, searchable. The words you look up once are marked <em>look-up</em>; the ones you have to be able to see are marked <em>see-it</em>, and knowing those words is not the skill.</p><input class="q" id="q" type="search" placeholder="Search terms and definitions" autocomplete="off">

<script type="application/json" id="data">[{"term":"FEN","slug":"fen","kind":"look-up","tier":1,"also":[],"definition":"A single line of text that describes a position completely: where the pieces are, whose turn it is, which castling moves are still legal, whether an en passant capture is available, and two counters.","h":"fen  a single line of text that describes a position completely: where the pieces are, whose turn it is, which castling moves are still legal, whether an en passant capture is available, and two counters. six fields, separated by spaces. the initials stand for forsyth-edwards notation. pgn a fen is one position; a pgn is a whole game, stored as the moves that produced it. you replay a pgn and you load a fen. puzzles usually ship as a fen plus a short move list, which is how they can begin in the middle of a game nobody has shown you. the first four fields tools routinely compare only the first four - placement, side to move, castling, en passant - because the two counters can differ between two boards that are the same position. the corpus behind this glossary de-duplicates on exactly those four, and so do both courses. opening recapture"},{"term":"Opening","slug":"opening","kind":"look-up","tier":1,"also":[],"definition":"The first phase of a game, while both sides are still bringing pieces off their starting squares and following sequences that have been catalogued and named.","h":"opening  the first phase of a game, while both sides are still bringing pieces off their starting squares and following sequences that have been catalogued and named. it ends, roughly, when neither player is recalling any more and both start working things out. opening book an opening is a phase of the game; an opening book is the catalogue of known sequences. out of book means the position is no longer in the catalogue, which can happen on move four or move twenty - it is not the same as the opening being over. development development is the work the opening exists to do: getting pieces off the back rank and the king to safety. you can be well into the opening and badly developed, which is one of the twelve things the seeds course teaches you to look for. endgame fen"},{"term":"Endgame","slug":"endgame","kind":"look-up","tier":1,"also":[],"definition":"The last phase, once enough material has come off that the king becomes a fighting piece rather than something to hide, and getting a pawn to the far rank becomes the main way to win..","h":"endgame  the last phase, once enough material has come off that the king becomes a fighting piece rather than something to hide, and getting a pawn to the far rank becomes the main way to win. middlegame there is no sharp line. counting pieces or naming a move number are conventions rather than rules, and two strong players will disagree about a given position. the useful test is behavioural: if the kings are walking towards the action instead of away from it, you are in an endgame. the end of the game an endgame is a phase, not a result. plenty of games finish before one starts, and an endgame can last sixty moves. opening queening fen"},{"term":"Open file","slug":"open-file","kind":"see-it","tier":1,"also":["half-open file","semi-open file"],"definition":"A file with no pawns on it at all, of either colour.","h":"open file half-open file semi-open file a file with no pawns on it at all, of either colour. a rook or queen on an open file attacks along its whole length, and getting a rook there is one of the standard reasons to trade pawns. half-open file a half-open file has pawns of one colour only. it is open for the side without a pawn there, and is often the more useful thing to own, because the enemy pawn on it is a fixed target that cannot run. sources agree on the definitions and split on the label - some write semi-open - with no difference in meaning. file rook"},{"term":"Back rank","slug":"back-rank","kind":"see-it","tier":1,"also":[],"definition":"Your own first rank - the one your king started on.","h":"back rank  your own first rank - the one your king started on. the phrase almost always points at a weakness: a king that has castled and never moved one of the three pawns in front of it can be mated by a rook or queen arriving on that rank, because its own pawns block every square it could step to. back-rank mate the rank is a place; the mate is an event. a back rank can be weak for fifty moves and never be mated on, and the weakness is worth seeing long before anything can be done about it. first rank the same eight squares. first rank is neutral and absolute; back rank is relative - it means whichever of the two is yours, and it usually carries the implication that it is soft. luft luft is the escape square a pawn move makes for the king. making luft is the standard cure for a weak back rank, and the word is simply german for air. queening combination skewer"},{"term":"Recapture","slug":"recapture","kind":"look-up","tier":1,"also":[],"definition":"Taking back on the square where one of your own pieces has just been captured.","h":"recapture  taking back on the square where one of your own pieces has just been captured. the word describes the second half of an exchange, so it only means anything relative to the move before it. capture a capture removes a piece. a recapture is a capture that answers one, on the same square. every recapture is a capture; almost no captures are recaptures. trade a trade is the pair of moves; a recapture is the second of them. if nobody takes back, there was a capture and no trade. trade combination"},{"term":"Trade","slug":"trade","kind":"look-up","tier":1,"also":["exchange"],"definition":"Exchanging pieces of roughly equal value - a knight for a bishop, a rook for a rook - so that both sides come out level on material.","h":"trade exchange exchanging pieces of roughly equal value - a knight for a bishop, a rook for a rook - so that both sides come out level on material. trading is one of the main ways to change a position without taking a risk: it simplifies, and whether that helps depends entirely on what each side is left with. sacrifice a trade comes out level on material; a sacrifice deliberately does not. the difference is intention plus arithmetic, and the arithmetic is the easy half. recapture the trade is the pair of moves; the recapture is the second one. an offer that is declined is not a trade. the exchange exchange is an older synonym for trade, but the exchange, with the article, is a different term entirely: it means the advantage of a rook against a bishop or knight. up the exchange does not mean a trade happened. recapture combination"},{"term":"Queening","slug":"queening","kind":"look-up","tier":1,"also":[],"definition":"Promoting a pawn to a queen by reaching the far rank.","h":"queening  promoting a pawn to a queen by reaching the far rank. the pawn is removed from the board and a queen takes its place, whatever else is still on - a second or third queen is perfectly legal. promotion promotion is the rule: a pawn reaching the last rank must become a queen, rook, bishop or knight. queening is the usual choice, and common enough that the two words get used interchangeably. choosing anything else is underpromotion, and it is occasionally the only move that wins, because a new queen can leave the opponent with no legal move and force a draw where a knight would have mated. passed pawn a passed pawn has no enemy pawn able to stop it on its own file or the two beside it. that is what turns queening from a wish into a threat - but the pawn still has to get there. endgame back-rank"},{"term":"Combination","slug":"combination","kind":"look-up","tier":1,"also":[],"definition":"A forced sequence of moves, usually beginning with a sacrifice, that reaches a specific goal you have seen in advance.","h":"combination  a forced sequence of moves, usually beginning with a sacrifice, that reaches a specific goal you have seen in advance. three things separate it from a plain good move: the opponent's replies are forced or near-forced, the goal is concrete rather than positional, and you have to see the whole thing before you start, because the first move is often bad on its own terms. tactic tactic is the general word for short-range forcing play; combination is the specific thing you calculate. the seeds course scans for the twelve features that make a tactic possible. a combination is what you find afterwards, and it is the thing the scan cannot produce. a named shape fork and skewer name a shape. combination names a sequence. a single combination often contains two or three named shapes at once, which is why looking for shapes and looking for combinations are different searches. tactic sacrifice"},{"term":"Skewer","slug":"skewer","kind":"see-it","tier":2,"also":[],"definition":"One piece attacks two enemy units standing on the same line, with the more valuable one in front.","h":"skewer  one piece attacks two enemy units standing on the same line, with the more valuable one in front. the front unit moves out of the attack - often because it is the king and has no choice - and the one behind it is taken. pin same geometry, opposite order. a pin has the valuable unit behind, so the front one is stuck. a skewer has the valuable unit in front, so it steps aside and abandons what was sheltering behind it. the common shorthand - a skewer is a pin in reverse - is accurate about the geometry and misleading about the play: a pin is a restraint that can sit on the board for twenty moves, while a skewer is almost always cashed in immediately. pin x-ray combination"}]</script>
