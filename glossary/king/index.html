<script type="application/json" id="data">{"tier":3,"group":"pieces-and-rules","kind":"look-up","chips":["sourced"],"term":"King","slug":"king","definition":"The piece the game is played for. It moves one square in any direction, may never move onto a square where it would be in check, and is never actually captured - the game ends the moment it has no legal way out. It is the one man both sides always have exactly one of, which is why it carries no number in the material count.","precision":[{"against":"being a piece to hide","text":"In the endgame it is a fighting piece and often the strongest one left. In the three-man ending below, when it is White's move the king makes seven of White's eight legal moves and the pawn makes the eighth. The middlegame advice to tuck the king away and the endgame advice to march it up the board are the same advice about different numbers of enemy pieces."},{"against":"the back rank being a safe place","text":"It is the ordinary place and not a safe one. Both kings are standing on their own back rank in 79.8% of the 2,100 certified positions, and in 35.5% of them the seeds course's back-rank test fires for at least one side - a castled king with the pawns in front of it unmoved and no square to step to."},{"against":"the king being worth nothing","text":"It has no price because it cannot be traded, not because it is weak. Books that need a number for endgame purposes put its fighting value at about four points, which is more than a bishop; the material count leaves it out because both sides have one and always will."}],"boards":[{"fen":"3k4/8/8/4K3/5P2/8/8/8 b - - 1 58","corpus":"endgame","ref":"juq7otel","caption":"Three men. Black is to move; when White moves, the king on e5 has seven legal squares and the pawn on f4 has one, so seven of White's eight moves are king moves. The whole ending is about where that king walks, and the pawn follows it.","highlight":["e5","f4","d8"],"render_fen":"3k4/8/8/4K3/5P2/8/8/8 b - - 1 58","highlig
