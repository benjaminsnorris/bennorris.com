<script type="application/json" id="data">{"term":"Opposition","slug":"opposition","tier":3,"group":"endgame-technique","kind":"look-up","definition":"Two kings on the same file, rank or diagonal with an odd number of squares between them. The player who is not to move holds the opposition, because the other one has to give way - and in a king-and-pawn endgame giving way is usually the whole game.","precision":[{"against":"holding the opposition being good","text":"It is not a plus, it is a turn. Holding the opposition means your opponent must move their king first and so must stop guarding something; if there is nothing they are guarding, it means nothing at all. The opposition is worth a name in king-and-pawn endings and almost never worth one elsewhere."},{"against":"zugzwang","text":"The opposition is the commonest special case of it. Zugzwang is the general condition - having to move is what damages you - and the opposition is the particular geometry that produces it between two kings."},{"against":"the kings simply being near each other","text":"The odd count is the entire definition and it is easy to get backwards. Kings on c3 and c5 have one square between them and are in opposition; kings on c3 and c6, with two squares between, are not. Distant opposition - three or five squares apart on a line - works the same way and is what most endgame mistakes at this level are about."}],"chips":["sourced"],"boards":[{"fen":"8/8/2p5/2k5/8/2K5/8/8 w - - 3 55","corpus":"drill","ref":"odv155ak","caption":"Three men, and the position is entirely about whose turn it is. The kings face each other on the c-file with c4 between them, so Black holds the opposition, and White is to move. White has exactly five legal moves - Kb2, Kc2, Kd2, Kb3, Kd3 - and not one of them keeps the kings facing. Whichever way the king steps, Black's king takes ground on the other side.","highlight":["c3","c4","c5"],"render_fen":"8/8/2p5/2k5/8/2K5/8/8 w - - 3 55","highlight_squares":["c3","c4","c5"]}],"drill":{"mode":"none","why":"unbalanced","note":"The predicate is four lines and exact, and the corpus cannot carry it: kings are in some opposition in 7.5% of the relaxed corpus and direct opposition in 1.8%. Restricting to positions with seven men or fewer - where the term actually lives - lifts it only to 24.4%, still under the 25% floor. So this is not a corpus that needs replacing but a term whose presence is close to a coincidence: what matters is whose move it is, and no yes-or-no question about the position can ask that. The corpora are samples of games, not of endgames: the relaxed harvest takes up to four positions from anywhere in a game, so only 390 of its 10,000 positions have seven men or fewer. A rate measured over the whole file reports how often a position is an endgame, not how often the idea holds where it applies."},"links":["zugzwang","pawn-endgame","key-squares","triangulation","endgame","tempo","stalemate"],"reading":[{"title":"Opposition (chess)","url":"https://en.wikipedia.org/wiki/Opposition_(chess)"}],"links_resolved":[{"label":"Zugzwang","href":"/glossary/zugzwang/"},{"label":"Pawn endgame","href":"/glossary/pawn-endgame/"},{"label":"Key squares","href":"/glossary/key-squares/"},{"label":"Triangulation","href":"/glossary/triangulation/"},{"label":"Endgame","href":"/glossary/endgame/"},{"label":"Tempo","href":"/glossary/tempo/"},{"label":"Stalemate","href":"/glossary/stalemate/"}],"home":null}</script>
