<script type="application/json" id="data">{"term":"Opposition","slug":"opposition","tier":3,"group":"endgame-technique","kind":"look-up","definition":"Two kings on the same file, rank or diagonal with an odd number of squares between them. The player who is not to move holds the opposition, because the other one has to give way - and in a king-and-pawn endgame giving way is usually the whole game.","precision":[{"against":"holding the opposition being good","text":"It is not a plus, it is a turn. Holding the opposition means your opponent must move their king first and so must stop guarding something; if there is nothing they are guarding, it means nothing at all. The opposition is worth a name in king-and-pawn endings and almost never worth one elsewhere."},{"against":"zugzwang","text":"The opposition is the commonest special case of it. Zugzwang is the general condition - having to move is what damages you - and the opposition is the particular geometry that produces it between two kings."},{"against":"the kings simply being near each other","text":"The odd count is the entire definition and it is easy to get backwards. Kings on c3 and c5 have one square between them and are in opposition; kings on c3 and c6, with two squares between, are not. Distant opposition - three or five squares apart on a line - works the same way and is what most endgame mistakes at this level are about."}],"chips":["sourced"],"boards":[{"fen":"8/8/8/8/8/1p6/1k1K4/8 b - - 5 58","corpus":"drill","ref":"x8nn40yw","caption":"Three men, and the position is entirely about whose turn it is. The kings face each other along the second rank with c2 empty between them, so White holds the opposition and Black is to move. Black's four legal moves are all king moves - Ka1, Kb1, Ka2, Ka3 - and every one of them gives ground.","highlight":["b2","c2","d2"],"render_fen":"8/8/8/8/8/1p6/1k1K4/8 b - - 5 58","highlight_squares":["b2","c2","d2"]}],"drill":{"mode":"none","why":"unbalanced","note":"The predicate is four lines and exact, and the corpus cannot carry it: kings are in some opposition in 7.8% of the relaxed corpus and direct opposition in 2.5%, far under the 25% floor. **This entry used to say the term could never be drilled, and the rebuilt corpora show that was too strong.** Among the 447 positions with seven men or fewer the rate is 29.3%, and on the endgame corpus it is 26.0% - both inside the band. What stops it is not the number but the pool: the endgame corpus was built for the square rule, so its population is positions holding one unobstructed passed pawn, and a rate from it describes that and not opposition. A corpus sampled for this term would support a drill, and none is declared. The corpora are samples of games, not of endgames: the relaxed harvest takes up to four positions from anywhere in a game, so only 447 of its 10,000 positions have seven men or fewer. A rate measured over the whole file reports how often a position is an endgame, not how often the idea holds where it applies."},"links":["zugzwang","pawn-endgame","key-squares","triangulation","endgame","tempo","stalemate"],"reading":[{"title":"Opposition (chess)","url":"https://en.wikipedia.org/wiki/Opposition_(chess)"}],"links_resolved":[{"label":"Zugzwang","href":"/glossary/zugzwang/"},{"label":"Pawn endgame","href":"/glossary/pawn-endgame/"},{"label":"Key squares","href":"/glossary/key-squares/"},{"label":"Triangulation","href":"/glossary/triangulation/"},{"label":"Endgame","href":"/glossary/endgame/"},{"label":"Tempo","href":"/glossary/tempo/"},{"label":"Stalemate","href":"/glossary/stalemate/"}],"home":null}</script>
