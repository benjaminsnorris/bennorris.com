<script type="application/json" id="data">{"term":"Zwischenzug","slug":"zwischenzug","tier":2,"order":560,"group":"tactics","kind":"see-it","taught":[],"thread":"The last of the tactics, and the one whose whole content is the order you do things in.","definition":"An in-between move. Instead of making the reply everyone is expecting - usually a recapture - you insert something more forcing first, and only then go back to the move you were going to make. The inserted move changes the position in your favour before you complete the exchange.","precision":[{"against":"intermezzo","text":"The same thing. Zwischenzug is German and intermezzo Italian, both meaning an in-between move, and English took both. Neither is more correct; zwischenzug is commoner in English chess writing and intermezzo is what this glossary's puzzle bank tags it as."},{"against":"a desperado","text":"A desperado is a piece that is lost anyway and goes out taking whatever it can. Related in spirit and different in mechanism: a desperado is about a doomed piece, a zwischenzug is about the order of moves."},{"against":"delaying a recapture","text":"Only a zwischenzug if the inserted move is forcing. If the opponent can simply ignore it and take, the recapture was not delayed, it was declined."}],"chips":["sourced"],"boards":[{"fen":"2r5/4k3/7p/p2R1p1n/P4P2/N7/5P1P/6K1 b - - 0 32","corpus":"puzzles","ref":"04jmi","moves":["c8c1"],"caption":"Verified rather than tagged: before this move Black had two units hanging, on f5 and a5. Rc1+ deals with neither - it gives check, which must be answered, and only then does Black come back for the material. The board shows the position after the in-between move.","render_fen":"8/4k3/7p/p2R1p1n/P4P2/N7/5P1P/2r3K1 w - - 1 33"}],"drill":{"mode":"none","why":"impossible","note":"A zwischenzug is defined by the move that was expected and not played, and by the order of a sequence. Neither is in the position."},"reading":[{"title":"Zwischenzug, in Glossary of chess","ur
