<script type="application/json" id="data">{"tier":3,"group":"historical","kind":"look-up","term":"Chaturanga","slug":"chaturanga","chips":["sourced"],"definition":"The Indian game chess grew out of, played by the 7th century. Its name is the word for an army of four divisions - infantry, cavalry, elephantry and chariotry - and those four are the pawn, the knight, the bishop and the rook, which have kept their moves ever since. What has changed is everything else.","precision":[{"against":"it being early chess","text":"It is the ancestor rather than the child. Four of the six pieces arrived from it intact and two did not: the counsellor beside the king became the queen and the elephant became the bishop, and both were changed out of recognition about eight hundred years later. A game of chaturanga would be recognisable to you and unplayable by you."},{"against":"the four divisions being a metaphor","text":"They are the etymology. Chaturanga is the Sanskrit for the four-limbed army, and the pieces are the limbs - which is why the rook is a chariot rather than a castle, and why the piece an English speaker calls a bishop is an elephant in most of the languages that have the game. `rook` still carries the older name in the word itself."},{"against":"a single line of descent","text":"The route west is documented and the route east is a different game: chaturanga also travelled into China and Japan, and xiangqi and shogi are its cousins rather than its descendants of this line. This entry follows only the branch that became the game this glossary is about."}],"origin":{"text":"India, by the 7th century CE, and into Sassanid Persia as chatrang around 600. The name is the Sanskrit for an army's four divisions - infantry, cavalry, elephantry and chariotry - which became the pawn, the knight, the bishop and the rook.","chip":"sourced","source":"Wikipedia, History of chess. The primaries - the Sanskrit and Persian sources it cites - were not consulted, and the earliest history
