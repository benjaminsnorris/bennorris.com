<script type="application/json" id="data">{"tier":3,"group":"online","kind":"look-up","term":"Accuracy","slug":"accuracy","also":["accuracy score","game review","computer analysis"],"chips":["sourced","vendor-framing"],"definition":"The percentage a site gives you after a game, for how close your moves came to an engine's. It is built from how much each move cost - the engine's evaluation before it against the evaluation after it - and then run through a curve so the result reads like a school mark. It measures something real. It is not a rating, and it is not comparable to anybody else's.","precision":[{"against":"accuracy being centipawn loss","text":"Not directly, and the reason is a good one. Lichess converts each evaluation to a win percentage first, on the grounds that \"centipawns are great for developing chess engines... but not so much for human comprehension\" and that \"a loss of 300 centipawns means vastly different things depending on position context\" - three pawns thrown away in a level position is a disaster and in a won one is nothing. Accuracy then compares the win percentage before and after each move, so it is measured in chances rather than in pawns."},{"against":"two accuracy scores being comparable","text":"They are comparable only within one site, in one version. Lichess's own page says plainly that \"different websites use different formulas, engines and analysis depths\", that it calibrates against games among 2300-rated players, and that its equations \"might change in the future\". So an accuracy score is a reading from one instrument, and comparing yours to a friend's on another site is comparing two instruments."},{"against":"a high score meaning you played well","text":"It means you did not go wrong, which is not the same. A simple position offers few chances to lose any, so a quiet game trades down to a draw at 95% and a sharp game you eventually win can score in the seventies. The number rewards not erring, and most of learning to p
