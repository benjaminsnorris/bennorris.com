<script type="application/json" id="data">{"term":"Exposed king","slug":"exposed-king","tier":2,"order":406,"kind":"see-it","taught":["seeds:block-3"],"defined_also_in":["seeds:block-3"],"thread":"The first of two seeds about the king's neighbourhood, counted two different ways.","definition":"A king with one pawn in front of it, or none. The seed is a count, not a judgement: fewer shielding pawns means fewer obstacles between the king and anything aimed at it.","precision":[{"against":"king safety","text":"King safety is the whole judgement - who is attacking, what can arrive, how fast, and whether the defence holds. This seed is one measurable input to it: how many pawns are still in front. A king with three pawns can be far less safe than one with none, if the attackers are all pointed at it."},{"against":"open line to the king","text":"Two different counts of the same neighbourhood. This one counts the pawns immediately in front of the king. The other looks for a whole file or diagonal running to the king with no pawn of either colour on it. A king can have its own pawns intact and still sit at the end of an open line."}],"chips":["sourced"],"extra":[{"heading":"How often it fires","body":"For at least one side in 38.2% of the 2,100 certified positions - close to the middle of the twelve. It is present in 74% of the 35 puzzles tagged skewer, 71% of the 68 tagged promotion and 67% of the 54 tagged deflection: a broad, moderate association with several motifs rather than a strong tie to one."}],"boards":[{"fen":"6rk/ppp1Q1pp/3p4/8/2P5/1P4qP/PB6/4RK2 b - - 1 29","corpus":"positions","ref":"m0l95uak","highlight":"auto:seed:exposed_king","caption":"The white king on f1 has no pawn in front of it at all. Fewer pawns means fewer things an attacker has to remove first.","render_fen":"6rk/ppp1Q1pp/3p4/8/2P5/1P4qP/PB6/4RK2 b - - 1 29","highlight_squares":["f1"]}],"drill":{"mode":"none","why":"taught-elsewhere","note":"The seeds course drills this, as one of the twelve, an
