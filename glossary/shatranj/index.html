<script type="application/json" id="data">{"tier":3,"group":"historical","kind":"look-up","term":"Shatranj","slug":"shatranj","also":["chatrang"],"chips":["sourced"],"definition":"The game that carried chess from Persia across the Islamic world and into Europe, and the direct ancestor of the modern game. Same board, same six pieces, three different rules: pawns moved one square only, the piece where the queen stands moved one square diagonally, and the bishop jumped exactly two diagonally. It was played for something like eight hundred years.","precision":[{"against":"it being slow chess","text":"It is a different game, and this project can put a number on how different. Of the 7,905 distinct positions in the opening census - every position occurring at plies 2 to 6 of 121,332 games - **125 could have been reached in shatranj**, and the other 7,780 could not. That is inside the first three moves, before anybody castles or does anything clever. The board below is one of the 125."},{"against":"the pieces being the ones you know","text":"Two of them are not. The **ferz**, the counsellor standing where your queen stands, moved one square diagonally - so it never left the colour it started on and took a dozen moves to cross the board. Short-range, and worth about a pawn and a half rather than nine. The **alfil**, in the bishop's place, jumped exactly two squares diagonally, over anything in between, which confines it to **8 of the 64 squares** for the entire game - the board divides into 8 such orbits and an alfil can never leave the one it starts in, so two alfils of the same side can never so much as attack the same square. Neither piece is a weaker queen or a weaker bishop; they are differently shaped."},{"against":"the pawn being a detail","text":"It is the rule that breaks most positions. **15,905 of the 40,241 moves** stored in the opening census are a pawn moving two squares, which shatranj did not allow, and that single rule is what makes 7,577 of the 7,780 unreachable positions unreachable - the bishop accounts for 160 and the queen for 43. The two-square first move is a European speed-up, and it is why modern chess opens the way it does."}],"origin":{"text":"Persian chatrang, from Indian chaturanga around 600 CE, became shatranj after the Arab conquest - Arabic has neither the \"ch\" nor the \"ng\" of the older name, so the word records the transmission. It reached Europe through the Islamic world and was the game played there until about 1475.","chip":"sourced","source":"Wikipedia, History of chess and Shatranj. The primaries were not consulted."},"boards":[{"fen":"rnbqkbnr/pp3ppp/2ppp3/8/8/2N1PN2/PPPP1PPP/R1BQKB1R w KQkq - 0 4","corpus":"opening","ref":"7m3wydcz","caption":"1.e3 e6 2.Nc3 d6 3.Nf3 c6, from a real modern game, and one of the 125 positions in the whole 7,905-position census that a shatranj player could also have reached. Every pawn has moved one square; the knights, whose move never changed, are the only pieces out. It looks like a slow modern opening and it is also a thousand-year-old game - which is exactly how rare that overlap is.","render_fen":"rnbqkbnr/pp3ppp/2ppp3/8/8/2N1PN2/PPPP1PPP/R1BQKB1R w KQkq - 0 4"}],"drill":{"mode":"none","why":"impossible","note":"The question a drill would ask - could this position have occurred in shatranj - is computable from the moves and was computed for this entry, but the answer is 125 of 7,905, 1.6%, which is far under the floor. And it needs the moves rather than the position, which no drill here is built for."},"links":["chaturanga","mad-queen","arabian-mate","queen","bishop","pawn","castling","en-passant","promotion"],"reading":[{"title":"Shatranj","url":"https://en.wikipedia.org/wiki/Shatranj"}],"links_resolved":[{"label":"Chaturanga","href":"/glossary/chaturanga/"},{"label":"The mad queen","href":"/glossary/mad-queen/"},{"label":"Arabian mate","href":"/glossary/arabian-mate/"},{"label":"Queen","href":"/glossary/queen/"},{"label":"Bishop","href":"/glossary/bish
