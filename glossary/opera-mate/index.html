<script type="application/json" id="data">{"tier":3,"group":"mating-patterns","kind":"look-up","chips":["sourced"],"term":"Opera mate","slug":"opera-mate","definition":"A rook giving mate on the back rank from the square beside the king, held there by a bishop on a long diagonal, with the king's other squares blocked by its own pieces. Named after the game Paul Morphy played in a box at the Paris opera in 1858.","precision":[{"against":"being a back-rank mate","text":"Relatives, and the difference is distance. A back-rank mate is delivered from along the rank or down the file with the king's own pawns shutting it in, and the mating piece is usually out of reach. Here the rook is standing right beside the king and would simply be captured - the bishop three squares away on the diagonal is what makes it mate."},{"against":"the king being able to step aside","text":"It cannot step along the rank away from the rook, and that catches beginners every time: moving out of a checking piece's line does not help if the square you move to is still on that line. The rook checks through the square the king would vacate."}],"origin":{"chip":"sourced","text":"From the Opera Game, played by Paul Morphy against the Duke of Brunswick and Count Isouard at the Salle Ventadour in Paris in 1858, in a box while an opera was performed on stage. It is among the most famous games ever played and is still the standard teaching example for development and for sacrifice.","source":"Wikipedia, Opera Game. Secondary; no primary score consulted."},"boards":[{"fen":"4Rk1r/p1Q2ppp/2B5/8/6P1/7P/P4P2/6K1 b - - 0 25","corpus":"drill","ref":"gigy4rgm","caption":"The rook on e8 gives check from next to the king and cannot be taken: the bishop on c6 defends it down c6-d7-e8. Black's own pawns on f7 and g7 block two escape squares, and g8 is no escape either - the king would still be on the rook's rank. Black has a rook and four pawns and no legal move.","highlight":["f8","e8","c6","f7","g7"],"render_fen":"4Rk1r/p1Q2ppp/2B5/8/6P1/7P/P4P2/6K1 b - - 0 25","highlight_squares":["f8","e8","c6","f7","g7"]}],"drill":{"mode":"none","why":"unbalanced","note":"12 of the 1,153 checkmates in the drill corpus are a rook mating from an adjacent square on a back rank while a bishop defends it and at least one of the king's neighbouring squares holds one of its own men. One mate in ninety-six, inside a corpus where mate itself is 11.5%."},"links":["checkmate","back-rank-mate","bishop","rook","sacrifice","epaulette-mate"],"reading":[{"title":"Opera Game","url":"https://en.wikipedia.org/wiki/Opera_Game"}],"links_resolved":[{"label":"Checkmate","href":"/glossary/checkmate/"},{"label":"Back-rank mate","href":"/glossary/back-rank-mate/"},{"label":"Bishop","href":"/glossary/bishop/"},{"label":"Rook","href":"/glossary/rook/"},{"label":"Sacrifice","href":"/glossary/sacrifice/"},{"label":"\u00c9paulette mate","href":"/glossary/epaulette-mate/"}],"home":null}</script>
