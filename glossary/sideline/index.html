<script type="application/json" id="data">{"term":"Sideline","slug":"sideline","tier":3,"group":"openings","kind":"look-up","definition":"Any branch that is not the main line. It says how much attention a line has had, and nothing at all about whether it is good.","precision":[{"against":"being bad","text":"Sound and unfashionable are different things, and plenty of sidelines are simply lines nobody has needed. What makes one *bad* is analysis showing it loses something by force; what makes it a sideline is that fewer people have looked. A beginner is much better served by a sound sideline they understand than by a main line they have memorised twelve moves of."},{"against":"an opening trap","text":"A sideline is a place you are happy to end up; a trap is a place you are hoping your opponent ends up. Some sidelines contain traps, which is a large part of their popularity at club level - and the ones whose only merit is the trap are the ones to avoid."}],"chips":["sourced"],"boards":[],"no_board":"A diagram shows one position. This term is about a *tree* of them - which branch, whose branch, how deep - and the picture that would explain it is a list of moves rather than a board.","drill":{"mode":"none","why":"impossible","note":"Same reason as the main line: this is a statement about what has been analysed, not about a position."},"links":["main-line","variation","repertoire","theory","opening-trap","novelty"],"reading":[{"title":"Glossary of chess","url":"https://en.wikipedia.org/wiki/Glossary_of_chess"}],"links_resolved":[{"label":"Main line","href":"/glossary/main-line/"},{"label":"Variation","href":"/glossary/variation/"},{"label":"Repertoire","href":"/glossary/repertoire/"},{"label":"Theory","href":"/glossary/theory/"},{"label":"Opening trap","href":"/glossary/opening-trap/"},{"label":"Novelty","href":"/glossary/novelty/"}],"home":null}</script>
