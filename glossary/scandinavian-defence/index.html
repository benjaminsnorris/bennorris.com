<script type="application/json" id="data">{"term":"Scandinavian Defence","slug":"scandinavian-defence","tier":3,"group":"openings","kind":"look-up","also":["Centre Counter","Center Counter Defense"],"definition":"1.e4 d5, hitting the centre immediately. White almost always takes, and Black recaptures with the queen - which is why beginners like it and why it costs time: the queen then has to move again when it is attacked.","precision":[{"against":"the queen recapture being a mistake","text":"It is playable and it is not free. After 1.e4 d5 2.exd5 Qxd5 3.Nc3 the queen moves a second time and White develops a piece doing it, so Black is behind on development by exactly the tempo the books complain about. The opening's soundness rests on Black getting that time back later, which is a harder thing to judge than counting it."},{"against":"being a beginner opening","text":"It is popular with beginners for a good reason - the centre is resolved at once and there is little to memorise - and it is also perfectly respectable. What it does not do is teach anything about developing pieces, which the Italian does on every move. That is the argument against learning it first, and it is an argument about learning rather than about chess."}],"origin":{"chip":"sourced","text":"Arguably the oldest recorded opening of all. It appears in a fictional game in the Catalan poem Scachs d'amor, written in Valencia around 1475 between Francesc de Castellvi and Narcis Vinyoles - possibly the earliest documented game played with the modern queen and bishop moves. It is also listed in Lucena's book of 1497, which is the same book that does *not* contain the Lucena position.","source":"Wikipedia, Scandinavian Defense. Secondary; neither the poem nor Lucena consulted."},"chips":["sourced"],"boards":[{"fen":"rnbqkbnr/ppp1pppp/8/3p4/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2","corpus":"opening","ref":"xni0zij8","caption":"1.e4 d5. Black offers the trade in the centre on move one; White takes, Black's queen recaptures, and a white knight then gains time by attacking it. Lichess codes the game B01. Lichess classifies the game itself, so the code is the database's and not this glossary's. Note what it names: the *game's* whole opening, decided by moves played after the position shown.","highlight":["d5","e4"],"render_fen":"rnbqkbnr/ppp1pppp/8/3p4/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2","highlight_squares":["d5","e4"]}],"drill":{"mode":"none","why":"impossible","note":"A named opening is a move order, and a position cannot say how it was reached - which is why this board is drawn from the one corpus here that stores the moves alongside the position."},"links":["italian-game","lucena","development","tempo","open-game","recapture","theory"],"reading":[{"title":"Scandinavian Defense","url":"https://en.wikipedia.org/wiki/Scandinavian_Defense"}],"links_resolved":[{"label":"Italian Game","href":"/glossary/italian-game/"},{"label":"The Lucena position","href":"/glossary/lucena/"},{"label":"Development","href":"/glossary/development/"},{"label":"Tempo","href":"/glossary/tempo/"},{"label":"Open game","href":"/glossary/open-game/"},{"label":"Recapture","href":"/glossary/recapture/"},{"label":"Theory","href":"/glossary/theory/"}],"home":null}</script>
