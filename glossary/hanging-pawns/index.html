<script type="application/json" id="data">{"tier":3,"group":"positional","kind":"look-up","chips":["sourced"],"term":"Hanging pawns","slug":"hanging-pawns","definition":"Two pawns side by side on adjacent half-open files, with no friendly pawn beside them to help. They control four squares in front of them and they are targets, because there are no pawns to defend them and the files they stand on are open to enemy rooks.","precision":[{"against":"being a weakness","text":"They are an imbalance rather than a verdict, and they are famously both things at once: strong while they can advance together and weak the moment one of them has to move, because whichever stays behind becomes backward and whichever advances can be blockaded. Whole opening systems are built on taking them deliberately."},{"against":"any pair of pawns side by side","text":"The term is much narrower than it sounds, and measuring shows how much. Two friendly pawns abreast with no friendly pawn on either flanking file occurs in 33.3% of the 2,100 certified positions. Add the condition that actually makes them hang - both files clear of enemy pawns, so enemy rooks can use them - and it falls to 1.1%, twenty-three positions."}],"boards":[{"fen":"rn3rk1/pp2n1pp/2q5/4R3/2PP4/5NP1/P2Q1K1P/RN6 w - - 1 20","corpus":"positions","ref":"zdfwqtxg","caption":"The only pair in the 2,100 certified positions that meets the definition: White's pawns on c4 and d4, no white pawn on b or e, and no black pawn on c, d or e. It also shows what the definition leaves out - Black has no pawn anywhere near them and only one rook, so nothing is attacking them, and hanging pawns are only a liability when something is.","highlight":["c4","d4"],"render_fen":"rn3rk1/pp2n1pp/2q5/4R3/2PP4/5NP1/P2Q1K1P/RN6 w - - 1 20","highlight_squares":["c4","d4"]}],"drill":{"mode":"none","why":"unbalanced","note":"Exactly computable and far too rare: the strict reading is 1.1% of the certified corpus and 2.4% of the drill corpus, both far under the
