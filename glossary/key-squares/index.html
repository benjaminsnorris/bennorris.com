<script type="application/json" id="data">{"term":"Key squares","slug":"key-squares","tier":3,"group":"endgame-technique","kind":"look-up","also":["critical squares"],"definition":"The squares your king has to reach for a pawn to promote whoever is to move. For a pawn on the second to fifth rank they are the three squares two ranks in front of it; get the king to one of them and the pawn goes through, whatever the defender does.","precision":[{"against":"the opposition","text":"The two are the same subject from opposite ends, and key squares are the more useful half. The opposition tells you who has to give way; the key squares tell you what you are trying to reach, which means you can plan the king's route rather than counting tempi move by move."},{"against":"squares in front of the pawn","text":"Two ranks in front, not one, and three squares rather than one file. For a pawn on b5 the key squares are a7, b7 and c7 - so the king does not have to get in front of its own pawn, it has to get beside where the pawn is going."}],"chips":["sourced"],"boards":[{"fen":"2k5/8/1K6/1P6/8/8/8/8 w - - 1 51","corpus":"drill","ref":"lv1htg3x","caption":"Pawn on b5, so the key squares are a7, b7 and c7, and White's king on b6 is on none of them. Black's king on c8 covers two of the three - b7 and c7 - which is what a defending king in front of the pawn is for. The whole ending is White trying to reach a square Black is standing next to.","highlight":["a7","b7","c7","c8"],"render_fen":"2k5/8/1K6/1P6/8/8/8/8 w - - 1 51","highlight_squares":["a7","b7","c7","c8"]}],"drill":{"mode":"none","why":"unbalanced","note":"Where the key squares are is pure geometry and exactly computable from the pawn. Whether the king can reach one is a calculation, and either way the question only exists in a king-and-pawn ending. The corpora are samples of games, not of endgames: the relaxed harvest takes up to four positions from anywhere in a game, so only 390 of its 10,000 positions have seven men or fewer. A rate measured over the whole file reports how often a position is an endgame, not how often the idea holds where it applies."},"links":["opposition","pawn-endgame","queening","passed-pawn","triangulation","square-of-the-pawn"],"reading":[{"title":"Key square","url":"https://en.wikipedia.org/wiki/Key_square"}],"links_resolved":[{"label":"Opposition","href":"/glossary/opposition/"},{"label":"Pawn endgame","href":"/glossary/pawn-endgame/"},{"label":"Queening","href":"/glossary/queening/"},{"label":"Passed pawn","href":"/glossary/passed-pawn/"},{"label":"Triangulation","href":"/glossary/triangulation/"},{"label":"The square of the pawn","href":"/glossary/square-of-the-pawn/"}],"home":null}</script>
