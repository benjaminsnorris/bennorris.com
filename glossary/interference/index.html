<script type="application/json" id="data">{"term":"Interference","slug":"interference","tier":2,"order":530,"group":"tactics","kind":"see-it","taught":[],"thread":"The other way, and the rarer one: leave the defender where it stands and block its view.","definition":"A defender's line is cut by putting something in the way. The defender does not move and is not captured - it simply stops reaching what it was guarding, because a piece has been dropped between them.","precision":[{"against":"deflection","text":"Deflection moves the defender. Interference leaves it standing and blocks its view. The tell is that after an interference the defender is still on the same square, doing nothing."},{"against":"blocking a check","text":"Same physical act, opposite purpose. Interposing to stop a check protects your own king; interference cuts an enemy defence. Some writers use obstruction for the second sense, and a few use the two words the other way round."}],"chips":["sourced"],"extra":[{"heading":"The rarest of the eleven, and the least predicted","body":"Only 24 puzzles in the bank carry the tag, the fewest of any motif here. One seed is claimed - an open line to the king, in 67% of them at a lift of 1.31 - and it is marked weak. That fits: interference is about a defensive line somewhere on the board, which the king's neighbourhood says nothing about."}],"boards":[{"fen":"r4rk1/pbpp1ppp/1p3n2/3Pn3/4PR2/4B1P1/PqP1N1BP/R2Q2K1 w - - 0 14","corpus":"puzzles","ref":"0EywV","moves":["e3d4"],"caption":"Verified: before Bd4, the black queen on b2 defended the knight on e5 along the b2-e5 diagonal. Bd4 sits down in the middle of that diagonal. The queen has not moved and is not attacked - it simply cannot see e5 any more, and Bxe5 follows.","render_fen":"r4rk1/pbpp1ppp/1p3n2/3Pn3/3BPR2/6P1/PqP1N1BP/R2Q2K1 b - - 1 14"}],"drill":{"mode":"none","why":"impossible","note":"Interference is a fact about a move and the line it cuts, not about a position. A predicate would have to know which defence mattered and what was worth blocking it for. Illustrated, not drilled."},"reading":[{"title":"Interference (chess)","url":"https://en.wikipedia.org/wiki/Interference_(chess)"}],"links":["deflection","overworked-defender","battery","check"],"links_resolved":[{"label":"Deflection","href":"/glossary/deflection/"},{"label":"Overworked defender","href":"/glossary/overworked-defender/"},{"label":"Battery","href":"/glossary/battery/"},{"label":"Check","href":"/glossary/check/"}],"home":{"slug":"core","title":"The core vocabulary","framing":"Why this is in the core vocabulary"},"paths":{"core":{"title":"The core vocabulary","n":50,"of":73,"prev":{"slug":"deflection","term":"Deflection"},"next":{"slug":"hanging-piece","term":"Hanging piece"}}}}</script>
