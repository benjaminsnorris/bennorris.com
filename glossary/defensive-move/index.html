<script type="application/json" id="data">{"term":"Defensive move","slug":"defensive-move","tier":3,"group":"tactical-method","kind":"look-up","definition":"The move that holds, when the position offers you nothing to attack with. It is the answer to a threat rather than a threat of its own, and it is the hardest kind of move to find by instinct because none of the usual signals - check, capture, forcing line - points at it.","precision":[{"against":"the rest of the puzzle bank","text":"This is the one theme in the bank where the solution is not an attack, and it shows up in the numbers: 0 of these 24 puzzles end in mate, against 19 of 24 for the kingside attacks. All 24 contain a move that gives no check and takes nothing, and only 8 of the 24 open with a check at all."},{"against":"a passive move","text":"Defending is not the same as doing nothing, and the good ones usually do two jobs at once - the board below answers a check and rescues an undefended pawn with the same move. A move that only avoids trouble tends to hand over the initiative, which is how a defensible position becomes a lost one."},{"against":"the name","text":"A Lichess puzzle tag rather than a term of art. Players talk about defence, resourcefulness or holding a position; nobody says defensive move as a category. The skill it names is entirely real, and the courses' scan is explicitly not built to find it."}],"chips":["sourced","vendor-framing"],"boards":[{"fen":"8/2p5/p1n5/1pP1p2k/1P1p4/P2P3q/5P2/R4KR1 w - - 0 35","corpus":"puzzles","ref":"00XZR","caption":"White is in check from the queen on h3 and has exactly three legal replies: Ke2, Ke1 and Rg2. Only one of them does a second job. The pawn on d3 is attacked by that same queen and defended by nothing at all; Ke2 answers the check and defends the pawn in the same move.","moves":["f1e2"],"highlight":["d3","f1","h3"],"render_fen":"8/2p5/p1n5/1pP1p2k/1P1p4/P2P3q/4KP2/R5R1 b - - 1 35","highlight_squares":["d3","f1","h3"]}],"drill":{"mode":"none",
