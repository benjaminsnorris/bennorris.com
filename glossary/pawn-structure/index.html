<script type="application/json" id="data">{"tier":3,"group":"positional","kind":"look-up","chips":["sourced"],"term":"Pawn structure","slug":"pawn-structure","also":["pawn skeleton","pawn formation"],"definition":"The arrangement of all the pawns on the board, taken as one thing. It changes slowly and never goes backwards, so it is the part of a position that decides what the plans are: which files will open, which squares can be occupied, and which side of the board each player should be playing on.","precision":[{"against":"being one of several things to look at","text":"It is the thing the others hang off. Almost every positional word in this glossary is a name for a feature of it - isolated, doubled, backward, passed, connected, chain, majority, island, outpost, weak square, hole. Learning the structure is learning what the rest of the vocabulary is about."},{"against":"a good structure being the goal","text":"The goal is a structure that suits your pieces. A locked centre is bad for bishops and good for knights, a broken structure is a liability in an endgame and often irrelevant in a sharp middlegame, and doubled pawns that open a file for a rook are frequently worth having. There is no scoring it in the abstract."}],"boards":[{"fen":"rnbq1rk1/1p3ppp/p2p1b2/2pPp3/2P1P3/2N2N2/PP2BPPP/R2Q1RK1 b - - 1 10","corpus":"positions","ref":"5xk1jezm","caption":"Sixteen pawns, one island each, and eight of them already unable to move: c4 against c5, d5 against d6, e4 against e5, and f2 against f7 down an empty file. Nothing here has been captured and the game is already decided in shape - White will play on the queenside where the c- and d-pawns point, and Black on the kingside.","highlight":["c4","c5","d5","d6","e4","e5"],"render_fen":"rnbq1rk1/1p3ppp/p2p1b2/2pPp3/2P1P3/2N2N2/PP2BPPP/R2Q1RK1 b - - 1 10","highlight_squares":["c4","c5","d5","d6","e4","e5"]}],"drill":{"mode":"none","why":"impossible","note":"The structure is exactly readable from any FEN and there is no yes/no question about it worth asking: what matters is what it means for the plans, which is a judgement over the whole position. The features it is made of are drilled one at a time - `passed-pawn`, `doubled-pawns`, `isolated-pawn`, `pawn-chain` and `pawn-island` all have computed drills."},"links":["pawn-island","pawn-chain","isolated-pawn","doubled-pawns","backward-pawn","passed-pawn","closed-position","pawn"],"reading":[{"title":"Pawn structure","url":"https://en.wikipedia.org/wiki/Pawn_structure"}],"links_resolved":[{"label":"Pawn island","href":"/glossary/pawn-island/"},{"label":"Pawn chain","href":"/glossary/pawn-chain/"},{"label":"Isolated pawn","href":"/glossary/isolated-pawn/"},{"label":"Doubled pawns","href":"/glossary/doubled-pawns/"},{"label":"Backward pawn","href":"/glossary/backward-pawn/"},{"label":"Passed pawn","href":"/glossary/passed-pawn/"},{"label":"Closed position","href":"/glossary/closed-position/"},{"label":"Pawn","href":"/glossary/pawn/"}],"home":null}</script>
