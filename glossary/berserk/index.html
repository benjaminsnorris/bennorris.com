<script type="application/json" id="data">{"tier":3,"group":"tournament","kind":"look-up","term":"Berserk","slug":"berserk","also":["berserking"],"chips":["sourced","vendor-framing"],"definition":"A Lichess arena button that halves your clock in exchange for an extra tournament point if you win. It also cancels the increment, and you have to play at least seven moves for the point to count. It is one site's invention, it is the first tournament format a great many people ever meet, and it is a genuinely interesting piece of design.","precision":[{"against":"it being a gimmick","text":"It is a solution to a real problem with arena scoring. An arena rewards playing many games in a fixed hour, so the dominant strategy without it is to play fast and safe against weaker opponents; berserking prices risk into the scoring, so the strongest players take a handicap and the field stays interesting. Whether that is *chess* is a fair question - it is certainly game design."},{"against":"the extra point being free money","text":"You are giving up half your clock and, in an incremented game, the increment as well - so a 3+2 game becomes 1\u00bd+0, which is a different sport rather than the same one played faster. And the point only lands if you both win and reach seven moves, so berserking into an immediate loss costs you the game and pays nothing."},{"against":"arena scoring being simply a point a win","text":"Two consecutive wins start a double-point streak: while it runs a win is worth 4 and a draw 2, and a game you do not win ends it. So an arena is scoring momentum rather than results, which is a deliberate departure from every over-the-board format in this group and the reason arena standings and `swiss-system` standings are not comparable at all."}],"no_board":"A button. What it changes is the clock and the scoring, and neither is in a position - the same limit `time-trouble` runs into, arriving from the tournament's side rather than the player's.","boards":[],"drill":{"mo
