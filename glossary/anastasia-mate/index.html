<script type="application/json" id="data">{"term":"Anastasia's mate","slug":"anastasia-mate","tier":3,"group":"mating-patterns","kind":"look-up","also":["Anastasia mate"],"definition":"A mate on the h-file in which a knight three files away covers the two escape squares beside the king, one of the king's own pieces blocks a third, and a rook or queen arrives down the file. The knight does the work; the piece that arrives only finishes.","precision":[{"against":"the name knight-and-rook mate","text":"That names the common case rather than the pattern. Across the 24 Anastasia puzzles in the bank the mate is delivered by a rook 19 times and by a queen 5. What holds in all 24 is the geometry and not the piece: the king is mated on the h-file in 24 of 24, and the mating side has a knight on the e-file in 24 of 24."},{"against":"the smothered mate","text":"Both trap a king with its own pieces, and the difference is which piece is doing the trapping. A smothered mate seals the king in with its own units on every side and the knight itself gives check. Here the knight gives no check at all - it stands off at a distance covering flight squares, and something else checks along the file."}],"origin":{"chip":"sourced","text":"Named after the novel Anastasia und das Schachspiel, published in 1803 by Johann Jakob Wilhelm Heinse, but Heinse did not compose the position: he took it from an essay by Giambattista Lolli. So the pattern is named after a novel that borrowed it, which is why the name says nothing about the chess.","source":"Wikipedia, Checkmate pattern. Secondary; neither Heinse nor Lolli consulted."},"chips":["sourced"],"boards":[{"fen":"2r4k/1p2N1pp/pq2p3/3b3Q/P7/3R4/5bPP/7K w - - 2 34","corpus":"puzzles","ref":"0SJyX","caption":"The finished pattern, and the sacrifice that sets it up. Qxh7+ drags the king to h7 - it has one legal reply - and after Rxh4 the king has five neighbouring squares and not one is available: the knight on e7 covers g8 and g6, its own pawn stands on g7, and the rook on h4 holds h6 and h8.","moves":["h5h7","h8h7","d3h3","f2h4","h3h4"],"highlight":["e7","g7","h4","h7"],"render_fen":"2r5/1p2N1pk/pq2p3/3b4/P6R/8/6PP/7K b - - 0 36","highlight_squares":["e7","g7","h4","h7"]}],"drill":{"mode":"none","why":"unbalanced","note":"A mate is available in 0.62% of the certified corpus, and this is one named pattern inside that. The puzzle bank holds exactly 24 of these, 12 at each of two rating tiers, by construction. That makes them illustrations and can never make them a rate: a share measured inside one theme is real, and any comparison of how often two themes occur is an artefact of the sampling."},"links":["checkmate","attraction","arabian-mate","smothered-mate","sacrifice","back-rank-mate"],"reading":[{"title":"Checkmate pattern","url":"https://en.wikipedia.org/wiki/Checkmate_pattern"}],"links_resolved":[{"label":"Checkmate","href":"/glossary/checkmate/"},{"label":"Attraction","href":"/glossary/attraction/"},{"label":"Arabian mate","href":"/glossary/arabian-mate/"},{"label":"Smothered mate","href":"/glossary/smothered-mate/"},{"label":"Sacrifice","href":"/glossary/sacrifice/"},{"label":"Back-rank mate","href":"/glossary/back-rank-mate/"}],"home":null}</script>
