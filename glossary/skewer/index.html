<script type="application/json" id="data">{"term":"Skewer","slug":"skewer","tier":2,"order":210,"kind":"see-it","taught":["board-vision:unit-3","seeds:block-5"],"thread":"The pin's twin, and the reason the two are worth reading together rather than apart: the geometry is identical and the play is nothing like it.","definition":"One piece attacks two enemy units standing on the same line, with the more valuable one in front. The front unit moves out of the attack - often because it is the king and has no choice - and the one behind it is taken.","precision":[{"against":"pin","text":"Same geometry, opposite order. A pin has the valuable unit behind, so the front one is stuck. A skewer has the valuable unit in front, so it steps aside and abandons what was sheltering behind it. The common shorthand - a skewer is a pin in reverse - is accurate about the geometry and misleading about the play: a pin is a restraint that can sit on the board for twenty moves, while a skewer is almost always cashed in immediately."}],"origin":{"chip":"sourced","text":"Unlike almost every other term here, this one has a named inventor and a date. It was coined by Edgar Pennell, an English schoolteacher, for the juniors he taught. The earliest known record is a 1939 report in CHESS describing spectators at the 1937 Blackpool congress puzzling over the strange vocabulary his boys were using. The word has no entry in the Oxford English Dictionary at all, as noun or verb, which is why most glossaries say nothing about where it came from. Compare pin, attested in Walker's A New Treatise on Chess (1833) more than a century earlier.","source":"Attestation research: Edward Winter, Earliest Occurrences of Chess Terms"},"chips":["sourced"],"extra":[{"heading":"The king-in-front version is nearly the only one","body":"Of the 24 skewer-tagged puzzles in the bank, 21 begin with a check. That is why the reverse-pin shorthand survives despite describing the play badly: in practice the front piece is usually a king, and a king in front has no choice at all. Measured within a theme, which is the only claim this corpus supports."}],"boards":[{"fen":"8/r4k2/7R/3n1PK1/8/8/8/8 w - - 4 57","corpus":"puzzles","ref":"00KOz","moves":["h6h7"],"lines":[{"from":"h7","to":"a7","kind":"skewer","mark":"f7"}],"caption":"The clean case. Rh7+ forces the king to f8 - Black has exactly three legal replies - and Rxa7 collects the rook.","render_fen":"8/r4k1R/8/3n1PK1/8/8/8/8 b - - 5 57"},{"fen":"r4rk1/p2b1pp1/3bp2p/3pq3/2pN4/P1P1B1P1/1P1Q1P1P/R4RK1 w - - 0 21","corpus":"puzzles","ref":"03COV","moves":["e3f4"],"lines":[{"from":"f4","to":"d6","kind":"skewer","mark":"e5"}],"caption":"No check anywhere. Bf4 attacks the queen on e5 with the bishop on d6 directly behind it. The queen is not obliged to move - it just cannot stay and cannot save both.","render_fen":"r4rk1/p2b1pp1/3bp2p/3pq3/2pN1B2/P1P3P1/1P1Q1P1P/R4RK1 b - - 1 21"},{"fen":"r7/pp1Qp1B1/3b4/3k4/4q3/8/PP3PP1/5K2 w - - 5 35","corpus":"puzzles","ref":"01243","moves":["d7b7"],"awkward":true,"lines":[{"from":"b7","to":"e4","kind":"skewer","mark":"d5"}],"caption":"The awkward one, tagged deflection, fork and skewer at once. Qxb7+ Ke6 Qxe4+. Which name is right? All three. The labels are not a partition.","render_fen":"r7/pQ2p1B1/3b4/3k4/4q3/8/PP3PP1/5K2 b - - 0 35"}],"drill":{"mode":"hand-picked","why":"contested","note":"A skewer predicate is writable - geometry.py has one, and it found every line drawn above. What it cannot do is settle the third board, where the same move is a deflection, a fork and a skewer at once. The labels overlap, so an answer key would be arguable. Verified examples, no score, no gate: not a drill, and not described as one."},"reading":[{"title":"Skewer (chess)","url":"https://en.wikipedia.org/wiki/Skewer_(chess)"},{"title":"Pin (chess)","url":"https://en.wikipedia.org/wiki/Pin_(chess)"}],"links":["pin","x-ray","combination","/courses/board-vision-attacks/"],"links_resolved":[{"label":"Combination","href":"/glo
