<script type="application/json" id="data">{"tier":3,"group":"tournament","kind":"look-up","term":"Scoresheet","slug":"scoresheet","also":["game score","keeping score","recording the moves"],"chips":["sourced"],"definition":"The sheet you write your moves on, and the reason a tournament game exists afterwards at all. Both players keep one, in `algebraic-notation`, move by move as the game goes - and the word for the record itself is the *score* of the game, which has nothing to do with points.","precision":[{"against":"the score being the result","text":"\"The score of the game\" is the moves, not who won. It is an old usage borrowed from music, where a score is the written form of a performance, and it survives in chess and almost nowhere else - which is why \"could you send me the score\" means something quite different from what a beginner expects."},{"against":"it being optional or a formality","text":"It is required in competition, and it is what a claim rests on. A repetition or fifty-move claim is made from your own scoresheet, so a player who has stopped writing has given up the ability to claim - and the Laws contain the exception that proves it: a player with fewer than five minutes left need not record, unless the increment is at least thirty seconds a move."},{"against":"writing the move before playing it","text":"Not allowed, and the reason is worth knowing. The current rule is that the move must be made on the board before it is written down, because writing first turns the scoresheet into a notepad for calculating - which is assistance, in the same family as the things `cheat-detection` exists for."}],"no_board":"A scoresheet holds a list of moves and a position holds none - which is `fen`'s point from the other side. The nearest thing this project has to one is the opening corpus's stored SAN, 40,241 moves of it, and that is a database field rather than a piece of paper.","boards":[],"drill":{"mode":"none","why":"impossible","note":"Keeping score is a
