<script type="application/json" id="data">{"tier":3,"group":"pieces-and-rules","kind":"look-up","chips":["sourced"],"term":"Dead position","slug":"dead-position","definition":"A position from which no series of legal moves by either side could ever produce checkmate. The game is over the instant one arises, whoever is to move. Insufficient material is the part of it an arbiter can recognise on sight; the rest has to be proved.","precision":[{"against":"being the same as insufficient material","text":"Insufficient material is a rule about what is on the board. A dead position is a rule about what could happen from it, and a blocked pawn wall neither king can get through can be dead with a great deal of material still on. In practice only the material cases are ever claimed, because the others are hard to demonstrate."},{"against":"needing somebody to claim it","text":"It does not. The laws make the game drawn the moment the position arises, which is the one termination that needs neither a claim nor an agreement - and it is why a flag falling in a position where the opponent could not possibly mate is not a loss."}],"no_board":"The same reason as `insufficient-material`, and measured with it: not one of the 24,208 positions across the five corpora is a draw by insufficient material, which is the only part of a dead position a program can recognise at all. The blocked-wall cases are not computable, so searching harder would not have found one either.","drill":{"mode":"none","why":"impossible","note":"The general case is a search over every continuation, not a property of the men on the board. The subset that is computable, insufficient material, is 0 of the 10,000 drill-corpus positions, so even the easy half of the question has nothing here to ask it about."},"links":["draw","insufficient-material","fortress","stalemate","blockade","closed-position"],"reading":[{"title":"Dead position, in Glossary of chess","url":"https://en.wikipedia.org/wiki/Glossary_of_chess#dead_
