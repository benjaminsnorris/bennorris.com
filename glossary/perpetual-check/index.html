<script type="application/json" id="data">{"tier":3,"group":"pieces-and-rules","kind":"look-up","chips":["sourced"],"term":"Perpetual check","slug":"perpetual-check","definition":"Checking the enemy king over and over with no way for it to escape the checks, so that the game is drawn. It is not a rule of its own: the draw arrives as a threefold repetition, or because both players can see it coming and agree. It is the commonest way a lost position is saved.","precision":[{"against":"being a rule","text":"The modern laws have no rule of that name. What ends the game is the repetition the checks produce, or the agreement they force, and a player who does not claim the repetition may go on being checked indefinitely."},{"against":"any run of checks being perpetual","text":"The checks have to be unstoppable, and whether they are is a calculation rather than a pattern. What makes one perpetual is that no square exists where the checks stop and the checking piece can be neither captured nor blocked - almost always a queen against a king with no pawn shelter left."}],"no_board":"One position cannot show it. Whether a run of checks goes on for ever is a claim about every continuation from here, which is a search rather than a feature of the men on the board - and the corpora store positions. The part a diagram can show, a king with no shelter and a queen loose on the board, is `exposed-king`, and that entry has one.","drill":{"mode":"none","why":"impossible","note":"Whether checks can be repeated for ever needs the tree below the position, which is what an engine is for. No yes/no question about a FEN asks it, and a predicate that guessed from the shape of the position would be asserting rather than measuring."},"links":["draw","threefold-repetition","check","exposed-king","stalemate","sacrifice"],"reading":[{"title":"Perpetual check","url":"https://en.wikipedia.org/wiki/Perpetual_check"}],"boards":[],"links_resolved":[{"label":"Draw","href":"/glossary/draw/"},{"label":"Thr
