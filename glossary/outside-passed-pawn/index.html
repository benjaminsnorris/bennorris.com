<script type="application/json" id="data">{"term":"Outside passed pawn","slug":"outside-passed-pawn","tier":3,"group":"endgame-technique","kind":"look-up","definition":"A passed pawn on the far side of the board from everything else. Its value is not that it promotes but that it has to be watched: the enemy king must go and deal with it, which leaves the other wing to your king.","precision":[{"against":"a passed pawn being strong because it might promote","text":"This one is usually spent rather than promoted. It is a decoy, and the profit is taken somewhere else on the board - which is why a distant pawn can be worth more than a nearer one even when the nearer one is closer to promoting."},{"against":"a protected passed pawn","text":"Different advantages. A protected passed pawn is safe and hard to attack; an outside passed pawn is often neither, and works by being far away. A pawn can be both, which is usually winning."}],"chips":["sourced"],"boards":[{"fen":"8/6p1/1k5p/p3R2P/3r4/K4P2/6P1/8 b - - 10 50","corpus":"drill","ref":"hcbokbko","caption":"Black's pawn on a5 is the only pawn on that half of the board; White's three are on f, g and h. It is the one passed pawn in the position, and its job is to make White keep a king or a rook looking at it while the other five pawns are settled elsewhere.","highlight":["a5","f3","g2","h5"],"render_fen":"8/6p1/1k5p/p3R2P/3r4/K4P2/6P1/8 b - - 10 50","highlight_squares":["a5","f3","g2","h5"]}],"drill":{"mode":"none","why":"unbalanced","note":"The predicate is straightforward - a passed pawn with no enemy pawn within three files - and the rate is 11.7% on the relaxed corpus and 3.6% on the certified one. The corpora are samples of games, not of endgames: the relaxed harvest takes up to four positions from anywhere in a game, so only 390 of its 10,000 positions have seven men or fewer. A rate measured over the whole file reports how often a position is an endgame, not how often the idea holds where it applies."},"links":["pass
