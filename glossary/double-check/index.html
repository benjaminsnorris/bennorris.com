swer would be zero every time. The harvest excluded positions where the side to move is in check, so 0 of 2,100 are; a different corpus is needed, which is what separates this from a term no predicate can settle."},"reading":[{"title":"Double check","url":"https://en.wikipedia.org/wiki/Double_check"}],"links":["discovered-attack","discoverable","exposed-king"],"links_resolved":[{"label":"Discovered attack","href":"/glossary/discovered-attack/"},{"label":"Discoverable","href":"/glossary/discoverable/"},{"label":"Exposed king","href":"/glossary/exposed-king/"}],"home":{"slug":"core","title":"The core vocabulary","framing":"Why this is in the core vocabulary"},"paths":{"core":{"title":"The core vocabulary","n":34,"of":47,"prev":{"slug":"discovered-attack","term":"Discovered attack"},"next":{"slug":"deflection","term":"Deflection"}}}}</script>
