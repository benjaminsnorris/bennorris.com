<script type="application/json" id="data">{"tier":3,"group":"pieces-and-rules","kind":"look-up","chips":["sourced"],"term":"Touch-move","slug":"touch-move","also":["touch-move rule"],"definition":"Touch one of your own men and you must move it; touch an enemy man and you must capture it if you legally can; let go of a piece on a square and the move is made. Over the board it is a rule of the game. Online it cannot be broken, which is why most players meet it for the first time at their first tournament.","precision":[{"against":"the rule being about honesty","text":"It is about ending an argument before it can start. Without it every move would be negotiable up to the moment somebody objected, and the objection would be unanswerable either way. `j-adoube` exists for the same reason: it is the sentence that lets you straighten a piece without triggering the rule, and it has to be said first."},{"against":"applying whatever you touch","text":"If the piece you touched has no legal move, the touch means nothing and you may play anything else. If it has one, you must play one of them, however bad they all are - which is the rule's real cost, and it is paid in whole games."}],"no_board":"Nothing on a board shows it. This is a rule about what a player's hand did, and every corpus here stores positions - the same limit as `threefold-repetition`, arriving from a different direction.","drill":{"mode":"none","why":"impossible","note":"A rule about conduct rather than about a position. No pool here records what a player touched, and no pool could."},"links":["j-adoube","illegal-move","blunder","time-control","draw"],"reading":[{"title":"Touch-move rule","url":"https://en.wikipedia.org/wiki/Touch-move_rule"}],"boards":[],"links_resolved":[{"label":"J'adoube","href":"/glossary/j-adoube/"},{"label":"Illegal move","href":"/glossary/illegal-move/"},{"label":"Blunder","href":"/glossary/blunder/"},{"label":"Time control","href":"/glossary/time-control/"},{"label":"Draw","href":"/gloss
