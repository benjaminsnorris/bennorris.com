<script type="application/json" id="data">{"term":"X-ray","slug":"x-ray","tier":2,"order":307,"kind":"see-it","taught":["board-vision:unit-3"],"defined_also_in":["board-vision:unit-3"],"thread":"One word, two established meanings, both used inside this sequence. Read this one slowly.","definition":"In the courses' sense: the piece behind, in a battery - the one attacking a square through a colleague, which still counts toward the attacker count. In the wider tactical sense: acting through an enemy piece, so that the piece in the way must move or be taken and what stands behind it is the real target.","precision":[{"against":"itself","text":"These are two different ideas wearing one word, and no amount of care makes them the same. Board vision's x-ray is about counting - who attacks this square, including through my own pieces. The motif called an x-ray attack is about a line running through an enemy piece to something behind it, which is the family that also contains the pin and the skewer. This glossary does not pick a winner, because both senses are established and you will meet both."},{"against":"pin and skewer","text":"In the tactical sense, x-ray is the general case and those two are its named children: same line, same idea of acting through a piece, distinguished by which of the two units is the more valuable and which stands in front."}],"chips":["sourced","contested"],"boards":[{"fen":"3r4/pp3k2/2p1bbp1/4Bp1p/3P3P/2P5/PP3PP1/1B2R1K1 w - - 4 30","corpus":"positions","ref":"xw4ccyaw","caption":"The courses' sense. The bishop on e6 attacks g4 through its own pawn on f5, which is why Black's attacker count on g4 is three rather than two.","render_fen":"3r4/pp3k2/2p1bbp1/4Bp1p/3P3P/2P5/PP3PP1/1B2R1K1 w - - 4 30"},{"fen":"r3k3/pb1p3p/1p2p1q1/2pn4/7B/P2P3P/1PPQB1r1/2KR3R w q - 0 21","corpus":"positions","ref":"nkpfh1r3","awkward":true,"caption":"The awkward case, and the reason this entry has two senses. The white queen on d2 stands behind the rook on d1: an x-ray in the counting sense. Whether it is also an x-ray attack depends on what is at the far end of the file, which is a different question about a different thing.","render_fen":"r3k3/pb1p3p/1p2p1q1/2pn4/7B/P2P3P/1PPQB1r1/2KR3R w q - 0 21"}],"drill":{"mode":"none","why":"taught-elsewhere","note":"The courses already drill this, and better than a second drill here would. Board vision is where the seeing gets built; this entry exists so the word can be looked up, not so the skill can be practised twice."},"reading":[{"title":"X-ray (chess)","url":"https://en.wikipedia.org/wiki/X-ray_(chess)"}],"links":["battery","pin","skewer","attacker-count","/courses/board-vision-counting/"],"group":"relations","links_resolved":[{"label":"Battery","href":"/glossary/battery/"},{"label":"Pin","href":"/glossary/pin/"},{"label":"Skewer","href":"/glossary/skewer/"},{"label":"Attacker count","href":"/glossary/attacker-count/"},{"label":"Board vision: counting attackers","href":"/courses/board-vision-counting/"}],"home":{"slug":"core","title":"The core vocabulary","framing":"Why this is in the core vocabulary"},"paths":{"core":{"title":"The core vocabulary","n":29,"of":73,"prev":{"slug":"battery","term":"Battery"},"next":{"slug":"absolute-pin","term":"Absolute pin"}}}}</script>
