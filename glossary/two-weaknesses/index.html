<script type="application/json" id="data">{"tier":3,"group":"positional","kind":"look-up","chips":["sourced"],"term":"Two weaknesses","slug":"two-weaknesses","also":["the principle of two weaknesses"],"definition":"One weakness is usually not enough to win, because the defender can guard a single point for ever. The winning method is to create a second one somewhere else and make the defender travel between them, which is a plan rather than a move.","precision":[{"against":"being an endgame rule","text":"It is where it is most visible and it is not where it stops. A middlegame attack on both wings is the same idea at speed, and so is the standard treatment of an isolated pawn: attack it, watch the defence commit, and open a second front. What the endgame adds is time to do it slowly."},{"against":"needing two big weaknesses","text":"The second one is often trivial on its own - a pawn that has to be watched, a square the king would rather cover. Its whole job is to be somewhere else. A defender who can guard both without moving anything has one weakness, not two."}],"boards":[{"fen":"4r3/1p4k1/p3rpn1/3p3p/3P3p/3N1R1P/PP4PK/5R2 w - - 3 30","corpus":"positions","ref":"e0b80e84","caption":"Black has four isolated pawns and they are in two places: d5 in the middle, blocked and fixed by White's d4, and the doubled h-pawns on h4 and h5 out on the edge. White's rooks are on f3 and f1 and the knight on d3 already holds one of the targets. The defence has to cover both ends of the board with the same pieces.","highlight":["d5","d4","h4","h5","f3","d3"],"render_fen":"4r3/1p4k1/p3rpn1/3p3p/3P3p/3N1R1P/PP4PK/5R2 w - - 3 30","highlight_squares":["d5","d4","h4","h5","f3","d3"]}],"drill":{"mode":"none","why":"impossible","note":"Whether a position has two weaknesses is not a property of the men on the board; it is a claim about whether a defender can cover both, which needs the plan and the moves. Weaknesses themselves are computable one at a time and this glossary drills several of them - `isolated-pawn`, `doubled-pawns`, `backward-pawn` - and none of those is this."},"links":["prophylaxis","isolated-pawn","endgame","minority-attack","initiative","weak-square"],"reading":[{"title":"Principle of two weaknesses, in Glossary of chess","url":"https://en.wikipedia.org/wiki/Glossary_of_chess#principle_of_two_weaknesses"}],"links_resolved":[{"label":"Prophylaxis","href":"/glossary/prophylaxis/"},{"label":"Isolated pawn","href":"/glossary/isolated-pawn/"},{"label":"Endgame","href":"/glossary/endgame/"},{"label":"Minority attack","href":"/glossary/minority-attack/"},{"label":"Initiative","href":"/glossary/initiative/"},{"label":"Weak square","href":"/glossary/weak-square/"}],"home":null}</script>
