<script type="application/json" id="data">{"tier":3,"group":"slang","kind":"look-up","term":"Mouse slip","slug":"mouse-slip","also":["misclick","Fingerfehler"],"chips":["sourced"],"definition":"Releasing a piece on the wrong square online, and having the move stand. The board cannot tell a mistake from an intention, so a legal move made by a slipping hand is simply your move - and the over-the-board version has a German name, *Fingerfehler*, and the same consequence.","precision":[{"against":"it being unfair","text":"It is the same rule as `touch-move` and it exists for the same reason. Over the board, releasing a piece on a square commits you; online, so does releasing the mouse. Both rules are there because the alternative - allowing a player to decide afterwards whether they meant it - is unworkable. The unfairness people feel is real and it is the price of a rule that cannot be gamed."},{"against":"it being a modern problem","text":"*Fingerfehler* is the older word and it names the identical failure: \"an error caused by unthinkingly touching the wrong piece or releasing a piece on the wrong square, forcing the player to move that piece\". What changed with the mouse is the *rate* - a bullet game asks for a hundred precise physical actions in a minute - not the principle."},{"against":"a `takeback` fixing it","text":"Only by agreement, and only in a casual game. In anything rated the move stands, which is why the standard response to a mouse slip is to play on - and why the second-commonest response, resigning in disgust, throws away positions that were still perfectly playable."}],"no_board":"A mouse slip is a fact about how a move was made, not about the move or the position. Two identical games differ only in what one player's hand did, and no FEN records that - the same wall `cheat-detection` runs into from the opposite direction.","boards":[],"drill":{"mode":"none","why":"impossible","note":"Nothing distinguishes a move that was meant from one that was not,
