<script type="application/json" id="data">{"term":"Open file","slug":"open-file","also":["half-open file","semi-open file"],"tier":1,"order":40,"kind":"see-it","taught":["board-vision:unit-2"],"thread":"Included on purpose because it is dull. The bar has to hold for the boring terms or it is not a bar. It also earns its place in tier 1 for a duller reason: both courses talk about files without ever saying what an open one is.","definition":"A file with no pawns on it at all, of either colour. A rook or queen on an open file attacks along its whole length, and getting a rook there is one of the standard reasons to trade pawns.","precision":[{"against":"half-open file","text":"A half-open file has pawns of one colour only. It is open for the side without a pawn there, and is often the more useful thing to own, because the enemy pawn on it is a fixed target that cannot run. Sources agree on the definitions and split on the label - some write semi-open - with no difference in meaning."}],"origin":{"chip":"contested","text":"The chess senses of rank and file are attested early: the OED's first citation for the chess use of ranke is a 1597 English translation of Damiano, and for file a 1614 treatise by Saul. The military phrase ranke and file is first cited in 1598, between the two. It is tempting to conclude the chess use came first and the army borrowed it, but it does not follow: a year's gap in surviving printed records is noise, not sequence. The honest statement is that both senses appear in English within roughly twenty years of each other and the direction of borrowing is not established.","source":"Attestation research: Edward Winter, Earliest Occurrences of Chess Terms"},"chips":["sourced","contested"],"extra":[{"heading":"Why this one gets a real drill","body":"An open file is a fact about pawn placement, so a four-line predicate settles it and the answer key is generated rather than asserted. Most terms in this glossary cannot be treated that way, and say so."
