<script type="application/json" id="data">{"term":"Material","slug":"material","tier":2,"order":700,"group":"judgement","kind":"look-up","taught":[],"thread":"The judgement group starts with the one term in it a machine can actually settle - and with the clearest demonstration of why settling it is not the same as knowing who is winning.","definition":"The pieces you have, counted by their conventional values: a pawn 1, a knight or bishop 3, a rook 5, a queen 9. The king is not counted, because you always have exactly one and losing it ends the game. Being up material means the count favours you.","precision":[{"against":"winning","text":"Material is a count; winning is a judgement. They agree often enough that the count is the first thing to learn and the first thing to check, and they come apart often enough that the count must never be the last word. The second board below is a position where the side ahead by twelve points of material is being mated."},{"against":"the exchange","text":"Up the exchange means holding a rook against a bishop or knight - a specific two-point edge with its own name, because it comes up constantly. It is a statement about material, not a synonym for having traded something."},{"against":"compensation","text":"Compensation is what you claim in return when the count is against you: an attack, better pieces, a safer king. Saying a sacrifice has compensation is saying the count is wrong here, which is a judgement no counting settles."}],"chips":["sourced","inference"],"extra":[{"heading":"Two corpora, two different numbers, and only one of them means anything","body":"The side to move is ahead on material in 27.4% of the 10,000 positions in the drill corpus - real positions from real games at any stage. On the 2,100 certified positions it comes out at 14.6%, but that number is an artefact: the certified harvest required material within one pawn, so there being ahead can only ever mean up a single pawn. This is why the two corpora are kept apart and why every base rate in this glossary says which file it came from. The drill below draws from the drill corpus, and says so."},{"heading":"Thirty-six times the count was flatly wrong","body":"The drill corpus contains 36 positions in which the side being checkmated was ahead on material - once by twelve points. That is not a large share of 10,000, and it is not meant to be: the point is that the count and the result are different kinds of thing, and the count is the one that can be computed."}],"boards":[{"fen":"4rrk1/1p4p1/p6p/2q2p2/4p3/2P4P/PP2QPP1/4R1K1 b - - 0 30","corpus":"drill","ref":"6dz5i5j2","caption":"Black is a rook up - five points - with the same number of pawns. This is what the count looks like when it is straightforward, and it is Black to move.","render_fen":"4rrk1/1p4p1/p6p/2q2p2/4p3/2P4P/PP2QPP1/4R1K1 b - - 0 30"},{"fen":"1B4k1/1p4p1/p6p/8/8/bP6/PqP1QPPP/1K1R3R w - - 1 27","corpus":"drill","ref":"xoanyby7","awkward":true,"caption":"White has a queen, two rooks, a bishop and six pawns against a queen, a bishop and four pawns - ahead by twelve. White is also checkmated. The count is correct and it is telling you nothing at all.","render_fen":"1B4k1/1p4p1/p6p/8/8/bP6/PqP1QPPP/1K1R3R w - - 1 27"}],"drill":{"mode":"computed","predicate":"ahead_on_material","corpus":"drill","question":"Is the side to move ahead on material?","note":"Ten positions, counted the conventional way. Drawn from the drill corpus rather than the certified one, because the certified corpus was filtered to positions within a pawn of level and cannot ask this question.","base_rate_pct":27.4,"base_rate_n":10000,"items":[{"fen":"2k5/pbpr1p2/1p6/4PpQ1/3r4/7P/PP1N4/2R3K1 w - - 0 32","ref":"7l6r1l1m","answer":true,"flip":false},{"fen":"b2qk1r1/4np1p/R3p3/1pN1Pp2/2pP1P2/2P2N2/4Q1PP/6K1 w - - 12 25","ref":"mb9bfr4a","answer":false,"flip":false},{"fen":"rnb1k2r/ppBp1ppp/8/8/2B5/q2P1N2/P2NQbPP/2R4K b kq - 3 14","ref":"n3shtgyi","answer":true,"flip":true},{"fen":"r1b3k1/p4p2/1pp1
