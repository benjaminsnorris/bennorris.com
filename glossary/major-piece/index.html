<script type="application/json" id="data">{"tier":3,"group":"pieces-and-rules","kind":"look-up","chips":["sourced"],"term":"Major piece","slug":"major-piece","also":["heavy piece"],"definition":"A queen or a rook: the pieces that can force checkmate with nothing but their own king to help. That is the whole reason the word exists - a rook and a king mate a lone king, and a bishop and a king cannot.","precision":[{"against":"major meaning more valuable","text":"It means self-sufficient. The line is not drawn at any value: two bishops also mate a lone king and are both still minor pieces, because it takes two of them. One major piece and a king is enough, and that is the mate every beginner learns first."},{"against":"the distinction mattering in the middlegame","text":"It almost never does. Both sides still have at least one major piece in 98.7% of the 2,100 certified positions and 88.0% of the drill corpus, so the word distinguishes nothing there. It earns its keep in two places: describing an imbalance - two rooks against a bishop and a knight - and in the endgame, where having one decides whether you can mate at all."}],"boards":[{"fen":"1k1rr3/ppp3pp/8/8/2PN2Q1/qPNK4/P7/3R4 w - - 0 29","corpus":"positions","ref":"4jyki43w","caption":"Black has three major pieces and no minor ones - a queen on a3 and rooks on d8 and e8. White has two majors and two knights. Material is level, 23 to 24, and the two armies want completely different things: Black wants files, White wants squares.","highlight":["a3","d8","e8","g4","d1"],"render_fen":"1k1rr3/ppp3pp/8/8/2PN2Q1/qPNK4/P7/3R4 w - - 0 29","highlight_squares":["a3","d8","e8","g4","d1"]}],"drill":{"mode":"none","why":"unbalanced","note":"Counting queens and rooks is exact and answers itself: both sides still hold a major piece in 98.7% of the certified corpus and 88.0% of the drill corpus, both far above the 75% ceiling. A term that is true of nearly every position is not a question."},"links":["minor-piece","rook","queen","m
