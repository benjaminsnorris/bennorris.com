<script type="application/json" id="data">{"term":"Combination","slug":"combination","tier":1,"order":90,"kind":"look-up","taught":[],"thread":"The word the whole sequence has been walking towards. Both courses end by telling you the scan has gone quiet and you now have to calculate; neither ever says what calculating is looking for. This is it, and it is the largest hole the two courses leave.","definition":"A forced sequence of moves, usually beginning with a sacrifice, that reaches a specific goal you have seen in advance. Three things separate it from a plain good move: the opponent's replies are forced or near-forced, the goal is concrete rather than positional, and you have to see the whole thing before you start, because the first move is often bad on its own terms.","precision":[{"against":"tactic","text":"Tactic is the general word for short-range forcing play; combination is the specific thing you calculate. The seeds course scans for the twelve features that make a tactic possible. A combination is what you find afterwards, and it is the thing the scan cannot produce."},{"against":"a named shape","text":"Fork and skewer name a shape. Combination names a sequence. A single combination often contains two or three named shapes at once, which is why looking for shapes and looking for combinations are different searches."}],"chips":["inference"],"extra":[{"heading":"Why forcedness is countable","body":"Forced is usually offered as a feeling. It is not: it is the number of legal replies. Counting them is what lets a sequence be calculated to the end before the first piece moves, and it is the only part of this definition a machine can check."},{"heading":"This entry used to have no origin, on purpose","body":"It shipped without one while the rule here was to omit an origin rather than write an unsourced guess, and combination was the entry where that was hardest to accept. Nothing about the rule has changed - a dated attestation from a reputable secondary source satisfies it rather than bending it. The rule was never no origins; it was no invented ones."}],"boards":[{"fen":"2k3r1/1p1q3p/1p2p3/1NbpQr2/P1p2P2/6P1/6KP/R4R2 w - - 1 32","corpus":"puzzles","ref":"00ICz","caption":"Na7+ Kd8 Qb8+ Ke7 Qxg8. After Na7+ Black has exactly one legal move; after Qb8+, two. That is what forced means, stated as a count rather than as a feeling.","render_fen":"2k3r1/1p1q3p/1p2p3/1NbpQr2/P1p2P2/6P1/6KP/R4R2 w - - 1 32"}],"drill":{"mode":"none","why":"impossible","note":"Whether a position contains a combination depends on how deep you look and on what goal you accept, and no predicate settles either. Illustrated, not drilled. Inventing an answer key here is the failure this project has spent real effort avoiding."},"reading":[{"title":"Combination (chess)","url":"https://en.wikipedia.org/wiki/Combination_(chess)"}],"links":["tactic","sacrifice","/courses/chess-seeds/"],"origin":{"chip":"sourced","text":"The word itself is much older than its chess sense: it reaches English from French in the first half of the sixteenth century, and by the 1700s it had already been pressed into service by mathematics, theology, education and chemistry. Chess was late. The Oxford English Dictionary dates the chess sense only to the 1870s - which means players were finding these sequences for centuries before anyone settled on a word for them, and that the word arrived as a borrowing from mathematics rather than as something chess coined for itself.","source":"Oxford English Dictionary, combination, n. - the entry's dating of the chess sense. Secondary source; the 1870s texts have not been consulted directly"},"group":"tactics","links_resolved":[{"label":"Sacrifice","href":"/glossary/sacrifice/"},{"label":"Seeds of tactical destruction","href":"/courses/chess-seeds/"}],"home":{"slug":"start","title":"Course words","framing":"Why this is one of the course words"},"paths":{"start":{"title":"Course words","n":9,"of":9,"prev":{"slug":"back-rank","term":"Back rank
