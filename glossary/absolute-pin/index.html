<script type="application/json" id="data">{"term":"Absolute pin","slug":"absolute-pin","tier":2,"order":308,"kind":"see-it","taught":[],"thread":"The first of a pair the sequence names but never actually teaches - see the note below.","definition":"A piece that cannot legally move at all, because the king is directly behind it on the same line and moving would expose the king. Not a matter of judgement: the moves simply are not legal, and a rules-correct board will refuse them.","precision":[{"against":"relative pin","text":"An absolute pin is enforced by the rules; a relative pin is enforced by arithmetic. The piece in an absolute pin cannot move. The piece in a relative pin can move and usually should not, which makes it a decision rather than a fact."},{"against":"being unable to move usefully","text":"An absolutely pinned piece can still capture along the line it is pinned on, and it still attacks everything it attacked before. It is frozen, not deleted - which matters, because it still counts toward the attacker count."}],"chips":["inference"],"extra":[{"heading":"Neither course teaches this, despite what they say","body":"The tutor contract states that the absolute and relative distinction is taught in board vision rather than deferred, and the seeds course's own glossary said board vision named the two cases. Neither is true of the published pages: board vision uses the word pin four times, all in passing as an aside about legality, and never defines either case. This entry and the next are therefore the first place in the sequence where the distinction is actually made. Flagged rather than quietly filled, because the contract asserts a teaching location that does not exist."}],"boards":[{"fen":"6rk/ppp1Q1pp/3p4/8/2P5/1P4qP/PB6/4RK2 b - - 1 29","corpus":"positions","ref":"pj3e2mxs","caption":"The black pawn on g7 is absolutely pinned: the white bishop on b2 looks down the long diagonal at the black king on h8, and g7 is in the way. That pawn has zero legal moves.","render_fen":"6rk/ppp1Q1pp/3p4/8/2P5/1P4qP/PB6/4RK2 b - - 1 29"}],"drill":{"mode":"none","why":"unbalanced","note":"The predicate is trivial - a rules library answers it directly - but an absolute pin is present in only 20.3% of the 2,100 certified positions, just outside the band this project requires of a yes/no item. Its twin measures 44.7% and does get a drill, which is the more interesting fact: the two cases are far less symmetrical than their names suggest."},"reading":[{"title":"Pin (chess)","url":"https://en.wikipedia.org/wiki/Pin_(chess)"}],"links":["relative-pin","pin","x-ray"],"group":"relations","links_resolved":[{"label":"Relative pin","href":"/glossary/relative-pin/"},{"label":"Pin","href":"/glossary/pin/"},{"label":"X-ray","href":"/glossary/x-ray/"}],"home":{"slug":"core","title":"The core vocabulary","framing":"Why this is in the core vocabulary"},"paths":{"core":{"title":"The core vocabulary","n":16,"of":47,"prev":{"slug":"x-ray","term":"X-ray"},"next":{"slug":"relative-pin","term":"Relative pin"}}}}</script>
