<script type="application/json" id="data">{"term":"Aligned","slug":"aligned","tier":2,"order":401,"kind":"see-it","taught":["seeds:block-1"],"defined_also_in":["seeds:block-1"],"thread":"The second of the three you meet first, and the weakest signal of all twelve. Worth reading immediately after the last one, because they fail in the same way.","definition":"Two of your units on the same rank, file or diagonal with at most one thing between them, while the opponent has a queen, rook or bishop that can travel that line. It is the geometry a pin or a skewer requires, and nothing more than the geometry.","precision":[{"against":"a pin","text":"Alignment is the shape that makes a pin possible; the pin is what happens when someone uses it. Every pin needs alignment, and almost no alignment is a pin. Treating the two as the same thing is the mistake this seed exists to prevent."},{"against":"x-ray","text":"Board vision's x-ray is about your own pieces stacked on a line, counting toward an attack. Alignment is about two of your units on a line an enemy slider can use. Same geometry, opposite ownership."}],"chips":["sourced"],"extra":[{"heading":"The weakest signal of the twelve, measured","body":"Alignment fires for at least one side in 99.0% of the 2,100 certified positions. It is present in 100% of the 55 puzzles tagged pin, 100% of the 25 tagged x-ray and 100% of the 28 tagged smothered mate. A feature present in every tactic and in essentially every quiet position too carries almost no information on its own, which is exactly why the course teaches you to count how many seeds land on one square rather than whether a seed is there at all."}],"boards":[{"fen":"3r4/pp3k2/2p1bbp1/4Bp1p/3P3P/2P5/PP3PP1/1B2R1K1 w - - 4 30","corpus":"positions","ref":"xw4ccyaw","highlight":"auto:seed:aligned","caption":"Two white units on a line a black slider can travel, with at most one thing in between. The shape a pin needs - not a pin.","render_fen":"3r4/pp3k2/2p1bbp1/4Bp1p/3P3P/2P5/PP3P
