<script type="application/json" id="data">{"term":"Knight endgame","slug":"knight-endgame","tier":3,"group":"endgame-technique","kind":"look-up","definition":"An endgame in which the knights are the only pieces left. A knight can reach every square on the board, which sounds like an advantage until you count the moves: it takes three or four to cross to the other wing, so a knight on the wrong side of the board is effectively not on it.","precision":[{"against":"the bishop endgame","text":"The trade-off runs the other way. A knight is not colour-blind, so no pawn is permanently safe from it; but it cannot cover a distant square in one move, so a passed pawn on the far wing is often simply unstoppable. Of these 24 puzzles, 17 have exactly one knight each and nothing else, with a median of eleven men."},{"against":"harmlessness","text":"The knight is the only piece that can mate a king with no other help at all in the right corner arrangement, and it does so here: 4 of the 24 puzzles end in mate and all four mates are delivered by a knight. It is also the piece that most often wins by forking two pawns."}],"chips":["sourced"],"boards":[{"fen":"8/4NP1p/8/6p1/6n1/5k1K/7P/8 b - - 0 51","corpus":"puzzles","ref":"05hfp","caption":"Eight men and the knight mates on its own: Nf2 is checkmate, with the white king on h3 hemmed in by its own pawn on h2 and the black king on f3 covering the rest. This is the shape a knight endgame turns into when a king is driven to the edge.","moves":["g4f2"],"highlight":["f2","h2","h3"],"render_fen":"8/4NP1p/8/6p1/8/5k1K/5n1P/8 w - - 1 52","highlight_squares":["f2","h2","h3"]}],"drill":{"mode":"none","why":"unwritten","note":"The computable content is distance - how many knight moves from here to there - and a predicate for it would be four lines and would have an exact answer key. Nobody has written it. Recorded as debt, like the wrong-coloured bishop."},"links":["endgame","bishop-endgame","fork","passed-pawn","outpost","smothered-mate","knig
