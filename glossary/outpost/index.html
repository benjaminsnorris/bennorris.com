<script type="application/json" id="data">{"term":"Outpost","slug":"outpost","tier":2,"order":604,"group":"pawns","kind":"see-it","taught":[],"thread":"The last of the pawn terms, and the one where the interesting number is the gap between two of them.","definition":"A square in or near the opponent's half that one of your pawns defends and no enemy pawn can ever attack, because they have all advanced past it or been traded. A knight on an outpost is hard to remove and hard to ignore.","precision":[{"against":"a piece on an outpost","text":"The word names the square, not what stands on it. An outpost can sit empty for the whole game, which is what makes the two measurements below so different."},{"against":"a strong square or a hole","text":"Much the same idea from either side of the board. A hole is a square in your own position that your pawns can no longer defend; an outpost is that square seen by the player who gets to occupy it. One player's hole is the other's outpost."}],"chips":["sourced"],"extra":[{"heading":"Two numbers, and the gap between them is the point","body":"An outpost square exists in 73.6% of the drill corpus - they are almost always available. A knight or bishop is actually standing on one in 12.2%. The gap is the whole practical content of the term: the squares are there, and most of the time nobody has taken them. That is also why this entry has no drill. Asking whether an outpost exists is answered by saying yes; asking whether one is occupied is answered by saying no. Both pass this project's base-rate band at one end or fail it at the other, and neither makes a question worth ten items."}],"boards":[{"fen":"r3k2r/1p1bq1p1/2n5/p1bpPpNp/2p2P1P/2P3P1/PP5K/RNB1QR2 w kq - 2 19","corpus":"drill","ref":"0844ezjx","highlight":"auto:pawns:outpost_occupied","caption":"The white knight on g5 is on an outpost: defended by the pawn on h4, and unattackable by any black pawn - the f and h pawns have both gone past it. No black pawn will ever chase it away.","render_fen":"r3k2r/1p1bq1p1/2n5/p1bpPpNp/2p2P1P/2P3P1/PP5K/RNB1QR2 w kq - 2 19","highlight_squares":["g5"]}],"drill":{"mode":"none","why":"unbalanced","note":"Both predicates work and neither makes a good item. An outpost square exists in 73.6% of the drill corpus, so asking is answered by yes; one is occupied in 12.2%, so asking that is answered by no. This is a judgement rather than a refusal by the base-rate gate: the square version passes the band at 73.6% and would still be a weak question."},"reading":[{"title":"Glossary of chess","url":"https://en.wikipedia.org/wiki/Glossary_of_chess"}],"links":["isolated-pawn","pawn-chain","open-file"],"also":["hole","strong square"],"links_resolved":[{"label":"Isolated pawn","href":"/glossary/isolated-pawn/"},{"label":"Pawn chain","href":"/glossary/pawn-chain/"},{"label":"Open file","href":"/glossary/open-file/"}],"home":{"slug":"core","title":"The core vocabulary","framing":"Why this is in the core vocabulary"},"paths":{"core":{"title":"The core vocabulary","n":46,"of":54,"prev":{"slug":"pawn-chain","term":"Pawn chain"},"next":{"slug":"material","term":"Material"}}}}</script>
