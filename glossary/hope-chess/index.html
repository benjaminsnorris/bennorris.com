<script type="application/json" id="data">{"tier":3,"group":"slang","kind":"look-up","term":"Hope chess","slug":"hope-chess","also":["hoping"],"chips":["sourced"],"definition":"Playing a move without working out whether you can meet the opponent's forcing replies - their checks, their captures, their threats. It is a named diagnosis of a specific bad habit rather than a general insult, and it was coined for exactly that purpose: to give beginners something precise to stop doing.","precision":[{"against":"it meaning setting a trap and hoping","text":"That is a `cheapo`, and the two get confused constantly. Hope chess is not about hoping your opponent blunders; it is about not having checked what happens if they do not. You can play hope chess with a perfectly good move - the fault is in the process, not in the move, which is what makes it a habit rather than an error."},{"against":"the cure being to calculate everything","text":"It is much cheaper than that, and this project can price it. Across the 10,000 positions of the relaxed harvest the side to move has a median of **30 legal moves** and only **2** of them are forcing - a check or a capture; **57.4%** of positions offer no check at all, and **74.5%** offer at least one forcing move of some kind. So the discipline is looking at two moves, not thirty. That is the whole of the fix, and it is why the habit is worth naming."},{"against":"it being a beginner's problem only","text":"The category is a beginner's; the failure is not. Every player who has ever said \"I just didn't see it\" about a check has done this, and the frequency falls with strength rather than reaching zero. What changes is that a stronger player's two forcing moves are checked without noticing that they are being checked."}],"origin":{"text":"Coined by the American chess teacher Dan Heisman, in his long-running *Novice Nook* column and the book collected from it, as a name for one specific analysis error: making a move without working out whether you can safely answer any forcing reply. The name is deliberately memorable and the definition is deliberately narrow.","chip":"sourced","source":"Heisman's *Novice Nook* columns and *A Guide to Chess Improvement: The Best of Novice Nook*, as described in secondary discussion; the columns themselves were not consulted. The term has no entry in Wikipedia's chess glossary, which is why this origin names a person and a book rather than a reference work."},"boards":[{"fen":"1k5r/1pp3pp/p4p2/5B2/3r4/7P/2K2P2/4R3 w - - 0 24","corpus":"drill","ref":"0gxs6ryk","caption":"The side to move has 30 legal moves here and exactly 2 of them are forcing: Bxh7, a capture, and Re8+, a check. Those two are the whole of what hope chess skips. Thirty moves is too many to calculate and two is not - which is the argument of the entry, on a position that happens to sit at both medians of the 10,000-position corpus.","highlight":["f5","h7","e1","e8"],"render_fen":"1k5r/1pp3pp/p4p2/5B2/3r4/7P/2K2P2/4R3 w - - 0 24","highlight_squares":["f5","h7","e1","e8"]}],"drill":{"mode":"none","why":"impossible","note":"The fault is in a thought process rather than in a position, so there is nothing to mark. The nearest thing that exists is the courses' scan, which is a drill in looking before moving, and the seeds course is built around it."},"links":["cheapo","blunder","check","capture","scan","combination","patzer","time-trouble"],"reading":[{"title":"Novice Nook","url":"https://chesscafe.com/columns/novice-nook/"}],"links_resolved":[{"label":"Cheapo","href":"/glossary/cheapo/"},{"label":"Blunder","href":"/glossary/blunder/"},{"label":"Check","href":"/glossary/check/"},{"label":"Capture","href":"/glossary/capture/"},{"label":"Scan","href":"/glossary/scan/"},{"label":"Combination","href":"/glossary/combination/"},{"label":"Patzer","href":"/glossary/patzer/"},{"label":"Time trouble","href":"/glossary/time-trouble/"}],"home":null}</script>
