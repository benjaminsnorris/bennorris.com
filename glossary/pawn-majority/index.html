<script type="application/json" id="data">{"term":"Pawn majority","slug":"pawn-majority","tier":3,"group":"positional","kind":"look-up","definition":"More pawns than your opponent on one side of the board. It matters because a majority can usually be turned into a passed pawn by force, and a passed pawn is what wins endgames.","precision":[{"against":"counting pawns","text":"The count is the start of the question rather than the answer. A majority with a doubled pawn in it often cannot produce a passed pawn at all, and three pawns against two is worth much more when the enemy king is on the other wing. What you are really asking is whether the majority can be *mobilised*."},{"against":"the outside passed pawn","text":"The two ideas meet in the endgame: a majority on the wing away from the kings is the usual way an outside passed pawn is made. That is why a queenside majority is worth more than a kingside one in most games - both kings have castled the other way."}],"chips":["sourced"],"boards":[{"fen":"3r1rk1/N5pp/8/2P5/PP6/3p1P2/5P1P/R5K1 b - - 0 26","corpus":"positions","ref":"7uv5pu4b","caption":"White's three queenside pawns on a4, b4 and c5 against Black's one on d3 - and Black's two kingside pawns on g7 and h7 against White's three on f2, f3 and h2, where the doubled f-pawns make that majority much harder to use. Both majorities exist; only one of them is straightforward.","highlight":["a4","b4","c5","d3"],"render_fen":"3r1rk1/N5pp/8/2P5/PP6/3p1P2/5P1P/R5K1 b - - 0 26","highlight_squares":["a4","b4","c5","d3"]}],"drill":{"mode":"none","why":"unbalanced","note":"Both versions fail, in opposite directions. Asking whether anybody has a majority anywhere is 67.1% and close to a tautology - almost any asymmetry produces one. Asking whether the side to move has a queenside majority is 23.2%, under the floor. The question that would be worth asking - can the majority be mobilised - is not computable. Measured over `positions.json`: 2,100 engine-checked positions, mat
