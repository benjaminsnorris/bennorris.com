<script type="application/json" id="data">{"tier":3,"group":"pieces-and-rules","kind":"look-up","chips":["sourced"],"term":"Queen","slug":"queen","definition":"The strongest piece: a rook and a bishop at once, moving any distance along a rank, a file or a diagonal. Worth about nine pawns, which is more than a rook and a minor piece together, so losing one for nothing usually ends the game at any level.","precision":[{"against":"bringing her out early","text":"The opening corpus is a census of 7,905 positions from plies two to six, and both queens are still on d1 and d8 in 86.5% of them. What punishes an early queen is not the move itself but what follows it: every developing move the opponent makes comes with a threat attached, so the tempi you gain are handed straight back."},{"against":"the queen deciding the game","text":"27.4% of the 2,100 certified middlegame positions have no queen on the board at all. Queens come off early and often, and what is left is where most club games are actually decided - which is the argument for learning endings."},{"against":"nine points being the whole story","text":"The number is an average over positions where she has somewhere to go. A queen with no open line is worth less than the rook and bishop she is made of, and a queen is the easiest piece in the game to harass: anything the opponent attacks her with is worth less than she is, so she must always move first."}],"boards":[{"fen":"2k5/3r1pb1/RP1p3p/6p1/4q3/7Q/5PPP/2B2K2 b - - 0 27","corpus":"positions","ref":"fhoz8ht2","caption":"Material is dead level, 21 points each. Black's queen on e4 has 26 legal moves; the whole rest of the black army - bishop, rook, king and four pawns - has 16 between them. One piece with more of the position than everything else put together is what nine points buys.","highlight":["e4"],"render_fen":"2k5/3r1pb1/RP1p3p/6p1/4q3/7Q/5PPP/2B2K2 b - - 0 27","highlight_squares":["e4"]}],"drill":{"mode":"none","why":"unbalanced","note":"Whether the side to
