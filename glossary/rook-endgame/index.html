<script type="application/json" id="data">{"term":"Rook endgame","slug":"rook-endgame","tier":3,"group":"endgame-technique","kind":"look-up","definition":"An endgame in which the rooks are the last pieces standing. It is much the commonest ending in practice, and its reputation for drawishness is earned: a rook defends so well from a distance that an extra pawn is often not enough.","precision":[{"against":"the rooks being incidental","text":"In 18 of the 24 puzzles here each side has exactly one rook and there is nothing else on the board, and the median position has ten men. This is a real category rather than a tag: rook endgames are what most games become if nobody wins first."},{"against":"quiet play","text":"The exposed kings make these sharper than they look. Of the 24 solutions, 18 open with a check, and 8 of the 24 end in mate, which is not what you would guess from the drawish reputation. The reputation is about correctly played rook endgames; these are club games."}],"chips":["sourced"],"boards":[{"fen":"8/5k2/1p4p1/1R1K2P1/r6P/8/8/8 b - - 12 58","corpus":"puzzles","ref":"02CNX","caption":"Rook endgames are usually decided by turning them into something else. Ra5 offers the trade, Rxa5 accepts, and bxa5 leaves a pawn endgame with kings and three pawns - six men, and a result that can now be counted out rather than played. Liquidation is the technique, not an accident.","moves":["a4a5","b5a5","b6a5"],"highlight":["a4","b5","b6"],"render_fen":"8/5k2/6p1/p2K2P1/7P/8/8/8 w - - 0 60","highlight_squares":["a4","b5","b6"]}],"drill":{"mode":"none","why":"taught-elsewhere","note":"As with the pawn endgame, the drillable content sits in the named methods - the Lucena and Philidor positions, cutting the king off, the active rook - and each of those is its own entry."},"links":["endgame","pawn-endgame","open-file","passed-pawn","lucena","philidor-position","seventh-rank","rook"],"reading":[{"title":"Rook and pawn versus rook endgame","url":"https://en.wikipedia.org/w
