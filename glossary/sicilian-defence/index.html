<script type="application/json" id="data">{"term":"Sicilian Defence","slug":"sicilian-defence","tier":3,"group":"openings","kind":"look-up","also":["Sicilian","Sicilian Defense"],"definition":"1.e4 c5. The commonest answer to 1.e4 and the least symmetrical: Black fights for d4 with a flank pawn instead of a centre pawn, so the two sides end up wanting different things from the start.","precision":[{"against":"being about the centre only","text":"The asymmetry is the point. After 1...e5 both sides have the same structure and mostly the same plans; after 1...c5 Black has a queenside pawn majority and White a kingside one, so each side attacks where they are stronger and the game becomes a race. That is why it produces decisive results more often than the symmetrical defences - and why it is hard work."},{"against":"being for strong players","text":"It is the most played and most analysed defence in chess, which cuts both ways: the theory is enormous, and the practical positions are so sharp that knowing what you are doing matters more than knowing what has been published. The usual advice for a beginner - play 1...e5 first - is about workload rather than soundness."}],"origin":{"chip":"sourced","text":"Analysed by Giulio Polerio in a manuscript of 1594, though he did not call it that, and then by Salvio in 1604, Carrera around 1617, Greco in 1623 and Cozio around 1740. Philidor dismissed it in 1777 as \u201cabsolutely defensive, and very far from being the best\u201d, which is a fair summary of the next century and a half of opinion and the exact opposite of the modern view.","source":"Wikipedia, Sicilian Defence. Secondary; Polerio and Philidor not consulted."},"chips":["sourced"],"boards":[{"fen":"rnbqkbnr/pp1ppppp/8/2p5/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2","corpus":"opening","ref":"uc2ntk5u","caption":"1.e4 c5, and that is the whole opening - two moves. Black contests d4 without putting a pawn in the centre, and the position is already asymmetrical: White's pawn is on e4 and Black's on c5, so neither side can copy the other from here on. Lichess codes the game B43. Lichess classifies the game itself, so the code is the database's and not this glossary's. Note what it names: the *game's* whole opening, decided by moves played after the position shown.","highlight":["c5","d4","e4"],"render_fen":"rnbqkbnr/pp1ppppp/8/2p5/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2","highlight_squares":["c5","d4","e4"]}],"drill":{"mode":"none","why":"impossible","note":"A named opening is a move order, and a position cannot say how it was reached - which is why this board is drawn from the one corpus here that stores the moves alongside the position."},"links":["french-defence","caro-kann","open-game","pawn-majority","kingside-attack","queenside-attack","theory"],"reading":[{"title":"Sicilian Defence","url":"https://en.wikipedia.org/wiki/Sicilian_Defence"}],"links_resolved":[{"label":"French Defence","href":"/glossary/french-defence/"},{"label":"Caro-Kann Defence","href":"/glossary/caro-kann/"},{"label":"Open game","href":"/glossary/open-game/"},{"label":"Pawn majority","href":"/glossary/pawn-majority/"},{"label":"Kingside attack","href":"/glossary/kingside-attack/"},{"label":"Queenside attack","href":"/glossary/queenside-attack/"},{"label":"Theory","href":"/glossary/theory/"}],"home":null}</script>
