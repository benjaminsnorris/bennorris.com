<script type="application/json" id="data">{"term":"Underguarded","slug":"underguarded","tier":2,"order":305,"kind":"see-it","taught":["board-vision:unit-3","seeds:block-2"],"defined_also_in":["board-vision:unit-3"],"thread":"The arithmetic's verdict, and one of the twelve seeds - the only word in this group that is both.","definition":"Attacked more times than it is defended. The attacker count on one side is higher than on the other, so the exchanges on that square end in the attacker's favour and something can be won there.","precision":[{"against":"hanging","text":"Hanging means no defenders at all. Underguarded means fewer defenders than attackers, which includes hanging as the case where the defenders are zero. Underguarded is the general statement; hanging is its loudest instance."},{"against":"winning material","text":"Underguarded is arithmetic, not a promise. The counts can favour you and the sequence still fail, because the order matters and because a defender may be doing something else. The count tells you where to look, not what happens."}],"chips":["sourced"],"boards":[{"fen":"r4rk1/p4pp1/1pq1p2p/2p3bP/2P3P1/3PPN2/PP1QR3/2K1R3 b - - 4 23","corpus":"positions","ref":"2a5wx1e2","caption":"The white knight on f3 is attacked once and defended not at all: one against zero, the simplest underguarded square there is.","render_fen":"r4rk1/p4pp1/1pq1p2p/2p3bP/2P3P1/3PPN2/PP1QR3/2K1R3 b - - 4 23"}],"drill":{"mode":"none","why":"taught-elsewhere","note":"The courses already drill this, and better than a second drill here would. Board vision is where the seeing gets built; this entry exists so the word can be looked up, not so the skill can be practised twice."},"reading":[{"title":"Glossary of chess","url":"https://en.wikipedia.org/wiki/Glossary_of_chess"}],"links":["attacker-count","hanging","overworked-defender","/courses/board-vision-counting/"],"group":"relations","links_resolved":[{"label":"Attacker count","href":"/glossary/attacker-count/"},{"label":"Hangin
