<script type="application/json" id="data">{"term":"Arabian mate","slug":"arabian-mate","tier":3,"group":"mating-patterns","kind":"look-up","definition":"A rook and a knight mating a king in the corner. The rook stands next to the king and delivers the check; the knight, two squares away diagonally, both covers the one flight square and defends the rook, so the king cannot take it.","precision":[{"against":"Anastasia's mate","text":"The same two pieces and a different cage. Here the king is in a corner in 24 of 24 of the puzzles, and the rook is adjacent to it; in Anastasia's the king is against the side of the board with a friendly piece beside it and the rook comes from a distance. The Arabian is also the purer of the two to measure: the mate is delivered by a rook in 24 of 24, with no queen substitutions."},{"against":"the description in the reference books","text":"Unusually, it survives contact with the evidence exactly. The standard account - rook adjacent to the king, knight two squares away diagonally, covering the flight square and protecting the rook - holds in all 24 puzzles: the king is in a corner 24 of 24, and a knight is within two squares of it 24 of 24."}],"origin":{"chip":"sourced","text":"The oldest named mate here by a wide margin. It appears in an Arabic manuscript of the 8th century CE, and it comes from shatranj rather than from chess - a game whose queen and bishop moved barely at all, which is why a rook-and-knight mate was worth naming and a queen mate was not.","source":"Wikipedia, Checkmate pattern. Secondary; the manuscript not consulted."},"chips":["sourced"],"boards":[{"fen":"1k6/6R1/1P5p/5B2/5P2/5nP1/1r6/7K b - - 2 46","corpus":"puzzles","ref":"0Gjvb","caption":"Rh2 mates, and the knight never moves. The rook checks from h2, right beside the king; the knight on f3 defends that rook and covers g1, which is the only square the king could otherwise use. Ten pieces on the board and no way out.","moves":["b2h2"],"highlight":["f3","g1","h1",
