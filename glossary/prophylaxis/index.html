<script type="application/json" id="data">{"term":"Prophylaxis","slug":"prophylaxis","tier":2,"order":706,"group":"judgement","kind":"look-up","taught":[],"thread":"The hardest term here to illustrate, for a reason worth stating out loud.","definition":"Playing to stop what your opponent wants to do, rather than to advance your own plan. A prophylactic move often looks like nothing - a pawn nudged, a king tucked away - and its whole value is in the game that now cannot happen.","precision":[{"against":"defence","text":"Defence answers a threat that exists. Prophylaxis removes a threat before it arrives, and often before the opponent has thought of it. The distinction is timing, and it is the reason prophylaxis is hard to spot in someone else's game: nothing was happening, and then nothing continued to happen."},{"against":"waiting","text":"A waiting move passes the turn without changing anything. A prophylactic move changes something specific - it just changes it in the opponent's plans rather than in your own."}],"chips":["sourced","inference"],"extra":[{"heading":"Why no board can really show this","body":"Every other entry here illustrates a term with a position. This one cannot, in principle: a prophylactic move is defined by the game that did not happen afterwards, and a static board shows only what is there. The board below is the closest available - a position with one concrete threat in it, computed rather than asserted - and the prophylactic move is the one that stops it, which is not on the board."},{"heading":"The threat, computed","body":"If it were Black's move, Bxe5 would take a bishop for nothing: after the capture, no white piece attacks e5. It is White's move, so the threat can be prevented - by defending e5, moving the bishop, or creating a bigger threat elsewhere. Choosing which is judgement; noticing that there is something to prevent is the habit the word names."}],"boards":[{"fen":"3r4/pp3k2/2p1bbp1/4Bp1p/3P3P/2P5/PP3PP1/1B2R1K1 w - - 4 30","corpus":"positions","ref":"tg34i2ha","caption":"White to move. Black is not threatening anything yet in the ordinary sense - but if Black had the move, Bxe5 would win a bishop for nothing. The prophylactic move is whichever one makes that permanently unavailable.","render_fen":"3r4/pp3k2/2p1bbp1/4Bp1p/3P3P/2P5/PP3PP1/1B2R1K1 w - - 4 30"}],"drill":{"mode":"none","why":"impossible","note":"Prophylaxis is a property of a move and of the plan it prevents, and the plan never happened. There is nothing in a position for a predicate to read."},"reading":[{"title":"Prophylaxis (chess)","url":"https://en.wikipedia.org/wiki/Prophylaxis_(chess)"}],"links":["initiative","weak-square","defends","exposed-king","pawn-break"],"links_resolved":[{"label":"Initiative","href":"/glossary/initiative/"},{"label":"Weak square","href":"/glossary/weak-square/"},{"label":"Defends","href":"/glossary/defends/"},{"label":"Exposed king","href":"/glossary/exposed-king/"},{"label":"Pawn break","href":"/glossary/pawn-break/"}],"home":{"slug":"core","title":"The core vocabulary","framing":"Why this is in the core vocabulary"},"paths":{"core":{"title":"The core vocabulary","n":68,"of":73,"prev":{"slug":"weak-square","term":"Weak square"},"next":{"slug":"zugzwang","term":"Zugzwang"}}}}</script>
