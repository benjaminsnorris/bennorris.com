<script type="application/json" id="data">{"tier":3,"group":"online","kind":"look-up","term":"Premove","slug":"premove","also":["pre-move"],"chips":["sourced"],"definition":"Entering your next move before your opponent has made theirs. The board holds it and plays it the instant their move arrives, so it costs you almost none of your clock. It is what makes the fastest time controls playable at all, and it is how a great many of those games are lost.","precision":[{"against":"a premove being safe whenever the reply looks forced","text":"It is only certainly safe when there is exactly one legal move, and that is rare. **110 of the 10,000 positions** in the relaxed harvest have a single legal move, 1.1%, and 16 of those are a capture like the board below; in the endgame corpus it is **58 of 3,435**, 1.7%. Everywhere else \"forced\" means forced as far as you looked, and the premove commits you to your reading of the position before you have seen the move you are replying to."},{"against":"the premove being your move","text":"It is a move you chose for a position you had not seen yet. If the opponent plays what you expected it is your move; if they play something else, the board plays it anyway when it is still legal - which is how a premove recaptures a piece that is no longer there to recapture, or steps a king into a square that has just been covered. Where it is not legal it is simply discarded, which is the merciful case."},{"against":"the certified corpus showing you one","text":"It cannot: **0 of its 2,100 positions** have a single legal move, by construction rather than by chance. The harvest required that the side to move not be in check, and a position with one legal move nearly always is one. A rate measured on a filtered attribute measures the filter, so the counts above name the two corpora that were not filtered that way."}],"boards":[{"fen":"2r2rk1/1p2ppb1/p2p2p1/3P3p/3pPP2/1P1P2P1/P2B2qP/2R2RK1 w - - 0 20","corpus":"drill","ref":"t572y57q","caption":"White to move, 25 men on the board, and exactly 1 legal move: Kxg2. The black queen has arrived on g2 beside the king, so nothing can interpose and nothing else can take her. This is the only kind of position in which a premove cannot be wrong - and it is 110 of the 10,000 in this corpus, of which 16 are a capture like this one.","highlight":["g1","g2"],"render_fen":"2r2rk1/1p2ppb1/p2p2p1/3P3p/3pPP2/1P1P2P1/P2B2qP/2R2RK1 w - - 0 20","highlight_squares":["g1","g2"]}],"drill":{"mode":"none","why":"unbalanced","note":"Whether a position has exactly one legal move is exactly computable and far too rare to drill: 1.1% of the drill corpus and 1.7% of the endgame corpus, both a long way under the 25% floor. And a premove is a decision about a clock, which no position records."},"links":["time-control","increment","check","recapture","capture","blunder","engine","j-adoube"],"reading":[{"title":"Glossary of chess: premove","url":"https://en.wikipedia.org/wiki/Glossary_of_chess#premove"}],"links_resolved":[{"label":"Time control","href":"/glossary/time-control/"},{"label":"Increment","href":"/glossary/increment/"},{"label":"Check","href":"/glossary/check/"},{"label":"Recapture","href":"/glossary/recapture/"},{"label":"Capture","href":"/glossary/capture/"},{"label":"Blunder","href":"/glossary/blunder/"},{"label":"Engine","href":"/glossary/engine/"},{"label":"J'adoube","href":"/glossary/j-adoube/"}],"home":null}</script>
