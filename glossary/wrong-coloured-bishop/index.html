<script type="application/json" id="data">{"term":"Wrong-coloured bishop","slug":"wrong-coloured-bishop","tier":3,"group":"endgame-technique","kind":"look-up","also":["wrong bishop","wrong rook pawn"],"definition":"A bishop that cannot control the square its own pawn is promoting on, because that square is the other colour. With a rook pawn and nothing else it turns a piece and a pawn up into a dead draw: the defending king sits in the corner and nothing can shift it.","precision":[{"against":"a bad bishop","text":"Different terms entirely, and easily confused. A bad bishop is blocked in by its own pawns and can improve if they move. A wrong-coloured bishop is a statement about the colour of one square, and no manoeuvre, plan or number of moves changes it."},{"against":"being about the bishop","text":"It is about the pawn. The same bishop is right or wrong depending on which file the surviving pawn is on, which is why the term is often heard as the wrong rook pawn instead - and why trading into an ending with the wrong pair is a specific thing to check before you do it."}],"chips":["sourced"],"boards":[{"fen":"8/6K1/4B2P/8/1k6/p7/8/3q4 b - - 0 53","corpus":"drill","ref":"dzbb6vax","caption":"White's bishop on e6 runs on light squares. The h-pawn promotes on h8, which is dark. No manoeuvre changes that, and that sentence is the whole term. This position is settled by Black's queen long before the h-pawn matters - it is here because the colour geometry is exactly what it should be, not because it is a clean example of the draw.","highlight":["e6","h6","h8"],"awkward":true,"render_fen":"8/6K1/4B2P/8/1k6/p7/8/3q4 b - - 0 53","highlight_squares":["e6","h6","h8"]}],"drill":{"mode":"none","why":"unbalanced","note":"The colour arithmetic is two lines and exact; positions where it decides anything are almost absent. Searching the relaxed corpus for a bishop with a rook pawn of the wrong colour and at most six men on the board returns two positions out of 10,000, and neither
