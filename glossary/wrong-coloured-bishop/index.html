<script type="application/json" id="data">{"term":"Wrong-coloured bishop","slug":"wrong-coloured-bishop","tier":3,"group":"endgame-technique","kind":"look-up","also":["wrong bishop","wrong rook pawn"],"definition":"A bishop that cannot control the square its own pawn is promoting on, because that square is the other colour. With a rook pawn and nothing else it turns a piece and a pawn up into a dead draw: the defending king sits in the corner and nothing can shift it.","precision":[{"against":"a bad bishop","text":"Different terms entirely, and easily confused. A bad bishop is blocked in by its own pawns and can improve if they move. A wrong-coloured bishop is a statement about the colour of one square, and no manoeuvre, plan or number of moves changes it."},{"against":"being about the bishop","text":"It is about the pawn. The same bishop is right or wrong depending on which file the surviving pawn is on, which is why the term is often heard as the wrong rook pawn instead - and why trading into an ending with the wrong pair is a specific thing to check before you do it."}],"chips":["sourced"],"boards":[{"fen":"8/8/8/4b3/8/5k2/7p/7K w - - 2 94","corpus":"drill","ref":"tta6v112","caption":"Four men and a dead draw. Black has a bishop and a rook pawn, and the bishop on e5 runs on dark squares while the pawn promotes on h1, which is light. White's king sits in the corner it can never be driven out of. No manoeuvre changes the colour of a square, and that sentence is the whole term.","highlight":["e5","h1","h2"],"awkward":true,"render_fen":"8/8/8/4b3/8/5k2/7p/7K w - - 2 94","highlight_squares":["e5","h1","h2"]}],"drill":{"mode":"none","why":"unbalanced","note":"The colour arithmetic is two lines and exact; positions where it decides anything are almost absent. Searching the relaxed corpus for a bishop with a rook pawn of the wrong colour and at most six men on the board returns eight positions out of 10,000, and the board above is the cleanest of them. The corpora are samples of games, not of endgames: the relaxed harvest takes up to four positions from anywhere in a game, so only 447 of its 10,000 positions have seven men or fewer. A rate measured over the whole file reports how often a position is an endgame, not how often the idea holds where it applies."},"links":["bishop-endgame","diagonal","queening","promotion","fortress","good-and-bad-bishop","stalemate"],"reading":[{"title":"Wrong bishop","url":"https://en.wikipedia.org/wiki/Wrong_bishop"}],"links_resolved":[{"label":"Bishop endgame","href":"/glossary/bishop-endgame/"},{"label":"Diagonal","href":"/glossary/diagonal/"},{"label":"Queening","href":"/glossary/queening/"},{"label":"Promotion","href":"/glossary/promotion/"},{"label":"Fortress","href":"/glossary/fortress/"},{"label":"Good and bad bishop","href":"/glossary/good-and-bad-bishop/"},{"label":"Stalemate","href":"/glossary/stalemate/"}],"home":null}</script>
