<script type="application/json" id="data">{"tier":3,"group":"tactical-method","kind":"look-up","chips":["sourced"],"term":"Desperado","slug":"desperado","definition":"A piece that is going to be lost anyway, sold for whatever it can take on the way out. The point is that its value is already spent, so anything it captures is free - and the same logic applies to both sides at once when two pieces are hanging.","precision":[{"against":"being a sacrifice","text":"Nothing is being given up. A sacrifice pays material for something you judge to be worth more; a desperado spends material that has already gone. Working out that a piece is lost is the whole of the skill, and it is the step beginners skip - they move the doomed piece to safety it does not have."},{"against":"being rare","text":"A piece of the side to move is attacked, undefended, and able to capture something in 11.0% of the 2,100 certified positions. What is rare is noticing in time: the natural reaction to seeing your piece attacked is to move it, and by the time you have, the free capture has usually gone."}],"boards":[{"fen":"4r3/pp1R3p/5b1k/q1p1pbp1/2B5/1P3Q1N/P4PPP/K7 w - - 2 31","corpus":"positions","ref":"3buzcmkl","caption":"White's rook on d7 is attacked and defended by nothing, so it is already lost. It can go quietly, or it can take on b7 or take on h7 with check first. The whole idea is in the arithmetic: the rook is spent either way, so anything it collects on the way out is profit.","highlight":["d7","b7","h7"],"render_fen":"4r3/pp1R3p/5b1k/q1p1pbp1/2B5/1P3Q1N/P4PPP/K7 w - - 2 31","highlight_squares":["d7","b7","h7"]}],"drill":{"mode":"none","why":"unbalanced","note":"The recognisable half is computable - a hanging piece of the side to move that has a capture available - and it comes out at 11.0% of the certified corpus and 8.4% of the drill corpus, both well under the floor. The half that matters, whether the piece really is unsaveable, is a calculation. Measured over `positions.json`: 2,100 e
