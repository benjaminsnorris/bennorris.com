<script type="application/json" id="data">{"tier":3,"group":"tournament","kind":"look-up","term":"Flag","slug":"flag","also":["flag fall","flagging","losing on time","running out of time"],"chips":["sourced"],"definition":"Running out of time, and the word for it. Mechanical clocks had a small flag that the minute hand lifted and dropped at the hour, so \"the flag fell\" meant your time was gone - the clocks are digital now and the word stayed. Your flag falling normally loses the game whatever the position, and there is one exception that is worth knowing.","precision":[{"against":"the flag always losing","text":"The exception is positional, and it is the one rule in this group that a board can show. The Laws: \"if a player correctly claims flag-fall, that player wins. But if the claiming player is out of time, or could not still theoretically checkmate the opponent, the game is a draw.\" So a bare king cannot win on time no matter how long you take - and this is not a curiosity. In **990 of the 3,435 endgame-corpus positions** one of the two sides could not deliver mate by any legal sequence at all; in the relaxed harvest it is **246 of 10,000**, and in the certified corpus **0 of 2,100**, which is the \u226512-piece filter rather than a fact about chess."},{"against":"the clock enforcing itself over the board","text":"It does not: flag-fall is a *claim*, like a repetition. Over the board a fallen flag that nobody notices is a game that carries on, and the arbiter rules when somebody stops the clock and says so. Online is the opposite - the server calls it the instant it happens - which is why `premove` and time scrambles are a different sport from the ones with wooden clocks."},{"against":"flagging being cheating","text":"It is playing the game that was agreed. If you sat down to five minutes each, the five minutes are part of the position - and deliberately playing on in a lost position to win on time is legal, common, and the reason increments were invented. `i
