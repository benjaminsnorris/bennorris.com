<script type="application/json" id="data">{"tier":3,"group":"positional","kind":"look-up","chips":["sourced"],"term":"Simplification","slug":"simplification","also":["trading down","simplifying"],"definition":"Trading pieces to make the position smaller, usually because you are ahead. Every trade takes the same amount off both sides, so the same lead is worth more with less left on the board - a pawn up in a four-piece endgame is winning where a pawn up in the middlegame is barely anything.","precision":[{"against":"trade when you are ahead being the whole rule","text":"The rule is trade *pieces* when ahead in material, and trade *pawns* when ahead in pieces. They point opposite ways for a reason: pieces coming off magnifies a material lead, and pawns coming off can leave a lead that cannot mate - which is what `insufficient-material` and the wrong-coloured bishop are about."},{"against":"simplification being safe","text":"It is the commonest way a winning position becomes a drawn one. Every trade is a decision about the position that comes after it, and a defender's best practical chance is very often to offer trades that reach an ending the extra material cannot win."}],"no_board":"A single position cannot show a trade. Simplification is a comparison between a position and the one three moves later, and every corpus here holds positions rather than pairs of them - the same limit `trade` and `recapture` describe from the other end, and the reason both of those are illustrated by the capture that is available rather than by the exchange itself.","drill":{"mode":"none","why":"impossible","note":"Whether trading is right here needs the position after the trade, so it is a comparison rather than a property, and no pool in this project stores pairs of positions. The nearest computable questions are drilled elsewhere: `trade` asks whether an even capture is on offer, at 35.0% of the certified corpus, and `material` asks who is ahead."},"links":["trade","material","endgam
