<script type="application/json" id="data">{"term":"Fianchetto","slug":"fianchetto","tier":3,"group":"openings","kind":"look-up","definition":"Developing a bishop to b2, g2, b7 or g7 - the square the knight pawn vacates - so that it looks down the long diagonal across the whole board. Two moves rather than one, and the bishop ends up defending its own king as well as pointing at the far corner.","precision":[{"against":"the long diagonal being open","text":"It usually is not, and the board below is the ordinary case rather than a bad one: two fianchettoed bishops, one seeing five squares and the other four, both looking at their own pawns. A fianchetto is where the bishop sits, not what it has achieved; the diagonal is a plan that the middlegame either opens or does not."},{"against":"being free","text":"Moving the knight pawn leaves a hole beside the king that the pawn can never cover again, which is why trading off a fianchettoed bishop is a standard way to attack that king - the pawn cannot come back and no other pawn covers the square. The bishop is the roof."},{"against":"being a modern idea","text":"It is the signature of hypermodernism, the 1920s school that argued you could attack the centre from a distance rather than occupy it, and it turns up constantly in the Indian defences for that reason. It is correspondingly rare in the open games - 1.e4 e5 - where the centre is contested directly and immediately."}],"origin":{"chip":"sourced","text":"Italian, and a diminutive: fianco is a flank, so a fianchetto is a little flank. The word describes the move rather than the bishop, which is why it is a verb as often as a noun - you fianchetto a bishop.","source":"Wikipedia, Fianchetto. Secondary."},"chips":["sourced"],"boards":[{"fen":"rn1q1rk1/2pbbppp/1p2pn2/p1Pp4/1P1P4/P4NP1/1B2PPBP/RN1QK2R b KQ - 1 9","corpus":"positions","ref":"olifnuob","caption":"A double fianchetto, with all thirty-two men still on the board at move nine: White's bishops on b2 and g2, behind pawns pushed to b4 and g3. Neither diagonal is doing anything yet - the b2 bishop reaches five squares and the g2 bishop four, each blocked by White's own men - which is what the formation looks like before the position opens.","highlight":["b2","b4","g2","g3"],"render_fen":"rn1q1rk1/2pbbppp/1p2pn2/p1Pp4/1P1P4/P4NP1/1B2PPBP/RN1QK2R b KQ - 1 9","highlight_squares":["b2","b4","g2","g3"]}],"drill":{"mode":"none","why":"unbalanced","note":"Exactly computable - a bishop on b2, g2, b7 or g7 with its own knight pawn one or two squares up - and too rare: 19.6% of the certified corpus has one for either side, 11.0% for the side to move, both under the 25% floor."},"links":["diagonal","development","good-and-bad-bishop","king-safety","weak-square","open-game","castling"],"reading":[{"title":"Fianchetto","url":"https://en.wikipedia.org/wiki/Fianchetto"}],"links_resolved":[{"label":"Diagonal","href":"/glossary/diagonal/"},{"label":"Development","href":"/glossary/development/"},{"label":"Good and bad bishop","href":"/glossary/good-and-bad-bishop/"},{"label":"King safety","href":"/glossary/king-safety/"},{"label":"Weak square","href":"/glossary/weak-square/"},{"label":"Open game","href":"/glossary/open-game/"},{"label":"Castling","href":"/glossary/castling/"}],"home":null}</script>
