<script type="application/json" id="data">{"term":"Repertoire","slug":"repertoire","tier":3,"group":"openings","kind":"look-up","definition":"The set of openings you have decided to play, as White and against each of Black's replies. It is a set of decisions rather than a body of knowledge, and most of the decisions are about what you are *not* going to play.","precision":[{"against":"knowing a lot of openings","text":"A repertoire is narrow on purpose. Its value is that the same structures keep appearing, so the middlegames become familiar and the plans transfer from game to game - which is the opposite of knowing a little about many openings. Two replies to everything, understood, beats twenty memorised."},{"against":"being the thing to work on","text":"For a beginner it is very nearly the last thing. Games at this level are decided by what happens after the opening, so a repertoire is worth having mainly so that you stop spending thought on move three and start spending it on move fifteen. It is a way of saving effort, not of gaining an advantage."}],"chips":["sourced"],"boards":[],"no_board":"A repertoire is a set of choices spread across every opening you might meet. There is no position that is a repertoire.","drill":{"mode":"none","why":"impossible","note":"A fact about a player rather than about a position."},"links":["main-line","sideline","variation","theory","opening-book","transposition"],"reading":[{"title":"Glossary of chess","url":"https://en.wikipedia.org/wiki/Glossary_of_chess"}],"links_resolved":[{"label":"Main line","href":"/glossary/main-line/"},{"label":"Sideline","href":"/glossary/sideline/"},{"label":"Variation","href":"/glossary/variation/"},{"label":"Theory","href":"/glossary/theory/"},{"label":"Opening book","href":"/glossary/opening-book/"},{"label":"Transposition","href":"/glossary/transposition/"}],"home":null}</script>
