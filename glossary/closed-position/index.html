<script type="application/json" id="data">{"term":"Closed position","slug":"closed-position","tier":3,"group":"positional","kind":"look-up","also":["open position","semi-open position","blocked position"],"definition":"A position whose pawns are locked head to head, so there are no open files or long diagonals and nothing can be attacked directly. An open position is the opposite: pawns traded off, lines everywhere, and tactics available every move. Most games are somewhere between.","precision":[{"against":"closed meaning quiet","text":"It means slow, not safe. With no lines to work along the plans get long - manoeuvre a knight to a square that will matter in ten moves, prepare a pawn break for twenty - and the game is decided by whether the break comes off. A closed position that opens suddenly is the sharpest thing in chess."},{"against":"knights beating bishops","text":"The usual shorthand, and worth keeping because it is mostly right: a knight jumps over the pawn wall and a bishop has to go round it. What makes it shorthand is that the wall can move. The side whose pawns are blocking their own bishop is usually the side that wants the break."},{"against":"being common","text":"Genuinely closed positions are rare in club chess. Three or more pawns blocked head to head occurs in 2.9% of the certified corpus. Beginners are taught the closed-versus-open distinction as though it were half of chess, and at this level the open half is nearly all of it."}],"chips":["sourced"],"boards":[{"fen":"5n2/8/bp1p1p1k/p1p1p1p1/P1P1P1P1/2PPBPK1/2B5/8 w - - 2 31","corpus":"positions","ref":"8u0xc3dq","caption":"As closed as a position gets: four pairs of pawns locked head to head on a4/a5, c4/c5, e4/e5 and g4/g5, with the files between them shut too. Neither side has a single pawn capture. White has two bishops and Black a bishop and a knight, and in a wall like this the knight is the piece that can get anywhere.","highlight":["a4","a5","c4","c5","e4","e5","g4","g5"],"render_fen":
