<script type="application/json" id="data">{"term":"Increment","slug":"increment","tier":2,"order":902,"group":"practical","kind":"look-up","taught":[],"thread":"The second half of a time control, and the reason modern games rarely end on time.","definition":"Time added to your clock after each move you make. An increment of three seconds means every move you play gives you three seconds back, so a game cannot simply run out while there is still play in the position.","precision":[{"against":"delay","text":"A different mechanism with a similar purpose. A delay counts down a few seconds before your main clock starts running, so unused delay is not banked; an increment is added to your total and accumulates. Increment is the norm online, delay in some over-the-board events."},{"against":"the base time","text":"The base is what you begin with. With a large enough increment a game has no real time limit at all, which is why the two numbers are always quoted together."}],"chips":["sourced"],"boards":[],"drill":{"mode":"none","why":"impossible","note":"Like the time control it belongs to, an increment is a property of the game and leaves no mark on a position."},"reading":[{"title":"Glossary of chess","url":"https://en.wikipedia.org/wiki/Glossary_of_chess"}],"links":["time-control","blunder"],"also":["delay","Fischer increment"],"no_board":"Nothing about an increment is visible on a board. See the time control entry.","links_resolved":[{"label":"Time control","href":"/glossary/time-control/"},{"label":"Blunder","href":"/glossary/blunder/"}],"home":{"slug":"core","title":"The core vocabulary","framing":"Why this is in the core vocabulary"},"paths":{"core":{"title":"The core vocabulary","n":72,"of":73,"prev":{"slug":"time-control","term":"Time control"},"next":{"slug":"j-adoube","term":"J'adoube"}}}}</script>
