<script type="application/json" id="data">{"term":"Pawn race","slug":"pawn-race","tier":3,"group":"endgame-technique","kind":"look-up","definition":"Both sides pushing a passed pawn at once, with neither king able to stop the other's. The counting is simple and the position afterwards is not: what usually decides it is what the first new queen can do with a check.","precision":[{"against":"the faster pawn winning","text":"Promoting first is not the same as winning. The first queen may arrive with a check, stop the other pawn, or give mate - or it may arrive on a square where the second queen takes it. Counting the race takes a moment; working out the queen endgame that follows is the hard part, and it is the part the count does not touch."},{"against":"the square of the pawn","text":"That rule is about a king chasing a pawn. This is about neither king getting there, which is why both pawns are running in the first place."}],"chips":["sourced"],"boards":[{"fen":"5K2/6P1/8/8/3k4/2p5/8/8 w - - 0 54","corpus":"drill","ref":"60b6cqfd","caption":"Four men and two pawns going opposite ways. White's g-pawn needs one move, Black's c-pawn needs two, and White is to move - so White queens first, with Black's king four moves from g8 and White's seven from c1. Neither king is in the race at all, which is what makes it one.","highlight":["c1","c3","g7","g8"],"render_fen":"5K2/6P1/8/8/3k4/2p5/8/8 w - - 0 54","highlight_squares":["c1","c3","g7","g8"]}],"drill":{"mode":"none","why":"impossible","note":"The count is computable and the answer is not: what happens once both sides have a queen needs calculation, which is exactly the gap the entry is about. The corpora are samples of games, not of endgames: the relaxed harvest takes up to four positions from anywhere in a game, so only 447 of its 10,000 positions have seven men or fewer. A rate measured over the whole file reports how often a position is an endgame, not how often the idea holds where it applies."},"links":["square-of-the
