<script type="application/json" id="data">{"term":"Hanging piece","slug":"hanging-piece","tier":2,"order":535,"group":"tactics","kind":"see-it","taught":[],"thread":"The plainest tactic there is, and the one that actually decides most games.","definition":"A piece that is attacked and undefended, so it can be taken for nothing. As a tactic the name is almost a joke - there is no technique to it, only the seeing.","precision":[{"against":"hanging","text":"The same condition. Board vision's relation is the general statement; this entry is that condition treated as a tactic in its own right, which it is, because most material at club level is lost exactly this way rather than to anything cleverer."},{"against":"loose piece","text":"A loose piece is undefended and may be perfectly safe. A hanging piece is undefended and attacked. The seed is the first; this motif is the second, and the gap between them is one enemy move."}],"chips":["sourced"],"extra":[{"heading":"The best predicted motif in the bank, for an obvious reason","body":"Both the underguarded seed and the loose piece seed are present in 100% of the 37 hanging-piece puzzles. Underguarded manages a lift of 2.27 on top of that, which is the third strongest link measured. This is not a discovery so much as a consistency check: a hanging piece is by definition undefended and attacked, so the seeds that mean undefended and outnumbered had better fire every time. They do, which is some evidence the predicates are behaving."}],"boards":[{"fen":"8/7p/4k3/pb1p1pPB/1n1P3P/N1p1P3/4K3/8 w - - 2 43","corpus":"puzzles","ref":"002bK","caption":"The black bishop on b5 is attacked by the knight on a3 and defended by nothing at all. No sequence, no sacrifice - it is simply there to be taken.","render_fen":"8/7p/4k3/pb1p1pPB/1n1P3P/N1p1P3/4K3/8 w - - 2 43"}],"drill":{"mode":"none","why":"taught-elsewhere","note":"Board vision unit 4 drills exactly this, as the difference between loose and hanging, and it does so better than a se
