<script type="application/json" id="data">{"term":"Overprotection","slug":"overprotection","tier":3,"group":"positional","kind":"look-up","definition":"Defending a strong point more times than it currently needs. Nimzowitsch's idea, and the argument is not about the point but about the defenders: pieces aimed at a square that matters are well placed for whatever happens next, and they are free the moment the square stops needing them.","precision":[{"against":"overdefending a weakness","text":"The reverse, and the distinction is the whole idea. Piling defenders on something weak ties them to it; putting them behind something strong is where they wanted to be anyway. The test is whether the defenders would be well placed if the threat disappeared."},{"against":"a rule you can apply","text":"It is the least operational of Nimzowitsch's terms. What it gives you is an observation about piece placement - defenders of a point that matters are usually well placed for what comes next - and no way at all of saying which points qualify. The arithmetic below is checkable and it is not the term, which is why this entry has a board and no drill."}],"origin":{"chip":"sourced","text":"One of Aron Nimzowitsch's own terms, from My System - published as five brochures between 1925 and 1927, and one of the founding books of hypermodernism. It arrived alongside prophylaxis, the blockade and control of the centre by pieces rather than pawns: a vocabulary invented to argue that position could be reasoned about in general terms instead of case by case. Three of those four are now ordinary chess words. This one is not.","source":"Wikipedia, Aron Nimzowitsch and My System. Secondary; My System not consulted."},"chips":["sourced"],"boards":[{"fen":"rnbq1rk1/1p3ppp/p2p1b2/2pPp3/2P1P3/2N2N2/PP2BPPP/R2Q1RK1 b - - 1 10","corpus":"positions","ref":"5xk1jezm","caption":"The arithmetic, at least: White's pawn on d5 is defended four times - by the queen on d1, the knight on c3, and the pawns on c4 and e4 - and attacked zero times. Whether that is overprotection in Nimzowitsch's sense depends on whether d5 is a point worth it, which is a judgement; what is computable is that four defenders are pointed at a square nothing is currently attacking.","highlight":["c3","c4","d1","d5","e4"],"awkward":true,"render_fen":"rnbq1rk1/1p3ppp/p2p1b2/2pPp3/2P1P3/2N2N2/PP2BPPP/R2Q1RK1 b - - 1 10","highlight_squares":["c3","c4","d1","d5","e4"]}],"drill":{"mode":"none","why":"contested","note":"Counting defenders and attackers of a square is exactly computable - the seeds course has the predicate - and the term is a claim about whether the square deserved them. Any answer key would be measuring the arithmetic and calling it the concept."},"links":["attacker-count","underguarded","blockade","outpost","defends","weak-square","prophylaxis","restraint"],"reading":[{"title":"Aron Nimzowitsch","url":"https://en.wikipedia.org/wiki/Aron_Nimzowitsch"}],"links_resolved":[{"label":"Attacker count","href":"/glossary/attacker-count/"},{"label":"Underguarded","href":"/glossary/underguarded/"},{"label":"Blockade","href":"/glossary/blockade/"},{"label":"Outpost","href":"/glossary/outpost/"},{"label":"Defends","href":"/glossary/defends/"},{"label":"Weak square","href":"/glossary/weak-square/"},{"label":"Prophylaxis","href":"/glossary/prophylaxis/"},{"label":"Restraint","href":"/glossary/restraint/"}],"home":null}</script>
