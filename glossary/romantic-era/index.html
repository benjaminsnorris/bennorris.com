<script type="application/json" id="data">{"tier":3,"group":"historical","kind":"look-up","term":"Romantic era","slug":"romantic-era","also":["Romantic chess","the Romantics"],"chips":["sourced"],"definition":"The nineteenth-century style, and the one every beginner is shown first: open the e-pawn, give something away, attack the king, and win beautifully or lose trying. Gambits were expected and declining one was thought poor form. It produced the famous games and it lost to the first person who took defending seriously.","precision":[{"against":"it being bad chess","text":"It is chess played to a different specification. Winning was not the whole of the point - winning *with style* was, and a player who ground out a technical endgame was thought to have missed the game's purpose. Judge the era by that standard and it succeeded; judge it by results against `classical-school` methods and it collapsed inside a decade."},{"against":"it being a period anyone chose","text":"It is a label applied afterwards, to a stretch running from the late eighteenth century to the 1880s and usually dated as ending at the Vienna tournament of 1873. Nobody in 1851 thought they were being romantic. The word is doing what `hypermodernism` and `soviet-school` also do here: naming a tendency in hindsight, tidier than the thing it names."},{"against":"the openings being obsolete","text":"They are alive and they are where a club player still meets them. The census behind these boards is club games, and its romantic-era openings - the King's Gambit, the Danish, the Italian - are all in it. What went out of fashion was the assumption that the sacrifice must be sound because it is beautiful."}],"origin":{"text":"Popular through the nineteenth century and in decline by the 1880s; the era is generally dated as ending with the Vienna tournament of 1873, where Steinitz's positional play prevailed. McDonnell and La Bourdonnais dominated the 1830s, Staunton the 1840s, Anderssen and Morphy afterwards. Its emblem is the Immortal Game, Anderssen against Kieseritzky on 21 June 1851, in which Anderssen gave up both rooks, a bishop and his queen and mated with the three pieces left.","chip":"sourced","source":"Wikipedia, Romantic chess. The primaries - the tournament books and game collections - were not consulted."},"boards":[{"fen":"rnbqkbnr/pppp1ppp/8/4p3/4PP2/8/PPPP2PP/RNBQKBNR b KQkq - 0 2","corpus":"opening","ref":"n8poqu69","caption":"1.e4 e5 2.f4 - the King's Gambit, the romantic era's signature move, from a game played in 2013. White offers a pawn on move two to prise open the f-file and get at the black king, and accepts a wrecked kingside to do it. The whole argument of the period is in this position: material is a means, the attack is the end, and a player who declined was thought to be spoiling the game.","highlight":["f4","e5"],"render_fen":"rnbqkbnr/pppp1ppp/8/4p3/4PP2/8/PPPP2PP/RNBQKBNR b KQkq - 0 2","highlight_squares":["f4","e5"]}],"drill":{"mode":"none","why":"impossible","note":"A style is not a feature of a position. Any diagram is an example of it and no predicate decides one."},"links":["classical-school","gambit","sacrifice","staunton-pattern","opening-trap","italian-game","combination","king-safety","mad-queen","coffeehouse"],"reading":[{"title":"Romantic chess","url":"https://en.wikipedia.org/wiki/Romantic_chess"}],"links_resolved":[{"label":"Classical school","href":"/glossary/classical-school/"},{"label":"Gambit","href":"/glossary/gambit/"},{"label":"Sacrifice","href":"/glossary/sacrifice/"},{"label":"Staunton pattern","href":"/glossary/staunton-pattern/"},{"label":"Opening trap","href":"/glossary/opening-trap/"},{"label":"Italian Game","href":"/glossary/italian-game/"},{"label":"Combination","href":"/glossary/combination/"},{"label":"King safety","href":"/glossary/king-safety/"},{"label":"The mad queen","href":"/glossary/mad-queen/"},{"label":"Coffeehouse","href":"/glossary/coffeehouse/"}],"home":null}</script>
