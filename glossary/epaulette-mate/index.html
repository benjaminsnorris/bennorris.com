<script type="application/json" id="data">{"tier":3,"group":"mating-patterns","kind":"look-up","chips":["sourced"],"term":"\u00c9paulette mate","slug":"epaulette-mate","also":["epaulette mate"],"definition":"A king mated on its own back rank with its own rooks standing on the squares to either side, so that the only way out is blocked by its own army. The two rooks sit like epaulettes on a uniform, which is where the name comes from.","precision":[{"against":"the mating piece being the point","text":"The two blockers are. The check comes from directly in front, which against a king with room is not mate at all - it steps sideways. Here it cannot, and what stops it is not the attacker but its own rooks."},{"against":"only rooks doing it","text":"Any two of the king's own men will do, and the name only records the pair that most often ends up there after castling. What the pattern needs is both squares beside the king occupied by its own side and the square in front covered."}],"boards":[{"fen":"2rkr3/p3n2p/3Q2p1/2p3B1/3p4/8/PPP2PPP/R5K1 b - - 4 24","corpus":"drill","ref":"mfw9zpft","caption":"The king on d8 has five neighbouring squares and three of them hold black pieces: the rooks on c8 and e8, and a knight on e7 as well. The queen on d6 covers the other two, c7 and d7, and gives the check. Black has more material on the board than White and no legal move.","highlight":["d8","c8","e8","e7","d6"],"render_fen":"2rkr3/p3n2p/3Q2p1/2p3B1/3p4/8/PPP2PPP/R5K1 b - - 4 24","highlight_squares":["d8","c8","e8","e7","d6"]}],"drill":{"mode":"none","why":"unbalanced","note":"2 of the 1,153 checkmates in the drill corpus have a king mated on its own back rank with its own rooks on both squares beside it. That is the pattern measured rather than estimated, and two instances is an illustration and never a rate."},"links":["checkmate","back-rank-mate","smothered-mate","rook","damiano-mate","castling"],"reading":[{"title":"Checkmate pattern","url":"https://en.wikipedia.org/wiki/Checkmate_pattern"}],"links_resolved":[{"label":"Checkmate","href":"/glossary/checkmate/"},{"label":"Back-rank mate","href":"/glossary/back-rank-mate/"},{"label":"Smothered mate","href":"/glossary/smothered-mate/"},{"label":"Rook","href":"/glossary/rook/"},{"label":"Damiano's mate","href":"/glossary/damiano-mate/"},{"label":"Castling","href":"/glossary/castling/"}],"home":null}</script>
