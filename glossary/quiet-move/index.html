<script type="application/json" id="data">{"term":"Quiet move","slug":"quiet-move","tier":3,"group":"tactical-method","kind":"look-up","definition":"A move in the middle of a forcing sequence that gives no check and takes nothing. It is the move that is hardest to see, because a player calculating a combination follows the checks and the captures and a quiet move is neither.","precision":[{"against":"a slow or pointless move","text":"Quiet describes the move's form, not its strength. The quiet moves in these puzzles are the winning moves, and they are quiet in the technical sense only: no check, no capture. A move that is quiet and also does nothing is just a bad move."},{"against":"a waiting move","text":"A waiting move hands the obligation to move back to the opponent and wants the position unchanged - see zugzwang. A quiet move is doing something specific and forcing; it simply does it without a check."}],"chips":["sourced"],"boards":[{"fen":"5rk1/5pp1/3p3p/4p3/4N3/PR6/1p3PPP/6K1 b - - 1 33","corpus":"puzzles","ref":"00gyK","caption":"Two checks are available in this position - b1=Q and b1=R, both promotions with check - and the solution plays neither. Rc8 threatens nothing immediately and wins, because the rook is going to c1 and the promotion can wait. This is what the term is pointing at: the move a calculating player never reaches, because they were following the checks.","moves":["f8c8"],"highlight":["b2","c8"],"render_fen":"2r3k1/5pp1/3p3p/4p3/4N3/PR6/1p3PPP/6K1 w - - 2 34","highlight_squares":["b2","c8"]}],"drill":{"mode":"none","why":"contested","note":"The form is trivially computable - a move that is neither a check nor a capture - and that is not the term. What makes a quiet move worth a name is that it is the best move in a forcing position, which needs an engine, so any answer key here would be measuring the wrong thing."},"links":["combination","zugzwang","zwischenzug","tempo","check","prophylaxis"],"reading":[{"title":"Chess tactic","url":"https://
