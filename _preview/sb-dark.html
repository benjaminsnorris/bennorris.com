<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><style>
:root{
  color-scheme: light dark;
  --ground:#F4F6F7; --surface:#FFFFFF; --panel:#EAEFF1; --panel2:#DFE7EA;
  --ink:#131A1D; --ink-soft:#3F4B50; --ink-mute:#5E696E;
  --rule:#D5DFE3; --rule-strong:#818B90; --btn-fg:#FFFFFF;
  --signal:#14646E; --signal-soft:#E0F0F1; --signal-deep:#0C4A52;
  --fact:#1D6E45; --fact-bg:#E2F1E9;
  --infer:#8A5409; --infer-bg:#F6EBD8;
  --vendor:#5F3F97; --vendor-bg:#EDE6F7;
  --contest:#A03C2E; --contest-bg:#F8E6E2;
  --single:#2A5A8C; --single-bg:#E3EDF7;
  --muck:#8B8258; --clear:#2E8C99;
  --warn-bg:#FBF0E4; --warn-rule:#D8A45C;
  --shadow:0 1px 2px rgba(19,26,29,.06),0 4px 14px rgba(19,26,29,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1315; --surface:#161D20; --panel:#1C2529; --panel2:#243036;
    --ink:#E9EFF1; --ink-soft:#B6C3C8; --ink-mute:#8C9CA3;
    --rule:#2C383D; --rule-strong:#617076; --btn-fg:#07100F;
    --signal:#4FBFCB; --signal-soft:#123338; --signal-deep:#8FDCE4;
    --fact:#6FD49E; --fact-bg:#10301F;
    --infer:#E0B364; --infer-bg:#34260D;
    --vendor:#B79BE8; --vendor-bg:#241B38;
    --contest:#F0958A; --contest-bg:#361914;
    --single:#8FBCE8; --single-bg:#132437;
    --muck:#8A8260; --clear:#4FBFCB;
    --warn-bg:#2E230F; --warn-rule:#8A6524;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  }
}
[data-theme="light"]{
  --ground:#F4F6F7; --surface:#FFFFFF; --panel:#EAEFF1; --panel2:#DFE7EA;
  --ink:#131A1D; --ink-soft:#3F4B50; --ink-mute:#5E696E;
  --rule:#D5DFE3; --rule-strong:#818B90; --btn-fg:#FFFFFF;
  --signal:#14646E; --signal-soft:#E0F0F1; --signal-deep:#0C4A52;
  --fact:#1D6E45; --fact-bg:#E2F1E9;
  --infer:#8A5409; --infer-bg:#F6EBD8;
  --vendor:#5F3F97; --vendor-bg:#EDE6F7;
  --contest:#A03C2E; --contest-bg:#F8E6E2;
  --single:#2A5A8C; --single-bg:#E3EDF7;
  --muck:#8B8258; --clear:#2E8C99;
  --warn-bg:#FBF0E4; --warn-rule:#D8A45C;
  --shadow:0 1px 2px rgba(19,26,29,.06),0 4px 14px rgba(19,26,29,.05);
}
[data-theme="dark"]{
  --ground:#0E1315; --surface:#161D20; --panel:#1C2529; --panel2:#243036;
  --ink:#E9EFF1; --ink-soft:#B6C3C8; --ink-mute:#8C9CA3;
  --rule:#2C383D; --rule-strong:#617076; --btn-fg:#07100F;
  --signal:#4FBFCB; --signal-soft:#123338; --signal-deep:#8FDCE4;
  --fact:#6FD49E; --fact-bg:#10301F;
  --infer:#E0B364; --infer-bg:#34260D;
  --vendor:#B79BE8; --vendor-bg:#241B38;
  --contest:#F0958A; --contest-bg:#361914;
  --single:#8FBCE8; --single-bg:#132437;
  --muck:#8A8260; --clear:#4FBFCB;
  --warn-bg:#2E230F; --warn-rule:#8A6524;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}

*,*::before,*::after{box-sizing:border-box}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 12px);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:ui-serif,Georgia,"Iowan Old Style","Palatino Linotype",Palatino,serif;
  font-size:17px;line-height:1.62;
  padding:0 16px 132px;
}
.wrap{max-width:44rem;margin:0 auto}
h1,h2,h3,h4,.ui{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1{font-size:1.9rem;line-height:1.16;letter-spacing:-.02em;margin:.4em 0 .25em}
h2{font-size:1.35rem;line-height:1.24;letter-spacing:-.012em;margin:2.2em 0 .5em}
h3{font-size:1.06rem;line-height:1.3;margin:1.8em 0 .4em}
h4{font-size:.94rem;margin:1.4em 0 .3em;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-mute)}
p{margin:0 0 1em}
a{color:var(--signal)}
strong{font-weight:660}
em{font-style:italic}
hr{border:0;border-top:1px solid var(--rule);margin:2.4em 0}
ul,ol{padding-left:1.25em;margin:0 0 1em}
li{margin:.3em 0}
small{font-size:.86rem;color:var(--ink-mute)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88em;background:var(--panel);padding:.1em .35em;border-radius:4px}

header.masthead{padding:28px 0 8px;border-bottom:1px solid var(--rule);margin-bottom:8px}
.kicker{font-family:system-ui,sans-serif;font-size:.74rem;text-transform:uppercase;letter-spacing:.14em;color:var(--signal);font-weight:650}
.dek{font-size:1.06rem;color:var(--ink-soft);margin:.2em 0 1em}
.byline{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 14px}
.byline img{display:block;height:32px;width:auto;max-width:100%}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 0}
button,.btn{
  font-family:system-ui,sans-serif;font-size:.86rem;font-weight:560;
  min-height:44px;padding:9px 14px;border-radius:9px;
  border:1px solid var(--rule-strong);background:var(--surface);color:var(--ink);
  cursor:pointer;line-height:1.2;
}
button:hover{border-color:var(--signal)}
button.primary{background:var(--signal);color:var(--btn-fg);border-color:var(--signal)}
button.tiny{min-height:36px;padding:6px 10px;font-size:.8rem}

.card{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:16px;margin:1.4em 0;box-shadow:var(--shadow)}
.panel{background:var(--panel);border-radius:12px;padding:14px 16px;margin:1.3em 0}
.warn{background:var(--warn-bg);border-left:3px solid var(--warn-rule);border-radius:0 10px 10px 0;padding:13px 16px;margin:1.4em 0}
.pull{border-left:3px solid var(--signal);padding:2px 0 2px 16px;margin:1.5em 0;color:var(--ink-soft);font-size:1.03rem}

.chip{
  display:inline-flex;align-items:center;gap:.3em;
  font-family:system-ui,sans-serif;font-size:.68rem;font-weight:640;
  text-transform:uppercase;letter-spacing:.045em;
  padding:.16em .5em;border-radius:5px;vertical-align:.08em;white-space:nowrap;
}
.chip a{text-decoration:none;color:inherit;border-bottom:1px solid currentColor;opacity:.8}
.chip.src{background:var(--fact-bg);color:var(--fact)}
.chip.infer{background:var(--infer-bg);color:var(--infer)}
.chip.vendor{background:var(--vendor-bg);color:var(--vendor)}
.chip.contested{background:var(--contest-bg);color:var(--contest)}
.chip.single{background:var(--single-bg);color:var(--single)}

.legend{display:grid;grid-template-columns:1fr;gap:8px;margin:10px 0 0}
@media(min-width:560px){.legend{grid-template-columns:1fr 1fr}}
.legend div{font-size:.88rem;color:var(--ink-soft)}

.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:1.3em 0;border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:30rem;font-family:system-ui,sans-serif;font-size:.88rem}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--rule);vertical-align:top}
th{background:var(--panel);font-weight:650;color:var(--ink-soft)}

.blocks{display:grid;grid-template-columns:1fr;gap:10px;margin:1.3em 0}
@media(min-width:620px){.blocks{grid-template-columns:1fr 1fr}}
.blk{background:var(--panel);border-radius:11px;padding:11px 13px}
.blk .lab{font-family:system-ui,sans-serif;font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--signal);font-weight:650}
.blk .t{font-family:system-ui,sans-serif;font-weight:620;font-size:.95rem;margin:2px 0}
.blk .m{font-size:.88rem;color:var(--ink-soft)}

details{border:1px solid var(--rule);border-radius:11px;padding:0;margin:1.1em 0;background:var(--surface)}
details>summary{
  cursor:pointer;list-style:none;padding:13px 15px;min-height:44px;
  font-family:system-ui,sans-serif;font-weight:600;font-size:.92rem;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";color:var(--signal);font-size:1.2rem;line-height:1}
details[open]>summary::after{content:"\2212"}
details .body{padding:0 15px 14px;border-top:1px solid var(--rule);padding-top:12px}

textarea{
  width:100%;min-height:90px;resize:vertical;padding:11px 12px;border-radius:10px;
  border:1px solid var(--rule-strong);background:var(--ground);color:var(--ink);
  font-family:inherit;font-size:.97rem;line-height:1.5;
}
textarea:focus,input:focus,button:focus-visible{outline:2px solid var(--signal);outline-offset:1px}
label.fld{display:block;font-family:system-ui,sans-serif;font-size:.8rem;font-weight:620;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 5px}

.confrow{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:10px 0}
.confrow .lbl{font-family:system-ui,sans-serif;font-size:.8rem;color:var(--ink-mute);width:100%}
.conf{min-height:44px;min-width:44px;padding:8px 0;flex:1 1 44px;border-radius:9px;text-align:center}
.conf[aria-pressed="true"]{background:var(--signal);color:var(--btn-fg);border-color:var(--signal)}
.reveal{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed var(--rule-strong)}
.reveal.on{display:block}
.gap{font-family:system-ui,sans-serif;font-size:.84rem;font-weight:620;margin-top:9px}
.gap.good{color:var(--fact)} .gap.bad{color:var(--contest)}
.scorerow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

.item{background:var(--panel);border-radius:12px;padding:14px 15px;margin:1.2em 0}
.item .q{font-family:system-ui,sans-serif;font-weight:620;font-size:.95rem;margin-bottom:8px}
.tagline{font-family:system-ui,sans-serif;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-mute);font-weight:640;margin-bottom:6px}

.unit{border-top:1px solid var(--rule);padding-top:26px;margin-top:34px}
.unitbar{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;justify-content:space-between}
.unitno{font-family:system-ui,sans-serif;font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--signal)}
.time{font-family:system-ui,sans-serif;font-size:.78rem;color:var(--ink-mute)}
.blocks-time{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.tb{font-family:system-ui,sans-serif;font-size:.76rem;background:var(--panel2);color:var(--ink-soft);padding:4px 9px;border-radius:20px}
.evidence{background:var(--signal-soft);border-radius:11px;padding:12px 14px;margin:1em 0;font-size:.95rem}
.evidence .h{font-family:system-ui,sans-serif;font-size:.72rem;font-weight:680;letter-spacing:.09em;text-transform:uppercase;color:var(--signal);margin-bottom:4px}
.liminal{font-family:system-ui,sans-serif;font-size:.88rem;color:var(--ink-soft);background:var(--panel);border-radius:10px;padding:11px 13px;margin:1.2em 0}
.liminal b{color:var(--ink)}
.done{display:flex;align-items:center;gap:10px;margin:1.6em 0 .4em}
.done button{min-height:48px;flex:1}

/* creek meter */
#meter{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:color-mix(in srgb,var(--ground) 92%,transparent);
  backdrop-filter:saturate(1.3) blur(8px);
  border-bottom:1px solid var(--rule);
  margin:0 -16px;padding:7px 16px 6px;
}
.creek{display:flex;align-items:center;gap:3px;max-width:44rem;margin:0 auto}
.pool{flex:1 1 0;min-width:0;height:26px;border-radius:5px;background:var(--panel2);position:relative;overflow:hidden;border:1px solid var(--rule)}
.pool .fill{position:absolute;inset:auto 0 0 0;height:0%;transition:height .5s ease,background .5s ease;background:var(--muck)}
.pool .pn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;font-size:.62rem;font-weight:700;color:var(--ink);mix-blend-mode:normal;opacity:.72}
.flowline{max-width:44rem;margin:4px auto 0;display:flex;justify-content:space-between;align-items:baseline;font-family:system-ui,sans-serif;font-size:.7rem;color:var(--ink-mute)}
.flowline b{color:var(--ink);font-size:.78rem}

.srclist{font-size:.9rem}
.srclist li{margin:.6em 0}
.srclist .vstat{font-family:system-ui,sans-serif;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-mute);font-weight:640}
footer{margin-top:44px;padding-top:20px;border-top:1px solid var(--rule);color:var(--ink-mute);font-size:.88rem}

/* Footer button back to the course index. Colour rides on currentColor so one
   rule holds across every course palette; the bare currentColor line is the
   fallback for engines without color-mix. The logo keeps its transparency: on
   a dark ground the pale face carries the shape on its own, and a plate behind
   it reads as a lit square. */
.sitelink-row { margin: 1.1rem 0 0; }
.sitelink {
  display: inline-flex; align-items: center; gap: .45rem;
  padding: .42rem .72rem; border-radius: .45rem;
  border: 1px solid currentColor;
  border-color: color-mix(in srgb, currentColor 22%, transparent);
  color: inherit; text-decoration: none;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: .78rem; line-height: 1; opacity: .8;
  transition: opacity .15s, background-color .15s;
}
.sitelink:hover, .sitelink:focus-visible {
  opacity: 1; background: color-mix(in srgb, currentColor 8%, transparent);
}
.sitelink img {
  width: 18px; height: 18px; flex: none;
}
.sitelink-foot { max-width: 1300px; margin: 0 auto; padding: 0 1.1rem 2.5rem; }

/* AI attribution, under the site link.

   Two fixed variants rather than /badge/written-by/claude.svg, the one the
   site's Jekyll include uses: that file carries its own <style> keyed on
   prefers-color-scheme, which is the SYSTEM theme and not the artifact's. Most
   artifacts ship a [data-theme] toggle, and a reader who forces light while
   the OS is dark would get a dark-plated badge on a light page. These rules
   answer the media query and the override both.

   The SVGs are generated by bin/badge from bin/badge-assets/spec.py, and CI
   fails the deploy if the committed files drift from it. Never edit one here.
*/
.ai-badge-row { margin: 1.15rem 0 0; }
.ai-badge-link { display: inline-block; line-height: 0; border: 0; }
.ai-badge { display: block; height: auto; max-width: 100%; }
.ai-badge-dark { display: none; }
@media (prefers-color-scheme: dark) {
  .ai-badge-light { display: none; }
  .ai-badge-dark { display: block; }
}
[data-theme="light"] .ai-badge-light { display: block; }
[data-theme="light"] .ai-badge-dark { display: none; }
[data-theme="dark"] .ai-badge-light { display: none; }
[data-theme="dark"] .ai-badge-dark { display: block; }
</style><style>html,body{margin:0;background:var(--ground);color:var(--ink)}body{padding:14px 18px}</style></head><body><div class="wrap"><footer>
<p>A self-study course. Built to the threshold-concept model: three thresholds, eight units, roughly 22 hours.</p>
<p>Progress is stored in your browser and synced to your account if you are signed in. Nothing you write here is visible to anyone else.</p>
<p><img src="/badge/created-by/claude.svg" alt="Created by Claude" width="161" height="32" loading="lazy"></p>
<p class="sitelink-row"><a class="sitelink" href="/courses/"><img src="/assets/images/logo-48.png" width="18" height="18" alt=""><span>Course by Ben Norris</span></a></p><p class="ai-badge-row"><a class="ai-badge-link" href="/badges/" title="What this badge means"><img class="ai-badge ai-badge-light" src="/badge/written-by/claude-light.svg" alt="Written by Claude" width="175" height="30" loading="lazy" decoding="async"><img class="ai-badge ai-badge-dark" src="/badge/written-by/claude-dark.svg" alt="Written by Claude" width="175" height="30" loading="lazy" decoding="async"></a></p>
</footer></div><script>addEventListener('load',function(){setTimeout(function(){
 function v(x){var e=document.querySelector(x);return !e?'absent':(getComputedStyle(e).display==='none'?'hidden':'SHOWN')}
