A seven-week course. You end it able to build, defend, and document a rating instrument the way a testing organization would \u2014 and able to tell, quickly, whether someone else's eval is measuring anything at all.

---

## Why this course exists

Psychometrics is a century-old field that solved a specific problem: *how do you assign a number to something you cannot observe directly, using fallible human judges, and then defend that number to someone who has a stake in the outcome?*

That is exactly the LLM eval problem. A rubric is a test. A judge \u2014 human or model \u2014 is a rater. A benchmark is an instrument. A pass threshold is a cut score. Every one of these has a mature literature behind it, mostly written between 1950 and 2000, mostly ignored.

The result is a field that rediscovers the same results badly:

| What eval practice does | What psychometrics established | When |
|---|---|---|
| Reports raw % agreement between judge and human | Chance-corrected agreement (\u03BA) | 1960 |
| Reports \u03BA and reads off "substantial" from a table | Those bands are admittedly arbitrary; \u03BA is confounded by prevalence and bias | 1977 / 1990 |
| Averages three judges to "reduce noise" | Spearman\u2013Brown tells you exactly how much, and G-theory tells you whether to add raters or items | 1910 / 1972 |
| Argues about whether a benchmark is "valid" | Validity is a property of an *interpretation*, not a test, and is argued, not measured | 1989 / 1992 |
| Picks 0.8 as the pass bar | Standard setting: Angoff, bookmark, contrasting groups | 1971 |
| Notices judges prefer longer answers | Construct-irrelevant variance | 1989 |
| Notices a rubric misses something important | Construct underrepresentation | 1989 |
| Notices GPT-judge is harsher than Claude-judge | Rater severity \u2014 an estimable parameter, not a nuisance | 1989 |

Your advantage after this course is not that you'll know the words. It's that you'll have run the studies, so you'll know which of these problems your instrument actually has.

---

## What you build

There is one running project across all seven weeks: **a measurement instrument for Today Brief quality**, taken from working rubric to documented, validated instrument with a technical manual.

This is deliberate. Psychometrics does not transfer from reading. It transfers from having your own instrument fall apart under a reliability study and then fixing it.

By Week 7 you will have produced:

1. A construct map with explicit boundary statements (in-construct / out-of-construct)
2. A double-rated pilot dataset with defensible agreement statistics and confidence intervals
3. A G-study and D-study telling you how many items and raters you need for the decisions you want to make
4. A written Interpretation/Use Argument in Kane's format
5. A behaviorally anchored rubric with an exemplar set and adjudication protocol
6. Item-level analysis and a defensible cut score with documented method
7. A technical manual \u2014 the artifact you'd hand a Jordan district administrator who asks "how do you know this brief is good?"

That last one is the real deliverable. It is also, not incidentally, a competitive moat: nobody in EdTech AI has one.

---

## Time budget

Roughly **6\u20138 hours per week**, split:

- **Read** (~2h) \u2014 assigned primary sources, not summaries
- **Theory** (~1.5h) \u2014 derivations and hand-computation. Do these by hand first. The formulas do not become intuitive from library calls.
- **Lab** (~2h) \u2014 code, on real or synthetic data
- **Applied** (~1.5h) \u2014 the running project

Total \u2248 45 hours. Compressible to 4 weeks if you drop Week 6 (IRT/standard setting) and merge Weeks 2\u20133, but Week 6 is where the leverage is for benchmark design, so think twice.

**ADHD note, offered because you asked me to think about how you work:** each week's file has an explicit *Minimum Viable Week* box near the bottom. If a week goes sideways, do that and move on. Skipping Applied is worse than skipping Read \u2014 the applied thread compounds and the reading does not.

---

## Setup

### Environment

Python-first, with two short R detours (Weeks 3 and 6) where Python's tooling is genuinely worse.

\`\`\`bash
# Python
pip install numpy pandas scipy statsmodels scikit-learn \\
            pingouin krippendorff matplotlib seaborn jupyter

# R (Weeks 3 and 6 only)
# install.packages(c("psych", "irr", "irrCAC", "lme4", "mirt", "TAM"))
\`\`\`

Package roles:

- \`scikit-learn\` \u2014 \`cohen_kappa_score\` (supports linear/quadratic weights)
- \`statsmodels\` \u2014 \`fleiss_kappa\`, \`cohens_kappa\` with CIs
- \`pingouin\` \u2014 \`intraclass_corr\` (all six ICC forms, correctly labeled), \`cronbach_alpha\`
- \`krippendorff\` \u2014 \u03B1 for any measurement level, handles missing data
- \`irrCAC\` (R) \u2014 Gwet's AC1/AC2, the paradox-resistant coefficients; the Python ports are less reliable
- \`lme4\` (R) \u2014 variance components for G-theory
- \`mirt\` (R) \u2014 graded response models; nothing in Python is close

Verify installs before Week 2. \`pingouin\` in particular has had dependency friction with newer \`scipy\` releases.

### Repository layout

Suggested \u2014 mirrors the deliverable chain:

\`\`\`
psychometrics/
  data/
    ratings/          # double-rated pilot data, one CSV per study
    exemplars/        # anchor briefs at each score point
  notebooks/
    w2-agreement.ipynb
    w3-generalizability.ipynb
    w6-item-analysis.ipynb
  instrument/
    construct-map.md
    rubric-v1.md ... rubric-vN.md
    iua.md            # interpretation/use argument
    adjudication.md
  manual/
    technical-manual.md
\`\`\`

Version the rubric explicitly. Rubric revisions invalidate prior reliability estimates, and you need to be able to say which version a given \u03BA belongs to. This is the single most common bookkeeping failure in eval work.

### Data you need before Week 2

You need a **double-rated pilot set**. Start collecting now \u2014 this is the long-lead item.

Minimum: **60 briefs, each rated independently by two raters, on at least one ordinal dimension.** More is better; 60 is where confidence intervals on \u03BA stop being embarrassing. You can be one of the raters, but not both, and the second rater must not see your ratings.

If you cannot get a second human, use two structurally different LLM judges as raters *for practice* \u2014 but understand that this measures judge-judge consistency, which is not what you need. Correlated errors between two instances of the same model family will make your reliability look far better than it is. Plan for at least one real human.

## One framing to carry through

Psychometrics is not a set of statistics. It is a discipline of *making an argument about what a number means*, in which statistics are evidence.

The number is never the claim. The claim is always something like: "a score of 4 on this dimension supports the inference that this brief would let a captain act without opening Cadence." Reliability tells you the number is stable. Validity tells you the inference is warranted. Most eval work reports the number and skips both.

Start with Week 1.`,w1:`# Week 1 \u2014 Measurement Theory and Classical Test Theory

> **Outcome:** You can state precisely what your rubric is trying to measure, defend the boundary of that construct, decompose an observed score into true score and error, and explain why an unreliable measure caps how valid it can possibly be.

---

## 1. Orientation

Before any statistic, there's a prior question that eval work almost universally skips: **what is the thing?**

When you write a rubric dimension called "Actionability," you have done something consequential. You have asserted that there exists a property of briefs \u2014 not directly observable \u2014 that varies across briefs, that is coherent enough to be a single thing rather than three things, and that your rating procedure is sensitive to. That assertion is called *positing a construct*, and it is a theoretical claim that can be wrong.

Most rubric dimensions are wrong in one of two ways. They are **too broad** (a single "Quality" dimension bundling coverage, accuracy, and tone into a number where a 3 could mean anything). Or they are **not actually latent** (they're an observable count wearing a construct's clothes \u2014 "Number of gaps named" is a count, not a construct, and should be reported as a count).

This week is about doing that theoretical work first.

---

## 2. Core ideas

### 2.1 Constructs and operationalization

A **construct** is a theoretical attribute posited to explain a pattern of observations. It is not observable. "Reading comprehension," "extraversion," "brief actionability" \u2014 all constructs.

**Operationalization** is the procedure that turns a construct into a number. Your rubric *is* an operationalization. The construct and the operationalization are different things, and the gap between them is where every measurement problem lives.

The essential move, which almost nobody makes: write both a **construct definition** and a **boundary statement**.

\`\`\`
CONSTRUCT: Actionability

DEFINITION
  The degree to which a brief enables its reader to take correct
  next action on the day it is delivered without consulting the
  underlying source systems.

IN-CONSTRUCT (variance in these SHOULD move the score)
  - Whether items requiring the reader's decision are surfaced
  - Whether each surfaced item names a specific next action
  - Whether the reader's role relative to each item is stated
  - Whether blocked/waiting items are distinguished from open ones

OUT-OF-CONSTRUCT (variance in these should NOT move the score)
  - Prose quality, tone, warmth
  - Length
  - Whether the underlying week was actually eventful
  - Formatting and visual polish
  - Factual accuracy of the underlying claims  [covered by Groundedness]

BOUNDARY NOTES
  - A brief that surfaces the right items but states no actions
    is LOW actionable, not medium.
  - A brief that surfaces actions the reader does not own is
    NOT penalized here; that is Scoping.
\`\`\`

The out-of-construct list is the valuable half. Every entry on it is a hypothesis about a bias you'll later test. When you find that longer briefs get higher Actionability scores, you have a documented, falsified expectation rather than a vague unease.

### 2.2 Levels of measurement

Stevens (1946): nominal, ordinal, interval, ratio. Determines what arithmetic is legitimate.

Rubric scores are **ordinal**. A 4 is better than a 3; the distance from 3\u21924 is not guaranteed equal to 2\u21923. This has hard consequences:

- Averaging ordinal scores is technically illegitimate. Everyone does it anyway. The defensible move is to *check* the assumption (Week 6, via IRT) rather than assume it or refuse it.
- Pearson correlation assumes interval. Use Spearman for ordinal, or use ordinal-appropriate coefficients (weighted \u03BA, polychoric correlations).
- **A rubric with unequal category widths will systematically distort your aggregate scores.** If the jump from 3 to 4 requires much more than the jump from 2 to 3, mean scores compress at the top and your instrument loses discrimination exactly where you need it.

The practical stance: treat ordinal as ordinal in your statistics, but design your rubric so the intervals are as equal as you can make them, and verify in Week 6.

### 2.3 Classical Test Theory: the true score model

The founding equation:

$$X = T + E$$

where $X$ is the observed score, $T$ the **true score**, $E$ the **error**.

$T$ has a specific and slightly deflationary definition: it is the *expected value of the observed score over infinite independent replications of the measurement procedure*. It is not "the truth." It is the average of what your procedure would say if you ran it forever. A biased procedure has a biased true score. CTT can only see *random* error; systematic error is invisible to it and must be caught by validity work (Week 4).

**Assumptions:**
1. $E[E] = 0$ \u2014 errors average out
2. $\\text{cov}(T, E) = 0$ \u2014 error is uncorrelated with true score
3. $\\text{cov}(E_1, E_2) = 0$ \u2014 errors on different measurements are uncorrelated

Assumption 3 is the one your evals violate. Two judges from the same model family share correlated error. The same judge rating two dimensions of one brief shares correlated error (halo). When it breaks, reliability estimates inflate.

From the assumptions, since $T$ and $E$ are uncorrelated:

$$\\sigma^2_X = \\sigma^2_T + \\sigma^2_E$$

Observed variance decomposes into true variance plus error variance. This is the whole game.

### 2.4 Reliability

**Reliability** is the proportion of observed variance that is true variance:

$$\\rho_{XX'} = \\frac{\\sigma^2_T}{\\sigma^2_X} = \\frac{\\sigma^2_T}{\\sigma^2_T + \\sigma^2_E}$$

Range 0 to 1. Read it as *signal share*.

Two things fall out immediately, and both are counterintuitive enough to be worth sitting with:

**Reliability is not a property of an instrument.** It is a property of an instrument *applied to a population*. The same rubric, applied to a set of briefs that are all roughly equally good, will show low reliability \u2014 because $\\sigma^2_T$ is small, not because the rubric got worse. This is *range restriction*, and it is rampant in eval work: you improve your system until all outputs are decent, then your eval's reliability craters and you conclude the eval broke.

**Low reliability can mean the population is homogeneous, not that your instrument is noisy.** Always report the score distribution alongside the reliability coefficient. A \u03BA of 0.4 on a set with 90% passes tells you almost nothing about the rubric.

### 2.5 Standard error of measurement

Reliability is a ratio, which makes it hard to interpret in units you care about. The SEM fixes that:

$$\\text{SEM} = \\sigma_X \\sqrt{1 - \\rho_{XX'}}$$

This is the standard deviation of the error distribution around a true score, expressed in **score units**. A 95% confidence band around an observed score is roughly $X \\pm 1.96 \\times \\text{SEM}$.

This is the single most useful number in this course and it appears in approximately zero eval reports.

*Worked:* your rubric has $\\sigma_X = 1.0$ on a 1\u20135 scale and $\\rho = 0.75$. SEM $= 1.0 \\times \\sqrt{0.25} = 0.50$. A brief scoring 4.0 has a 95% band of roughly [3.0, 5.0]. **Your instrument cannot distinguish a 4 from a 3.** Any decision you make on a one-point difference is noise.

Now consider what this means for a dashboard reporting "average brief quality: 3.8, up from 3.6."

### 2.6 Spearman\u2013Brown: buying reliability

Reliability increases predictably as you add parallel measurements (more items, more raters):

$$\\rho_{\\text{new}} = \\frac{k\\rho}{1 + (k-1)\\rho}$$

where $k$ is the multiplication factor.

*Worked:* one rater gives $\\rho = 0.50$. Three raters: $\\frac{3(0.5)}{1 + 2(0.5)} = \\frac{1.5}{2.0} = 0.75$. Five raters: $\\frac{2.5}{3.0} = 0.833$. Ten: $\\frac{5}{5.5} = 0.909$.

Note the shape: **diminishing returns, hard.** Going from 1\u21923 raters buys you 0.25. Going from 5\u219210 buys you 0.076. If you're at 0.5 with one rater and you need 0.9, you need ten raters \u2014 which usually means the answer is *fix the rubric*, not *buy more raters*.

The formula assumes the added measurements are **parallel** \u2014 same true score, same error variance. Adding a second judge from the same model family is not adding a parallel measurement; it's adding a correlated one, and Spearman\u2013Brown will overpromise.

### 2.7 Attenuation: why reliability caps validity

If you correlate two fallible measures, the observed correlation is attenuated by both unreliabilities:

$$r_{xy(\\text{observed})} = r_{xy(\\text{true})} \\sqrt{\\rho_{xx}\\rho_{yy}}$$

Rearranged, the **correction for attenuation**:

$$r_{xy(\\text{true})} = \\frac{r_{xy(\\text{observed})}}{\\sqrt{\\rho_{xx}\\rho_{yy}}}$$

Two consequences worth internalizing:

**The ceiling.** A measure cannot correlate with anything more strongly than $\\sqrt{\\rho_{xx}}$. If your rubric has reliability 0.49, it cannot correlate above 0.70 with *anything*, including a perfect criterion. So if you're validating your LLM judge against human ratings and getting r = 0.6, before concluding the judge is bad, check the reliability of the human ratings. If humans agree with each other at 0.65, then r = 0.6 is close to the ceiling and your judge is nearly as good as a human.

This reframe \u2014 *compare your judge to human-human agreement, not to 1.0* \u2014 is the most immediately useful thing in Week 1. It is also frequently the difference between "our judge is unusable" and "our judge is at the human ceiling and the rubric is the problem."

**Use correction cautiously.** Corrected correlations above 1.0 are common and signal that an assumption broke. Report both corrected and uncorrected.

### 2.8 Internal consistency and the alpha problem

**Cronbach's alpha:**

$$\\alpha = \\frac{k}{k-1}\\left(1 - \\frac{\\sum \\sigma^2_i}{\\sigma^2_{\\text{total}}}\\right)$$

where $k$ is the number of items and $\\sigma^2_i$ the variance of item $i$.

Alpha is the most reported and most misunderstood coefficient in the social sciences. Know these four things:

1. **Alpha is not a measure of unidimensionality.** A two-factor scale can have high alpha. High alpha does not mean your dimension is one thing.
2. **Alpha is a lower bound on reliability**, and only equals reliability under *tau-equivalence* (all items load equally on the construct). Rubric dimensions are essentially never tau-equivalent.
3. **Alpha increases with the number of items** regardless of quality. A 20-item scale of mediocre items beats a 5-item scale of good ones on alpha.
4. **McDonald's omega ($\\omega$) is strictly better** and is what you should report. It relaxes tau-equivalence and estimates reliability from a factor model. \`pingouin\` and R's \`psych\` both compute it.

The 0.70 threshold everyone cites traces to Nunnally, who proposed it as adequate for *early-stage research*, not for consequential decisions. For decisions about individuals, the conventional bar is 0.90+.

---

## 3. The failure mode

**Construct proliferation without construct definition.** The typical eval rubric has 5\u20138 dimensions with one-line descriptions, written in an afternoon. Nobody has asked whether "Coherence" and "Clarity" are two constructs or one, so raters silently fill in different theories and the correlation between the dimensions ends up at 0.85 \u2014 meaning you have one construct measured twice, and you're reporting it as two.

**The tell:** a correlation matrix of your rubric dimensions where the off-diagonals are all above 0.7. That's not a rubric, that's a general-impression score with extra steps. (This is *halo*; Week 5.)

**The second failure: never computing SEM.** Every eval dashboard reports point estimates. Almost none report the measurement error around them. Teams ship prompt changes on differences smaller than their instrument can resolve, then generate post-hoc stories about why the change worked.

## 5. Theory exercises

Do these on paper. Answers follow each.

**1.1** A rubric has observed score variance $\\sigma^2_X = 1.44$ and error variance $\\sigma^2_E = 0.36$. Compute reliability and SEM.

> $\\sigma^2_T = 1.44 - 0.36 = 1.08$. $\\rho = 1.08/1.44 = 0.75$. $\\sigma_X = 1.2$. SEM $= 1.2\\sqrt{0.25} = 0.60$.

**1.2** Using 1.1's instrument: a brief scores 3.5, another scores 4.0. Can you distinguish them? Give the 95% band on each.

> SEM = 0.60, so 95% band \u2248 \xB11.18. Brief A: [2.32, 4.68]. Brief B: [2.82, 5.18]. Massive overlap. No. You would need the difference to exceed roughly $1.96 \\times \\text{SEM}\\sqrt{2} = 1.66$ points before calling it, and even that is a rough heuristic.

**1.3** Your judge correlates with human ratings at r = 0.62. Judge test-retest reliability is 0.85; human inter-rater reliability is 0.58. What is the disattenuated correlation? What does it tell you?

> $r_{\\text{true}} = 0.62 / \\sqrt{0.85 \\times 0.58} = 0.62/\\sqrt{0.493} = 0.62/0.702 = 0.883$. The judge and humans are measuring nearly the same underlying construct. The observed 0.62 is mostly *human* noise. Your problem is the rubric's clarity to humans, not the judge.

**1.4** Derive the ceiling: show that a measure's correlation with a perfectly reliable criterion cannot exceed $\\sqrt{\\rho_{xx}}$.

> Set $\\rho_{yy} = 1$ in the attenuation formula: $r_{xy(\\text{obs})} = r_{xy(\\text{true})}\\sqrt{\\rho_{xx}}$. Since $r_{xy(\\text{true})} \\leq 1$, we get $r_{xy(\\text{obs})} \\leq \\sqrt{\\rho_{xx}}$. \u220E

**1.5** You have one rater at $\\rho = 0.45$ and need 0.80. How many raters, by Spearman\u2013Brown? Sanity-check the answer.

> Solve $0.80 = \\frac{0.45k}{1 + 0.45(k-1)}$. \u2192 $0.80 + 0.36k - 0.36 = 0.45k$ \u2192 $0.44 = 0.09k$ \u2192 $k = 4.89$, so 5 raters. Sanity check: this is the point where you should stop and ask whether 5\xD7 the annotation cost is cheaper than rewriting the rubric. It almost never is.

**1.6** Explain, in three sentences, why improving your system can make your eval look worse.

> As the system improves, output quality becomes more homogeneous, shrinking true score variance $\\sigma^2_T$. Error variance $\\sigma^2_E$ is roughly unchanged. Reliability $\\sigma^2_T/(\\sigma^2_T + \\sigma^2_E)$ therefore falls even though the instrument is unchanged \u2014 this is range restriction, and it means late-stage evals need finer-grained instruments than early-stage ones.

## 6. Lab

Build intuition by simulation. The point is to *see* CTT's claims hold.

\`\`\`python
import numpy as np
import pandas as pd

rng = np.random.default_rng(7)

def simulate(n_items=200, n_raters=2, sd_true=1.0, sd_error=1.0):
    """Generate true scores and noisy observations under the CTT model."""
    true = rng.normal(0, sd_true, n_items)
    obs = true[:, None] + rng.normal(0, sd_error, (n_items, n_raters))
    return true, obs
\`\`\`

**Lab 1.1 \u2014 Verify the variance decomposition.** Simulate with \`sd_true=1.0, sd_error=0.5\`. Confirm empirically that $\\sigma^2_X \\approx \\sigma^2_T + \\sigma^2_E$ and that $\\rho \\approx 0.8$. Compute reliability two ways: from the known components, and as the correlation between two independent raters. They should match.

**Lab 1.2 \u2014 Range restriction.** Hold \`sd_error=0.5\` fixed. Sweep \`sd_true\` from 1.0 down to 0.2 in steps. Plot reliability against \`sd_true\`. Then plot *SEM* on the same sweep. Observe: reliability collapses; SEM is flat. **Write down what this means for choosing which statistic to report as your system matures.** This is the most important plot you'll make this week.

**Lab 1.3 \u2014 Spearman\u2013Brown, empirically.** Simulate 10 raters. For $k = 1..10$, compute the reliability of the mean of $k$ raters (split-half or via correlation with true scores, squared). Overlay the Spearman\u2013Brown prediction. They should coincide.

**Lab 1.4 \u2014 Break assumption 3.** Add a shared error component across raters:
\`obs = true[:,None] + shared_error[:,None] + independent_error\`
where \`shared_error\` is drawn per item and applied to all raters. Recompute inter-rater reliability. Observe that it *rises* while the correlation with the true score *falls*. **This is the correlated-judge problem in one plot.** Two GPT-family judges agreeing beautifully with each other while both being wrong looks exactly like this.

Lab 1.4 is the one to spend time on. It's the mechanism behind the most expensive mistake in eval design.

Deliverable: \`instrument/construct-map.md\`

**7.1** Take your current Today Brief eval rubric. For **each dimension**, write the full construct block from \xA72.1: definition, in-construct list, out-of-construct list, boundary notes.

Expect this to take 90 minutes for 5 dimensions and to be uncomfortable. The discomfort is the point \u2014 every place you struggle to decide whether something is in or out is a place your raters (human or model) are currently deciding for themselves, inconsistently.

---`,w2:`# Week 2 \u2014 Agreement and the Kappa Family

> **Outcome:** You can compute the full agreement family by hand, *choose correctly between them*, diagnose the two kappa paradoxes in your own data, report confidence intervals, and explain why "\u03BA = 0.72, substantial agreement" is usually an unsupported claim.

---

## 1. Orientation

This is the week that maps most directly onto what eval practice already does \u2014 and therefore the week where you'll find the most breakage.

The standard eval workflow: sample 100 outputs, have a human label them, have the judge label them, compute Cohen's \u03BA, compare to Landis & Koch's table, declare victory at 0.61.

Nearly every step of that is defensible. What's missing is everything that makes the number *mean* something: whether \u03BA is even the right coefficient, whether the paradoxes are inflating or deflating it, and what the confidence interval is. A \u03BA of 0.72 on n = 100 has a 95% CI roughly \xB10.13. Two rubric versions at 0.72 and 0.80 are not distinguishable, and teams ship on that difference constantly.

---

## 2. Core ideas

### 2.1 Percent agreement and why it fails

Raw agreement $p_o$ = proportion of items where raters gave the same label.

It fails because it includes agreement that would occur by chance. If 95% of your outputs pass and both raters know it, they'll agree ~90% of the time while doing no work.

The chance-correction family all share one form:

$$\\text{coefficient} = \\frac{p_o - p_e}{1 - p_e}$$

Read this as: *of the agreement available above chance, what fraction did we achieve?* All the coefficients differ only in how they estimate $p_e$ \u2014 the chance agreement. Every argument in this literature is an argument about $p_e$.

### 2.2 Cohen's kappa (Cohen, 1960)

Two raters, nominal categories, fully crossed.

$$p_e = \\sum_k \\frac{n_{k\\cdot}}{N} \\cdot \\frac{n_{\\cdot k}}{N}$$

\u2014 the product of each rater's marginal proportions for category $k$, summed.

**The embedded assumption:** chance agreement is modeled as each rater independently sampling from *their own observed marginal distribution*. That assumption is doing a lot of work, and it is the source of both paradoxes.

### 2.3 Weighted kappa (Cohen, 1968)

Rubric scores are ordinal. A 1-vs-5 disagreement should count more than a 3-vs-4. Unweighted \u03BA treats them identically \u2014 which is a real distortion, not a technicality.

$$\\kappa_w = 1 - \\frac{\\sum_{i,j} w_{ij} o_{ij}}{\\sum_{i,j} w_{ij} e_{ij}}$$

with disagreement weights $w_{ij}$ ($w_{ii} = 0$):

- **Linear:** $w_{ij} = \\frac{|i-j|}{k-1}$
- **Quadratic:** $w_{ij} = \\frac{(i-j)^2}{(k-1)^2}$

Quadratic penalizes distant disagreements much harder and is the default in most fields. It is also, under two-way random effects assumptions, asymptotically equivalent to ICC(2,1) (Fleiss & Cohen, 1973) \u2014 which is a useful bridge to Week 3, and a reason quadratic weighted kappa is a reasonable default for ordinal rubric data.

**Rule: if your scale is ordinal, unweighted \u03BA is the wrong statistic.** Report weighted, and state which weights.

### 2.4 Fleiss' kappa (Fleiss, 1971)

Three or more raters, where *different items may be rated by different raters* (but the same number per item). Not a generalization of Cohen's \u03BA \u2014 it uses a different chance model, based on the pooled marginal across all raters rather than per-rater marginals.

For $n$ items, $m$ raters, $k$ categories, $n_{ij}$ = number of raters assigning item $i$ to category $j$:

$$P_i = \\frac{1}{m(m-1)}\\left[\\sum_j n_{ij}^2 - m\\right], \\quad \\bar{P} = \\frac{1}{n}\\sum_i P_i$$
$$p_j = \\frac{1}{nm}\\sum_i n_{ij}, \\quad \\bar{P}_e = \\sum_j p_j^2$$
$$\\kappa = \\frac{\\bar{P} - \\bar{P}_e}{1 - \\bar{P}_e}$$

**Caution:** Fleiss' \u03BA treats raters as interchangeable. If you have a fixed panel of three judges whose identities matter (GPT, Claude, Gemini), that assumption is false and you want ICC or MFRM instead.

### 2.5 Krippendorff's alpha

The most general coefficient. Handles any number of raters, any measurement level (nominal, ordinal, interval, ratio), and \u2014 critically \u2014 **missing data**.

$$\\alpha = 1 - \\frac{D_o}{D_e}$$

where $D_o$ is observed disagreement and $D_e$ expected disagreement, both computed with a difference function appropriate to the measurement level.

**Why it's usually the right default for eval work:** your rating data is almost always ragged. Different subsets of items get rated by different numbers of raters; some judges error out; you add a judge partway through. Cohen and Fleiss both require complete designs. Krippendorff doesn't.

For nominal data with two raters and no missing values, \u03B1 \u2248 Cohen's \u03BA (they differ slightly in the chance model \u2014 \u03B1 uses a sampling-without-replacement correction). The choice between them at that point is toolchain convenience.

Krippendorff's own conventional bar is **\u03B1 \u2265 0.80 for conclusions, \u2265 0.667 for tentative conclusions**. Notably stricter than Landis & Koch. Worth knowing that reasonable people put the bar in very different places, which should make you suspicious of all of them.

### 2.6 The two kappa paradoxes

This is the most important section in the week. Feinstein & Cicchetti (1990) and Cicchetti & Feinstein (1990) documented two ways \u03BA misleads.

#### Paradox 1: Prevalence

**High agreement can produce low kappa when the marginals are skewed.**

Table A \u2014 skewed (90% pass rate):

| | B: Pass | B: Fail |
|---|---|---|
| **A: Pass** | 85 | 5 |
| **A: Fail** | 5 | 5 |

$p_o = 0.90$. Marginals: A pass = 0.90, B pass = 0.90.
$p_e = (0.90)(0.90) + (0.10)(0.10) = 0.81 + 0.01 = 0.82$.
$\\kappa = \\frac{0.90 - 0.82}{0.18} = \\mathbf{0.444}$

Table B \u2014 balanced:

| | B: Pass | B: Fail |
|---|---|---|
| **A: Pass** | 45 | 5 |
| **A: Fail** | 5 | 45 |

$p_o = 0.90$. Marginals: 0.50/0.50 both.
$p_e = 0.25 + 0.25 = 0.50$.
$\\kappa = \\frac{0.90 - 0.50}{0.50} = \\mathbf{0.800}$

**Identical 90% agreement. \u03BA of 0.44 vs 0.80.**

This is not a bug in \u03BA \u2014 the skewed case genuinely has less information, because a rater who always says "pass" achieves 90% agreement for free. But it means **you cannot compare \u03BA across datasets with different base rates**, and it means that as your system improves and pass rates climb, your \u03BA will fall for reasons that have nothing to do with rubric quality.

This is *the* reason most production eval \u03BA values look bad. Your pass rate is 85% because you shipped a decent system.

#### Paradox 2: Bias

**Marginal imbalance between raters *raises* \u03BA, holding agreement constant.**

Both tables below have $p_o = 0.60$ and identical prevalence:

Table C \u2014 unbiased:

| | B: Pass | B: Fail |
|---|---|---|
| **A: Pass** | 30 | 20 |
| **A: Fail** | 20 | 30 |

$p_e = (0.50)(0.50) + (0.50)(0.50) = 0.50$. $\\kappa = \\frac{0.60-0.50}{0.50} = \\mathbf{0.200}$

Table D \u2014 highly biased (A passes far more than B):

| | B: Pass | B: Fail |
|---|---|---|
| **A: Pass** | 30 | 40 |
| **A: Fail** | 0 | 30 |

$p_e = (0.70)(0.30) + (0.30)(0.70) = 0.21 + 0.21 = 0.42$. $\\kappa = \\frac{0.60-0.42}{0.58} = \\mathbf{0.310}$

**Same agreement. The *more biased* pair gets the *higher* \u03BA.**

This one is genuinely perverse. In eval terms: a lenient judge paired with a strict human can post a better \u03BA than a well-calibrated pair with the same raw agreement.

#### Diagnosing the paradoxes

Always report alongside \u03BA, for 2\xD72 tables:

- **Prevalence Index** $= |p_{11} - p_{22}|$ \u2014 the gap between the two agreement cells
- **Bias Index** $= |p_{12} - p_{21}|$ \u2014 the gap between the two disagreement cells

High PI \u2192 \u03BA deflated. High BI \u2192 \u03BA inflated. If either is large, \u03BA alone is uninterpretable.

### 2.7 The paradox-resistant alternatives

**PABAK** (Prevalence-Adjusted Bias-Adjusted Kappa; Byrt et al., 1993):

$$\\text{PABAK} = 2p_o - 1$$

For both Table A and Table B above: $2(0.90) - 1 = 0.80$.

PABAK "solves" the paradoxes by *ignoring* prevalence entirely \u2014 it's a rescaled percent agreement. That's often too far the other direction. Useful as a bound, not as your headline number.

**Gwet's AC1** (Gwet, 2008): a genuinely different chance model. Chance agreement is modeled as occurring only on *hard* items \u2014 those where a rater is genuinely uncertain \u2014 rather than on all items:

$$p_e^{(\\gamma)} = \\frac{1}{q-1}\\sum_{k=1}^{q} \\pi_k(1 - \\pi_k)$$

where $\\pi_k$ is the average marginal proportion for category $k$ across raters, and $q$ is the number of categories.

Applied to our tables:

- **Table A** (skewed): $\\pi_{\\text{pass}} = 0.90$, $\\pi_{\\text{fail}} = 0.10$. $p_e = \\frac{1}{1}[(0.9)(0.1) + (0.1)(0.9)] = 0.18$. $\\text{AC1} = \\frac{0.90 - 0.18}{0.82} = \\mathbf{0.878}$
- **Table B** (balanced): $\\pi = 0.5, 0.5$. $p_e = 0.25 + 0.25 = 0.50$. $\\text{AC1} = \\frac{0.90-0.50}{0.50} = \\mathbf{0.800}$

**\u03BA swung 0.44 \u2192 0.80. AC1 moved 0.88 \u2192 0.80.** AC1 is dramatically more stable under prevalence shift.

It also resists the *bias* paradox: run AC1 on Tables C and D from \xA72.6 and you get **0.200 for both** \u2014 the same value, correctly reflecting that they have identical raw agreement, where \u03BA reported 0.200 vs 0.310. Verify this yourself in Lab 2.2; it's a satisfying confirmation that the alternative chance model is doing real work rather than just rescaling.

AC2 is the ordinal-weighted version. R's \`irrCAC\` package computes both with CIs. This is worth the R detour.

**Practical recommendation for eval work:** report **weighted \u03BA *and* AC2 *and* raw agreement *and* the marginal distributions**. When \u03BA and AC2 diverge sharply, prevalence is doing the work, and AC2 is closer to what you actually want to know.

### 2.8 The Landis & Koch problem

The famous table:

| \u03BA | Label |
|---|---|
| < 0.00 | Poor |
| 0.00\u20130.20 | Slight |
| 0.21\u20130.40 | Fair |
| 0.41\u20130.60 | Moderate |
| 0.61\u20130.80 | Substantial |
| 0.81\u20131.00 | Almost perfect |

Landis & Koch (1977) offered these explicitly as **arbitrary benchmarks with no empirical basis**, in a paper about something else. They have since been cited tens of thousands of times as though they were derived.

The correct stance: **there is no context-free interpretation of \u03BA.** The bar depends on the stakes. A \u03BA of 0.55 might be fine for triaging which briefs to review manually and catastrophic for a metric you report to a school board. State your bar *before* you compute, and justify it by decision consequence.

If you must cite a convention, cite Krippendorff's 0.80/0.667 and note it's stricter, or cite Koo & Li (2016) for ICC. Citing Landis & Koch without noting its arbitrariness is a tell that someone learned this from a blog post.

### 2.9 Confidence intervals

**Report a CI on every agreement statistic.** This is non-negotiable and near-universally skipped.

Analytic SEs exist for \u03BA (Fleiss, Cohen & Everitt, 1969) but rely on asymptotics that behave badly with skewed marginals \u2014 exactly your situation. **Use the bootstrap:** resample *items* (not ratings) with replacement, recompute the coefficient, take the 2.5/97.5 percentiles. 2,000 resamples.

Rough scale for intuition: at n = 100 and \u03BA \u2248 0.7, the 95% CI is roughly \xB10.12. At n = 50, roughly \xB10.18. **A 50-item validation set cannot distinguish "fair" from "substantial."**

Sample size planning: Donner & Eliasziw (1992) and Flack et al. (1988) give formulas. Practically, simulate: assume your expected \u03BA and marginals, simulate at various n, find where CI width drops below what you need to make your decision.

---

## 3. The failure mode

**Reporting a single unweighted \u03BA against Landis & Koch on a skewed 100-item sample, with no CI, and calling the judge validated.**

Every clause is a problem:

- *unweighted* on ordinal data \u2014 throws away the distinction between near-misses and gross errors
- *Landis & Koch* \u2014 arbitrary bands presented as thresholds
- *skewed sample* \u2014 prevalence paradox deflating \u03BA, likely leading you to reject a fine judge
- *100 items* \u2014 CI \xB10.12, so most version-over-version comparisons are noise
- *"validated"* \u2014 agreement is reliability evidence, not validity evidence. A judge that agrees perfectly with a human applying a bad rubric is reliably measuring the wrong thing. (Week 4.)

**A second, subtler failure:** computing \u03BA between two LLM judges and reporting it as inter-rater reliability. Correlated errors between models from the same family inflate this badly. Judge-judge \u03BA is a *consistency* check; only judge-human \u03BA against an independently-derived standard is reliability evidence in the sense you want.

---

## 4. Read

**Primary:**

- **Feinstein, A.R. & Cicchetti, D.V. (1990). "High agreement but low kappa: I. The problems of two paradoxes."** *J Clinical Epidemiology*. **This is the essential reading of the week.** Read the companion (Cicchetti & Feinstein, "II. Resolving the paradoxes") too.
- **Gwet, K. (2008). "Computing inter-rater reliability and its variance in the presence of high agreement."** *British J Mathematical and Statistical Psychology*. The AC1 derivation.

**Supporting:**
- **Krippendorff, K. (2018). *Content Analysis: An Introduction to Its Methodology* (4th ed.)**, Ch. 12 on reliability. Krippendorff's framing \u2014 coming from content analysis rather than testing \u2014 is closest in spirit to eval work.
- **Landis, J.R. & Koch, G.G. (1977).** Skim it. Notice how casually the famous table is introduced. That's the lesson.
- **Zheng, L. et al. (2023). "Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena."** For how the field currently handles this, and what it omits.

## 5. Theory exercises

**2.1** Compute Cohen's \u03BA by hand:

| | B: 1 | B: 2 | B: 3 |
|---|---|---|---|
| **A: 1** | 20 | 5 | 0 |
| **A: 2** | 5 | 30 | 10 |
| **A: 3** | 0 | 5 | 25 |

> N = 100. $p_o = (20+30+25)/100 = 0.75$.
> A marginals: 25, 45, 30 \u2192 0.25, 0.45, 0.30. B marginals: 25, 40, 35 \u2192 0.25, 0.40, 0.35.
> $p_e = (0.25)(0.25) + (0.45)(0.40) + (0.30)(0.35) = 0.0625 + 0.18 + 0.105 = 0.3475$.
> $\\kappa = (0.75 - 0.3475)/(1 - 0.3475) = 0.4025/0.6525 = \\mathbf{0.617}$

**2.2** Same table, linear weighted \u03BA. Weights $w_{ij} = |i-j|/2$.

> Disagreement weights: adjacent = 0.5, distance-2 = 1.0.
> Observed weighted disagreement: $0.5(5 + 5 + 10 + 5) + 1.0(0 + 0) = 0.5(25) = 12.5$, so $12.5/100 = 0.125$.
> Expected counts $e_{ij} = 100 \\cdot p_{i\\cdot} p_{\\cdot j}$:
> (1,2): 100(0.25)(0.40) = 10; (2,1): 100(0.45)(0.25) = 11.25; (2,3): 100(0.45)(0.35) = 15.75; (3,2): 100(0.30)(0.40) = 12 \u2192 adjacent sum = 49.0
> (1,3): 100(0.25)(0.35) = 8.75; (3,1): 100(0.30)(0.25) = 7.5 \u2192 distance-2 sum = 16.25
> Expected weighted disagreement $= [0.5(49.0) + 1.0(16.25)]/100 = [24.5 + 16.25]/100 = 0.4075$.
> $\\kappa_w = 1 - 0.125/0.4075 = 1 - 0.3068 = \\mathbf{0.693}$
>
> Weighted \u03BA (0.693) > unweighted (0.617), because disagreements are concentrated in adjacent cells. **This is the normal pattern for a well-built ordinal rubric** \u2014 and reporting the unweighted value understates your instrument.

**2.3** For Table A in \xA72.6, compute the Prevalence Index and Bias Index. Interpret.

> PI $= |0.85 - 0.05| = 0.80$ (very high). BI $= |0.05 - 0.05| = 0.00$ (none).
> Diagnosis: \u03BA is deflated by prevalence, not distorted by bias. The 0.444 understates the raters' actual concordance. Report AC1 (0.878) as the primary figure and explain why.

**2.4** Show algebraically that PABAK equals \u03BA when marginals are balanced at 0.5/0.5 in a 2\xD72.

> With balanced marginals, $p_e = (0.5)(0.5) + (0.5)(0.5) = 0.5$. Then $\\kappa = \\frac{p_o - 0.5}{1 - 0.5} = 2p_o - 1 = \\text{PABAK}$. \u220E So PABAK is precisely "what \u03BA would be if marginals were balanced."

**2.5** Your judge and human agree on 88 of 100 items. Judge passes 92; human passes 90. Compute \u03BA and AC1. Which do you report and why?

> Cells: let $a$ = both pass. Judge pass 92, human pass 90, agreement 88. Solve: $a + d = 88$, $a + b = 92$ (judge pass), $a + c = 90$ (human pass), total 100. From these: $b = 92 - a$, $c = 90 - a$, $d = 88 - a$, and $a+b+c+d = 100$ \u2192 $a + (92-a) + (90-a) + (88-a) = 100$ \u2192 $270 - 2a = 100$ \u2192 $a = 85$. So $a=85, b=7, c=5, d=3$.
> $p_o = 0.88$. $p_e = (0.92)(0.90) + (0.08)(0.10) = 0.828 + 0.008 = 0.836$. $\\kappa = (0.88-0.836)/0.164 = \\mathbf{0.268}$ \u2014 "fair," looks terrible.
> AC1: $\\pi_{\\text{pass}} = (0.92+0.90)/2 = 0.91$, $\\pi_{\\text{fail}} = 0.09$. $p_e = (0.91)(0.09) + (0.09)(0.91) = 0.1638$. $\\text{AC1} = (0.88 - 0.1638)/0.8362 = \\mathbf{0.856}$.
> PI $= |0.85 - 0.03| = 0.82$. Extreme prevalence.
> **Report both, lead with AC1, and show the marginals.** Reporting \u03BA = 0.27 alone would lead you to scrap a judge that is performing well. This exact scenario is why teams throw away working judges.

**Lab 2.3 \u2014 Bootstrap CIs.**

\`\`\`python
def bootstrap_ci(rater_a, rater_b, stat_fn, n_boot=2000, seed=0):
    """Bootstrap CI for an agreement statistic. Resamples ITEMS, not ratings."""
    rng = np.random.default_rng(seed)
    n = len(rater_a)
    stats = []
    for _ in range(n_boot):
        idx = rng.integers(0, n, n)
        stats.append(stat_fn(rater_a[idx], rater_b[idx]))
    return np.percentile(stats, [2.5, 97.5])
\`\`\`

Apply to your pilot data. Then run a **sample-size study**: simulate ratings at a plausible true \u03BA and marginals, and find the n at which the CI half-width drops below 0.05. Report that number. It's usually larger than people expect \u2014 often 300\u2013500 items for a tight estimate on skewed data.

**Lab 2.4 \u2014 Correlated judges.** Take two judges from the same model family and one from a different one. Compute all pairwise \u03BA. If the same-family pair agrees markedly more with each other than either does with the outsider, you have evidence of correlated error. Quantify the gap. This is the empirical form of Week 1's Lab 1.4.

---`,w3:`# Week 3 \u2014 ICC and Generalizability Theory

> **Outcome:** You can select the correct ICC form for a design and defend it; run a G-study that decomposes error into named sources; and use a D-study to make the budget decision \u2014 more items or more raters \u2014 with numbers instead of instinct.

---

## 1. Orientation

Week 2 gave you agreement. Agreement is a two-rater, one-number answer to a question that usually has more structure.

The real question in eval design is a resource-allocation question: **you have a fixed annotation budget. Do you spend it on more items, more raters, or more prompts per item?** Kappa cannot answer this. Generalizability Theory was invented specifically to answer it, in 1972, and is essentially unknown in ML.

G-theory is the highest-leverage material in this course. It is also the least represented in the LLM eval literature, which means it's where you can do something nobody else in your space is doing.

---

## 2. Core ideas

### 2.1 Why ICC, not kappa

Kappa is for categories. When ratings are ordinal-treated-as-continuous, or when you have more than two raters whose identities matter, or when you want to know about *agreement in absolute level* versus *agreement in ranking*, you want the intraclass correlation.

ICC is a ratio of variance components:

$$\\text{ICC} = \\frac{\\text{variance between targets}}{\\text{variance between targets} + \\text{error variance}}$$

Which is the CTT reliability definition from Week 1, estimated via ANOVA. The subtlety is entirely in *what goes in the denominator*.

### 2.2 The six ICC forms

Shrout & Fleiss (1979), extended by McGraw & Wong (1996). Three decisions:

**Decision 1 \u2014 Model:**
- **One-way random:** each target rated by a *different* random set of raters. (Different judges per item.)
- **Two-way random:** the same raters rate all targets, and raters are a *random sample* from a population you want to generalize to. (You want to claim "any competent judge would.")
- **Two-way mixed:** the same raters rate all targets, and these are *the only raters of interest*. (You want to claim "our three production judges.")

**Decision 2 \u2014 Type:**
- **Absolute agreement:** do raters give the same *value*? Systematic rater severity counts as error.
- **Consistency:** do raters *rank* targets the same way? Systematic severity is excluded from error.

**Decision 3 \u2014 Unit:**
- **Single rater** \u2014 reliability of one rating
- **Average of k raters** \u2014 reliability of the mean

**The eval-specific insight, which is the whole reason to learn this distinction:**

> If you are **comparing two prompt versions** (a ranking decision), judge severity cancels out and you want **consistency**.
> If you are **gating on an absolute threshold** ("ship if quality \u2265 3.5"), judge severity does *not* cancel, and you must use **absolute agreement**.

Teams routinely report a consistency ICC and then use the instrument for absolute gating. The consistency ICC is always \u2265 the absolute one, often substantially, so this systematically overstates the instrument's fitness for the decision being made.

**The formulas** (from a two-way ANOVA with $n$ targets, $k$ raters; MS_R = between-targets/rows, MS_C = between-raters/columns, MS_E = residual, MS_W = within-target):

| Form | Formula |
|---|---|
| ICC(1,1) \u2014 one-way, single | $\\dfrac{MS_R - MS_W}{MS_R + (k-1)MS_W}$ |
| ICC(2,1) \u2014 two-way random, absolute, single | $\\dfrac{MS_R - MS_E}{MS_R + (k-1)MS_E + \\frac{k(MS_C - MS_E)}{n}}$ |
| ICC(3,1) \u2014 two-way mixed, consistency, single | $\\dfrac{MS_R - MS_E}{MS_R + (k-1)MS_E}$ |
| ICC(\xB7,k) \u2014 average of k | replace $(k-1)MS_E$ with 0 in the denominator and drop the $/k$ scaling; equivalently apply Spearman\u2013Brown to ICC(\xB7,1) |

Note that ICC(3,1) is just ICC(2,1) with the rater-severity term removed from the denominator. That term \u2014 $\\frac{k(MS_C - MS_E)}{n}$ \u2014 *is* the severity penalty, and it's exactly what you drop when you only care about ranking.

**Interpretation** (Koo & Li, 2016 \u2014 a better convention than Landis & Koch, and it says so): <0.5 poor, 0.5\u20130.75 moderate, 0.75\u20130.90 good, >0.90 excellent. Still conventional, still context-dependent, but at least it comes with a rationale and a reporting checklist.

### 2.3 Generalizability Theory: the reframe

CTT lumps everything that isn't true score into one undifferentiated $E$. G-theory (Cronbach, Gleser, Nanda & Rajaratnam, 1972) asks: **error from what?**

The vocabulary:

- **Object of measurement** \u2014 what you're trying to measure and rank. In eval work this is usually *the system* or *the brief*. Getting this right is the crux; see \xA72.6.
- **Facets** \u2014 sources of variation you'd like to generalize over: rater, item, occasion, prompt template, ordering.
- **Universe of admissible observations** \u2014 the full space of conditions you'd accept as equivalent measurements.
- **G-study** \u2014 estimate the variance contributed by each facet and each interaction.
- **D-study** \u2014 use those components to project reliability under *different designs*, so you can choose one.

The G-study/D-study split is the crucial idea. You run one expensive, fully-crossed pilot. Then you can answer, analytically, "what happens if I use 5 items and 2 raters instead of 20 items and 1 rater?" \u2014 without running that study.

### 2.4 The p \xD7 r design

Simplest useful case: every brief ($p$) rated by every rater ($r$). Variance decomposes:

$$\\sigma^2_{\\text{total}} = \\sigma^2_p + \\sigma^2_r + \\sigma^2_{pr,e}$$

- $\\sigma^2_p$ \u2014 **true variance.** Briefs genuinely differ in quality. This is signal; you want it large.
- $\\sigma^2_r$ \u2014 **rater main effect.** Some raters are systematically harsher. Affects absolute decisions only.
- $\\sigma^2_{pr,e}$ \u2014 **interaction plus residual.** Raters disagree about *which* briefs are good, inconsistently. Pure noise; confounded with residual in a single-occasion design.

Two coefficients:

**Generalizability coefficient (relative decisions \u2014 ranking):**
$$E\\rho^2 = \\frac{\\sigma^2_p}{\\sigma^2_p + \\sigma^2_\\delta}, \\qquad \\sigma^2_\\delta = \\frac{\\sigma^2_{pr,e}}{n_r}$$

**Dependability coefficient (absolute decisions \u2014 thresholds):**
$$\\Phi = \\frac{\\sigma^2_p}{\\sigma^2_p + \\sigma^2_\\Delta}, \\qquad \\sigma^2_\\Delta = \\frac{\\sigma^2_r}{n_r} + \\frac{\\sigma^2_{pr,e}}{n_r}$$

$\\Phi \\leq E\\rho^2$ always, and the gap between them is exactly the cost of rater severity.

### 2.5 A worked D-study

Suppose a G-study on briefs \xD7 raters yields:

| Component | Estimate | % of total |
|---|---|---|
| $\\sigma^2_p$ (briefs) | 0.60 | 50% |
| $\\sigma^2_r$ (raters) | 0.10 | 8% |
| $\\sigma^2_{pr,e}$ | 0.50 | 42% |

**Read the percentages first.** Only half your variance is signal. 42% is rater-by-brief interaction \u2014 raters disagreeing about which briefs are good. That's a *rubric clarity* problem, not a *number of raters* problem, and no amount of averaging fixes the rubric.

Now project:

| $n_r$ | $\\sigma^2_\\delta$ | $E\\rho^2$ | $\\sigma^2_\\Delta$ | $\\Phi$ |
|---|---|---|---|---|
| 1 | 0.500 | 0.545 | 0.600 | 0.500 |
| 2 | 0.250 | 0.706 | 0.300 | 0.667 |
| 3 | 0.167 | **0.783** | 0.200 | **0.750** |
| 5 | 0.100 | 0.857 | 0.120 | 0.833 |
| 10 | 0.050 | 0.923 | 0.060 | 0.909 |

(Verify one row: $n_r = 3$. $\\sigma^2_\\delta = 0.50/3 = 0.1667$; $E\\rho^2 = 0.60/0.7667 = 0.783$. $\\sigma^2_\\Delta = 0.10/3 + 0.50/3 = 0.0333 + 0.1667 = 0.200$; $\\Phi = 0.60/0.80 = 0.750$. \u2713)

**What this table tells you, concretely:**

1. Single-rater eval is at $E\\rho^2 = 0.545$ \u2014 barely more than half signal. Do not make ship decisions on single-rating data.
2. Three raters gets you to 0.78 relative / 0.75 absolute. Reasonable for comparative work; thin for absolute gating.
3. Getting to 0.90 absolute needs ~10 raters. **That's the moment to stop and rewrite the rubric instead.** Reducing $\\sigma^2_{pr,e}$ from 0.50 to 0.25 gets you to $\\Phi = 0.837$ with three raters \u2014 cheaper than tripling your annotation cost.
4. The $E\\rho^2$\u2013$\\Phi$ gap is ~0.03 here because $\\sigma^2_r$ is small. If judge severity were large (say 0.40), the gap would widen sharply and absolute gating would become much more expensive than ranking.

**Cross-check with Week 1:** Spearman\u2013Brown on $\\rho = 0.545$ at $k=3$ gives $\\frac{3(0.545)}{1+2(0.545)} = 0.783$. Identical to $E\\rho^2$. G-theory *contains* Spearman\u2013Brown as a special case \u2014 but it also tells you which facet to multiply, which Spearman\u2013Brown cannot.

### 2.6 Choosing the object of measurement

This is where G-theory applied to evals gets genuinely subtle, and where you'll differentiate yourself.

**The object of measurement depends on the claim you're making.**

- Claim: *"Brief #482 is good."* \u2192 object = brief. Items and raters are facets.
- Claim: *"Prompt version B produces better briefs than version A."* \u2192 object = **prompt version**. Briefs are now a *facet* (you're generalizing over which briefs you happened to sample), and brief-to-brief variance moves from signal to error.
- Claim: *"Our brief generator is good."* \u2192 object = system. Both briefs and raters are facets.

That second case is the one everyone gets wrong. When you're comparing prompt versions, the variance across the sampled briefs is *error*, and if you have 20 briefs and a big $\\sigma^2_p$, your comparison has far less power than the per-brief reliability suggests. This is the formal version of "our eval set is too small," and G-theory quantifies exactly how much too small.

### 2.7 Multi-facet designs

Real eval designs have more facets. A brief \xD7 rater \xD7 dimension design, or brief \xD7 rater \xD7 occasion (to catch judge drift, Week 5).

Fully crossed p \xD7 r \xD7 o gives seven components: $\\sigma^2_p, \\sigma^2_r, \\sigma^2_o, \\sigma^2_{pr}, \\sigma^2_{po}, \\sigma^2_{ro}, \\sigma^2_{pro,e}$.

- $\\sigma^2_o$ large \u2192 judge drift over time (model updates, temperature)
- $\\sigma^2_{po}$ large \u2192 items rated inconsistently across occasions; possibly item ambiguity
- $\\sigma^2_{ro}$ large \u2192 raters drift differently from each other

Crossed vs. nested matters: if different briefs get different raters, raters are *nested within* briefs and you cannot separate $\\sigma^2_r$ from $\\sigma^2_{pr,e}$. **Design your pilot fully crossed even though it's more expensive**, because a crossed G-study lets you evaluate nested D-study designs, and not vice versa.

### 2.8 Estimation

Classical estimation uses ANOVA expected mean squares. It's fine for balanced designs and gives negative variance estimates for small components (set them to zero and note it).

Modern practice: **mixed-effects models.** In R:

\`\`\`r
library(lme4)
m <- lmer(score ~ 1 + (1|brief) + (1|rater), data = ratings)
VarCorr(m)  # variance components
\`\`\`

Random effects with crossed grouping factors handle unbalanced data gracefully \u2014 which your real data will be. Python's \`statsmodels\` MixedLM does not handle crossed random effects well; this is one of the two places R earns its keep in this course.

---

## 3. The failure mode

**Averaging three judges and reporting the mean without knowing what averaging bought.**

Averaging is Spearman\u2013Brown applied blindly. It helps only against the *interaction/residual* component. It does nothing against a shared bias \u2014 if all three judges prefer longer briefs, averaging three of them gives you a more precise estimate of a biased quantity. Precision without accuracy.

**The second failure: reporting consistency ICC while making absolute decisions.** Covered in \xA72.2 and worth repeating because it's so common. Check any eval you inherit for this.

**The third: never doing a D-study, and therefore never knowing that the rubric is the bottleneck.** When $\\sigma^2_{pr,e}$ dominates, more raters is throwing money at a problem that costs an afternoon of rubric writing to fix. Almost nobody knows which situation they're in, because almost nobody decomposes the variance.

---

## 4. Read

**Primary:**
- **Shrout, P.E. & Fleiss, J.L. (1979). "Intraclass correlations: uses in assessing rater reliability."** *Psychological Bulletin*. The canonical form taxonomy.
- **Koo, T.K. & Li, M.Y. (2016). "A Guideline of Selecting and Reporting Intraclass Correlation Coefficients for Reliability Research."** *J Chiropractic Medicine*. The practical selection guide; the decision tree in it is genuinely useful. Read this before Shrout & Fleiss if you're short on time.
- **Brennan, R.L. (2001). *Generalizability Theory*.** Chapters 1\u20133. The definitive text. Dense but the first three chapters are approachable.

**Supporting:**
- **Shavelson, R.J. & Webb, N.M. (1991). *Generalizability Theory: A Primer*.** Much gentler than Brennan. If Brennan is heavy going, start here \u2014 it's a slim book and you can read it in an evening.
- **Cronbach, L.J., Gleser, G.C., Nanda, H. & Rajaratnam, N. (1972). *The Dependability of Behavioral Measurements*.** The founding text. Skim the introduction for the framing; the rest is for reference.
- **Miller, E. "Adding Error Bars to Evals: A Statistical Approach to Language Model Evaluations."** The closest thing the ML field has to this material \u2014 variance decomposition and clustered standard errors for benchmarks. Read it and note which G-theory concepts it independently rediscovers.

---

## 5. Theory exercises

**3.1** Given $\\sigma^2_p = 0.80$, $\\sigma^2_r = 0.05$, $\\sigma^2_{pr,e} = 0.60$: compute $E\\rho^2$ and $\\Phi$ for $n_r = 1, 2, 4$.

> $n_r=1$: $\\sigma^2_\\delta = 0.60$, $E\\rho^2 = 0.80/1.40 = 0.571$. $\\sigma^2_\\Delta = 0.05 + 0.60 = 0.65$, $\\Phi = 0.80/1.45 = 0.552$.
> $n_r=2$: $\\sigma^2_\\delta = 0.30$, $E\\rho^2 = 0.80/1.10 = 0.727$. $\\sigma^2_\\Delta = 0.025 + 0.30 = 0.325$, $\\Phi = 0.80/1.125 = 0.711$.
> $n_r=4$: $\\sigma^2_\\delta = 0.15$, $E\\rho^2 = 0.80/0.95 = 0.842$. $\\sigma^2_\\Delta = 0.0125+0.15 = 0.1625$, $\\Phi = 0.80/0.9625 = 0.831$.

**3.2** Same components. Suppose instead you halve $\\sigma^2_{pr,e}$ to 0.30 by rewriting the rubric, keeping $n_r = 1$. Compare to 3.1's $n_r = 4$ result.

> $\\sigma^2_\\delta = 0.30$, $E\\rho^2 = 0.80/1.10 = 0.727$; $\\Phi = 0.80/(0.80+0.35) = 0.696$.
> So halving interaction variance with one rater \u2248 what two raters bought you, at zero marginal annotation cost. **Rubric work has better unit economics than rater work whenever $\\sigma^2_{pr,e}$ is large.** Internalize this.

**3.3** A G-study on briefs \xD7 raters yields $\\sigma^2_p = 0.20$, $\\sigma^2_r = 0.15$, $\\sigma^2_{pr,e} = 0.90$. Diagnose.

> Signal is 16% of total variance. Interaction is 71%. This instrument is measuring almost nothing. Adding raters is nearly futile: even $n_r = 10$ gives $E\\rho^2 = 0.20/(0.20+0.09) = 0.690$.
> Two possibilities: (a) the rubric is ambiguous, or (b) the briefs genuinely don't differ much (range restriction from Week 1). Distinguish them by checking the score distribution. If briefs are all clustered at 3\u20134, it's (b) and you need harder items, not a better rubric.

**3.4** Explain why $\\Phi \\leq E\\rho^2$ always.

> $\\sigma^2_\\Delta = \\frac{\\sigma^2_r}{n_r} + \\frac{\\sigma^2_{pr,e}}{n_r} \\geq \\frac{\\sigma^2_{pr,e}}{n_r} = \\sigma^2_\\delta$, since $\\sigma^2_r \\geq 0$. Larger denominator \u2192 smaller coefficient. Equality iff $\\sigma^2_r = 0$, i.e. no rater severity differences. \u220E

**3.5** You're comparing prompt v1 vs v2 on 25 briefs with 2 raters. Object of measurement is the prompt version. Which variance components are now error?

> $\\sigma^2_p$ (brief-to-brief) becomes error, divided by $n_p = 25$. So does rater variance and all interactions. Only the prompt-version main effect is signal. With 25 briefs and substantial brief-to-brief variance, your effective n for the comparison is 25, not 50 ratings \u2014 the two ratings per brief are not independent observations of the prompt version. **This is why paired designs (same briefs, both versions) are so much more powerful here**: they remove $\\sigma^2_p$ from the comparison entirely.

---

Then reproduce ICC(2,1) and ICC(3,1) by hand from the ANOVA table using the \xA72.2 formulas. Matching them is the exercise.

**Lab 3.2 \u2014 G-study, by hand and by lme4.** On the same simulated data (or your pilot), extract variance components two ways:

*ANOVA route (Python):* fit a two-way ANOVA, get MS_R, MS_C, MS_E, and solve the expected mean square equations:
- $\\hat\\sigma^2_{pr,e} = MS_E$
- $\\hat\\sigma^2_r = (MS_C - MS_E)/n$
- $\\hat\\sigma^2_p = (MS_R - MS_E)/k$

*Mixed model route (R):* \`lmer(score ~ 1 + (1|brief) + (1|rater))\`, read \`VarCorr\`.

They should agree on balanced data. Then delete 15% of ratings at random and rerun both. The ANOVA route breaks; the mixed model doesn't. That's why you learn both.

**Lab 3.3 \u2014 D-study function.** Write:

\`\`\`python
def d_study(var_p, var_r, var_pre, n_r_range):
    """Project G and Phi coefficients across rater counts."""
    rows = []
    for n_r in n_r_range:
        var_delta = var_pre / n_r
        var_Delta = var_r / n_r + var_pre / n_r
        rows.append({
            "n_raters": n_r,
            "G_rho2": var_p / (var_p + var_delta),
            "Phi":    var_p / (var_p + var_Delta),
        })
    return pd.DataFrame(rows)
\`\`\`

Verify against the \xA72.5 table (0.60, 0.10, 0.50 \u2192 row $n_r=3$ should give 0.783 / 0.750).

Then extend to a **two-facet** version (raters and items) and produce a 2D grid: rows = number of items, columns = number of raters, cells = $\\Phi$. Overlay a cost surface (annotation cost per rating). **Find the cheapest cell that clears your target $\\Phi$.** That is a real budget decision made with real numbers, and it is the deliverable of this week.

**Lab 3.4 \u2014 The rubric-vs-raters tradeoff.** Plot $\\Phi$ as a function of $\\sigma^2_{pr,e}$ (x-axis) for $n_r \\in \\{1,2,3,5\\}$ (separate lines). Mark your current position. The plot shows, visually, whether you're in "buy raters" territory or "fix rubric" territory.
