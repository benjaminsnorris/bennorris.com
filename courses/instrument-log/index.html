## 4. Success criteria

You've completed this course when you can:

**Diagnose.** Given someone else's eval, identify in fifteen minutes: what construct is claimed, what's actually measured, which of Kane's inferences is weakest, whether the reliability evidence supports the decisions being made, and which construct-irrelevant variance sources are unexamined.

**Build.** Design an instrument from construct definition through cut score, with a defensible justification at every step.

**Budget.** Answer "should we add raters or items or fix the rubric?" with a D-study rather than an opinion.

**Defend.** Hand a skeptical outsider a document that survives their questions, including the ones you'd rather they didn't ask.

**Recognize.** When someone proposes an eval methodology, know which piece of psychometrics they're reinventing, and whether their version is better or worse than the one from 1972.

---

## 5. Where this goes next

**For Cadence.** A brief-quality instrument with a technical manual is a product asset, not just an engineering one. When a district asks how you know the AI output is good, "here is our measurement instrument and its validity evidence" is a categorically different answer than "we test it a lot." It's also the shape of answer that procurement and evaluation committees in education are already trained to read \u2014 districts run this playbook on curriculum products constantly. You'd be speaking their language rather than asking them to learn yours.

The generalization is worth thinking about: **every AI feature that produces a judged output needs an instrument.** If you build the instrument-development process once, as a Cadence capability, that's a durable differentiator in a market where everyone else ships a vibes-based quality score.

**For your own practice.** The three habits with the longest half-life:

1. **Always report SEM or CI.** Never a bare point estimate. This alone will make you noticeably more careful than the room.
2. **Always ask what would make this score high without the property being present.** It's the fastest route to finding construct-irrelevant variance.
3. **Always identify the weakest inference, not the weakest statistic.** Kane's principle. It redirects effort from where measurement is easy to where the argument is fragile.

**Where to go deeper,** in rough order of return:

- **Structural equation modeling and confirmatory factor analysis** \u2014 the modern way to test internal structure and measurement invariance rigorously. Kline's *Principles and Practice of SEM* is the standard.
- **Bayesian measurement models** \u2014 better uncertainty quantification, natural handling of hierarchical eval data. HiBayES (Luettgau et al., 2025) is the AI-eval-specific entry point.
- **Computerized adaptive testing** \u2014 selecting the next item to maximize information. Directly applicable to adaptive eval sets that spend budget where it discriminates. van der Linden & Glas is the reference.
- **Cognitive diagnostic models** \u2014 instead of one $\\theta$, estimate a profile of mastered skills. The right framework for capability-profile evals, and largely unexplored in AI.

---

## 6. A closing note on why this is worth having done

The reason classical psychometrics keeps getting badly reinvented is that each individual piece looks obvious in isolation. Of course you should correct for chance agreement. Of course you should check whether your measure is affected by length. Of course you should know what your threshold means.

What's hard is the discipline of doing all of it, in order, and writing down what you found \u2014 including the parts that undermine your own metric.

That discipline is the actual skill. The statistics are just how you express it.

## Part I \u2014 Formula sheet

### Classical Test Theory

| Quantity | Formula | Notes |
|---|---|---|
| True score model | $X = T + E$ | $T$ = expected score over infinite replications |
| Variance decomposition | $\\sigma^2_X = \\sigma^2_T + \\sigma^2_E$ | requires $\\text{cov}(T,E)=0$ |
| Reliability | $\\rho_{XX'} = \\sigma^2_T / \\sigma^2_X$ | property of instrument **and population** |
| Standard error of measurement | $\\text{SEM} = \\sigma_X\\sqrt{1-\\rho_{XX'}}$ | in score units; report this |
| 95% score band | $X \\pm 1.96\\,\\text{SEM}$ | |
| Standard error of difference | $\\text{SE}_{\\text{diff}} = \\text{SEM}\\sqrt{2}$ | for comparing two scores |
| Spearman\u2013Brown | $\\rho_{\\text{new}} = \\dfrac{k\\rho}{1+(k-1)\\rho}$ | $k$ = multiplication factor; assumes parallel |
| Attenuation | $r_{xy(\\text{obs})} = r_{xy(\\text{true})}\\sqrt{\\rho_{xx}\\rho_{yy}}$ | |
| Correction for attenuation | $r_{xy(\\text{true})} = \\dfrac{r_{xy(\\text{obs})}}{\\sqrt{\\rho_{xx}\\rho_{yy}}}$ | >1.0 means an assumption broke |
| Validity ceiling | $r_{xy} \\leq \\sqrt{\\rho_{xx}}$ | compare judges to human\u2013human, not to 1.0 |
| Cronbach's alpha | $\\alpha = \\dfrac{k}{k-1}\\left(1 - \\dfrac{\\sum\\sigma^2_i}{\\sigma^2_{\\text{total}}}\\right)$ | lower bound; prefer McDonald's $\\omega$ |

### Agreement

General form for all chance-corrected coefficients:
$$\\text{coefficient} = \\frac{p_o - p_e}{1 - p_e}$$
They differ **only** in how $p_e$ is estimated.

| Coefficient | $p_e$ | Use when |
|---|---|---|
| Cohen's \u03BA | $\\sum_k \\frac{n_{k\\cdot}}{N}\\cdot\\frac{n_{\\cdot k}}{N}$ | 2 raters, nominal, complete |
| Weighted \u03BA | see below | 2 raters, **ordinal** |
| Fleiss' \u03BA | $\\sum_j p_j^2$ (pooled marginals) | \u22653 interchangeable raters |
| Krippendorff's \u03B1 | $1 - D_o/D_e$ | any raters, any level, **missing data OK** |
| Gwet's AC1/AC2 | $\\frac{1}{q-1}\\sum_k \\pi_k(1-\\pi_k)$ | **skewed marginals** \u2014 paradox-resistant |
| PABAK | (implicit) | $= 2p_o - 1$; bound, not headline |

**Weighted kappa:**
$$\\kappa_w = 1 - \\frac{\\sum_{i,j} w_{ij}o_{ij}}{\\sum_{i,j} w_{ij}e_{ij}}$$
Linear weights: $w_{ij} = |i-j|/(k-1)$. Quadratic: $w_{ij} = (i-j)^2/(k-1)^2$.

**Fleiss' kappa** ($n$ items, $m$ raters, $k$ categories, $n_{ij}$ = raters assigning item $i$ to category $j$):
$$P_i = \\frac{1}{m(m-1)}\\left[\\sum_j n_{ij}^2 - m\\right],\\quad \\bar P = \\tfrac{1}{n}\\sum_i P_i,\\quad p_j = \\tfrac{1}{nm}\\sum_i n_{ij},\\quad \\bar P_e = \\sum_j p_j^2$$

**Paradox diagnostics (2\xD72):**
- Prevalence Index $= |p_{11} - p_{22}|$ \u2014 high \u2192 \u03BA **deflated**
- Bias Index $= |p_{12} - p_{21}|$ \u2014 high \u2192 \u03BA **inflated**

### ICC

Two-way ANOVA: $MS_R$ (targets/rows), $MS_C$ (raters/columns), $MS_E$ (residual), $MS_W$ (within).

| Form | Formula | Use |
|---|---|---|
| ICC(1,1) | $\\dfrac{MS_R - MS_W}{MS_R + (k-1)MS_W}$ | different raters per target |
| ICC(2,1) | $\\dfrac{MS_R - MS_E}{MS_R + (k-1)MS_E + \\frac{k(MS_C - MS_E)}{n}}$ | same raters, random sample, **absolute** |
| ICC(3,1) | $\\dfrac{MS_R - MS_E}{MS_R + (k-1)MS_E}$ | same raters, fixed, **consistency** |
| ICC(\xB7,k) | Spearman\u2013Brown applied to ICC(\xB7,1) | reliability of the mean of $k$ |

**Selection:** absolute agreement for threshold decisions; consistency for ranking decisions.
**Bands** (Koo & Li 2016): <0.50 poor \xB7 0.50\u20130.75 moderate \xB7 0.75\u20130.90 good \xB7 >0.90 excellent.

### Generalizability Theory

p \xD7 r crossed design:
$$\\sigma^2_{\\text{total}} = \\sigma^2_p + \\sigma^2_r + \\sigma^2_{pr,e}$$

| Coefficient | Formula | Error term | Use for |
|---|---|---|---|
| Generalizability $E\\rho^2$ | $\\dfrac{\\sigma^2_p}{\\sigma^2_p + \\sigma^2_\\delta}$ | $\\sigma^2_\\delta = \\dfrac{\\sigma^2_{pr,e}}{n_r}$ | **relative** (ranking) |
| Dependability $\\Phi$ | $\\dfrac{\\sigma^2_p}{\\sigma^2_p + \\sigma^2_\\Delta}$ | $\\sigma^2_\\Delta = \\dfrac{\\sigma^2_r}{n_r} + \\dfrac{\\sigma^2_{pr,e}}{n_r}$ | **absolute** (thresholds) |

$\\Phi \\leq E\\rho^2$ always. The gap is the cost of rater severity.

Variance components from ANOVA (balanced, $n$ targets \xD7 $k$ raters):
$$\\hat\\sigma^2_{pr,e} = MS_E,\\quad \\hat\\sigma^2_r = \\frac{MS_C - MS_E}{n},\\quad \\hat\\sigma^2_p = \\frac{MS_R - MS_E}{k}$$

Or via mixed model: \`lmer(score ~ 1 + (1|target) + (1|rater))\`.

### IRT

| Model | Formula |
|---|---|
| Rasch / 1PL | $P(X=1\\mid\\theta) = \\dfrac{1}{1+e^{-(\\theta - b)}}$ |
| 2PL | $P(X=1\\mid\\theta) = \\dfrac{1}{1+e^{-a(\\theta - b)}}$ |
| Graded Response (ordinal) | $P(X \\geq k\\mid\\theta) = \\dfrac{1}{1+e^{-a(\\theta - b_k)}}$ |
| MFRM | $\\log\\dfrac{P_{nijk}}{P_{nijk-1}} = \\theta_n - \\delta_i - \\gamma_j - \\tau_k$ |

Item information (2PL): $I(\\theta) = a^2 P(\\theta)(1-P(\\theta))$
Standard error: $SE(\\theta) = 1/\\sqrt{I(\\theta)}$

Fit statistics (MFRM/Rasch): infit/outfit MNSQ, expected \u2248 1.0.
**> 1.5** = noisy/misfitting rater. **< 0.5** = overfitting (redundant, echoing another rater).

### Classical item analysis

| Statistic | Formula | Flags |
|---|---|---|
| Difficulty | $p$ = proportion correct | $p>0.95$ or $p<0.05$: dead weight |
| Point-biserial | corr(item, corrected total) | $<0.20$ weak; $<0$ **broken** |
| Discrimination index | $D = p_{\\text{upper 27\\%}} - p_{\\text{lower 27\\%}}$ | $>0.40$ good |
| Item variance (dichotomous) | $p(1-p)$ | max 0.25 at $p=0.5$ |

### Content validity

$$\\text{CVR} = \\frac{n_e - N/2}{N/2}$$
$n_e$ = panelists rating "essential", $N$ = panel size. CVI = mean CVR over retained items.

## Part III \u2014 Decision guides

### Which agreement coefficient?

\`\`\`
Ordinal scale?
\u251C\u2500 YES \u2192 Weighted \u03BA (quadratic) AND Gwet's AC2
\u2502         Add Krippendorff's \u03B1 (ordinal) if data is ragged
\u2514\u2500 NO (nominal)
   \u251C\u2500 2 raters, complete data \u2192 Cohen's \u03BA + AC1
   \u251C\u2500 \u22653 interchangeable raters, complete \u2192 Fleiss' \u03BA
   \u2514\u2500 Ragged / missing data \u2192 Krippendorff's \u03B1

ALWAYS ALSO REPORT:
  \u2022 raw agreement
  \u2022 marginal distributions for every rater
  \u2022 bootstrap 95% CI
  \u2022 Prevalence Index and Bias Index (2\xD72)

IF pass rate > 0.85 \u2192 \u03BA is deflated. Lead with AC1/AC2 and say why.
\`\`\`

### Which ICC?

\`\`\`
Do different targets get different raters?
\u251C\u2500 YES \u2192 ICC(1,\xB7)
\u2514\u2500 NO (same raters throughout)
   \u2502
   Do you want to generalize to OTHER raters?
   \u251C\u2500 YES \u2192 two-way RANDOM
   \u2514\u2500 NO (these raters only) \u2192 two-way MIXED
   \u2502
   Is your decision about ABSOLUTE level or RANKING?
   \u251C\u2500 ABSOLUTE (threshold, gate) \u2192 absolute agreement \u2192 ICC(2,1)
   \u2514\u2500 RANKING (which version wins) \u2192 consistency \u2192 ICC(3,1)
   \u2502
   Reporting one rating or the mean of k?
   \u251C\u2500 one  \u2192 ICC(\xB7,1)
   \u2514\u2500 mean \u2192 ICC(\xB7,k)
\`\`\`

### More raters, more items, or fix the rubric?

\`\`\`
Run a G-study. Look at the percentages.

\u03C3\xB2_p small (<25% of total)
  \u2192 Range restriction OR the instrument measures nothing.
    Check the score distribution first.
    Fix: harder criteria, or more heterogeneous targets.

\u03C3\xB2_pr,e large (>40%)
  \u2192 Raters disagree about WHICH targets are good.
    Fix: THE RUBRIC. BARS anchors. Retranslation.
    More raters is expensive and only partially effective.

\u03C3\xB2_r large
  \u2192 Systematic severity differences.
    Fix: severity adjustment (mixed model / MFRM), or use
    consistency statistics if ranking is all you need.
    Adding raters does NOT fix this for absolute decisions.

All modest, just need more precision
  \u2192 Run the D-study. Buy the cheapest facet.
\`\`\`

### Is this a validity problem or a reliability problem?

\`\`\`
Are scores unstable across raters/occasions?
\u251C\u2500 YES \u2192 reliability. Weeks 2, 3, 5.
\u2514\u2500 NO \u2014 scores are stable
   \u2502
   Would a target with the property score low? (or vice versa)
   \u251C\u2500 Property present, scores low  \u2192 construct UNDERrepresentation
   \u251C\u2500 Property absent, scores high  \u2192 construct-IRRELEVANT variance
   \u2514\u2500 Neither \u2192 check the inference chain (Kane, W4):
        \u2022 Does the sample represent the universe?  \u2192 generalization
        \u2022 Does the test setting resemble real use? \u2192 extrapolation
        \u2022 Is the decision rule appropriate?        \u2192 implication
\`\`\`

## Part IV \u2014 Reporting checklist

Print this. Check it before any eval result leaves your desk.

**Every reported score:**
- [ ] Point estimate **with** SEM or CI
- [ ] Sample size and population description
- [ ] Instrument version

**Every reliability claim:**
- [ ] Coefficient named precisely (which \u03BA? which ICC form?)
- [ ] Confidence interval
- [ ] Marginal distributions / score distribution
- [ ] Population it was estimated on
- [ ] Pre-adjudication, not post

**Every comparison between two conditions:**
- [ ] Is the difference larger than $1.96 \\times \\text{SEM}\\sqrt{2}$?
- [ ] Correct object of measurement (are you generalizing over items? over raters?)
- [ ] Paired design if possible
- [ ] Clustered SEs if items are nested

**Every threshold:**
- [ ] Method by which it was set
- [ ] Performance level description
- [ ] Impact data
- [ ] Classification consistency at the cut

**Every instrument change:**
- [ ] Anchor set re-rated
- [ ] Prior reliability evidence marked as version-specific
- [ ] Drift log entry`,reading:`# Reading List

Annotated. Ordered by how much you'll actually use it.

## The three books worth buying

**Furr, R.M. \u2014 *Psychometrics: An Introduction* (4th ed., 2021)**
The best single-volume introduction. Written for people who need to build instruments, not for statisticians. Chapters 5\u20136 on reliability are the clearest treatment of CTT anywhere. Start here and keep it on the desk.

**Shavelson, R.J. & Webb, N.M. \u2014 *Generalizability Theory: A Primer* (1991)**
Slim, readable, and covers the highest-leverage material in this course. Brennan's *Generalizability Theory* (2001) is the definitive reference, but this is the one you'll finish. Read it in an evening.

**Cizek, G.J. & Bunch, M.B. \u2014 *Standard Setting* (2007)**
The practical manual for cut scores. Buy it the moment you need to defend a threshold to anyone who might push back \u2014 which, for Cadence externalization, is soon.

## Papers, by week

### Week 1 \u2014 Measurement and CTT

**Jacobs, A.Z. & Wallach, H. (2021). "Measurement and Fairness." FAccT '21.**
\u2605 The paper that brings construct validity theory into ML. Short, precise, directly on target. If you read one modern paper from this list, this one.

**AERA/APA/NCME (2014). *Standards for Educational and Psychological Testing*.**
The field's normative document, with legal standing in the US. Read the Introduction and Chapter 1. The point is to see what a mature measurement discipline demands as a matter of course.

**Raji, I.D., Bender, E.M., Paullada, A., Denton, E. & Hanna, A. (2021). "AI and the Everything in the Whole Wide World Benchmark." NeurIPS D&B.**
The construct-validity critique of general-purpose benchmarks. Polemical and correct.

**Nunnally, J.C. & Bernstein, I.H. \u2014 *Psychometric Theory* (3rd ed., 1994).**
Reference, not reading. Where the 0.70 alpha convention comes from, in context \u2014 Nunnally proposed it for early-stage research, not consequential decisions.

### Week 2 \u2014 Agreement

**Feinstein, A.R. & Cicchetti, D.V. (1990). "High agreement but low kappa: I. The problems of two paradoxes." *J Clinical Epidemiology* 43(6).**
\u2605\u2605 **Essential.** Read with the companion: Cicchetti & Feinstein, "II. Resolving the paradoxes." Together they're the reason your production \u03BA looks worse than your eval quality.

**Cohen, J. (1960). "A Coefficient of Agreement for Nominal Scales." *Educational and Psychological Measurement* 20(1).**
The original. Cohen is unusually explicit about what the chance model assumes, which later citations forget.

**Cohen, J. (1968). "Weighted kappa."** The ordinal extension.

**Gwet, K. (2008). "Computing inter-rater reliability and its variance in the presence of high agreement." *British J Mathematical and Statistical Psychology* 61.**
The AC1 derivation. The alternative chance model is genuinely better-motivated than Cohen's for skewed data.

**Krippendorff, K. \u2014 *Content Analysis: An Introduction to Its Methodology* (4th ed., 2018), Ch. 12.**
\u03B1's derivation and rationale. Krippendorff comes from content analysis rather than testing, which makes his framing closest to eval work.

**Landis, J.R. & Koch, G.G. (1977). "The measurement of observer agreement for categorical data." *Biometrics* 33(1).**
Skim. Notice how casually the famous benchmark table is introduced, in a paper about something else. That's the lesson.

**Byrt, T., Bishop, J. & Carlin, J.B. (1993). "Bias, prevalence and kappa." *J Clinical Epidemiology* 46(5).**
PABAK and the prevalence/bias indices.

**Zheng, L. et al. (2023). "Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena." NeurIPS.**
The reference point for current practice. Read for what it does and what it omits.

### Week 3 \u2014 ICC and G-theory

**Koo, T.K. & Li, M.Y. (2016). "A Guideline of Selecting and Reporting Intraclass Correlation Coefficients for Reliability Research." *J Chiropractic Medicine* 15(2).**
\u2605 The practical selection guide, with a usable decision tree. Read before Shrout & Fleiss if short on time.

**Shrout, P.E. & Fleiss, J.L. (1979). "Intraclass correlations: uses in assessing rater reliability." *Psychological Bulletin* 86(2).**
The canonical form taxonomy. Everything since is an extension.

**McGraw, K.O. & Wong, S.P. (1996). "Forming inferences about some intraclass correlation coefficients." *Psychological Methods* 1(1).**
Extends Shrout & Fleiss; clarifies the absolute-vs-consistency distinction. Also the source of several published errata worth being aware of.

**Brennan, R.L. \u2014 *Generalizability Theory* (2001), Ch. 1\u20133.**
The definitive text. Dense, but the first three chapters are approachable and contain most of what you need.

**Cronbach, L.J., Gleser, G.C., Nanda, H. & Rajaratnam, N. (1972). *The Dependability of Behavioral Measurements*.**
The founding text. Skim the introduction for framing; the rest is reference.

**Miller, E. "Adding Error Bars to Evals: A Statistical Approach to Language Model Evaluations."**
\u2605 The closest thing ML has to this material. Variance decomposition and clustered standard errors for benchmarks. Read it and note which G-theory concepts it independently rediscovers \u2014 a good calibration on how far behind the field is and where it's catching up.

### Week 4 \u2014 Validity

**Kane, M.T. (2013). "Validating the Interpretations and Uses of Test Scores." *J Educational Measurement* 50(1).**
\u2605\u2605 **The central paper of this course.** The argument-based framework. Read it twice.

**Messick, S. (1995). "Validity of Psychological Assessment." *American Psychologist* 50(9).**
\u2605 The compact statement of unified validity and the two threats. Twelve pages, all load-bearing.

**Messick, S. (1989). "Validity." In *Educational Measurement* (3rd ed.).**
The full-length version. Reference.

**Campbell, D.T. & Fiske, D.W. (1959). "Convergent and discriminant validation by the multitrait-multimethod matrix." *Psychological Bulletin* 56(2).**
The four criteria and the worked matrices. Criterion 3 is the one your rubric will fail.

**Cronbach, L.J. & Meehl, P.E. (1955). "Construct Validity in Psychological Tests." *Psychological Bulletin* 52(4).**
Historical, but the nomological network argument is worth reading in the original.

**Bean, A. et al. (2025). "Measuring what Matters: Construct Validity in Large Language Model Benchmarks." NeurIPS Datasets & Benchmarks.**
\u2605 Systematic review of 445 benchmark papers against construct-validity criteria, with a usable checklist. Apply the checklist to your own instrument. The findings are the empirical case for this entire course.

**Eriksson, M. et al. (2025). "Can We Trust AI Benchmarks? An Interdisciplinary Review of Current Issues in AI Evaluation."** EC Joint Research Centre.
Taxonomy of benchmark failure modes. Useful for vocabulary and for citing to non-technical stakeholders.

**Wang, X. et al. "Evaluating General-Purpose AI with Psychometrics." *Communications of the ACM*.**
The general argument for importing psychometrics into AI evaluation, written for a broad technical audience. Good to hand to a colleague who needs convincing that this material is relevant.

**Bowman, S.R. & Dahl, G. (2021). "What Will It Take to Fix Benchmarking in Natural Language Understanding?" NAACL.**
Pre-dates most of the LLM eval boom and holds up well.

### Week 5 \u2014 Raters and rubrics

**Myford, C.M. & Wolfe, E.W. (2003, 2004). "Detecting and Measuring Rater Effects Using Many-Facet Rasch Measurement," Parts I and II. *J Applied Measurement*.**
\u2605\u2605 The best treatment of rater effects anywhere. Part I: the effects and their signatures. Part II: detection. Every LLM-judge failure mode is in here with a name and a remedy.

**Smith, P.C. & Kendall, L.M. (1963). "Retranslation of expectations: An approach to the construction of unambiguous anchors for rating scales." *J Applied Psychology* 47(2).**
The BARS original. The retranslation procedure is the transferable part and the part everyone skips.

**Linacre, J.M. (1989). *Many-Facet Rasch Measurement*, Ch. 1\u20133.**
The MFRM model and fit statistic interpretation.

**Engelhard, G. (2013). *Invariant Measurement: Using Rasch Models in the Social, Behavioral, and Health Sciences*.**
Rater-mediated assessment as a measurement problem. Strong on the conceptual framing.

**Bond, T. & Fox, C. (2015). *Applying the Rasch Model* (3rd ed.).**
The accessible entry to Rasch. Sets up Week 6 too.

### Week 6 \u2014 Items, IRT, cut scores

**Embretson, S.E. & Reise, S.P. (2000). *Item Response Theory for Psychologists*, Ch. 1\u20135.**
\u2605 Best conceptual introduction to IRT. Written explicitly for people who know CTT.

**Samejima, F. (1969). "Estimation of latent ability using a response pattern of graded scores." *Psychometrika* Monograph 17.**
The graded response model. Technical; read for the model statement.

**Cizek, G.J. & Bunch, M.B. (2007). *Standard Setting*.**
Angoff, bookmark, contrasting groups, borderline group. The practical manual.

**Angoff, W.H. (1971). "Scales, norms, and equivalent scores." In *Educational Measurement* (2nd ed.).**
The original Angoff method, described almost in passing in a footnote \u2014 a nice parallel to Landis & Koch.

**Holland, P.W. & Wainer, H., eds. (1993). *Differential Item Functioning*.**
The DIF reference. Read the introductory chapters and the Mantel-Haenszel chapter.

**Polo, F.M. et al. (2024). "tinyBenchmarks: Evaluating LLMs with Fewer Examples."**
\u2605 IRT applied to benchmark subsampling. The clearest existing example of this material used in ML, and a good template for what you could build.

**Zhou, L. et al. (2025). "General Scales Unlock AI Evaluation with Explanatory and Predictive Power."**
Latent-trait framing of AI capability evaluation. Worth reading as a signal of where the field is heading.

**Luettgau, L., Coppock, H., Dubois, M., Summerfield, C. & Ududec, C. (2025). "HiBayES: A Hierarchical Bayesian Modeling Framework for AI Evaluation Statistics."**
The Bayesian route to the same variance-decomposition problems G-theory solves. Read after Week 3 for the contrast.

**Reuel, A. et al. (2024). "BetterBench: Assessing AI Benchmarks, Uncovering Issues, and Establishing Best Practices."**
Benchmark construction best practices grounded in measurement theory. Useful as a checklist.

---

## Where to go after the course

**Kline, R.B. \u2014 *Principles and Practice of Structural Equation Modeling* (5th ed.)**
CFA and measurement invariance done properly. The rigorous version of Week 4's internal-structure evidence and Week 6's invariance question.

**van der Linden, W.J. & Glas, C.A.W., eds. \u2014 *Computerized Adaptive Testing: Theory and Practice***
Item selection to maximize information. Directly applicable to adaptive eval sets.

**Rupp, A.A., Templin, J. & Henson, R.A. \u2014 *Diagnostic Measurement: Theory, Methods, and Applications***
Cognitive diagnostic models. Instead of one $\\theta$, a profile of mastered skills \u2014 the right framework for capability-profile evals, and essentially unexplored in AI.

**DeVellis, R.F. \u2014 *Scale Development: Theory and Applications* (5th ed.)**
The practical how-to for building scales from scratch. Complements Furr.

**Haladyna, T.M. & Rodriguez, M.C. \u2014 *Developing and Validating Test Items***
Item-writing craft. Underrated; most benchmark items are badly written in ways this book catalogues.

---

## A note on access

Most of the classical papers are behind paywalls but findable through institutional access, Google Scholar's alternate-versions links, or the authors' own pages. The modern AI-eval papers are all on arXiv or OpenReview.

The three books are worth buying outright. Furr especially \u2014 you'll reach for it repeatedly, and a borrowed copy is a false economy for a reference you'll use for years.

@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Spectral:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

.root{
  --ground:#E9EBE3; --panel:#F6F7F2; --ink:#1B2430; --ink2:#5A6472; --ink3:#8A9280;
  --rule:#C6CABE; --marker:#A02C2C; --band:#4A6FA5; --band-soft:rgba(74,111,165,0.16);
  background:var(--ground); color:var(--ink);
  font-family:'Archivo',system-ui,sans-serif; font-size:15px; line-height:1.55;
  min-height:100vh; padding-bottom:2rem; -webkit-font-smoothing:antialiased;
}
.root *{box-sizing:border-box}
.root button{font-family:inherit;cursor:pointer}
.root :focus-visible{outline:2px solid var(--marker);outline-offset:2px}
.loading{padding:4rem 2rem;font-family:'IBM Plex Mono',monospace;color:var(--ink2)}

.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);display:block;margin-bottom:.4rem}
.mono{font-family:'IBM Plex Mono',monospace}

/* Masthead */
.masthead{border-bottom:1px solid var(--rule);padding:1.5rem 2rem 0;max-width:1300px;margin:0 auto}
.masthead-top{display:flex;justify-content:space-between;align-items:flex-start;gap:1.5rem;flex-wrap:wrap}
.masthead h1{font-family:'Spectral',Georgia,serif;font-weight:600;font-size:clamp(1.35rem,3vw,2rem);line-height:1.1;margin:0;letter-spacing:-.015em}
.rule-dash{color:var(--marker);padding:0 .3rem;font-weight:500}
.masthead-tools{display:flex;flex-direction:column;align-items:flex-end;gap:.6rem}
.tabs{display:flex;border:1px solid var(--rule);background:var(--panel)}
.tab{background:none;border:0;padding:.45rem .85rem;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--ink2);border-right:1px solid var(--rule)}
.tab:last-child{border-right:0}
.tab.on{background:var(--ink);color:var(--panel)}

.search{position:relative}
.search-input{width:230px;padding:.4rem .6rem;border:1px solid var(--rule);background:var(--panel);font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink)}
.search-input:focus{outline:1px solid var(--band)}
.results{position:absolute;right:0;top:100%;z-index:30;width:420px;max-width:80vw;max-height:340px;overflow-y:auto;background:var(--panel);border:1px solid var(--ink);box-shadow:0 6px 22px rgba(27,36,48,.16)}
.result{display:flex;flex-direction:column;gap:.15rem;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:.55rem .7rem}
.result:hover{background:var(--band-soft)}
.result-src{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--marker)}
.result-text{font-size:12.5px;color:var(--ink2);line-height:1.4}

.masthead-band{padding:1.35rem 0 1.1rem}
.band-caption{font-size:12px;color:var(--ink2);margin:.8rem 0 0;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.status{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.status.ok{color:var(--band)} .status.bad{color:var(--marker)}

/* Score band */
.band{position:relative;width:100%}
.band-rule{position:absolute;top:14px;left:0;right:0;height:1px;background:var(--rule)}
.band-interval{position:absolute;top:6px;height:17px;background:var(--band-soft);border-top:1px solid var(--band);border-bottom:1px solid var(--band);transition:left .5s cubic-bezier(.2,.7,.3,1),width .5s cubic-bezier(.2,.7,.3,1)}
.band-cap{position:absolute;top:4px;height:21px;width:1px;background:var(--band);transition:left .5s cubic-bezier(.2,.7,.3,1)}
.band-point{position:absolute;top:0;height:29px;width:2px;background:var(--marker);transform:translateX(-1px);transition:left .5s cubic-bezier(.2,.7,.3,1)}
.band-point-label{position:absolute;top:-4px;left:6px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--marker);white-space:nowrap}
.band-ticks{position:absolute;top:30px;left:0;right:0;height:14px}
.band-tick{position:absolute;transform:translateX(-50%);font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--ink3);letter-spacing:.06em;padding-top:3px;border-top:1px solid var(--rule)}
@media (prefers-reduced-motion:reduce){.band-interval,.band-cap,.band-point{transition:none}}

/* Course */
.course{max-width:1300px;margin:0 auto;padding:1.5rem 2rem;display:grid;grid-template-columns:210px 1fr;gap:2rem;align-items:start}
.rail{display:flex;flex-direction:column;border-top:1px solid var(--rule);position:sticky;top:1rem}
.rail-item{display:grid;grid-template-columns:auto 1fr;gap:.1rem .6rem;align-items:baseline;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:.6rem .4rem .6rem .1rem;color:var(--ink2)}
.rail-item:hover{background:var(--panel)}
.rail-item.on{color:var(--ink);background:var(--panel);box-shadow:inset 2px 0 0 var(--marker)}
.rail-n{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--ink3)}
.rail-item.on .rail-n{color:var(--marker)}
.rail-item.done .rail-n{color:var(--band)}
.rail-title{font-size:12.5px;line-height:1.3;font-weight:500}
.pips{grid-column:2;display:flex;gap:3px;margin-top:.3rem}
.pip{width:12px;height:3px;background:var(--rule);display:block}
.pip.on{background:var(--band)}

.panel{background:var(--panel);border:1px solid var(--rule);padding:1.6rem 2rem 2rem;min-width:0}
.doc{max-width:1080px;margin:0 auto;padding:1.5rem 2rem;background:transparent}

.taskbar{display:flex;gap:.4rem;flex-wrap:wrap;padding-bottom:1rem;border-bottom:1px solid var(--rule);margin-bottom:.9rem;position:sticky;top:0;background:var(--panel);z-index:10;padding-top:.3rem}
.taskchip{display:flex;align-items:center;gap:.45rem;border:1px solid var(--rule);background:var(--ground);color:var(--ink2);padding:.35rem .7rem;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.taskchip.on{border-color:var(--band);color:var(--band)}
.task-box{width:12px;height:12px;border:1.5px solid var(--ink3);flex:none;position:relative}
.taskchip.on .task-box{background:var(--band);border-color:var(--band)}
.taskchip.on .task-box::after{content:"";position:absolute;left:3px;top:0;width:3px;height:7px;border:solid var(--panel);border-width:0 2px 2px 0;transform:rotate(42deg)}

.sectionnav{display:flex;gap:.35rem;overflow-x:auto;padding-bottom:.9rem;margin-bottom:.4rem;border-bottom:1px solid var(--rule)}
.secchip{flex:none;background:none;border:1px solid var(--rule);color:var(--ink2);padding:.22rem .55rem;font-size:11px;white-space:nowrap}
.secchip:hover{border-color:var(--band);color:var(--band)}

/* Prose */
.prose{max-width:74ch}
.prose p{margin:0 0 .95rem;font-size:15px;line-height:1.62}
.prose .md-h{font-family:'Spectral',Georgia,serif;font-weight:600;line-height:1.2;scroll-margin-top:70px}
.prose .md-h1{font-size:1.75rem;margin:.4rem 0 .9rem;letter-spacing:-.015em}
.prose .md-h2{font-size:1.3rem;margin:2.2rem 0 .8rem;padding-top:.5rem;border-top:1px solid var(--rule)}
.prose .md-h3{font-size:1.08rem;margin:1.6rem 0 .6rem}
.prose .md-h4{font-size:.95rem;margin:1.2rem 0 .5rem;font-family:'Archivo',sans-serif;font-weight:700}
.prose hr{border:0;border-top:1px solid var(--rule);margin:1.8rem 0}
.prose strong{font-weight:600;color:var(--ink)}
.prose em{font-style:italic}
.prose code{font-family:'IBM Plex Mono',monospace;font-size:.86em;background:var(--ground);padding:.1em .32em;border:1px solid var(--rule)}
.prose a{color:var(--band);text-decoration:underline;text-underline-offset:2px}
.xref{background:none;border:0;padding:0;color:var(--band);text-decoration:underline;text-underline-offset:2px;font:inherit}
.xref:hover{color:var(--marker)}

.md-code{background:var(--ink);color:#E4E7DF;padding:.9rem 1rem;overflow-x:auto;font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.6;margin:0 0 1.1rem;border-left:2px solid var(--marker)}
.md-code code{background:none;border:0;padding:0;color:inherit;font-size:inherit}

.prose blockquote{margin:0 0 1.1rem;padding:.75rem 1rem;background:var(--ground);border-left:2px solid var(--marker)}
.prose blockquote p{margin:0 0 .4rem;font-size:14px;color:var(--ink2)}
.prose blockquote p:last-child{margin:0}

.answer{margin:0 0 1.1rem}
.answer-toggle{display:inline-flex;align-items:center;gap:.4rem;background:var(--ground);border:1px solid var(--rule);color:var(--ink2);padding:.28rem .7rem;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
.answer-toggle:hover{border-color:var(--marker);color:var(--marker)}
.answer-caret{font-weight:600;font-size:12px;line-height:1}
.answer-body{margin-top:.5rem;padding:.75rem 1rem;background:var(--ground);border-left:2px solid var(--band)}
.answer-body p{margin:0 0 .5rem;font-size:14px;color:var(--ink2)}
.answer-body p:last-child{margin:0}

.md-list{margin:0 0 1.1rem;padding-left:1.15rem}
.md-list li{margin-bottom:.35rem;line-height:1.55}
.md-list li.nested{margin-left:.9rem;font-size:14px;color:var(--ink2)}
.md-task{list-style:none;margin-left:-1.15rem}
.check{display:flex;gap:.6rem;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:.35rem .2rem;font-size:14px;color:var(--ink2);line-height:1.45}
.check:hover{color:var(--ink)}
.check-mark{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--rule);flex:none;margin-top:5px}
.check.on .check-mark{background:var(--marker);border-color:var(--marker)}
.check.on{color:var(--ink)}

.md-table-wrap{overflow-x:auto;margin:0 0 1.2rem;border:1px solid var(--rule);background:var(--ground)}
.md-table{width:100%;border-collapse:collapse;font-size:13px}
.md-table th{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);text-align:left;font-weight:500;padding:.5rem .7rem;border-bottom:1px solid var(--ink);white-space:nowrap}
.md-table td{padding:.45rem .7rem;border-bottom:1px solid var(--rule);vertical-align:top;line-height:1.45}
.md-table tr:last-child td{border-bottom:0}

.tex-inline,.tex-block{font-family:'Spectral',Georgia,serif;font-style:italic;white-space:nowrap}
.tex-block{display:block;margin:0 0 1.2rem;padding:.85rem 0;overflow-x:auto;text-align:center;font-size:1.14em;white-space:normal}
.tex-inline .tx-text,.tex-block .tx-text{font-style:normal;font-family:'Archivo',sans-serif;font-size:.92em}
.tx-frac{display:inline-flex;flex-direction:column;vertical-align:-.44em;text-align:center;margin:0 .2em;font-size:.95em}
.tx-num{padding:0 .35em .06em;border-bottom:1px solid currentColor}
.tx-den{padding:.06em .35em 0}
.tx-sqrt{white-space:nowrap}
.tx-rad{border-top:1px solid currentColor;padding:0 .18em;margin-left:-.06em}
.tx-bar{border-top:1px solid currentColor;padding-top:.02em}
.tx-hat{position:relative;padding-top:.1em}
.tx-hat::before{content:"^";position:absolute;top:-.62em;left:50%;transform:translateX(-50%);font-size:.85em}
.tx-ss{display:inline-flex;flex-direction:column;vertical-align:.34em;line-height:1;font-size:.66em;margin-left:.06em;text-align:left}
.tx-sup{display:block;margin-bottom:.02em}
.tx-sub{display:block}
.tx-op{font-size:1.28em;font-style:normal;vertical-align:-.12em;padding:0 .04em}
.tx-quad{display:inline-block;width:1em}
.tx-qquad{display:inline-block;width:2em}
.tex-inline sub,.tex-inline sup,.tex-block sub,.tex-block sup{font-size:.68em}

.notes{margin-top:2.2rem;padding-top:1.2rem;border-top:1px solid var(--rule)}
.notes textarea{width:100%;background:var(--ground);border:1px solid var(--rule);padding:.8rem;font-family:'IBM Plex Mono',monospace;font-size:12.5px;line-height:1.65;color:var(--ink);resize:vertical}
.notes textarea:focus{outline:1px solid var(--band);border-color:var(--band)}
.btn{margin-top:.8rem;background:var(--ink);color:var(--panel);border:0;padding:.5rem 1rem;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.btn:hover{background:var(--marker)}

/* Bench */
.bench{max-width:1300px;margin:0 auto;padding:1.5rem 2rem;display:grid;grid-template-columns:repeat(2,1fr);gap:1.4rem;align-items:start}
.bench-intro{grid-column:1/-1;margin:0;max-width:62ch;color:var(--ink2);font-size:14.5px}
.instrument{background:var(--panel);border:1px solid var(--rule);padding:1.35rem}
.instrument.wide{grid-column:1/-1}
.instrument-head h3{font-family:'Spectral',Georgia,serif;font-weight:600;font-size:1.2rem;margin:0 0 .3rem}
.instrument-head p{margin:0 0 1rem;font-size:13.5px;color:var(--ink2);max-width:56ch}
.size-row{display:flex;align-items:center;gap:.35rem;margin-bottom:.85rem}
.size-row .field-label{margin:0 .5rem 0 0}
.chip{border:1px solid var(--rule);background:var(--ground);color:var(--ink2);padding:.18rem .55rem;font-family:'IBM Plex Mono',monospace;font-size:12px}
.chip.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.matrix-wrap{overflow-x:auto;margin-bottom:1rem}
.matrix{border-collapse:collapse}
.matrix th{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--ink3);padding:.25rem .5rem;text-align:center}
.matrix td{padding:1px}
.cell{width:60px;padding:.32rem .4rem;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:13px;border:1px solid var(--rule);background:var(--ground);color:var(--ink)}
.cell.diag{background:var(--band-soft);border-color:var(--band);font-weight:600}
.cell:focus{outline:1px solid var(--marker)}
.field-row{display:flex;flex-wrap:wrap;gap:.85rem;margin-bottom:1.1rem}
.field{display:flex;flex-direction:column;gap:.22rem}
.field-label{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)}
.field-input{width:84px;padding:.32rem .45rem;border:1px solid var(--rule);background:var(--ground);font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink)}
.field-input:focus{outline:1px solid var(--band)}

.printout{border-top:2px solid var(--ink);margin-top:1.1rem;padding-top:.45rem}
.printout-head{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-bottom:.3rem}
.printout-table{width:100%;border-collapse:collapse;font-family:'IBM Plex Mono',monospace;font-size:12.5px}
.printout-table td{padding:.26rem 0;border-bottom:1px dotted var(--rule);vertical-align:baseline}
.pr-label{color:var(--ink2)}
.pr-value{text-align:right;width:110px;font-weight:500;padding-left:.75rem}
.pr-note{text-align:right;color:var(--ink3);font-size:10.5px;padding-left:.75rem;width:128px}
.printout-table tr.emph .pr-value{color:var(--marker);font-weight:600;font-size:14px}
.printout-table tr.emph .pr-label{color:var(--ink)}
.printout-note{margin-top:.65rem;font-size:12.5px;color:var(--ink2);line-height:1.5}
.readout{margin-top:.9rem;padding:.75rem .85rem;background:var(--ground);border-left:2px solid var(--band)}
.readout p{margin:0 0 .45rem;font-size:13px;color:var(--ink2);line-height:1.5}
.readout p:last-child{margin:0}
.readout strong{color:var(--ink)}

.varsplit{display:flex;height:32px;margin-bottom:1rem;border:1px solid var(--rule)}
.varseg{display:flex;flex-direction:column;justify-content:center;align-items:center;font-family:'IBM Plex Mono',monospace;overflow:hidden;min-width:0;border-right:1px solid var(--panel)}
.varseg span{font-size:9.5px;letter-spacing:.06em;white-space:nowrap}
.varseg em{font-size:10px;font-style:normal;font-weight:600;opacity:.75}
.v-p{background:var(--band);color:#fff}
.v-r{background:var(--marker);color:#fff}
.v-e{background:var(--rule);color:var(--ink)}
.dtable{width:100%;border-collapse:collapse;font-size:13px}
.dtable th{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);text-align:left;font-weight:500;padding:.35rem .5rem .35rem 0;border-bottom:1px solid var(--ink)}
.dtable td{padding:.33rem .5rem .33rem 0;border-bottom:1px dotted var(--rule)}
.dtable tr.hit{background:var(--band-soft)}
.dtable tr.hit td{font-weight:600}
.dnote{color:var(--ink2);font-size:12px}

/* Record */
.record{max-width:1080px;margin:0 auto;padding:1.5rem 2rem}
.record-head h2{font-family:'Spectral',Georgia,serif;font-weight:600;font-size:1.5rem;margin:0 0 .35rem}
.record-head p{margin:0 0 1.4rem;color:var(--ink2);font-size:14px;max-width:62ch}
.record-table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--rule)}
.record-table th{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);text-align:left;font-weight:500;padding:.55rem .7rem;border-bottom:1px solid var(--ink)}
.record-table td{padding:.42rem .7rem;border-bottom:1px solid var(--rule);font-size:13px;vertical-align:middle}
.record-table .dim{color:var(--ink3);font-size:11.5px;white-space:nowrap}
.record-table .stat{color:var(--ink2)}
.record-table .val{color:var(--marker);font-weight:600}
.rec-input{width:100%;min-width:110px;border:0;border-bottom:1px solid var(--rule);background:none;font-family:inherit;font-size:13px;padding:.15rem 0;color:var(--ink)}
.rec-input:focus{outline:0;border-bottom-color:var(--band)}
.x{background:none;border:0;color:var(--ink3);font-size:17px;line-height:1;padding:0 .25rem}
.x:hover{color:var(--marker)}
.empty{background:var(--panel);border:1px dashed var(--rule);padding:2.2rem;text-align:center}
.empty p{margin:0 0 .35rem;color:var(--ink)}
.empty-sub{font-size:13px;color:var(--ink2)}

.foot-tools{display:flex;gap:1.1rem;align-items:center;flex-wrap:wrap}
.linkbtn{background:none;border:0;padding:0;color:var(--band);font:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.linkbtn:hover{color:var(--marker)}
.foot{max-width:1300px;margin:1.8rem auto 0;padding:1rem 2rem 0;border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}

@media (max-width:1000px){
  .course{grid-template-columns:1fr;gap:1.2rem;padding:1.1rem}
  .rail{flex-direction:row;overflow-x:auto;border-top:0;border-bottom:1px solid var(--rule);position:static}
  .rail-item{flex:none;width:158px;border-bottom:0;border-right:1px solid var(--rule)}
  .rail-item.on{box-shadow:inset 0 2px 0 var(--marker)}
  .bench{grid-template-columns:1fr;padding:1.1rem}
  .masthead,.record,.doc,.foot{padding-left:1.1rem;padding-right:1.1rem}
  .panel{padding:1rem}
  .masthead-tools{align-items:stretch;width:100%}
  .search-input{width:100%}
  .results{width:100%;right:auto;left:0}
  .prose{max-width:100%}
}
