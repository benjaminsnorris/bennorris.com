---`,w4:`# Week 4 \u2014 Validity

> **Outcome:** You can write an argument-based validity case for a score interpretation, distinguish construct underrepresentation from construct-irrelevant variance in your own instrument, design a multitrait-multimethod study, and explain why "is this eval valid?" is a malformed question.

---

## 1. Orientation

Weeks 1\u20133 were about *precision*: is the number stable? This week is about *meaning*: does the number license the claim you're making with it?

These are independent. A broken thermometer that always reads 72\xB0F is perfectly reliable and completely invalid. An LLM judge that agrees with itself at \u03BA = 0.95 while scoring on prose polish instead of actionability is a broken thermometer.

Validity is the harder half and the more neglected half. It is also the half where you cannot substitute computation for thinking \u2014 there is no \`validity_score()\` function, and the fact that people keep looking for one is the field's central confusion.

The single most important reframe:

> **Validity is not a property of a test. It is a property of an *interpretation* of test scores for a *particular use*.**

Your Today Brief rubric is not valid or invalid. The *inference* "a score of 4 on Actionability means a captain could act on this brief without opening Cadence" is valid or invalid, and it might be valid for captains and invalid for individual contributors, valid for weekly briefs and invalid for daily ones. Every validity claim carries an interpretation and a population.

---

## 2. Core ideas

### 2.1 The historical arc

Worth knowing because the field's terminology is layered sediment.

**1950s \u2014 the trinity.** Content validity, criterion validity, construct validity, treated as three separate types you could have some of. You still see this framing everywhere. It's superseded.

**1955 \u2014 Cronbach & Meehl, "Construct Validity in Psychological Tests."** The foundational paper. Introduces the **nomological network**: a construct is defined by its lawful relations to other constructs and to observables. You validate a construct by showing the measure behaves as the network predicts \u2014 correlating with what it should, not correlating with what it shouldn't, responding to interventions it should respond to.

The deep point: **you cannot validate a measure in isolation.** Validation is always simultaneously a test of the measure and of the theory. If your Actionability measure doesn't predict whether people act, either the measure is bad or your theory of actionability is wrong, and the data alone can't tell you which.

**1989 \u2014 Messick.** Collapses the trinity: **all validity is construct validity.** Content and criterion evidence are *kinds of evidence* bearing on a single unified judgment, not separate types. Also introduces **consequential validity** \u2014 the social consequences of test use are part of the validity argument.

**1992/2013 \u2014 Kane.** The argument-based approach, now the dominant framework. Validation is building and evaluating an **argument** with explicit inferential steps, each requiring warrant and backing. This is the one to actually use.

### 2.2 The two threats

Messick's most portable contribution. Every validity problem is one of these two:

**Construct underrepresentation** \u2014 the measure is too narrow. It misses parts of the construct.

*In evals:* your Groundedness dimension checks whether claims cite a source, but not whether the source says what the brief claims it says. Briefs that cite correctly and summarize wrongly score high. The construct is "grounded"; the operationalization is "has citations."

**Construct-irrelevant variance** \u2014 the measure captures things outside the construct. Scores move for reasons that aren't the construct.

*In evals:* this is where all the famous LLM-judge biases live, and naming them properly is worth doing:

| Eval-world name | Psychometric name |
|---|---|
| Verbosity/length bias | Construct-irrelevant variance (surface feature) |
| Position bias in pairwise comparison | Construct-irrelevant variance (administration artifact) |
| Self-enhancement bias (models prefer own outputs) | Construct-irrelevant variance (method effect) |
| Formatting/markdown preference | Construct-irrelevant variance (surface feature) |
| Sycophancy in judge prompts | Construct-irrelevant variance (demand characteristic) |

Naming them this way isn't pedantry \u2014 it connects each to a literature with established detection methods and remedies. Position bias is a *method effect*, and method effects are exactly what MTMM (\xA72.5) was built to detect.

**Diagnostic question for any rubric dimension:** *what would make a brief score high on this without actually having the property?* Every answer is construct-irrelevant variance you should test for. That question is worth asking about every dimension you own, this week.

### 2.3 Kinds of validity evidence

The 2014 *Standards* list five sources:

1. **Evidence based on test content** \u2014 do the items represent the construct domain? (Expert review, Lawshe's CVR.)
2. **Evidence based on response processes** \u2014 are raters actually doing what you think? (Think-alouds; for LLM judges, reading the reasoning traces.)
3. **Evidence based on internal structure** \u2014 do the dimensions relate as theory predicts? (Factor analysis, dimension correlations.)
4. **Evidence based on relations to other variables** \u2014 convergent, discriminant, criterion, predictive.
5. **Evidence based on consequences of testing** \u2014 what happens when this score is used to make decisions?

**Source 2 is the one evals uniquely can do well and almost never do.** You have the judge's chain of thought. Read it. A judge that assigns a 4 for the right reason and a judge that assigns a 4 because the brief was well-formatted are giving you the same number and completely different measurements. Sampling and coding judge rationales is a response-process study, it's cheap, and it's the highest-yield validity work available to you.

**Source 5 matters more than eval teams think.** When you ship a brief-quality metric, teams optimize it. If your metric rewards naming gaps, generators will name spurious gaps. Goodhart's law is consequential validity with a different name. Part of your validity argument must be a claim about what happens under optimization pressure.

### 2.4 Content validity: Lawshe's CVR

The one quantitative content-validity tool worth knowing. Panel of $N$ subject-matter experts rates each item as Essential / Useful but not essential / Not necessary:

$$\\text{CVR} = \\frac{n_e - N/2}{N/2}$$

where $n_e$ = number rating it Essential. Range \u22121 to +1. Zero means half the panel called it essential. Lawshe published minimum values by panel size for significance (e.g., ~0.62 for N=10, ~0.49 for N=14).

**Content Validity Index (CVI)** = mean CVR across retained items.

*Eval application, and it's a good one:* have 5\u20138 SchoolAI people who actually read briefs rate each rubric dimension for whether it's essential to brief quality. Dimensions with low CVR are ones you invented and nobody needs. Do the same for candidate dimensions you *didn't* include \u2014 high CVR on an omitted dimension is direct evidence of construct underrepresentation.

### 2.5 Convergent and discriminant validity: MTMM

Campbell & Fiske (1959), "Convergent and discriminant validation by the multitrait-multimethod matrix." One of the most cited papers in the social sciences and directly applicable to eval work.

**The setup:** measure multiple *traits* (constructs) by multiple *methods*. Build the full correlation matrix. Four blocks:

- **Monotrait-monomethod** (diagonal) \u2014 reliability
- **Monotrait-heteromethod** \u2014 same construct, different method \u2192 **convergent validity**
- **Heterotrait-monomethod** \u2014 different constructs, same method \u2192 **method effect / halo**
- **Heterotrait-heteromethod** \u2014 different constructs, different methods \u2192 should be lowest

**Campbell & Fiske's four criteria:**
1. Monotrait-heteromethod values should be substantial and significantly non-zero
2. Monotrait-heteromethod > heterotrait-heteromethod
3. Monotrait-heteromethod > heterotrait-monomethod *(the hard one)*
4. The pattern of trait interrelations should be the same in all blocks

**Criterion 3 is the killer, and it's where eval rubrics fail.** It says: two different measures of Actionability should correlate more with each other than Actionability and Groundedness measured the same way. If your rubric's dimensions correlate 0.85 with each other when rated by the same judge, but the same dimension rated by two different methods correlates only 0.60 \u2014 **your method is dominating your constructs.** You are not measuring five things; you are measuring one thing (general impression) five times.

**Designing an MTMM for a brief eval:**

*Traits:* Actionability, Groundedness, Scoping
*Methods:*
- (a) LLM judge with rubric
- (b) Human rater with rubric
- (c) A behavioral proxy \u2014 e.g., did the reader actually take the named action within 24h? Did they open Cadence after reading? Time-to-first-action?

Method (c) is what makes this a real study rather than a correlation matrix of two judges. Behavioral criteria are hard to get and worth disproportionate effort, because they're the only evidence that breaks out of the rubric's own frame. **You have an unusual advantage here: Cadence knows what people actually did.** Almost no one building LLM evals has access to downstream behavioral outcomes. Use it.

### 2.6 Kane's argument-based validity

The framework to actually adopt. Kane reframes validation as building an **Interpretation/Use Argument (IUA)** \u2014 a chain of inferences from observation to decision, each with a warrant and supporting backing.

The standard chain:

\`\`\`
OBSERVATION  \u2192  SCORE  \u2192  UNIVERSE SCORE  \u2192  TARGET DOMAIN  \u2192  DECISION
           scoring   generalization    extrapolation    implication
\`\`\`

**1. Scoring inference:** from observed performance to an observed score.
*Warrant:* the rubric was applied as intended.
*Backing:* rater training records, agreement statistics, judge reasoning-trace audit, adjudication protocol.
*Eval failure:* the judge silently used a different rubric version. Or ignored the rubric and used general impression.

**2. Generalization inference:** from this observed score to the expected score over the universe of admissible observations.
*Warrant:* these items/raters/occasions represent the universe.
*Backing:* **your G-study from Week 3.** This is exactly what generalizability coefficients license.
*Eval failure:* 30 hand-picked briefs, all from one team, generalized to "brief quality."

**3. Extrapolation inference:** from the universe score to the target domain \u2014 real-world performance.
*Warrant:* the test situation resembles the real situation in the ways that matter.
*Backing:* criterion validity evidence, behavioral outcomes, ecological validity arguments.
*Eval failure:* the biggest one in AI. Briefs rated in isolation by a rater with no stake, versus briefs read at 7am by a captain deciding what to do. Those are different situations, and scores from the first may not extrapolate to the second at all.

**4. Implication/decision inference:** from the target-domain claim to the decision.
*Warrant:* the decision rule is appropriate and consequences are acceptable.
*Backing:* cut-score justification (Week 6), consequence analysis, fairness evidence across subgroups.
*Eval failure:* shipping on a threshold nobody can justify.

**Kane's principle:** the argument is only as strong as its **weakest inference**. And validation effort should go to the *least plausible* link, not the easiest one to measure.

This is the most useful practical rule in validity theory, and it's a direct rebuke to eval practice. Teams pour effort into the scoring inference (judge-human agreement, \u03BA, prompt tuning) because it's measurable \u2014 and leave extrapolation completely unexamined, because it's hard. **Extrapolation is almost always the weakest link in an LLM eval.** Your \u03BA can be 0.9 and the whole argument still collapses at step 3.

### 2.7 The maxim

> **Reliability is necessary but not sufficient for validity.**

You can have a perfectly reliable measure of the wrong thing. Reliability caps validity (Week 1's attenuation result) but does not confer it. Almost all eval effort goes to reliability. Almost all eval *failure* is validity.

---

## 3. The failure mode

**Treating judge-human agreement as validation.** If a human and an LLM both apply the same flawed rubric consistently, you get high agreement and zero evidence that the rubric measures anything worth measuring. Agreement is backing for Kane's *scoring* inference only. It says nothing about generalization, extrapolation, or implication.

**Never testing for construct-irrelevant variance.** The diagnostic is cheap: hold the construct fixed and vary a surface feature. Take 20 briefs, produce a longer-but-not-better version of each, rate both. If scores rise, you have length bias, quantified. Almost nobody runs this experiment, and it takes an afternoon.

**Silent construct drift.** The rubric is edited across versions and the construct definition is never updated, so the operationalization slowly wanders away from the thing. Every rubric edit is a validity event. This is why Week 1 asked you to version rubrics explicitly.

**No behavioral criterion, ever.** Whole eval programs run for years with no evidence that scores relate to anything outside the eval. The scores become their own justification. This is the state of most of the benchmark ecosystem.

---

## 4. Read

**Primary:**
- **Kane, M.T. (2013). "Validating the Interpretations and Uses of Test Scores."** *J Educational Measurement*, 50(1). **The central reading of this course.** If you read one paper about validity, read this.
- **Messick, S. (1995). "Validity of Psychological Assessment."** *American Psychologist*. The compact statement of the unified view and the two threats. Twelve pages.
- **Campbell, D.T. & Fiske, D.W. (1959). "Convergent and discriminant validation by the multitrait-multimethod matrix."** *Psychological Bulletin*. Read for the four criteria and the worked matrices.

**Supporting:**
- **Cronbach, L.J. & Meehl, P.E. (1955). "Construct Validity in Psychological Tests."** *Psychological Bulletin*. Historical, but the nomological network argument is worth reading in the original.
- **AERA/APA/NCME (2014). *Standards*, Chapter 1.** The normative statement of the five evidence sources.
- **Bean, A. et al. (2025). "Measuring what Matters: Construct Validity in Large Language Model Benchmarks."** NeurIPS Datasets & Benchmarks. A systematic review of 445 benchmark papers against construct-validity criteria, with a checklist. **Use their checklist on your own instrument.** The headline findings \u2014 that a small minority report uncertainty estimates, and that construct definitions are frequently contested or unstated \u2014 are the empirical case for this whole course.
- **Jacobs & Wallach (2021)** \u2014 reread from Week 1 with Messick's vocabulary in hand. It reads differently.
- **Eriksson, M. et al. (2025). "Can We Trust AI Benchmarks? An Interdisciplinary Review."** EC Joint Research Centre. Taxonomy of benchmark failure modes.

---

## 5. Theory exercises

These are writing exercises. That's the discipline \u2014 validity is argued, not computed.

**4.1** For each, classify as construct underrepresentation or construct-irrelevant variance, and say what evidence would confirm it:

(a) Your Actionability rubric scores only whether actions are *named*, not whether they're *correct*.
(b) Judges score briefs higher when they use bulleted lists.
(c) Your Groundedness dimension can't detect a correct citation attached to a wrong claim.
(d) In pairwise comparison, the first-presented brief wins 58% of the time.
(e) Briefs about engineering topics score higher than briefs about people topics, at equal actual quality.

> (a) **Underrepresentation** \u2014 the construct includes action correctness; the operationalization omits it. Evidence: expert panel rates "action correctness" as essential (high CVR) but no item covers it.
> (b) **Irrelevant variance** \u2014 surface feature. Evidence: hold content constant, vary formatting, observe score shift.
> (c) **Underrepresentation** \u2014 same structure as (a).
> (d) **Irrelevant variance** \u2014 administration artifact. Evidence: it's already there. 58% \u2260 50% *is* the evidence. Remedy: randomize and average both orders.
> (e) **Irrelevant variance**, and specifically **differential item functioning** (Week 6) \u2014 score depends on topic conditional on quality. Evidence: match briefs on independently-assessed quality, compare scores by topic.

**4.2** Write the full IUA for this claim: *"A Today Brief scoring \u2265 4.0 on Actionability enables a captain to take correct next action without opening Cadence."*

For each of Kane's four inferences, state: the warrant, the backing you currently have, the backing you're missing, and your subjective plausibility (high/medium/low).

> No answer key \u2014 this is your Week 7 deliverable in miniature. But a strong response will rate **extrapolation as the weakest link** and will identify that you have essentially no backing for it, because nobody has ever measured whether captains actually act on briefs without opening Cadence. If your answer doesn't reach that conclusion, reread \xA72.6.

**4.3** Design a 3-trait \xD7 3-method MTMM for your instrument. Specify the traits, the three methods, and write the four Campbell-Fiske criteria as specific numeric predictions.

> Strong answers use a *behavioral* method as the third, not a third LLM judge. Two LLM judges are two instances of the same method \u2014 they share method variance, which defeats the point of the design.

**4.4** Your rubric's five dimensions all inter-correlate above 0.80 when rated by the same judge. Give three competing explanations and an experiment distinguishing them.

> (1) **Halo** \u2014 the judge forms a global impression and back-fills dimensions. (2) **Genuine positive manifold** \u2014 brief quality really is mostly one thing and your five dimensions are five indicators of it. (3) **Underrepresentation of the distinguishing content** \u2014 the dimensions differ conceptually but the rubric language doesn't operationalize the differences.
> Distinguishing experiment: **construct briefs that are deliberately high on one dimension and low on another** (a beautifully grounded brief with no actions; an actionable brief with fabricated grounding). If the judge still scores them uniformly, it's (1) or (3), not (2). Then have each dimension rated in a *separate* call with no visibility into the others \u2014 if correlations drop sharply, it's (1) halo. If they stay high on the deliberately-discordant briefs, it's (3).
>
> That experiment is worth actually running. It's cheap and it will probably surprise you.

**4.5** Explain in three sentences why "our eval has 0.85 agreement with humans, so it's validated" is a category error.

> Agreement is evidence for the scoring inference only \u2014 that the rubric was applied consistently. It provides no evidence that the rubric represents the construct (content), that the sample generalizes (generalization), that scores predict real-world behavior (extrapolation), or that the decision rule is appropriate (implication). A judge that reliably reproduces a human applying a bad rubric has validated nothing except its own obedience.

---

## 6. Lab

Validity labs are experiments, not computations.

**Lab 4.1 \u2014 Length bias, quantified.** Take 25 briefs. For each, produce a variant that is 60\u201380% longer with no added information (elaborate existing points; add no new facts, actions, or gaps). Rate original and variant with your judge, blind to condition. Compute the mean score difference per dimension and its CI.

Report as: *"a 70% length increase with zero information gain produces a mean Actionability increase of X points (95% CI [a, b]), which is Y% of the instrument's usable range."* That sentence, with real numbers in it, is more valuable than any \u03BA you'll compute all course.

**Lab 4.2 \u2014 Position bias.** For any pairwise comparison in your eval, run every pair in both orders. Compute the rate at which the first position wins. Test against 50%. If significant, you have a quantified administration artifact \u2014 and the remedy (present both orders, average) is now justified rather than cargo-culted.

**Lab 4.3 \u2014 Response process audit.** Sample 30 judge rationales stratified across score points. Code each for the *primary basis* of the score: did the judge cite rubric-relevant evidence, or general impression, or a surface feature? Report the distribution.

Expect to be unsettled. This is the cheapest high-value validity study available and it is essentially never run.

**Lab 4.4 \u2014 Discordant briefs.** Build the experiment from Exercise 4.4: 10 briefs deliberately high on one dimension and low on another. Rate them. Compute the between-dimension correlation on this discordant set versus your normal set. A large drop means your dimensions *can* separate and your normal set just doesn't have the variance to show it. No drop means halo.

**Lab 4.5 \u2014 Method-effect check (mini-MTMM).** Even without a behavioral criterion, build a 3-trait \xD7 2-method matrix (LLM judge, human rater). Test Campbell-Fiske criterion 3: is monotrait-heteromethod > heterotrait-monomethod? Report the full matrix with the four blocks visually distinguished.

---

## 7. Applied

Deliverable: \`instrument/iua.md\`

**7.1** Write the full Interpretation/Use Argument for your primary score interpretation. Use this template per inference:

\`\`\`markdown
### Inference: Extrapolation

CLAIM
  The universe score on Actionability corresponds to the brief's
  actual capacity to enable correct next action in real morning use.

WARRANT
  Rating conditions resemble use conditions in the respects that
  affect action-enablement.

BACKING WE HAVE
  - [list, with links to studies]

BACKING WE LACK
  - No measurement of actual action-taking after brief delivery
  - Raters read briefs out of temporal context (not at 7am, no
    competing demands, no stake in the outcome)
  - Raters are not the brief's intended reader and lack the
    situational knowledge a captain has

PLAUSIBILITY: Low

CHALLENGES TO ADDRESS
  1. [strongest counterargument]
  2. ...

PLANNED EVIDENCE
  - [what you'd measure, and what result would support/undermine]
\`\`\`

**7.2** Run a **content validity study**. Recruit 5\u20138 people who actually read briefs. Have them rate each current dimension and each of 5 candidate-but-omitted dimensions as Essential/Useful/Not necessary. Compute CVR for each. Report which current dimensions fail and which omitted ones pass. Act on it.

**7.3** Build the **construct-irrelevant variance register** \u2014 a living table:

| Suspected CIV source | Dimension(s) affected | Test | Result | Magnitude | Mitigation |
|---|---|---|---|---|---|
| Length | Actionability, Coverage | Lab 4.1 | | | |
| Position (pairwise) | all | Lab 4.2 | | | |
| Markdown formatting | Clarity | | | | |
| Topic domain | all | | | | |
| Self-preference | all | | | | |

Populate it over the rest of the course. This table goes in the technical manual and is the thing that will most impress a skeptical reader.

**7.4** **Design the behavioral criterion study.** This is the highest-value item in the whole course and the one you're uniquely positioned to do. Cadence has downstream signal: did the person open the referenced item? Did the named action get completed? Did they open Cadence directly after reading?

Write the study design: what behavioral outcome, what time window, what confounds (people who read briefs may differ systematically from those who don't), what sample size. You may not be able to run it this week. Design it anyway \u2014 and note that this is exactly the evidence a school district will eventually ask for, in exactly those terms.

---`,w5:`# Week 5 \u2014 Raters, Rubrics, and Bias

> **Outcome:** You can detect and quantify the five classical rater effects in judge data; write behaviorally anchored scales that reduce interaction variance; build an exemplar set and adjudication protocol; and model judge severity as a parameter rather than treating it as noise.

---

## 1. Orientation

Weeks 2\u20133 measured how much rater error you have. This week is about *where it comes from* and *what to do about it*.

The performance-assessment literature \u2014 writing assessment, clinical evaluation, structured interviewing, oral proficiency testing \u2014 spent fifty years on exactly this problem: fallible human judges applying a rubric to a complex artifact. Every failure mode you'll see in an LLM judge was catalogued there first, usually with a name and a remedy.

The reframe that matters: **rater severity is not noise. It is a parameter.** A judge that scores everything 0.4 points below another judge is not adding random error; it's adding a constant offset that can be estimated and removed. Treating it as noise throws away information and inflates your error variance. Week 3 already showed the cost of this \u2014 it's the gap between $E\\rho^2$ and $\\Phi$.

---

## 2. Core ideas

### 2.1 The five classical rater effects

Each has a signature in the data, a detection method, and a remedy.

**Severity / Leniency.** A rater's scores are systematically shifted relative to others.
*Signature:* rater main effect ($\\sigma^2_r$ in your G-study). Different marginal means.
*Detect:* compare rater means on a common set. Plot rater mean vs. grand mean.
*Remedy:* estimate and adjust (MFRM, \xA72.5), or use consistency-based statistics if you only need ranking.
*In evals:* different judge models have markedly different severity. So does the same model at different temperatures, and \u2014 critically \u2014 the same model across version updates.

**Central tendency.** A rater avoids the extremes, clustering scores in the middle.
*Signature:* reduced variance for that rater; underuse of categories 1 and 5.
*Detect:* per-rater SD and category-usage histogram.
*Remedy:* better anchors at the extremes; force distribution only as a last resort (it introduces its own problems).
*In evals:* **pervasive.** LLM judges cluster hard at 3\u20134 on 5-point scales. A judge that only ever uses 3 and 4 has a 2-point scale, and your instrument's effective range \u2014 and therefore its discrimination \u2014 is halved. Check this first, always.

**Halo.** Ratings on one dimension contaminate ratings on others; a global impression drives everything.
*Signature:* uniformly high inter-dimension correlations for that rater; low $\\sigma^2_{p \\times \\text{dimension}}$.
*Detect:* per-rater dimension correlation matrix. Compare to the theoretical expectation.
*Remedy:* rate all briefs on one dimension before moving to the next (dimension-major rather than brief-major order); separate calls per dimension for LLM judges; anchor each dimension to distinct observable evidence.
*In evals:* asking a judge for all five dimensions in one response is a halo generator. Separate calls cost more and are usually worth it. This is testable \u2014 run both and compare the correlation matrices.

**Restriction of range.** All scores compressed regardless of the target's actual variation.
*Signature:* low $\\sigma^2_p$, low reliability, compressed distribution.
*Distinguish from central tendency:* central tendency is per-rater; restriction of range affects all raters and may reflect genuine homogeneity in the targets (Week 1, \xA72.4).

**Drift.** A rater's severity or criteria change over the course of rating.
*Signature:* correlation between item sequence position and residual.
*Detect:* plot residuals against rating order. Fit severity as a function of time.
*Remedy:* periodic recalibration against anchor items; randomize order; interleave known-value control items.
*In evals:* **this is the sleeper problem.** Judge drift across model versions is drift with no warning and no logged cause. If you're calling an API model as your judge, your instrument silently changes underneath you. A brief that scored 4.2 in March and 3.8 in August may not have changed at all.

The remedy for that last one is the single most actionable thing in this week: **maintain a frozen anchor set with known values and re-rate it on every judge change.** See \xA72.6.

### 2.2 Rubric design: analytic vs. holistic

**Holistic** \u2014 one overall judgment. Faster, better inter-rater agreement (fewer decisions to disagree about), but no diagnostic information and prone to being driven by whatever's most salient.

**Analytic** \u2014 separate scores per dimension. Diagnostic, actionable, but slower and vulnerable to halo.

The literature's finding, consistently: **analytic rubrics have lower agreement per dimension but higher total-score reliability**, because errors partially cancel across dimensions. And they're the only option if you want to know *why* something scored low, which is the entire point of an eval you use to improve a system.

Use analytic. Then guard against halo aggressively, because analytic rubrics that suffer halo give you holistic scores at analytic cost \u2014 the worst of both.

### 2.3 Scale construction

**Number of points.** The literature broadly supports 4\u20137 for rater-applied scales; below 4 loses information, above 7 exceeds raters' ability to discriminate reliably. Five and six are the workhorses.

**Even vs. odd.** Odd allows a neutral midpoint, which invites central tendency. Even forces a directional judgment. For quality rubrics where "middling" is a real state, odd is defensible; where you suspect central tendency (i.e., always, with LLM judges), even is the safer choice.

**A specific recommendation for LLM judges:** use a 4-point scale with sharply distinguished anchors before you use a 5-point one. The neutral option is disproportionately attractive to models, and the loss from 5\u21924 points is smaller than the loss from having half your range unused.

**Equal intervals.** Design anchors so the conceptual distance between adjacent points is roughly constant. Verify in Week 6 with a graded response model, which will show you empirically where your thresholds actually sit. Unequal thresholds are why the "same" 1-point improvement means different things at different parts of the scale.

### 2.4 Behaviorally anchored rating scales

BARS (Smith & Kendall, 1963) is the highest-leverage rubric technique available and it's nearly absent from eval work.

**The principle:** anchor each scale point to *observable behaviors or artifacts*, not to evaluative adjectives.

Bad \u2014 evaluative adjectives, which just relocate the judgment:

\`\`\`
5 \u2014 Excellent actionability
4 \u2014 Good actionability
3 \u2014 Adequate actionability
2 \u2014 Poor actionability
1 \u2014 Very poor actionability
\`\`\`

This rubric contains no information. "Excellent" means whatever the rater already thought, which is precisely the variance you're trying to eliminate.

Good \u2014 observable criteria:

\`\`\`
4 \u2014 Every item requiring reader decision states a specific next
    action with a named owner and a decision point. Blocked items
    are marked as blocked with the blocker named.

3 \u2014 Most items requiring reader decision state a next action, but
    at least one is stated as a status ("waiting on legal") rather
    than an action ("ping Dana re: legal review by Thu").

2 \u2014 Items requiring decision are surfaced, but next actions are
    absent or generic ("follow up"). Reader must reconstruct what
    to do.

1 \u2014 Items requiring reader decision are not distinguished from
    informational items. Reader must first determine what needs
    their attention.
\`\`\`

The second version tells a rater \u2014 human or model \u2014 what to look at. It converts a judgment call into an observation. **This is the most direct lever you have on $\\sigma^2_{pr,e}$**, the interaction variance that Week 3 showed dominates most eval instruments.

**How to build BARS properly** (the classic procedure, and worth following):
1. Generate a large pool of *critical incidents* \u2014 specific real examples of good and bad performance. For you: pull 40 real briefs and write, for each, what specifically made it work or fail.
2. Have a second group **retranslate**: given the dimension definitions, sort the incidents back to dimensions. Incidents that don't sort consistently (< 60\u201370% agreement) are ambiguous \u2014 **discard them.** This step is what makes BARS work and it's the step everyone skips.
3. Have a third group scale the surviving incidents on the dimension.
4. Incidents with low scaling variance become your anchors.

The retranslation step is a content-validity check embedded in the rubric-writing process. It catches dimension overlap before it becomes halo.

### 2.5 Many-Facet Rasch Measurement

MFRM (Linacre, 1989) is the proper statistical treatment of rater effects, and the natural bridge to Week 6.

The model, in log-odds form, for the probability of a rating in category $k$:

$$\\log\\left(\\frac{P_{nijk}}{P_{nijk-1}}\\right) = \\theta_n - \\delta_i - \\gamma_j - \\tau_k$$

where $\\theta_n$ = target ability/quality, $\\delta_i$ = item difficulty, $\\gamma_j$ = **rater severity**, $\\tau_k$ = rating-scale threshold.

Everything is estimated on a common logit scale, which gives you:

**1. Severity-adjusted scores.** A brief rated by a harsh judge gets an estimate corrected for that harshness. You are no longer at the mercy of which judge happened to draw the item. This alone justifies learning MFRM.

**2. Fit statistics per rater.** Infit and outfit mean-square, expected \u2248 1.0:
- **MNSQ > 1.5** \u2014 the rater is *noisy* (misfitting). Unpredictable, inconsistent. This is the bad one.
- **MNSQ < 0.5** \u2014 the rater is *overfitting* \u2014 too predictable, not adding independent information. In eval terms: a second judge with MNSQ 0.4 is echoing the first and you're paying twice for one rating.

The overfit case is the interesting one for evals. It's the quantitative form of the correlated-judge problem from Weeks 1\u20132. If your three judges all have low outfit, you have one judge in a trenchcoat.

**3. Bias/interaction analysis.** Rater \xD7 item-type interactions surface as significant bias terms. This is how you detect "judge A is unusually harsh on people-topic briefs specifically" \u2014 a targeted, testable form of the DIF question in Week 6.

**Tooling:** the reference implementation is Linacre's *Facets* (commercial, with a free demo version limited in size). R's \`TAM\` package fits many-facet models. Fitting a full MFRM is more than you need for a first pass; the *concepts* \u2014 severity as a parameter, fit statistics, bias terms \u2014 are what transfer, and you can approximate the severity correction with a mixed-effects model.

**The pragmatic version, which you should actually do:**

\`\`\`r
lmer(score ~ 1 + (1|brief) + (1|rater) + (1|rater:topic))
\`\`\`

The \`rater\` random effect gives you severity estimates. Subtract them. You've captured most of MFRM's practical value without the machinery.

### 2.6 Anchor sets and calibration

The operational infrastructure that makes rater agreement hold over time. Standard practice in every serious assessment program; nearly nonexistent in eval work.

**Anchor set (exemplar set):** a frozen collection of artifacts with consensus scores, established by expert adjudication.

Purposes:
- **Training** \u2014 new raters (and new judge prompts) rate the anchors and get feedback on discrepancies
- **Calibration** \u2014 before each rating session, raters re-rate a few anchors to recalibrate
- **Drift detection** \u2014 periodically re-rate anchors; a shift in mean score on a *fixed* set is unambiguously drift, since the artifacts cannot have changed
- **Regression testing** \u2014 when you change the judge model, judge prompt, or rubric, re-rate the anchors first

**This last use is the one to institutionalize immediately.** It's the eval equivalent of a test suite, and it converts a category of silent failure into a loud one.

Build it: 20\u201330 briefs, 4\u20136 per score point per dimension, chosen to include clear cases *and* borderline ones. Adjudicate to consensus. Freeze. Version. Never let anyone train a judge prompt on the anchor set \u2014 it's your held-out calibration standard and contaminating it destroys its value.

**Adjudication protocol** \u2014 decide *before* you collect data:

\`\`\`markdown
## Adjudication Protocol v1.0

TRIGGER
  Raters differ by \u2265 2 scale points on any dimension.

PROCESS
  1. Both raters independently write a one-paragraph justification
     citing specific brief content. No discussion first.
  2. Justifications exchanged. Raters may revise.
  3. If still \u2265 2 apart, a third rater adjudicates blind to
     both scores but with access to both justifications.
  4. Final score = adjudicated score. Original scores are RETAINED
     for reliability computation, not overwritten.

RUBRIC AMENDMENT
  If the same disagreement pattern occurs 3+ times, it is a rubric
  defect, not a rater defect. Open a rubric revision.

LOGGING
  Every adjudication logged with: item, initial scores, final score,
  disagreement category (ambiguous language / borderline case /
  rater error / differing construct definition), rubric section
  implicated.
\`\`\`

Point 4 in the process is important and frequently violated: **do not overwrite original ratings with adjudicated ones and then compute reliability.** That computes the reliability of a process that includes adjudication, which is not the same thing and is always higher. Keep both.

The disagreement log is the highest-value artifact in your whole instrument. It tells you exactly which rubric language to fix, and it's what makes rubric revision empirical instead of vibes-based.

---

## 3. The failure mode

**Treating judge severity as noise to be averaged away.** Averaging a harsh judge and a lenient one gives you a middling estimate with inflated error variance. Estimating severity and adjusting gives you a better estimate with *less* error. The information is right there in the data.

**Adjective-only rubrics.** "Rate the actionability from 1 (poor) to 5 (excellent)" is not a rubric. It is a request for the model's prior. Astonishingly common in production evals.

**No anchor set, so no drift detection.** Your judge silently changes and you attribute the score shift to your system. This is happening to a lot of teams right now and most of them don't know it.

**Adjudicating and then reporting the post-adjudication agreement.** Inflates reliability, sometimes dramatically. Report pre-adjudication agreement as your reliability figure and describe adjudication separately.

**Ignoring category usage.** A judge using only 3 and 4 on a 5-point scale means your scale has two functional levels. Check the histogram before anything else. If you do one thing from this week, do this.

---

## 4. Read

**Primary:**
- **Myford, C.M. & Wolfe, E.W. (2003/2004). "Detecting and Measuring Rater Effects Using Many-Facet Rasch Measurement," Parts I and II.** *J Applied Measurement*. **The best single treatment of rater effects anywhere.** Part I covers the effects and their signatures; Part II covers detection. Directly applicable to judge models.
- **Smith, P.C. & Kendall, L.M. (1963). "Retranslation of expectations."** *J Applied Psychology*. The original BARS paper. Short and the retranslation procedure is the transferable part.
- **Linacre, J.M. (1989). *Many-Facet Rasch Measurement.*** Chapters 1\u20133 for the model and the interpretation of fit statistics.

**Supporting:**
- **Engelhard, G. (2013). *Invariant Measurement*.** Rater-mediated assessment framed as a measurement problem. Excellent on the conceptual side.
- **Zheng, L. et al. (2023). "Judging LLM-as-a-Judge."** Reread with this week's vocabulary. Their position bias, verbosity bias, and self-enhancement bias map cleanly onto rater effects, and their proposed mitigations are the field independently arriving at calibration and counterbalancing.
- **Bond, T. & Fox, C. (2015). *Applying the Rasch Model* (3rd ed.).** Accessible entry to Rasch if Linacre is heavy going. Sets up Week 6 as well.

---

## 5. Theory exercises

**5.1** For each pattern, name the rater effect and give the statistic that detects it:

(a) Rater B's mean is 0.6 below Rater A's across all items, with correlation 0.85 between them
(b) Rater C's SD is 0.4 while others are 1.1
(c) Rater D's five dimension scores correlate \u2265 0.92 with each other
(d) Rater E's residuals trend downward across rating order
(e) All raters show low variance and the score histogram is unimodal at 3.5

> (a) **Severity/leniency.** High correlation with mean offset = pure severity. Detect: rater main effect / marginal means. Note the high correlation means B is a *fine* rater \u2014 just calibrated differently. Adjust, don't discard.
> (b) **Central tendency.** Detect: per-rater SD, category usage histogram.
> (c) **Halo.** Detect: per-rater inter-dimension correlation matrix.
> (d) **Drift.** Detect: regress residual on sequence position.
> (e) **Restriction of range** \u2014 but ambiguous. Could be genuine target homogeneity. Check $\\sigma^2_p$ against an independent quality assessment before blaming the raters.

**5.2** MFRM gives Judge A severity 0.8 logits above Judge B. Both have infit MNSQ \u2248 1.0. Is this a problem?

> Not for measurement quality \u2014 both are internally consistent, and MFRM adjusts for the offset. It *is* a problem if you're using raw scores with an absolute threshold and briefs are non-randomly assigned to judges: which judge you drew determines whether you pass. Remedies: adjust scores by severity, ensure random assignment, or use consistency-based statistics for ranking decisions. It also means you cannot compare a score from Judge A's era to one from Judge B's era without adjustment.

**5.3** Judge C has outfit MNSQ = 0.35. Interpret.

> Overfit \u2014 too predictable. C's ratings are almost fully determined by the model, contributing little independent information. In evals this typically means C is echoing another judge (shared model family) or is applying a mechanical heuristic (e.g., "long = good") that happens to correlate with the estimated quality. Diagnostic: check C's correlation with each other rater; check whether C's scores are predictable from a surface feature.

**5.4** Rewrite this as a BARS anchor set:

> "Rate Groundedness 1\u20135. 5 = fully grounded, 1 = ungrounded."

> A strong answer replaces every evaluative adjective with an observable. Something like:
> **4** \u2014 Every factual claim traces to a named source item; spot-checking three claims against the source confirms the source supports the claim as stated. No claims about state that lack a source.
> **3** \u2014 Every factual claim names a source, but at least one claim overstates or generalizes beyond what the source supports.
> **2** \u2014 Some claims name sources; at least one substantive claim has no source and cannot be traced.
> **1** \u2014 Claims are asserted without source attribution, or attributed sources do not contain the claimed content.
>
> Note that these anchors also distinguish Groundedness from Coverage \u2014 a brief can be fully grounded and miss half the week. That boundary is doing validity work inside the rubric.

**5.5** Explain why reporting post-adjudication agreement overstates reliability, and what to report instead.

> Adjudication is a process that resolves disagreements by construction. Computing agreement after it measures the reliability of *the adjudicated procedure*, not of the rating procedure \u2014 and if you then deploy single-rater scoring without adjudication, you've reported a reliability you don't have. Report pre-adjudication agreement as the reliability figure. Report adjudication rate and the disagreement-category distribution separately as process metrics.

---

## 6. Lab

**Lab 6.1 \u2014 Rater effect detection suite.** Write a function that takes a ratings matrix and returns a per-rater diagnostic table: mean, SD, category-usage proportions, inter-dimension correlation (mean off-diagonal), correlation with the grand mean, and residual-vs-order slope. Run it on your pilot. This becomes standing infrastructure \u2014 you'll run it on every judge change.

**Lab 6.2 \u2014 Simulate and recover.** Generate synthetic ratings with known injected effects: a lenient rater (+0.7), a central-tendency rater (scores compressed by 0.4\xD7), a halo rater (dimension scores = global impression + small noise), and a drifting rater (severity increasing linearly across order). Confirm your Lab 6.1 suite detects each. **Then confirm that a plain ICC does not distinguish them** \u2014 it just reports lower reliability. That's the point: aggregate reliability tells you there's a problem, diagnostics tell you which one.

**Lab 6.3 \u2014 Severity adjustment.** Fit \`lmer(score ~ 1 + (1|brief) + (1|rater))\` on your pilot. Extract rater random effects. Adjust scores. Recompute ICC(2,1) \u2014 absolute agreement \u2014 before and after. Report the improvement. This is MFRM's core benefit obtained cheaply, and the delta is a number you can put in a memo.

**Lab 6.4 \u2014 Halo experiment.** Rate 40 briefs two ways with the same judge model: (a) all five dimensions in one call, (b) five separate calls, each seeing only its own dimension's rubric. Compare the inter-dimension correlation matrices. Report the difference in mean off-diagonal correlation.

If separate calls drop the correlations substantially, you have quantified halo and justified the extra API cost with data. If they don't drop, your dimensions may genuinely be one construct \u2014 which is a Week 4 finding, and means you should collapse the rubric.

**Lab 6.5 \u2014 Drift monitor.** Build the anchor set (20 briefs, consensus-scored). Write a script that re-rates the anchor set and reports mean shift per dimension with a CI, flagging shifts beyond a threshold. Wire it to run on every judge-prompt or judge-model change.

This is the piece of infrastructure with the longest half-life of anything you build in this course. It is also the piece most likely to eventually be a Cadence feature.

---

## 7. Applied

Deliverables: \`instrument/rubric-v2.md\`, \`instrument/adjudication.md\`, \`data/exemplars/\`

**7.1** Rewrite the full rubric as BARS. Every scale point on every dimension gets observable criteria. No evaluative adjectives. Use your Week 2 disagreement inventory as the source: each disagreement category (a) \u2014 ambiguous rubric language \u2014 points at exactly the anchor that needs rewriting.

Budget real time for this. It's the highest-ROI activity in the course, per Week 3's Exercise 3.2.

**7.2** Run the **retranslation check**. Take 30 critical incidents from real briefs. Give a colleague only the dimension names and definitions (not the incidents' original assignment) and have them sort. Discard incidents that sort inconsistently. Track the retranslation rate per dimension \u2014 a dimension with low retranslation is one whose boundary is unclear, and that's a Week 4 construct problem surfacing in Week 5.

**7.3** Build the anchor set. 20\u201330 briefs, adjudicated to consensus, versioned, frozen. Document the adjudication for each \u2014 *why* this brief is a 3 and not a 4 is the most useful text in your whole instrument, because it's the thing you'll paste into judge prompts and rater training.

**7.4** Write the adjudication protocol. Use the \xA72.6 template. Then apply it retroactively to your Week 2 disagreement inventory and log the categories.

**7.5** **Re-run the Week 2 reliability study with the v2 rubric.** Same briefs, same raters if possible, uncalibrated versus calibrated. Report:

| | Rubric v1 | Rubric v2 | \u0394 |
|---|---|---|---|
| Quadratic weighted \u03BA | | | |
| $\\sigma^2_{pr,e}$ | | | |
| $\\Phi$ at $n_r = 2$ | | | |
| Category usage (% using all points) | | | |

**This table is the proof that the course worked.** If $\\sigma^2_{pr,e}$ dropped, the D-study from Week 3 now tells you exactly how many raters you saved. Convert it to dollars.

---

- [ ] Name the five rater effects, their data signatures, and their remedies

- [ ] Interpret infit/outfit MNSQ above 1.5 and below 0.5, in eval terms

## 9. Minimum Viable Week

Check category usage on your existing judge data (5 minutes; likely alarming). Rewrite one dimension as BARS (\xA77.1). Build a 10-brief anchor set and wire up the drift check (Lab 6.5).

---`,w6:`# Week 6 \u2014 Item Analysis, IRT, and Cut Scores

> **Outcome:** You can diagnose individual eval items for difficulty and discrimination, fit a graded response model to ordinal rubric data and read the thresholds, detect differential item functioning, and set a cut score by a method you can defend to someone with a stake in the outcome.

---

## 1. Orientation

Everything so far has treated the eval set as a lump. This week takes it apart.

Two distinct payoffs:

**Item analysis** tells you which of your eval items are doing work. Most benchmarks contain a large fraction of items that discriminate nothing \u2014 everything passes them or everything fails them \u2014 and are pure cost. Item analysis finds them in an afternoon.

**Standard setting** tells you where to put the bar. This is the most consequential and least examined decision in eval work. Someone picks 0.8, or 3.5, or "80% pass rate," and that number then governs shipping decisions for years. There is a fifty-year literature on doing this defensibly, developed because in licensure testing, an indefensible cut score gets you sued.

You will need this second one. When Jordan district asks "what does a good brief score mean, and who decided?", "we picked 3.5" is not an answer. "We ran a modified Angoff with seven district administrators; the panel's mean minimally-acceptable score was 3.4 with an SEM of 0.2; we set the cut at 3.4 and here's the impact data" is.

---

## 2. Core ideas

### 2.1 Classical item analysis

For dichotomous items (pass/fail):

**Item difficulty** ($p$-value) = proportion passing. Confusingly, higher $p$ = *easier*.
- $p > 0.95$ or $p < 0.05$: near-zero variance, contributes almost nothing. Cut or replace.
- Maximum discrimination at $p \\approx 0.5$.
- But: a benchmark should have items spanning a *range* of difficulty. All-0.5 items maximize total-score variance but tell you nothing about performance at the extremes.

**Item discrimination** \u2014 does this item separate high from low performers?

*Point-biserial correlation* $r_{pb}$: correlation between item score and total score (with the item removed \u2014 "corrected item-total correlation").
- $r_{pb} > 0.30$: good
- $0.20 < r_{pb} < 0.30$: marginal
- $r_{pb} < 0.20$: weak
- $r_{pb} < 0$: **the item is broken.** Better performers do worse on it. Usually a mis-keyed answer, an ambiguous item, or an item measuring something different from everything else.

*Discrimination index* $D = p_{\\text{upper}} - p_{\\text{lower}}$, using the top and bottom 27% of performers. Cruder than $r_{pb}$ but more intuitive and useful for quick screening.

**Applied to LLM benchmarks:** treat models as "examinees," items as items.
- Items every model passes: saturated. Cut.
- Items no model passes: either too hard to be informative *or* broken/mislabeled. **Inspect them by hand** \u2014 a surprising fraction of universally-failed benchmark items have wrong gold labels.
- Items with negative $r_{pb}$: weaker models pass, stronger models fail. Almost always broken, or the item rewards a behavior that stronger models have been trained out of. Inspect every one.

Running this on any public benchmark is illuminating and takes an hour. A large share of most benchmarks is dead weight, and that's before you get to contamination.

### 2.2 Why IRT beats sum scores

Classical item analysis has a circularity problem: item difficulty depends on the sample of examinees, and examinee scores depend on the sample of items. Neither is on an absolute scale.

**Item Response Theory** places both on a common latent scale $\\theta$, and \u2014 under the model's assumptions \u2014 the parameters are *invariant*: item difficulty estimated on strong models should match difficulty estimated on weak ones.

**Rasch / 1PL:**
$$P(X_{ij} = 1 \\mid \\theta_i) = \\frac{1}{1 + e^{-(\\theta_i - b_j)}}$$
Items differ only in difficulty $b_j$.

**2PL:** adds discrimination $a_j$:
$$P(X_{ij}=1 \\mid \\theta_i) = \\frac{1}{1 + e^{-a_j(\\theta_i - b_j)}}$$

**Graded Response Model** (Samejima, 1969) \u2014 **this is the one for rubric data.** For an ordinal item with $K$ categories, it models the probability of scoring *at or above* each threshold:

$$P(X_{ij} \\geq k \\mid \\theta_i) = \\frac{1}{1 + e^{-a_j(\\theta_i - b_{jk})}}$$

Each item gets one discrimination $a_j$ and $K-1$ thresholds $b_{jk}$.

**Why this matters for your rubric, concretely:**

The thresholds $b_{jk}$ tell you **where on the quality continuum your scale points actually sit.** Week 5 asked you to design roughly equal intervals; the GRM tells you whether you succeeded.

Suppose your Actionability thresholds come back as:
$$b_1 = -1.8, \\quad b_2 = -0.4, \\quad b_3 = 0.1, \\quad b_4 = 1.9$$

Gaps: 1.4, 0.5, 1.8. The 3\u21924 boundary sits only 0.5 logits above the 2\u21923 boundary, but 4\u21925 is 1.8 above. **Your scale is badly unequal**: moving from 3 to 4 is easy, moving from 4 to 5 is a chasm. That's why nobody ever scores a 5, and it means "average score went from 3.4 to 3.6" and "went from 4.4 to 4.6" describe wildly different amounts of real improvement.

Additionally: **disordered thresholds** ($b_{k+1} < b_k$) mean a category is never the most likely response at any $\\theta$ \u2014 the category is functionally unused and should be collapsed. This is the rigorous version of Week 5's "check your category usage."

**Item information:**
$$I_j(\\theta) = a_j^2 P_j(\\theta)(1 - P_j(\\theta))$$

Items are most informative near their difficulty. Total information across items gives the **test information function**, and its inverse square root is the standard error at each $\\theta$:

$$SE(\\theta) = \\frac{1}{\\sqrt{I(\\theta)}}$$

**This is the big one for benchmark design.** Unlike CTT's single SEM, IRT gives you measurement precision *as a function of ability level*. A benchmark packed with medium-difficulty items measures medium models precisely and frontier models terribly \u2014 which is exactly the situation the field is in, and the reason benchmark saturation looks like a cliff rather than a slope.

If you want to distinguish two frontier models, you need items with difficulty near their $\\theta$. Adding more medium items adds no information where you need it. **Test information functions are how you'd design an eval set deliberately rather than by accretion.**

Related and worth knowing: \`tinyBenchmarks\` (Polo et al., 2024) uses IRT to select small maximally-informative subsets of large benchmarks \u2014 a direct application of item information, and evidence the ML field is starting to arrive here.

### 2.3 Assumptions and when they break

IRT assumes:
1. **Unidimensionality** \u2014 one latent trait explains the responses. Check with factor analysis or the ratio of first to second eigenvalue.
2. **Local independence** \u2014 conditional on $\\theta$, responses are independent. Broken by item bundles sharing a stimulus (five questions about one passage) \u2014 common in agentic benchmarks where later steps depend on earlier ones.
3. **Monotonicity** \u2014 $P$(correct) increases with $\\theta$.

Assumption 2 is routinely violated in agentic evals and inflates apparent reliability. If a benchmark has 200 items but they're really 40 independent scenarios with 5 dependent steps each, your effective item count is 40 and your standard errors should reflect that. This is the same clustering issue Miller's "Adding Error Bars to Evals" addresses \u2014 and clustered standard errors are the remedy in both framings.

### 2.4 Differential item functioning

**DIF:** an item behaves differently for two groups *at the same level of the underlying trait*. This is the technical definition of item bias, and the conditioning clause is the whole point \u2014 a group difference in raw scores is not DIF; a group difference *after matching on ability* is.

**Uniform DIF** \u2014 constant advantage for one group across the trait range.
**Non-uniform DIF** \u2014 the advantage varies with trait level (an $a$-parameter difference).

**Detection:**
- **Mantel-Haenszel** \u2014 stratify on total score, test for association between group and item response within strata. Simple, standard, well-understood.
- **Logistic regression DIF** \u2014 regress item response on $\\theta$, group, and their interaction. The group term tests uniform DIF; the interaction tests non-uniform.

**Eval applications, which are numerous and underexplored:**

- **Fairness across content domains.** Does your brief rubric score people-topic briefs lower than engineering-topic briefs at equal quality? That's DIF with topic as the grouping variable, and it's directly relevant to whether Cadence's brief quality metric works across a whole district.
- **Judge fairness.** Two judge models on the same items, conditioning on item difficulty \u2014 DIF identifies which specific items they disagree about systematically, rather than just reporting a lower correlation.
- **Contamination detection.** This is the clever one. A contaminated model performs anomalously well on specific items relative to its overall ability. That is exactly the DIF signature with model-family as the grouping variable. Not a proof of contamination, but a strong screen, and much sharper than aggregate score comparisons.
- **Cross-district generalization.** When you take a brief-quality instrument built at SchoolAI and apply it at Jordan, DIF analysis across organizations tells you whether it means the same thing in both \u2014 which is the *measurement invariance* question, and it's the one that determines whether your instrument externalizes at all.

That last point deserves emphasis: **measurement invariance is the technical precondition for comparing scores across groups.** If your instrument functions differently at SchoolAI than at Jordan, cross-district comparisons are meaningless. Establishing invariance is a real, checkable property and it's the difference between a metric and a product.

### 2.5 Standard setting

How do you decide where the bar goes? The literature is mature and the methods are all variations on *making a group of qualified judges' reasoning explicit and auditable*.

**Angoff method (1971), modified.** The workhorse.

1. Assemble a panel of subject-matter experts.
2. Have the panel define the **minimally acceptable performer** \u2014 a shared, concrete description. *This step takes most of the time and is most of the value.*
3. For each item, each panelist estimates: *of 100 minimally acceptable performers, how many would pass this item?*
4. Sum each panelist's estimates \u2192 that panelist's cut score.
5. Average across panelists \u2192 the cut score.
6. **Iterate:** show panelists the spread of their estimates and (in modified versions) real performance data, discuss, re-estimate. Convergence across rounds is evidence of a defensible process.

For rubric-based ratings, the analogue: *what score would a minimally acceptable brief receive on this dimension?*

**Bookmark method.** Order items by IRT difficulty into a booklet. Panelists page through and place a bookmark where a minimally acceptable performer would stop succeeding (conventionally at a 67% response probability). The bookmark location maps directly to a $\\theta$ cut. Requires IRT calibration but is cognitively much easier for panelists than Angoff's probability estimates.

**Contrasting groups.** Independently classify targets as acceptable/unacceptable by some external criterion, plot the two score distributions, set the cut where they cross (or where the misclassification cost is minimized). **This is the most natural fit for eval work** because you often *do* have an external signal \u2014 did the reader act on the brief, did they file a complaint, did they open Cadence anyway.

**Borderline group.** Identify targets judged borderline; the cut is their median score. Simple; requires only that judges can recognize borderline cases, which is often easier than absolute judgments.

**What makes a cut score defensible** (and this is the part to internalize):

1. A **documented, replicable process** with qualified panelists
2. An explicit **performance level description** \u2014 what the cut means in substantive terms
3. **Consistency evidence** \u2014 panelist agreement, cross-round convergence, SEM of the cut
4. **Impact data** \u2014 what proportion passes at this cut; is that plausible?
5. **Explicit consideration of error costs** \u2014 false pass vs. false fail, and which is worse here

Point 5 is where you should start, always. Ask: what happens if a bad brief passes? What happens if a good brief fails? If false passes are much worse (a captain acts on a wrong brief), the cut goes higher; if false fails are worse (you suppress useful briefs), lower. **The cut score is a decision about error costs wearing a statistical costume.** Naming the costs first makes everything downstream easier.

And: the SEM from Week 1 bounds all of this. If SEM = 0.5, a cut at 3.5 misclassifies a large band of briefs no matter how good your standard-setting process is. Report the classification consistency at the cut \u2014 the probability that a brief near the cut would be classified the same way on a second measurement. It's often sobering.

---

## 3. The failure mode

**Benchmarks that grow by accretion.** Items are added, never removed, never analyzed. Nobody knows which items carry information. The benchmark saturates, everyone declares it dead, and a new one is built the same way.

**Ignoring the difficulty distribution.** Reporting a single accuracy number on a set whose difficulty distribution is unexamined. Two benchmarks at 70% can mean completely different things depending on where their information sits.

**Thresholds by vibes.** The dominant practice. Someone picks a number in a meeting. It becomes load-bearing. Six months later nobody remembers why, and it can't be changed because everything is calibrated to it.

**Ignoring local dependence in agentic evals.** Multi-step tasks scored per-step, with steps treated as independent items. Massively inflates effective sample size and shrinks reported standard errors below their true value.

**Never checking measurement invariance before comparing groups.** Comparing brief quality across districts, teams, or roles without establishing that the instrument functions the same way in each. Every such comparison is uninterpretable until invariance is checked, and this will matter enormously the moment Cadence is externalized.

---

## 4. Read

**Primary:**
- **Embretson, S.E. & Reise, S.P. (2000). *Item Response Theory for Psychologists*.** Chapters 1\u20135. Best conceptual introduction; explicitly written for people who know CTT and need IRT.
- **Cizek, G.J. & Bunch, M.B. (2007). *Standard Setting: A Guide to Establishing and Evaluating Performance Standards on Tests*.** Chapters on Angoff, bookmark, and contrasting groups. The practical manual. Read this if you expect to defend a threshold to anyone.
- **Samejima, F. (1969). "Estimation of latent ability using a response pattern of graded scores."** The GRM. Technical; read for the model statement.

**Supporting:**
- **Bond, T. & Fox, C. (2015). *Applying the Rasch Model* (3rd ed.).** The gentlest real introduction to Rasch.
- **Holland, P.W. & Wainer, H., eds. (1993). *Differential Item Functioning*.** The reference. Read the introductory chapters and the Mantel-Haenszel chapter.
- **Polo, F.M. et al. (2024). "tinyBenchmarks: Evaluating LLMs with Fewer Examples."** IRT applied to benchmark subsampling. The clearest existing example of this material used in ML.
- **Zhou, L. et al. (2025). "General Scales Unlock AI Evaluation with Explanatory and Predictive Power."** Latent-trait framing of AI evaluation. Worth reading as a sign of where the field is heading.
- **Miller, E. "Adding Error Bars to Evals."** Reread for the clustered-standard-error treatment now that you know why local dependence matters.

---

## 5. Theory exercises

**6.1** A benchmark item is passed by 48 of 50 models. Compute $p$. What's its maximum possible contribution to score variance? Should you keep it?

> $p = 0.96$. Item variance for a dichotomous item is $p(1-p) = 0.96 \\times 0.04 = 0.0384$, versus a maximum of 0.25 at $p = 0.5$. It carries about 15% of the variance an optimal item would. Keep it *only* if you specifically need to detect regression below a floor capability \u2014 it's a canary, not a discriminator. Otherwise cut. For a frontier-model comparison, definitely cut.

**6.2** An item has $r_{pb} = -0.18$. Diagnose and give three possible causes.

> Better overall performers do worse on this item. Possible causes: (1) wrong gold label \u2014 the "correct" answer is wrong, and stronger models give the actually-correct one; (2) the item rewards a behavior stronger models are trained away from (e.g., confident guessing, or complying with a request stronger models decline); (3) ambiguity \u2014 the item admits multiple readings and stronger models pick the less-common one. **Inspect manually. Never leave a negative-discrimination item in a benchmark.**

**6.3** GRM thresholds for a dimension: $b_1 = -2.1$, $b_2 = -0.3$, $b_3 = 0.9$, $b_4 = 1.1$. Diagnose.

> Gaps: 1.8, 1.2, 0.2. The 4\u21925 threshold sits only 0.2 logits above 3\u21924 \u2014 category 4 occupies a very narrow band of the trait continuum and will rarely be the most probable response. Practically, 4 and 5 are nearly the same category. **Collapse them to a 4-point scale, or rewrite the anchors** so the 4/5 distinction is substantive. Note this would be invisible in a category-usage histogram if the scale is used at all \u2014 you need the model to see it.

**6.4** Explain why a benchmark of all-medium-difficulty items can't distinguish two frontier models.

> Item information $I_j(\\theta) = a_j^2 P(1-P)$ peaks near $\\theta = b_j$ and falls off symmetrically. If all $b_j$ are near the population mean and the frontier models sit far above it, every item contributes near-zero information at their $\\theta$. Total information is low there, so $SE(\\theta) = 1/\\sqrt{I(\\theta)}$ is large, and the two models' confidence intervals overlap regardless of sample size. Adding more medium items adds essentially nothing. You need items with $b_j$ near the frontier models' $\\theta$ \u2014 which is why benchmarks saturate abruptly and why "harder benchmark" is the only fix.

**6.5** Run a modified Angoff, on paper, for your Actionability dimension. Write the minimally-acceptable-brief description (150 words, concrete). Then estimate the score a minimally acceptable brief would receive. Then list what you'd need from a real panel.

> No key. The 150-word description is the exercise. If you can't write it concretely, you cannot set a defensible cut \u2014 and that's a finding, not a failure.

**6.6** Your instrument has SEM = 0.45 and a cut at 3.5. For a brief with true score exactly 3.5, what is the probability it's classified as passing on a single measurement? What about a brief with true score 3.8?

> True score 3.5: by symmetry, 50%. Pure coin flip.
> True score 3.8: $z = (3.5 - 3.8)/0.45 = -0.667$; $P(X > 3.5) = P(Z > -0.667) \\approx 0.75$. A brief genuinely 0.3 above the bar fails a quarter of the time.
> **Conclusion:** report classification consistency alongside any pass rate, and consider a buffer zone requiring a second rating rather than a hard threshold.

---

## 6. Lab

**Lab 6.1 \u2014 Classical item analysis on a real benchmark.** Take any public benchmark with per-item, per-model results. Compute $p$ and corrected $r_{pb}$ for every item. Produce:
- The difficulty distribution histogram
- A list of items with $p > 0.95$ or $p < 0.05$ (dead weight, with count and percentage)
- All items with $r_{pb} < 0$, **manually inspected**, with a note on what's wrong with each

Report what fraction of the benchmark is doing no work. Then compute: if you dropped the dead items, how much would the total-score reliability change? (Usually: almost not at all, at a fraction of the cost.)

**Lab 6.2 \u2014 Fit a GRM.** R detour. On your rubric data:

\`\`\`r
library(mirt)
m <- mirt(rubric_data, 1, itemtype = "graded")
coef(m, simplify = TRUE, IRTpars = TRUE)   # a and b_k per dimension
plot(m, type = "trace")                     # category response curves
plot(m, type = "info")                      # test information function
\`\`\`

Read off: discrimination per dimension (which dimensions carry the most information?), thresholds per dimension (are they evenly spaced? disordered?), and the test information function (where on the quality continuum is your instrument precise?).

**The category response curve plot is the deliverable.** If a category's curve is never highest at any $\\theta$, that category is functionally dead. Put this plot in the technical manual.

**Lab 6.3 \u2014 Test information for eval-set design.** Using your fitted GRM, plot $SE(\\theta)$ across the range. Mark where your current briefs actually sit. Answer: *is my instrument precise in the region where my briefs live?*

Then simulate: if you added five items with difficulty targeted at the high end, how much would $SE$ drop there? This is deliberate instrument design, and it is what separates an eval set from a pile of test cases.

**Lab 6.4 \u2014 DIF.** Split your data by a grouping variable (topic domain, reader role, team). Run logistic regression DIF on each dimension:

\`\`\`python
# response ~ theta + group + theta:group
# group term      \u2192 uniform DIF
# interaction     \u2192 non-uniform DIF
\`\`\`

Report effect sizes, not just p-values \u2014 with enough data, everything is significant. Flag any dimension with meaningful uniform DIF and investigate the rubric language for domain-specific assumptions.

**Lab 6.5 \u2014 Contamination screen.** Using per-item benchmark results across model families, look for items where a specific family performs far better than its overall $\\theta$ predicts. Rank items by residual. Inspect the top 20. This is DIF repurposed as a contamination detector \u2014 treat the output as a screen, not a verdict.

**Lab 6.6 \u2014 Classification consistency.** Given your SEM and cut score, simulate: generate true scores, add measurement error, classify, repeat. Compute the proportion of briefs classified consistently across two independent measurements, overall and *within 1 SEM of the cut*. Report both. The second number is the honest one.

---

## 7. Applied

Deliverables: item analysis of your eval set, GRM output, a documented cut score.

**7.1** Run item analysis on your brief eval set, treating briefs as items and either raters or system versions as "examinees." Identify briefs that discriminate nothing. Are you spending annotation budget on briefs everyone scores the same?

**7.2** Fit the GRM to your rubric. Report per dimension: discrimination, thresholds, threshold ordering, category response curves. Act on what you find \u2014 collapse disordered categories, rewrite anchors where thresholds are unevenly spaced.

**7.3** Plot the test information function. Determine where your instrument is precise and whether that overlaps with where your briefs actually score. If your instrument is most precise at quality levels your system has already passed, you have a Week 1 range-restriction problem with an IRT diagnosis, and you need harder criteria.

**7.4** **Run a real standard-setting exercise.** Not simulated \u2014 get 5\u20137 people who read briefs into a room (or a call).

1. Draft a **performance level description** for "minimally acceptable brief." Circulate before the session.
2. Session round 1: independent estimates of the minimally-acceptable score per dimension.
3. Show the spread. Discuss disagreements. **Do not average away disagreement without discussing it** \u2014 the disagreement usually reveals that people hold different performance level descriptions, which is a Week 4 finding.
4. Round 2: re-estimate.
5. Compute mean cut and SEM of the cut across panelists.
6. Apply to your data: what proportion of current briefs pass? Is that plausible? (Impact data.)
7. Document all of it.

Budget two hours. The output \u2014 a written cut-score justification with panel composition, PLD, round-by-round convergence, and impact data \u2014 is the artifact that makes your metric defensible to a school board. Nobody else in EdTech AI will have one.

**7.5** Compute and report classification consistency at your cut. Decide whether to use a hard threshold or a buffer zone (e.g., scores within 1 SEM of the cut trigger a second rating). Document the decision and the error-cost reasoning behind it.

---

---`,w7:`# Week 7 \u2014 Capstone: Ship a Validated Instrument

> **Outcome:** A complete measurement instrument with a technical manual \u2014 the artifact you'd hand someone who has to trust your numbers, and the thing you'd need before Cadence's brief-quality metric goes to a district.

---

## 1. What this week is

Six weeks of components. This week assembles them into one document and one working system, and then stress-tests both.

The deliverable is a **technical manual**. Every serious assessment instrument has one. It is the document that says: here is what this measures, here is the evidence, here is what you may and may not conclude from a score, and here is where it's weak.

Writing it does something the individual studies don't: it forces you to state the claim in one place, and the gaps become impossible to hide from. Expect to discover at least one thing you can't defend. That discovery is the point.

---

## 2. The technical manual

Structure below. Target 15\u201325 pages. Write it as though a skeptical, competent outsider will read it \u2014 because eventually one will, and it will be easier if you wrote for them the first time.

**Sections 1.4, 6.7, and 9.1 are the ones that build credibility.** Anyone can write a document claiming their metric is good. A document that says clearly *what it does not support*, *which biases it has and how large they are*, and *which link in its own argument is weakest* is the mark of someone who actually did the work. It is also, practically, the thing that survives contact with a skeptical CTO or a district evaluation committee.

---

## 3. Capstone tasks

### 3.1 Assemble (day 1\u20132)

Pull every artifact from Weeks 1\u20136 into the structure above. Fill gaps. Where you have no evidence, **write "no evidence" rather than omitting the section.** Omissions read as oversights; explicit gaps read as rigor.

### 3.2 The honest gap analysis (day 2)

For each of Kane's four inferences, rate your backing: strong / adequate / weak / none. Then rank the inferences by *how much a failure there would damage the overall claim*.

Nearly everyone finishes with: scoring \u2014 strong; generalization \u2014 adequate; extrapolation \u2014 weak; implication \u2014 weak-to-adequate.

If yours differs, check whether you're being generous. Specifically: if you rated extrapolation as adequate, ask what *behavioral* evidence you have. If the answer is "none, but the rubric is well-designed," that's a weak rating.

Write a paragraph naming your weakest inference and what single study would most improve it. That paragraph is your next quarter's eval roadmap.

### 3.3 The adversarial review (day 3)

Give the manual to someone who has reason to doubt it \u2014 Mason, Wes, Justin. Ask them specifically to attack the *inferences*, not the statistics. Prompts to give them:

- "Where could this number be high while the brief is actually bad?"
- "What would you need to see before you'd trust this for a district-facing claim?"
- "What's the most obvious way someone could game this metric?"
- "What population would you expect this to work worse on, and why?"

Log every objection. Answer each in writing: addressed / acknowledged limitation / disputed with reasoning. Objections you can't answer go in Section 9.

This is the extreme-ownership move applied to measurement: you go looking for the failure before it finds you, and you write it down.

### 3.4 The Goodhart analysis (day 3)

For each dimension, answer: **if a system optimized directly against this score, what would it produce?**

- Actionability \u2192 briefs that name actions for everything, including things that need none
- Groundedness \u2192 over-citation, citations to trivial sources
- Coverage \u2192 padded briefs listing everything
- Gap-naming \u2192 spurious gaps invented to hit the criterion

For each, decide: is this an acceptable failure mode, does the rubric already penalize it, or do you need a counter-criterion? Document. Then design one **canary metric** per dimension \u2014 something that would move if the dimension were being gamed. Wire it into your monitoring.

Consequential validity is the part of Messick that eval teams skip entirely, and it's the part that will actually bite you, because your metric *will* become a target the moment someone's work is evaluated against it.

### 3.5 The operational system (day 4)

Turn the instrument into running infrastructure:

- **Anchor set regression test** \u2014 runs on every judge model, judge prompt, or rubric change; reports mean shift per dimension with CI; fails loudly beyond threshold
- **Standing diagnostics** \u2014 per-rating-batch: category usage, rater effect table, agreement statistics with CIs
- **Drift log** \u2014 append-only record of every instrument change with attached anchor-set results
- **Reporting template** \u2014 no bare point estimates. Every reported score carries an SEM or CI. Enforce this in code if you can.

The last one is worth being stubborn about. If your dashboard can only render point estimates, fix the dashboard.

### 3.6 The 10-minute version (day 5)

Write the talk. Ten minutes, for the SchoolAI engineering and product org: what you built, what you found, and what it means for how the team evaluates AI outputs.

Lead with a finding, not a framework. The strongest openings from this course are usually:

- The length-bias number from Lab 4.1 ("70% more words with zero new information raises our quality score by X")
- The paradox plot from Lab 2.2 ("our \u03BA fell because our system got better")
- The D-study cost grid from Lab 3.3 ("we can cut annotation cost by N% and get *more* reliable numbers")
- The dead-weight fraction from Lab 6.1

Then the framework, briefly. Then one ask.

The \`ia-presenter-deck\` skill will handle the format. Assertion headlines, talk track in the notes.
