# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
lang: en-US
title: Ben Norris
email: info@bennorris.com
description: Sharing mental health, parenting, leadership, and other thoughts
baseurl: # the optional subpath of your site, e.g. "/blog"
url: https://bennorris.com
plausible: bennorris.com
author:
   name: Ben Norris
   twitter: bsndesign
   picture: /assets/images/ben-norris-2021-light.jpg
twitter:
  username: bsndesign
  card: summary_large_image
twitter_username: bsndesign
github_username: benjaminsnorris
linkedin_username: benjaminsnorris
microblog_username: bennorris
banner_image: /assets/images/banner-image.png
logo: /assets/images/logo.png # path of site logo, e.g. "/assets/images/logo.png"
date_format: "%-d %b %Y"
date_time:   "%-d %b %Y, %I:%M %p"
timezone:    America/Denver
tag_archive_path: /tags/
tag_archive_links: true
category_archive_path: /

# Build settings
markdown: kramdown

# Sass deprecations.
#
# slash-div, strict-unary and the deprecated colour functions are fixed in the
# source, in this theme and in the two vendored libraries under
# _sass/basically-basic/vendor. They are listed as fatal so they cannot creep
# back in unnoticed -- everything they warned about goes away in Dart Sass 2.0,
# which is the next one to land.
#
# The three that are silenced are all Dart Sass 3.0, and neither is a matter of
# editing a line:
#
#   import          The theme skin is chosen by Liquid in main.scss and sets its
#                   colours by landing in the global scope ahead of
#                   _variables.scss's own !defaults. @use has no global scope,
#                   so the skins would have to pass their values through
#                   `@use ... with ()` -- and they override between 1 and 23
#                   variables each, so every skin would have to declare the
#                   whole surface. That is a redesign of how a skin is written,
#                   not a migration.
#
#   global-builtin  Inside Susy 2 and Breakpoint, both unmaintained since 2017.
#   if-function     Same. Rewriting either one's internals to the module system
#                   means forking a dead library, and the grid maths is load
#                   bearing.
sass:
  fatal_deprecations:
    - slash-div
    - strict-unary
    - color-functions
  silence_deprecations:
    - import
    - global-builtin
    - if-function
search: true
search_full_content: true
plugins: # previsously gems
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache
permalink:    /:year/:month/:day/:title
include:
  - /.well-known

# Feed
feed:
  categories:
    - Balanced Ownership
    - Mental Work Health
    - Gospel Sketcher
    - Sketchnotable
  tags:
    path: "feed/"
    only:
      - weekly
      - podcast

# Exclude from processing.
exclude:
  - .asset-cache
  - .bundle
  - .env
  - .env.*
  - bin
  - supabase
  - .codeclimate.yml
  - .editorconfig
  - .gitattributes
  - .jekyll-assets-cache
  - .sass-cache
  - .scss-lint.yml
  - CHANGELOG
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - node_modules
  - Rakefile
  - README
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - /docs # ignore Basically Basic sample site
  - /example # ignore Basically Basic dev site

collections:
  drafts:
    output: true
  designs:
    output: true
  presentations:
    output: true
  apps:
    output: true
    permalink: /:collection/:path/
  books:
    output: true
    permalink: /:collection/:path/

# Front Matter Defaults
defaults:
  # bank/resources/ is build scaffolding, not content: two pages that render the
  # icon and the preview art at size so they can be captured into the PNGs next
  # to them. Both PNGs are checked in, so the pages have already done their job
  # and have no reason to be in sitemap.xml offering themselves as pages.
  #
  # They are static HTML with no front matter of their own. Jekyll 4 still
  # resolves defaults for a StaticFile (as :pages), which is the documented way
  # to set `sitemap: false` on one -- so the scope needs no type.
  - scope:
      path: "bank/resources"
    values:
      sitemap: false
  # _posts
  - scope:
      path: "_posts"
      type: posts
    values:
      layout: post
      read_time: true
      word_count: true
      image: /assets/images/banner-image.png
  - scope:
      path: "_drafts"
      type: drafts
    values:
      layout: draft
      image: /assets/images/banner-image.png
  - scope:
      path: "_apps"
      type: apps
    values:
      layout: post
      read_time: false
      excerpt_separator: "<!--more-->"
  - scope:
      path: "_books"
      type: books
    values:
      layout: book
      read_time: false
      excerpt_separator: "<!--more-->"
  - scope:
      path: "_designs"
      type: designs
    values:
      layout: post
      read_time: false
  - scope:
      path: "_presentations"
      type: presentations
    values:
      layout: post
      read_time: false
