# Index for /courses/.
#
# bin/publish-course adds an entry here when it publishes a new course, and
# updates `title` and `tracked` if they change. Descriptions are yours to write
# by hand -- the tool never overwrites one it did not create.
#
# The tool rewrites this file only when something actually changed, so hand
# edits survive. Comments inside the list below do not: keep notes up here.
#
# tracked: true  -> progress persists (signed in: across devices)
# tracked: false -> static reading material, published with --no-store

- slug: instrument-log
  title: Instrument Log
  description: >-
    Classical Psychometrics for Eval Rubrics: test theory, the kappa family, ICC and generalizability theory —
    measurement thinking applied to eval rubrics.
  tracked: true

- slug: record-linkage
  title: Probabilistic Record Linkage
  description: >-
    Deciding when two records describe the same thing, built on Fellegi &
    Sunter (JASA, 1969).
  tracked: true

- slug: context-graphs
  title: Context Graphs
  description: >-
    How context graphs connect people to the priorities that matter. A crash
    course in systems and data modeling.
  tracked: false

- slug: teeline
  title: Teeline Shorthand to 100
  description: >-
    Six weeks to take a passage in Teeline and transcribe it accurately twenty-
    four hours later.
  tracked: true

- slug: copying-morse
  title: Copying Morse
  description: >-
    Learn to copy an unfamiliar plain-text transmission in Morse code onto paper.
  tracked: true

- slug: sending-morse
  title: Sending Morse
  description: >-
    Advance to sending messages with Morse code via sound or light.
  tracked: true

- slug: graphical-perception
  title: Graphical Perception
  description: >-
    Which visual encodings a reader actually decodes accurately, from Cleveland
    & McGill (JASA, 1984) to a chart you can defend with measurements you took
    yourself.
  tracked: true

- slug: color-science
  title: Color Science
  description: >-
    OKLCH, display gamut, and why the 4.5:1 your linter enforces is a model
    rather than a measurement. Ends in a token palette and a contrast policy
    you can defend.
  tracked: true

- slug: map-projections
  title: Map Projections
  description: >-
    Flattening a sphere is impossible by Gauss's theorem, not by clumsiness, so
    every map is a choice about which invariant to break. Tissot's indicatrix
    makes the cost computable; the deliverable is a projection decision memo.
  tracked: true

- slug: task-abstraction
  title: Task Abstraction
  description: >-
    Not whether a mark can be read but whether it should have been drawn at all,
    one level upstream of graphical perception. Brehmer & Munzner's why/what/how
    typology (2013) and the argument around it; the artifact is a task
    abstraction memo.
  tracked: true

- slug: board-vision
  title: Board vision — four units and a final check
  description: >-
    The four questions a position asks before tactics do — what square is that,
    what does that piece attack, how many pieces hit it, and what is undefended
    — each drilled alone until it is automatic, then shuffled, because a game
    never tells you which one it wants. Five units, every one gated at eighteen
    of twenty held-out positions inside their cap.
  tracked: true

- slug: chess-seeds
  title: Seeds of tactical destruction — scanning a position
  description: >-
    Board vision's sequel. Heisman's twelve seeds of tactical destruction —
    loose pieces, overworked defenders, an exposed king — named from memory
    under a cap, then read as evidence rather than an answer: four or more
    present is 85% tactical, two or three is the same as not looking. Gated at
    eighteen of twenty, except the calibration block, which cannot be: the
    features top out at 78%, against 29% for guessing quiet.
  tracked: true
